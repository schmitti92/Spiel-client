<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a30">
<meta name="description" content="Meta-Sammelalbum: ein blätterbares Weihnachtsbuch mit zwölf Lichtertal-Sammelbildern.">
<title>Meta-Sammelalbum · Spielesammlung</title>
<link rel="stylesheet" href="meta-sammelalbum.css?v=8">
<script src="profile-config.js"></script>
<script src="profile-auth.js"></script>
<script type="module" src="meta-sammelalbum.js?v=9"></script>
<link rel="stylesheet" href="DOG/touch-navigation.css?v=1">
</head>
<body>
<div class="meta-album-page">
 <header class="meta-album-header">
  <a id="meta-back-top" class="meta-album-back" href="hub-lobby.html">← Spiellobby</a>
  <div class="meta-theme-picker">
   <button id="meta-theme-toggle" class="meta-theme-toggle" type="button"
     aria-controls="meta-theme-list" aria-expanded="false">🎄 Weihnachtsevent 1 <span aria-hidden="true">▾</span></button>
   <nav id="meta-theme-list" class="meta-theme-list" aria-label="Sammelalbum-Themen" hidden></nav>
  </div>
  <div class="meta-album-overview" aria-label="Gesammelte Bilder">
   <span class="meta-visually-hidden">Gesammelt:</span><strong id="meta-overall-count">0 / 12</strong>
  </div>
 </header>
 <main class="meta-album-layout">
  <section class="meta-album-gallery-panel" aria-labelledby="meta-theme-title">
   <h1 id="meta-theme-title" class="meta-visually-hidden">🎄 Weihnachtsevent 1</h1>
   <p id="meta-theme-description" class="meta-visually-hidden">Zwölf Weihnachtsbilder sammeln.</p>
   <span id="meta-theme-progress" class="meta-visually-hidden">0 / 9 gesammelt</span>
   <div class="meta-album-gallery-scroll">
    <div id="meta-book" class="meta-book" aria-label="Blätterbares Weihnachts-Sammelbuch">
     <div id="meta-book-sheet" class="meta-book-sheet">
      <div id="meta-picture-grid" class="meta-picture-grid" role="group"
        aria-label="Sechs Bildplätze auf dieser Buchseite"></div>
     </div>
    </div>
    <nav class="meta-book-controls" aria-label="Buchseiten durchblättern">
     <button id="meta-book-prev" class="meta-book-turn" type="button" aria-label="Vorherige Buchseite">❮ Zurück</button>
     <span id="meta-book-position" role="status" aria-live="polite" aria-atomic="true">Seite 1 von 2</span>
     <button id="meta-book-next" class="meta-book-turn" type="button" aria-label="Nächste Buchseite">Weiter ❯</button>
    </nav>
    <div class="meta-album-auth-row" aria-live="polite">
     <span id="meta-album-feedback" role="status">⏳ Spielerprofil wird geprüft …</span>
     <button id="meta-album-login" type="button" hidden>👤 Anmelden</button>
     <button id="meta-album-refresh" type="button" hidden aria-label="Albumfreischaltungen prüfen">↻ Prüfen</button>
    </div>
   </div>
  </section>
 </main>
 <dialog id="meta-picture-dialog" class="meta-picture-dialog" aria-labelledby="meta-dialog-title">
  <button id="meta-dialog-close" class="meta-dialog-close" type="button" aria-label="Vorschau schließen">✕</button>
  <div id="meta-picture-detail" class="meta-picture-detail">
   <p>Wähle ein Bild im Buch aus.</p>
  </div>
 </dialog>
</div>
</body>
</html>
