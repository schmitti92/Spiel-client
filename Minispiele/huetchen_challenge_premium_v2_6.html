body{background-image:radial-gradient(ellipse at 50% 0%,#995b54aa,transparent 64%),repeating-linear-gradient(90deg,#39253b 0 94px,#54314a 96px 100px),linear-gradient(#2b192c,#140e19)!important}.stage{background:radial-gradient(ellipse at 50% 0%,#8a6372,#352033 70%,#1a1021)!important}</style></head><body><main class="app"><header class="top"><div><div class="badge">JAHRMARKT · MINISPIEL</div><h1 class="title">🎩 Hütchen-Challenge</h1></div><div class="round" id="roundLabel">3 RUNDEN</div></header><section class="stage" aria-label="Hütchenspiel"><div class="bulbs" id="bulbs"></div><div class="stage-info" id="stageInfo">3 Runden · Goldene Kugel</div><div class="message" id="message" role="status" aria-live="polite">Merke dir, unter welchem Hütchen die Kugel liegt!</div><div class="board"></div><div class="ball hide" id="ball"></div><div class="cups" id="cups"></div></section><section class="score" id="score"></section><div class="setup" id="setup"><label>Spieler: <select id="playerCount"><option>2</option><option>3</option><option selected>4</option></select></label><label>Menschen: <select id="humanCount"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label></div><div class="controls"><button class="btn" id="start">Spiel starten</button><button class="btn hide" id="next">Nächste Runde</button><button class="btn hide" id="restart">Neues Spiel</button></div><div class="result hide" id="result"></div><p class="muted" id="help">Drei Runden · Jede Runde schneller und schwieriger · Wer die meisten Kugeln findet, gewinnt.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));let players=[],round=0,secret=0,positions=[],cups=[],phase='setup',turn=0,token=0,answers=[],mixing=false,resizePending=false;const configs=[{n:3,swaps:8,ms:610,peek:1900},{n:4,swaps:13,ms:420,peek:1550},{n:5,swaps:19,ms:290,peek:1250}];$('bulbs').innerHTML=Array.from({length:13},()=>'<i></i>').join('');function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function drawScore(){ $('score').innerHTML=players.map((p,i)=>`<div class="player ${phase==='guess'&&i===turn?'current':''}"><div class="name">${p.bot?'🤖':'👤'} ${safe(p.name)}</div><div class="points">${p.score} / ${round ? Math.min(3,round - (phase==='reveal'||phase==='done'?0:1)) : 0}</div><small>${phase==='guess'&&i===turn?'Jetzt auswählen':p.bot?'Computer':'Mensch'}</small></div>`).join('')}function msg(s){$('message').textContent=s}function width(){return $('cups').clientWidth}function coords(slot){let w=width();return {x:w*(.13+slot*.74/(configs[round-1].n-1)),y:$('cups').clientHeight*.77}}function place(el,slot){const c=coords(slot);el.style.left=c.x+'px';el.style.top=c.y+'px'}function makeCups(){const cfg=configs[round-1];positions=Array.from({length:cfg.n},(_,i)=>i);$('cups').innerHTML='';cups=positions.map((_,i)=>{let b=document.createElement('button');b.className='cup';b.innerHTML='<span class="shape"></span><span class="rim"></span>';b.setAttribute('aria-label','Hütchen '+(i+1));b.onclick=()=>pick(cups.indexOf(b));b.disabled=true;$('cups').append(b);place(b,i);return b});}function ballAt(slot){const c=coords(slot);$('ball').style.left=c.x+'px';$('ball').style.top=(c.y+46)+'px'}function swap(a,b,ms){return new Promise(resolve=>{mixing=true;const x=cups[a],y=cups[b];const startX=coords(a).x,endX=coords(b).x,baseY=coords(a).y;const start=performance.now();x.style.transition='none';y.style.transition='none';x.style.zIndex='6';y.style.zIndex='5';function frame(now){const t=Math.min(1,(now-start)/ms),e=t*t*(3-2*t);const currentWidth=width(),scale=currentWidth/(swapWidth||currentWidth);x.style.left=(startX+(endX-startX)*e)*scale+'px';y.style.left=(endX+(startX-endX)*e)*scale+'px';const rowY=coords(a).y;x.style.top=rowY+'px';y.style.top=rowY+'px';if(t<1){requestAnimationFrame(frame)}else{[cups[a],cups[b]]=[cups[b],cups[a]];[positions[a],positions[b]]=[positions[b],positions[a]];x.style.zIndex='';y.style.zIndex='';cups.forEach((cup,i)=>place(cup,i));mixing=false;resizePending=false;resolve()}}const swapWidth=width();requestAnimationFrame(frame)})}async function beginRound(){const id=++token;phase='show';answers=[];turn=0;const cfg=configs[round-1];$('roundLabel').textContent=`RUNDE ${round} / 3`;$('next').classList.add('hide');$('result').classList.add('hide');makeCups();$('stageInfo').textContent=`${cfg.n} Hütchen · ${cfg.swaps} Mischungen · ${['Einfach','Mittel','Schwer'][round-1]}`;secret=Math.floor(Math.random()*cfg.n);ballAt(secret);$('ball').classList.remove('hide');cups[secret].style.transform='translate(-50%,-115%)';msg(`Runde ${round}: Schau genau hin! Unter diesem Hütchen liegt die leuchtende Kugel.`);drawScore();await sleep(cfg.peek);if(id!==token)return;cups[secret].style.transform='translate(-50%,-50%)';$('ball').classList.add('hide');await sleep(380);if(id!==token)return;phase='shuffle';msg('Augen auf! Die Hütchen werden gemischt …');for(let i=0;i<cfg.swaps;i++){let a=Math.floor(Math.random()*cfg.n),b;do{b=Math.floor(Math.random()*cfg.n)}while(b===a);await swap(a,b,cfg.ms);if(id!==token)return}phase='guess';turn=0;promptTurn()}function promptTurn(){drawScore();if(turn>=players.length){finishRound();return}const p=players[turn];msg(`${p.name}: Unter welchem Hütchen liegt die Kugel?`);if(p.bot){cups.forEach(c=>c.disabled=true);const id=token;setTimeout(()=>{if(id!==token||phase!=='guess')return;const cfg=configs[round-1],accuracy=[.77,.62,.48][round-1];let guess;if(Math.random()<accuracy){gue
