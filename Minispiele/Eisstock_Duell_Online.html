<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>❄️ Eisstock-Duell Online</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(at top,#23466a,#071626 75%);color:#edf7ff;font:600 15px system-ui}main{max-width:540px;margin:auto;padding:14px}h1{text-align:center}section{padding:14px;background:#112a44;border:1px solid #537c9b;border-radius:16px;margin:10px 0}input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #7fa9c6}input,select{max-width:100%;background:#071a2e;color:#fff}button{background:#e4b957;color:#182b40;cursor:pointer}button:disabled{opacity:.45}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}#board{width:100%;max-width:440px;display:block;margin:auto;touch-action:none;border-radius:15px;border:2px solid #8ec2dd;background:#d7f1fc}#scores{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}#scores>div{padding:9px;background:#081c31;border-radius:9px}.active{outline:2px solid #ffde83}#msg{color:#ffe3a0;min-height:22px}small{color:#bed5e7}a{color:#bfe9ff}</style><main><h1>❄️ Eisstock-Duell Online</h1><section id="lobby"><div class="row"><input id="name" maxlength="30" placeholder="Dein Name" value="Spieler"><select id="count"><option value="2">2 Spieler</option><option value="3">3 Spieler</option><option value="4">4 Spieler</option></select><button id="create">Raum erstellen</button></div><hr><div class="row"><input id="code" inputmode="numeric" maxlength="3" placeholder="Raumcode"><button id="join">Raum beitreten</button></div><p><small>Alle Spieler öffnen diese Seite auf ihrem eigenen Gerät. Ein Spieler erstellt den Raum, die anderen treten mit dem Code bei.</small></p></section><section id="game" class="hidden"><div class="row"><strong id="room"></strong><button id="start" class="hidden">Partie starten</button><button id="again" class="hidden">Nochmal spielen</button></div><p id="turn"></p><div id="scores"></div><p id="msg">Warte auf Mitspieler …</p></section><canvas id="board" width="440" height="650"></canvas><p style="text-align:center"><a href="../minispiele.html">← Zur Minispiele-Auswahl</a></p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),C=$('board'),ctx=C.getContext('2d'),COL=['#4ba9ff','#ff666a','#ffd35b','#65d99b'];let ws,seat=-1,room='',token='',state=null,drag=null,retry=0,manual=false;const ENDPOINT='wss://serverfinal-ynbe.onrender.com/eisstock';function msg(t){$('msg').textContent=t}function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}function connect(action){manual=false;if(ws){ws.onclose=null;ws.close()}ws=new WebSocket(ENDPOINT);ws.onopen=()=>{retry=0;if(action)send(action);else if(room&&token)send({type:'resume',room,token})};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){msg('⚠️ '+m.message);return}if(m.type==='joined'){seat=m.seat;room=m.room;token=m.token;try{sessionStorage.setItem('eisstock.online',JSON.stringify({room,token}))}catch{}$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('room').textContent='Raum '+room+' · Du bist '+COL[seat];return}if(m.type==='state'){state=m;draw();render()}};ws.onclose=()=>{if(manual)return;msg('Verbindung unterbrochen – erneuter Versuch …');setTimeout(()=>connect(),Math.min(15000,1000*Math.pow(1.7,retry++)))};ws.onerror=()=>msg('Verbindung zum Server wird geprüft …')}$('create').onclick=()=>connect({type:'create',players:Number($('count').value),name:$('name').value});$('join').onclick=()=>{const code=$('code').value.trim();if(!/^\d{3}$/.test(code))return alert('Bitte dreistelligen Raumcode eingeben');connect({type:'join',room:code,name:$('name').value})};$('start').onclick=()=>send({type:'start'});$('again').onclick=()=>send({type:'restart'});function render(){if(!state)return;const waiting=state.phase==='waiting',done=state.phase==='done';$('start').classList.toggle('hidden',seat!==0||!waiting);$('start').disabled=state.players.length<Number($('count').value)&&false;$('start').textContent='Partie starten ('+state.players.length+' Spieler)';$('again').classList.toggle('hidden',seat!==0||!done);$('turn').textContent=waiting?'Warte auf alle Mitspieler …':done?'🏆 Spiel beendet':state.phase==='moving'?'Eisstöcke gleiten …':'Am Zug: '+(state.players[state.turn]?.name||'?');$('scores').innerHTML=state.players.map((p,i)=>'<div class="'+(state.turn===i&&!done?'active':'')+'"><span style="color:'+COL[i]+'">●</span> '+p.name+(p.connected?'':' ⚠️')+' <strong>'+state.scores[i]+'</strong></div>').join('');msg(waiting?'Raumcode weitergeben: '+room:done?'🏆 '+state.players.filter((p,i)=>state.scores[i]===Math.max(...state.scores)).map(p=>p.name).join(' & ')+' gewinnt!':state.phase==='ready'&&state.turn===seat?'Du bist dran: nach unten ziehen und loslassen.':'Warte auf deinen Zug.')}function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*440/r.width,y:(e.clientY-r.top)*650/r.height}}C.onpointerdown=e=>{if(!state||state.phase!=='ready'||state.turn!==seat)return;drag=pos(e);C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(!drag)return;drag.end=pos(e);draw()};C.onpointerup=e=>{if(!drag)return;const p=pos(e),dx=p.x-drag.x,dy=p.y-drag.y;drag=null;if(dy>12)send({type:'shoot',vx:Math.max(-7,Math.min(7,-dx*.07)),vy:-Math.min(12,Math.max(2.8,dy*.06))});draw()};C.onpointercancel=()=>{drag=null;draw()};function draw(){const W=440,H=650,g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#eafaff');g.addColorStop(1,'#8cc4de');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=2;i>=0;i--){ctx.beginPath();ctx.arc(220,157,[47,86,125][i],0,Math.PI*2);ctx.fillStyle=['#ffe29a','#a4dbf3','#f4faff'][i];ctx.fill();ctx.strokeStyle='#376b8d';ctx.lineWidth=2;ctx.stroke()}ctx.fillStyle='#2b6588';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('3',220,163);ctx.fillText('2',220,218);ctx.fillText('1',220,268);for(const s of state?.stones||[]){ctx.beginPath();ctx.arc(s.x,s.y,14,0,Math.PI*2);ctx.fillStyle=COL[s.owner];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}if(state?.phase==='ready'){ctx.beginPath();ctx.arc(220,567,14,0,Math.PI*2);ctx.fillStyle=COL[state.turn];ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();if(drag?.end){ctx.beginPath();ctx.moveTo(220,567);ctx.lineTo(220-(drag.end.x-drag.x)*1.5,567-(drag.end.y-drag.y)*1.5);ctx.strokeStyle='#ef7838';ctx.lineWidth=5;ctx.stroke()}}}draw();try{const s=JSON.parse(sessionStorage.getItem('eisstock.online')||'null');if(s?.room&&s?.token){room=s.room;token=s.token;connect()}}catch{}window.addEventListener('pagehide',()=>{manual=true;ws?.close()})})();
</script></html>
