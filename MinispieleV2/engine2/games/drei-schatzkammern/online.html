<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die drei Schatzkammern · Engine 2.0 Online</title>
<style>
:root{font-family:system-ui;color:#fff1d7;background:#101426}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#303b66,#101426 70%);min-height:100dvh}main{max-width:1200px;margin:auto;padding:12px}h1{text-align:center;color:#ffda8b;font-size:clamp(24px,4vw,44px);margin:6px}p{text-align:center}.panel{background:#151d36e8;border:1px solid #aa8b5d;border-radius:20px;padding:14px;margin:12px auto;max-width:900px;text-align:center}button,input,select{font:inherit;border-radius:12px;padding:11px;border:1px solid #c7a16e;background:#263450;color:white}button{cursor:pointer;background:#93612d;font-weight:750}button:disabled{opacity:.4}input{width:130px;text-transform:uppercase}a{color:#ffe0a4}.hidden{display:none!important}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center}.code{font-size:28px;font-weight:900;letter-spacing:4px;color:#ffe4a3}.arena{border:3px solid #bd9c64;border-radius:25px;min-height:clamp(310px,60vh,580px);background:linear-gradient(#18223766,#111d2a44),url('./assets/treasure-hall.svg') center/cover;box-shadow:inset 0 0 70px #0008;position:relative;overflow:hidden}.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,3vw,35px);max-width:1000px;margin:30px auto;padding:12px}.arch{height:clamp(180px,38vh,330px);border:9px solid #858594;border-radius:100px 100px 6px 6px;position:relative;background:#111526;overflow:hidden;cursor:pointer;touch-action:manipulation;box-shadow:0 9px 0 #1b1627,0 0 25px #0008}.arch:before{content:'💎 ✨';position:absolute;inset:0;display:grid;place-items:center;font-size:42px}.door{position:relative;width:100%;height:100%;border:5px solid #c49759;border-radius:90px 90px 3px 3px;background:repeating-linear-gradient(90deg,#5b301c 0 22%,#a56b3c 22% 25%,#70391e 25% 50%);transform-origin:left;transition:transform 1.1s ease}.door:after{content:'✦';position:absolute;top:25%;left:0;right:0;text-align:center;color:#ffdb86;font-size:44px}.door-wrap:nth-child(2) .door{background:repeating-linear-gradient(90deg,#173c58 0 22%,#377aa4 22% 25%,#1c4a71 25% 50%)}.door-wrap:nth-child(3) .door{background:repeating-linear-gradient(90deg,#1d4a2c 0 22%,#55965c 22% 25%,#285e36 25% 50%)}.arch.open .door{transform:perspective(500px) rotateY(-78deg)}.arch.locked{box-shadow:0 0 28px #d33a52}.arch.locked .door{filter:brightness(.55);animation:shake .5s}.arch.locked:before{content:'⛓️ 🔒'}@keyframes shake{25%,75%{translate:-7px}50%{translate:7px}}.arch:focus-visible{outline:5px solid #ffe0a0}.arch.enabled:hover{filter:brightness(1.25)}.door-label{margin:12px;font-weight:850;text-align:center}.visitors{display:flex;justify-content:center;gap:8px;min-height:48px;font-size:32px}.status{font-weight:800;color:#ffe0a2;font-size:clamp(17px,2.5vw,26px);min-height:40px;text-align:center;margin-top:8px}.hint{color:#cad1e2}.badge{display:inline-block;padding:5px 12px;border:1px solid #b68e55;border-radius:25px;margin:3px;background:#151c30}#error{color:#ffb7b7;font-weight:bold}@media(max-width:600px){main{padding:5px}.doors{gap:6px;padding:4px}.arch{height:clamp(150px,30vh,230px);border-width:5px}.panel{padding:10px}.visitors{font-size:24px}}
</style></head><body><main><h1>🏰 Die drei Schatzkammern</h1><p>🌐 MiniGame Engine 2.0 · Gemeinsamer Online-Raum</p>
<section class="panel" id="lobby"><div class="controls"><label>Computergegner <select id="bots"><option>0</option><option selected>1</option><option>2</option><option>3</option></select></label><button id="create">Neuen Engine-2-Raum erstellen</button><input id="code" placeholder="Raumcode" maxlength="6" aria-label="Raumcode"><button id="join">Raum beitreten</button></div><p class="hint">Alle Teilnehmer müssen mit ihrem Spielprofil angemeldet sein. Jeder spielt auf seinem eigenen Gerät.</p></section>
<section class="panel hidden" id="roomPanel"><div>Raumcode <span class="code" id="roomCode"></span></div><div id="members"></div><div class="controls"><button id="prepare" class="hidden">Spiel vorbereiten</button><button id="ready" class="hidden">Verstanden · Bereit!</button><button id="refresh">Aktualisieren</button><button id="copy">Raumcode kopieren</button></div></section>
<section class="arena hidden" id="arena"><div class="status" id="status">Warte auf Spielstart …</div><div class="doors" id="doors"></div></section>
<section class="panel hidden" id="result"><h2>🏆 Abenteuer beendet!</h2><div id="winners"></div><button id="replay" class="hidden">Neues Abenteuer vorbereiten</button></section>
<p id="error" role="alert"></p><p><a href="./index.html">Offline spielen</a></p></main>
<script src="../../../../profile-config.js"></script><script src="../../../../profile-auth.js"></script><script type="module">
import {currentUser,engine2Request,engine2Room,engine2Action} from '../../Engine2Transport.js';
const $=id=>document.getElementById(id),show=(id,v)=>$(id).classList.toggle('hidden',!v),faces=['🧙','🧝','🥷','🦸'];
let code=new URLSearchParams(location.search).get('room')?.toUpperCase()||'',snapshot=null,busy=false,animating=false,lastRound=0,refreshing=false;
const err=e=>{$('error').textContent=e?.message||String(e)};
const call=async(fn)=>{if(busy)return;busy=true;$('error').textContent='';try{await fn()}catch(e){err(e)}finally{busy=false}};
function myId(){return currentUser()?.uid||null}
function render(){
 if(!snapshot)return;
 const room=snapshot.room,game=snapshot.game,match=room.match,me=myId(),host=room.hostId===me;
 show('lobby',false);show('roomPanel',true);$('roomCode').textContent=code;
 $('members').textContent='👥 '+room.members.map(m=>m.name||'Spieler').join(' · ')+(match?' · Phase: '+match.phase:'');
 show('prepare',host&&(!match||['finished','aborted','invalid'].includes(match.phase)));
 show('ready',!!match&&match.phase==='instructions'&&match.roster.includes(me));
 show('arena',!!game);show('result',!!game&&game.phase==='finished');
 show('replay',host&&game?.phase==='finished');
 if(!game)return;
 const canChoose=match?.phase==='playing'&&game.phase==='choosing'&&game.alive.includes(me)&&!game.hasChosen;
 const display=game.lastReveal?.round===game.round?game.lastReveal.doors:[];
 $('status').textContent=game.phase==='finished'?'🏆 Das Abenteuer ist vorbei!':game.phase==='choosing'?(canChoose?'🚪 Wähle eine Tür!':game.hasChosen?'✓ Deine Wahl ist gespeichert. Warte auf die anderen.':'⏳ Die anderen Abenteurer wählen …'):'⏳ Die Türen öffnen sich …';
 $('doors').innerHTML=[0,1,2].map(d=>{const reveal=display.find(x=>x.door===d);return '<div class="door-wrap"><div class="arch '+(reveal?(reveal.locked?'locked':'open'):'')+(canChoose?' enabled':'')+'" data-door="'+d+'" role="button" tabindex="0" aria-label="Tür '+(d+1)+' wählen"><div class="door"></div></div><div class="door-label">Tür '+(d+1)+'</div><div class="visitors">'+(reveal?reveal.visitors.map(id=>faces[match.roster.indexOf(id)]||'🧙').join(''):'')+'</div></div>'}).join('');
 if(game.phase==='finished')$('winners').textContent=game.result.winnerIds.length?'🎉 Gewinner: '+game.result.winnerIds.map(id=>room.members.find(m=>m.id===id)?.name||'Computer').join(', '):'Niemand hat überlebt!';
}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function applySnapshot(next){
 snapshot=next;
 const reveal=next.game?.lastReveal;
 if(reveal&&reveal.round>lastRound){
  lastRound=reveal.round;
  animating=true;render();show('arena',true);
  $('status').textContent='🏃 Die Abenteurer laufen zu den Türen …';
  await wait(600);
  for(const entry of reveal.doors){
   const arch=$('doors').querySelector('[data-door="'+entry.door+'"]');
   if(arch){
    arch.classList.add(entry.locked?'locked':'open');
    arch.parentElement.querySelector('.visitors').textContent=entry.visitors.map(id=>faces[next.room.match.roster.indexOf(id)]||'🧙').join('');
   }
   $('status').textContent=entry.locked?'🔒 Tür '+(entry.door+1)+' ist verschlossen!':'✨ Tür '+(entry.door+1)+' öffnet sich!';
   await wait(1150);
  }
  animating=false;
 }
 render();
}
async function load(){if(!code||refreshing||animating)return;refreshing=true;try{const next=await engine2Room(code);await applySnapshot(next)}catch(e){err(e)}finally{refreshing=false}}
async function act(name,data={}){const next=await engine2Action(code,name,data);await applySnapshot(next)}
$('create').onclick=()=>call(async()=>{const next=await engine2Request('/rooms',{bots:Number($('bots').value)});code=next.room.roomId;history.replaceState(null,'','?room='+encodeURIComponent(code));await applySnapshot(next)});
$('join').onclick=()=>call(async()=>{code=$('code').value.trim().toUpperCase();const next=await engine2Action(code,'join');history.replaceState(null,'','?room='+encodeURIComponent(code));await applySnapshot(next)});
$('prepare').onclick=()=>call(()=>act('prepare'));
$('ready').onclick=()=>call(()=>act('ready'));
$('replay').onclick=()=>call(()=>act('prepare'));
$('refresh').onclick=()=>call(load);
$('copy').onclick=()=>navigator.clipboard?.writeText(code).catch(err);
$('doors').addEventListener('click',e=>{const door=e.target.closest('[data-door]');if(!door||!snapshot)return;const g=snapshot.game,me=myId();if(g?.phase!=='choosing'||g.hasChosen||!g.alive.includes(me)||snapshot.room.match?.phase!=='playing')return;call(()=>act('choose',{door:Number(door.dataset.door)}))});
$('doors').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.closest('[data-door]')?.click()}});
if(code){$('code').value=code;const boot=setInterval(async()=>{if(currentUser()){clearInterval(boot);await load()}},700);setTimeout(()=>clearInterval(boot),20000)}
setInterval(()=>{if(code&&currentUser()&&!busy)load()},3500);
</script></body></html>
