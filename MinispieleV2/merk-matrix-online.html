<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Merk-Matrix 2 · Online</title><style>:root{font-family:system-ui;color:#ecf9ff;background:#081532}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 80% 35%,#654a9b88,transparent 55%),radial-gradient(ellipse at 20% 15%,#226a9d77,transparent 50%),#07132b}main{width:min(950px,96vw);margin:auto;text-align:center;padding:12px}h1{font-size:clamp(23px,4vw,42px);text-shadow:0 0 17px #2bcfff}button,a{font:inherit;color:white;border:1px solid #67caff;border-radius:13px;background:#1d5689;padding:12px;cursor:pointer}a{display:inline-block;text-decoration:none}#board{display:grid;gap:clamp(3px,.6vw,7px);width:min(57dvh,78vw,480px);margin:12px auto;padding:12px;border:2px solid #42d5ff;border-radius:18px;background:#091c3be8;box-shadow:0 0 25px #2eaeff77}.cell{aspect-ratio:1;min-width:0;padding:0;background:#243c6b;border:1px solid #5876ae;border-radius:6px;touch-action:manipulation}.cell.lit{background:#43e8d9;box-shadow:0 0 15px #40fff4}.cell.pick{background:#ab78ff;box-shadow:0 0 12px #a678ff}.cell.hit{background:#2ae5a7}.cell.miss{background:#fb6386}.cell.omit{background:#f3c351}.info{border:1px solid #486fa6;border-radius:13px;background:#0a2140d9;padding:12px;margin:8px auto;max-width:720px}#timer{font-size:clamp(25px,5vw,48px);font-weight:900;color:#ffdb76}#scores{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}#scores span{border:1px solid #6aa9f7;border-radius:12px;padding:9px;background:#142850}#understood{background:linear-gradient(110deg,#179ac8,#7453d6)}#error{color:#ffb5bc}#finish{max-width:720px;margin:14px auto;padding:18px;border:2px solid #f6d77a;border-radius:20px;background:linear-gradient(135deg,#112d55,#3a2b70);box-shadow:0 0 30px #e4b64d66}#finish h2{font-size:clamp(23px,4vw,38px);margin:8px}#finish a{margin-top:12px;background:#276da4}#finish ol{text-align:left;max-width:420px;margin:12px auto;padding-left:34px}#finish li{padding:5px}</style></head><body><main><a id="back" href="./lobby.html">← Zur Lobby</a><h1>🧠 MERK-MATRIX 2</h1><div class="info"><strong id="phase">Verbinde mit dem gemeinsamen Raum …</strong><div id="timer">–</div><div id="hint">Alle Teilnehmer erhalten dieselben Muster.</div></div><button id="understood" hidden>Verstanden · Bereit</button><div id="board" aria-label="Merk-Matrix Spielfeld"></div><div id="scores"></div><section id="finish" hidden><h2>🏆 Siegerehrung</h2><div id="winners"></div><ol id="ranking"></ol><a id="play-again" href="./lobby.html">Zur Lobby · Neues Spiel</a></section><p id="error" role="status"></p></main><script src="../profile-config.js"></script><script src="../profile-auth.js"></script><script type="module">
const q=new URLSearchParams(location.search),code=q.get('room')||'',api=String(window.SPIELPORTAL_CONFIG?.apiBase||'https://serverfinal-ynbe.onrender.com').replace(/\/+$/,'');const $=id=>document.getElementById(id);$('back').href='./lobby.html?room='+encodeURIComponent(code)+'&stay=1';$('play-again').href=$('back').href;let room=null,matchId=null,offset=0,selection=[],round=-1,phase='',busy=false,lastSent='',lastTick=0,ack=false,sendQueue=Promise.resolve();const onlineUser=()=>window.SpielOnline?.state?.()?.user;
async function req(path,body){const user=onlineUser();if(!user?.getIdToken)throw Error('Bitte online anmelden');const token=await user.getIdToken(),res=await fetch(api+'/api/hub/rooms/'+encodeURIComponent(code)+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)}),cache:'no-store'});const data=await res.json();if(!res.ok||data.ok!==true)throw Error(data.error||'SERVER_ERROR');return data.room;}
function serverNow(){return Date.now()+offset;}
async function refresh(){if(busy)return;if(!onlineUser()?.getIdToken){$('error').textContent='Online-Anmeldung wird geladen …';return;}busy=true;try{const sentAt=Date.now();const data=await req('');offset=data.serverNow+Math.max(0,Date.now()-sentAt)/2-Date.now();room=data;$('error').textContent='';const m=data.match;if(m?.game!=='merk-matrix'){ $('phase').textContent='Kein aktives Merk-Matrix-Spiel';return;}matchId=m.id;render(m.merkMatrix);}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
function render(s){if(!s)return;const changed=round!==s.round||phase!==s.phase;phase=s.phase;if(round!==s.round){round=s.round;selection=Array.isArray(s.myCells)?[...s.myCells]:[];lastSent=JSON.stringify(selection.slice().sort((a,b)=>a-b));ack=false;}const now=serverNow();$('understood').hidden=phase!=='instructions';$('understood').disabled=ack;const names={instructions:'Anleitung · Verstanden drücken',countdown:'Spiel beginnt',memorize:'Muster einprägen',answer:'Markiere die erinnerten Felder',reveal:'Auflösung · nächste Runde',finished:'🏆 Spiel beendet'};$('phase').textContent='Runde '+(s.round+1)+' · '+(names[phase]||phase);const end=phase==='countdown'?s.startAt:phase==='memorize'?s.answerAt:phase==='answer'?s.answerEndAt:phase==='reveal'?s.nextAt:null;$('timer').textContent=end===null?'':Math.max(0,Math.ceil((end-now)/1000))+' s';$('hint').textContent=phase==='answer'?'Kein Fertig-Button: Änderungen werden automatisch gespeichert.':phase==='reveal'?'Ergebnis bleibt fünf Sekunden sichtbar.':phase==='memorize'?'Alle leuchtenden Felder gleichzeitig merken!':'Antworten der anderen bleiben bis zur Auflösung verborgen.';const cells=s.size*s.size,board=$('board');board.style.gridTemplateColumns='repeat('+s.size+',minmax(0,1fr))';if(changed||board.children.length!==cells){board.replaceChildren();for(let i=0;i<cells;i++){const b=document.createElement('button');b.className='cell';b.type='button';b.setAttribute('aria-label','Feld '+(i+1));b.onclick=()=>{if(phase!=='answer'||serverNow()>=s.answerEndAt||!s.active.includes(room.players.find(p=>p.me)?.seat))return;selection=selection.includes(i)?selection.filter(x=>x!==i):[...selection,i];paint(s);sendSelection();};board.append(b);}}paint(s);$('scores').replaceChildren();if(s.results){for(const p of s.results){const item=document.createElement('span');const name=room.players.find(x=>x.seat===p.seat)?.name||'Spieler';item.textContent=name+': '+p.correct+' Treffer · '+p.extra+' Fehler';$('scores').append(item);}}if(s.winners?.length){$('hint').textContent='🏆 Sieger: '+s.winners.map(seat=>room.players.find(p=>p.seat===seat)?.name||'Spieler').join(', ');}const done=phase==='finished';$('finish').hidden=!done;if(done){$('winners').textContent='🥇 '+(s.winners||[]).map(seat=>room.players.find(p=>p.seat===seat)?.name||'Spieler').join(' & ');const scores=new Map();for(const result of s.results||[])scores.set(result.seat,result);const ordered=[...(room.match?.members||room.players||[])].filter(p=>p.seat).sort((a,b)=>{const x=scores.get(a.seat),y=scores.get(b.seat);return (s.winners?.includes(b.seat)?1:0)-(s.winners?.includes(a.seat)?1:0)||(y?.correct||0)-(x?.correct||0)||(x?.extra||0)-(y?.extra||0)||(x?.timeMs||10000)-(y?.timeMs||10000);});$('ranking').replaceChildren();for(const p of ordered){const li=document.createElement('li');const result=scores.get(p.seat);li.textContent=(p.name||'Spieler')+(result?' · '+result.correct+' Treffer · '+result.extra+' Fehler':' · ausgeschieden');$('ranking').append(li);}}}
function paint(s){const pattern=new Set(s.pattern||[]),my=new Set(selection);const reveal=phase==='reveal'||phase==='finished';if(reveal){const mine=room.players.find(p=>p.me)?.seat;const own=s.results?.find(r=>r.seat===mine);my.clear();for(const i of own?.cells||[])my.add(i);}Array.from($('board').children).forEach((b,i)=>{b.className='cell';if(phase==='memorize'&&pattern.has(i))b.classList.add('lit');if(phase==='answer'&&my.has(i))b.classList.add('pick');if(reveal){if(pattern.has(i)&&my.has(i))b.classList.add('hit');else if(my.has(i))b.classList.add('miss');else if(pattern.has(i))b.classList.add('omit');}b.disabled=phase!=='answer';});}
function sendSelection(){if(!matchId)return;const data=JSON.stringify(selection.slice().sort((a,b)=>a-b));if(data===lastSent)return;lastSent=data;const requestMatch=matchId,requestRound=round;sendQueue=sendQueue.catch(()=>{}).then(async()=>{try{await req('/merk-matrix/mark',{matchId:requestMatch,round:requestRound,cells:JSON.parse(data)});$('error').textContent='';}catch(e){if(requestRound===round){lastSent='';$('error').textContent='Markierung nicht gespeichert: '+e.message;}}});}
$('understood').onclick=async()=>{ack=true;$('understood').disabled=true;try{await req('/merk-matrix/understood',{matchId});await refresh();}catch(e){ack=false;$('error').textContent=e.message;}};
setInterval(()=>{if(!room?.match?.merkMatrix)return;const s=room.match.merkMatrix;const end=phase==='countdown'?s.startAt:phase==='memorize'?s.answerAt:phase==='answer'?s.answerEndAt:phase==='reveal'?s.nextAt:null;if(end!==null)$('timer').textContent=Math.max(0,Math.ceil((end-serverNow())/1000))+' s';if(end!==null&&serverNow()>=end&&Date.now()-lastTick>900&&matchId){lastTick=Date.now();req('/merk-matrix/tick',{matchId}).then(data=>{if(data?.match?.id===matchId){room=data;render(data.match.merkMatrix);}else void refresh();}).catch(()=>{});}},180);
window.addEventListener('spielonline-change',()=>{if(onlineUser()?.getIdToken)void refresh();});setInterval(refresh,2500);refresh();
</script></body></html>
