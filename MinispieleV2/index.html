<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minispiele 2.0 – Offline-Vorschau</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101c2b;color:#f4f7ff;min-height:100dvh;display:grid;place-items:center;padding:18px}main{width:min(620px,100%);background:#1c2b40;border:1px solid #3d5069;border-radius:20px;padding:24px}h1{margin-top:0}button,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #7187a4}button{background:#e8b95c;color:#172335;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}select{background:#263a54;color:white}#games{display:grid;gap:12px;margin:16px 0}.game{padding:16px;border:1px solid #4c6380;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hidden{display:none}#results{white-space:pre-wrap;line-height:1.6}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
</style></head><body><main><h1>🎮 Minispiele 2.0</h1><p>Unabhängige Offline-Vorschau. Die bestehende Online-Lobby bleibt unverändert.</p><section id="selection"><label for="players">Teilnehmer</label> <select id="players"><option value="1">1 Mensch</option><option value="2" selected>1 Mensch + 1 Bot</option><option value="3">1 Mensch + 2 Bots</option><option value="4">1 Mensch + 3 Bots</option></select><div id="games"></div></section><section id="play" class="hidden"><div id="game-root"></div></section></main>
<script type="module">
import './games.js';
import {listMiniGames} from './GameCatalog.js';
import {mountGame} from './host/GameHost.js';
const el=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const requestedBots=Number(params.get('bots'));
if(params.has('bots')&&Number.isInteger(requestedBots)&&requestedBots>=0&&requestedBots<=2)el('players').value=String(requestedBots+1);

function selection(){el('selection').classList.remove('hidden');el('play').classList.add('hidden');}
for(const entry of listMiniGames()){
 const card=document.createElement('div');card.className='game';
 const label=document.createElement('strong');label.textContent=entry.name;
 const button=document.createElement('button');button.textContent='Spielen';
 button.addEventListener('click',async()=>{
  button.disabled=true;
  try{
   const count=Number(el('players').value);
   const players=Array.from({length:count},(_,i)=>({id:'p'+i,type:i?'bot':'human'}));
   await mountGame({entry,players,container:el('game-root'),onExit:selection});
   el('selection').classList.add('hidden');el('play').classList.remove('hidden');
  }catch(e){alert('Spiel konnte nicht gestartet werden: '+e.message);}
  finally{button.disabled=false;}
 });
 card.append(label,button);el('games').append(card);
 if(params.get('game')===entry.id)queueMicrotask(()=>button.click());
}
</script></body></html>
