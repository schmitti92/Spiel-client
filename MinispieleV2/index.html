<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minispiele 2.0 – Offline-Vorschau</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101c2b;color:#f4f7ff;min-height:100dvh;display:grid;place-items:center;padding:18px}main{width:min(620px,100%);background:#1c2b40;border:1px solid #3d5069;border-radius:20px;padding:24px}h1{margin-top:0}button,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #7187a4}button{background:#e8b95c;color:#172335;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}select{background:#263a54;color:white}#games{display:grid;gap:12px;margin:16px 0}.game{padding:16px;border:1px solid #4c6380;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hidden{display:none}#results{white-space:pre-wrap;line-height:1.6}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
</style></head><body><main><h1>🎮 Minispiele 2.0</h1><p>Unabhängige Offline-Vorschau. Die bestehende Online-Lobby bleibt unverändert.</p><section id="selection"><label for="players">Teilnehmer</label> <select id="players"><option value="1">1 Mensch</option><option value="2" selected>1 Mensch + 1 Bot</option><option value="3">1 Mensch + 2 Bots</option><option value="4">1 Mensch + 3 Bots</option></select><div id="games"></div></section><section id="play" class="hidden"><h2 id="game-title"></h2><p id="instructions"></p><div class="controls"><button id="start">Zeitmessung starten</button><button id="stop" disabled>Stoppen</button></div><p id="results" aria-live="polite"></p><button id="again" class="hidden">Nochmal spielen</button> <button id="back">Zur Auswahl</button></section></main>
<script type="module">
import './games.js';
import {listMiniGames} from './GameCatalog.js';
import {createSession} from './engine/MiniGameEngine.js';
const el=id=>document.getElementById(id);let session=null,started=0,game=null;
function selection(){el('selection').classList.remove('hidden');el('play').classList.add('hidden');}
for(const entry of listMiniGames()){const card=document.createElement('div');card.className='game';const label=document.createElement('strong');label.textContent=entry.name;const button=document.createElement('button');button.textContent='Spielen';button.addEventListener('click',()=>openGame(entry));card.append(label,button);el('games').append(card);}
async function openGame(entry){try{const module=await import(entry.module);game=module;const count=Number(el('players').value);const players=Array.from({length:count},(_,i)=>({id:'p'+i,type:i?'bot':'human'}));session=createSession(game,players);el('game-title').textContent=entry.name;el('selection').classList.add('hidden');el('play').classList.remove('hidden');resetScreen();}catch(e){alert('Spiel konnte nicht gestartet werden: '+e.message);}}
function resetScreen(){started=0;el('start').disabled=false;el('stop').disabled=true;el('again').classList.add('hidden');el('results').textContent='Ziel: '+session.snapshot().state.targetSeconds+' Sekunden';el('instructions').textContent='Starte die Zeit und stoppe möglichst genau nach der Zielzeit.';}
el('start').addEventListener('click',()=>{started=performance.now();el('start').disabled=true;el('stop').disabled=false;el('results').textContent='Die Zeit läuft …';});
el('stop').addEventListener('click',()=>{if(!started)return;const seconds=(performance.now()-started)/1000;started=0;session.dispatch('p0',{type:'submitTime',seconds});for(const p of session.snapshot().players.filter(p=>p.type==='bot'))session.botTurn(p.id);const result=session.snapshot().result;el('stop').disabled=true;el('results').textContent='Ziel: '+result.targetSeconds+' s\n'+result.ranking.map(p=>p.rank+'. '+(p.id==='p0'?'Du':'Computer '+p.id.slice(1))+': '+p.seconds.toFixed(2)+' s · '+p.points+' Punkte').join('\n');el('again').classList.remove('hidden');});
el('again').addEventListener('click',()=>{session.restart();resetScreen();});el('back').addEventListener('click',selection);
</script></body></html>
