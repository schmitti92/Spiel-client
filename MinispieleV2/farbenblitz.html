<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farbenblitz – MiniGame Engine V2</title>
<style>
:root{font-family:system-ui,sans-serif;color:white;background:#09251d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 10%,#e7c65d88,transparent 36%),radial-gradient(ellipse at 15% 65%,#41883d,#173d2c 55%,#071c17 100%);padding:8px}
main{width:min(1480px,100%);height:calc(100dvh - 16px);min-height:480px;display:flex;flex-direction:column;overflow:hidden;position:relative;border-radius:24px;padding:clamp(10px,2vw,24px);background:linear-gradient(90deg,#071b18aa,#071b1811 17%,#071b1811 83%,#071b18aa),radial-gradient(ellipse at top,#75a54b77,transparent 50%);box-shadow:inset 0 0 95px #03150f,0 16px 60px #0009}
main:before,main:after{content:"🌳";position:absolute;top:12%;font-size:clamp(100px,21vw,320px);opacity:.55;pointer-events:none;filter:drop-shadow(0 0 18px #102b0c);z-index:0}main:before{left:-9%}main:after{right:-9%;transform:scaleX(-1)}
header,#setup,#play,#finish,#scores,footer{position:relative;z-index:1}header{display:flex;justify-content:center;align-items:center;text-align:center;margin-bottom:8px}h1{font-size:clamp(32px,5.6vw,74px);margin:0;font-weight:1000;font-style:italic;letter-spacing:-2px;color:#fff0ca;text-shadow:0 4px #633b16,0 7px 3px #160c07,0 0 18px #ffb727;transform:skew(-4deg)}header p{display:none}.tag{font-size:13px;background:#0b1c2ce8;border:2px solid #7c9eb5;border-radius:24px;padding:7px 13px}
header>.tag{position:absolute;right:0;top:5px}.hidden{display:none!important}
#setup,#finish{margin:auto;max-width:680px;width:100%;padding:28px;border:4px solid #bd7d38;border-radius:24px;background:#101d2de8;text-align:center}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}label{display:grid;gap:8px;text-align:left;font-weight:750}select,button{font:inherit;border-radius:16px;padding:12px;border:0}select{min-width:0;width:100%;background:#f6f0e5;color:#18243c}button{cursor:pointer;font-weight:950;touch-action:manipulation}button:focus-visible{outline:4px solid white;outline-offset:2px}button:active{transform:scale(.98)}#start,#again,#back{background:linear-gradient(#ffec83,#ffae18);color:#312008;padding:15px 28px;margin:6px}
#scores{order:1;display:flex;justify-content:center;gap:clamp(6px,2vw,20px);margin:0 auto 10px;width:100%;max-width:1340px;min-height:58px}
.score-pill{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid #7dcaff;border-radius:15px;background:linear-gradient(#122e43,#050e1c);box-shadow:0 4px 8px #0009,inset 0 1px #fff5;padding:clamp(8px,1.2vw,13px) 5px;font-size:clamp(13px,1.5vw,20px);font-weight:900}
.score-pill:first-child{border-color:#ffd65b;box-shadow:0 0 13px #ffd34c8c,0 4px 8px #0009}
#play{order:2;flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:clamp(7px,1.4vh,14px);width:min(1320px,100%);margin:auto;background:linear-gradient(125deg,#17243bf5,#0a1426f8);border:clamp(5px,.7vw,10px) ridge #b97b36;border-radius:clamp(16px,2.5vw,38px);padding:clamp(12px,2.2vw,30px);box-shadow:0 10px 35px #000c,inset 0 0 30px #030a17}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(14px,2vw,25px);font-weight:850}#status{border-bottom:1px solid #9d683b;padding-bottom:8px}.hud .tag{border:0;background:transparent;font-size:clamp(12px,1.5vw,19px)}
.question{min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}.question p{font-size:clamp(16px,2.2vw,28px);font-weight:850;text-align:center;margin:0;text-shadow:0 3px 5px #000}
#word{width:min(860px,100%);text-align:center;font-size:clamp(58px,10vw,125px);font-weight:1000;line-height:1.25;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(#1a3551,#10223a);border:3px solid #d6dfe8;border-radius:28px;padding:clamp(6px,2vh,22px);box-shadow:0 0 13px #ffb964,inset 0 -7px 14px #0008,0 10px 12px #0007;text-shadow:0 5px 5px #0009}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.5vw,18px)}
.colors button{min-height:clamp(63px,11vh,130px);color:#fff;font-size:clamp(23px,3.5vw,49px);border:3px solid #fff9;border-radius:clamp(14px,2vw,27px);box-shadow:inset 0 7px 6px #ffffff58,inset 0 -8px 6px #0005,0 5px 0 #071321,0 0 12px currentColor;text-shadow:0 4px 4px #0007}
#feedback{min-height:16px;text-align:center;color:#d6eaff;font-weight:800}#finish{order:2}footer{order:3;text-align:center;font-size:11px;color:#c3d9c8;margin-top:5px}
@media(max-width:650px){main{padding:8px;border-radius:14px}h1{font-size:32px}.controls{grid-template-columns:1fr}#scores{min-height:40px}.score-pill{font-size:11px;padding:6px 3px}#play{padding:10px;border-width:5px}.hud .tag{display:none}#word{font-size:clamp(43px,13vw,78px)}.colors button{font-size:22px;min-height:clamp(56px,11vh,95px)}}
@media(max-height:610px) and (orientation:landscape){header{margin:0}h1{font-size:clamp(28px,5vh,45px)}#scores{min-height:38px;margin-bottom:4px}.score-pill{padding:5px}.hud{font-size:15px}#play{padding:8px 18px;gap:4px}.question p{font-size:16px}#word{font-size:clamp(38px,10vh,70px);padding:4px}.colors button{min-height:48px;font-size:22px}footer{display:none}}

/* Tablet landscape: reserve real space for every row; no overlapping content */
main{min-height:0}
#play{grid-template-rows:min-content minmax(0,1fr) minmax(125px,36%) min-content;overflow:hidden}
.question{overflow:hidden;justify-content:space-evenly;gap:3px}
.question p{flex:none;line-height:1.15;font-size:clamp(15px,1.7vw,23px)}
#word{flex:0 1 auto;min-height:0;font-size:clamp(40px,7.3vh,84px);line-height:1.08;padding:clamp(4px,1vh,12px);max-width:800px}
.colors{min-height:0;grid-template-rows:repeat(2,minmax(0,1fr))}
.colors button{min-height:0;height:100%;font-size:clamp(21px,3vw,43px)}
#feedback{min-height:0;font-size:12px}
@media(max-height:700px) and (orientation:landscape){
header{margin-bottom:3px}h1{font-size:clamp(27px,5.2vh,48px)}
#scores{min-height:0;margin-bottom:5px}.score-pill{padding:6px 5px}
#play{grid-template-rows:min-content minmax(0,1fr) minmax(115px,40%) min-content;padding:9px 18px;gap:5px}
.hud{font-size:clamp(14px,1.5vw,20px)}
.question p{font-size:clamp(15px,1.6vw,21px)}
#word{font-size:clamp(40px,8.2vh,70px);padding:4px 10px;border-radius:16px}
.colors button{font-size:clamp(21px,2.6vw,35px);min-height:0}
}

/* Landscape tablet: strictly separated HUD, prompt, word and answer rows */
#play{display:grid;grid-template-rows:min-content minmax(0,1fr) minmax(0,1.15fr);gap:10px;align-content:stretch}
.question{display:grid;grid-template-rows:min-content minmax(0,1fr);align-items:center;justify-items:center;gap:8px;min-height:0;overflow:hidden}
.question p{position:static;line-height:1.15;margin:0;font-size:clamp(15px,1.8vw,25px);text-align:center}
#word{width:min(850px,100%);height:100%;max-height:100%;display:grid;place-items:center;line-height:1;font-size:clamp(38px,7vh,78px);padding:4px 12px;overflow:hidden}
.colors{height:100%;min-height:0;grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}
.colors button{height:100%;min-height:0;padding:4px 12px;font-size:clamp(20px,2.7vw,40px)}
#feedback{display:none}
@media (orientation:landscape) and (max-height:900px){
main{padding:10px 14px}header{margin:0 0 4px}h1{font-size:clamp(30px,6vh,60px)}
#scores{margin-bottom:5px;min-height:0}.score-pill{padding:7px 5px}
#play{padding:10px 20px;gap:7px;grid-template-rows:min-content minmax(0,1fr) minmax(0,1.25fr)}
.hud{font-size:clamp(14px,1.6vw,21px)}#status{padding-bottom:3px}
.question{gap:5px}.question p{font-size:clamp(15px,1.6vw,21px)}
#word{font-size:clamp(38px,7.5vh,72px);border-radius:16px}
.colors{gap:8px}.colors button{font-size:clamp(21px,2.5vw,35px)}
footer{display:none}
}

/* Forest artwork and arcade logo: visual-only; keep measured game grid intact */
body{background:#071d17 url('./assets/farbenblitz-forest.svg') center center / cover no-repeat fixed}
main{background:linear-gradient(90deg,#04170f85,#102a1822 20%,#102a1822 80%,#04170f85),url('./assets/farbenblitz-forest.svg') center center / cover no-repeat;box-shadow:inset 0 0 90px #07150caa,0 16px 60px #000a}
main:before,main:after{content:none}
header{isolation:isolate}
h1{display:inline-block;position:relative;padding:0 .55em .12em;background:linear-gradient(95deg,#fa333c 2%,#ffad20 24%,#f7e64d 45%,#3bd56b 65%,#2389f5 85%,#ba58f5 100%);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-stroke:1px #3c220c;text-shadow:0 6px 8px #000b;filter:drop-shadow(0 0 8px #ffcc5a);letter-spacing:-.045em}
header>div{background:linear-gradient(90deg,transparent,#071421a8 15%,#071421a8 85%,transparent);border-radius:25px}
#play{background:linear-gradient(145deg,#17233cf2,#071427f4);border-color:#cb8d43;box-shadow:0 12px 32px #000c,inset 0 0 35px #07182e}
.score-pill{background:linear-gradient(180deg,#143b53,#050e1d);box-shadow:0 4px 10px #0009,inset 0 1px #ffffff66}
</style></head><body><main>
<header><div><h1>⚡ Farbenblitz</h1><p>MiniGame Engine V2 · Design-Test</p></div><span class="tag">🎮 Offline-Test</span></header>
<section id="setup"><div class="controls">
<label>Spieler insgesamt<select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
<label>Schwierigkeit<select id="level"><option value="leicht">Leicht – Wort lesen</option><option value="mittel" selected>Mittel – Schriftfarbe</option><option value="schwer">Schwer – Schriftfarbe</option></select></label>
<label>Runden<select id="rounds"><option>5</option><option selected>10</option><option>20</option><option>30</option></select></label>
</div><button id="start">Spiel starten</button></section>
<section id="play" class="hidden"><div class="hud"><div id="status"></div><span class="tag">🎯 Wähle die richtige Farbe</span></div><div class="question"><p id="prompt">In welcher FARBE ist das Wort geschrieben?</p><div id="word"></div></div><div class="colors" id="colors"></div><div id="feedback" aria-live="polite"></div></section>
<section id="finish" class="hidden"><h2>🏆 Ergebnis</h2><div id="results"></div><button id="again">Nochmal spielen</button><button id="back">Zur Auswahl</button></section>
<div id="scores" aria-live="polite"></div><footer>Vorschau mit Computergegnern · gemeinsamer Online-Modus folgt später</footer>
</main>
<script type="module">
import {games} from './games.js';
import {createGameRegistry} from './engine/GameRegistry.js';
import {createGameLauncher} from './engine/GameLauncher.js';
import {createLobbyGameBridge} from './engine/LobbyGameBridge.js';
import {createResultLedger} from './engine/ResultLedger.js';
import {createMiniGameFlow} from './engine/MiniGameFlow.js';
const $=id=>document.getElementById(id);
const colors={rot:'#f04455',blau:'#3489ee',gruen:'#23b86a',gelb:'#e0ae15'};
const registry=createGameRegistry(games);
const bridge=createLobbyGameBridge(createGameLauncher(registry));
const ledger=createResultLedger(c=>c.result.results.map(r=>({playerId:r.playerId,points:r.score})));
const flow=createMiniGameFlow(bridge,ledger);
let serial=0;
function show(name){for(const id of ['setup','play','finish'])$(id).classList.toggle('hidden',id!==name);}
function startNew(){
 const count=Number($('count').value),rounds=Number($('rounds').value);
 const players=[{id:'player-1',type:'human'},...Array.from({length:count-1},(_,i)=>({id:'bot-'+(i+1),type:'bot'}))];
 flow.select({roomId:'offline-demo',matchId:'farbenblitz-'+(++serial),gameId:'farbenblitz',players,options:{rounds,level:$('level').value}});
 flow.start();$('feedback').textContent='';show('play');render();
}
function answer(color){
 const s=flow.snapshot();if(s.stage!=='playing')return;
 const round=s.session.state.round;
 flow.dispatch('player-1',{type:'answer',round,color});
 let current=flow.snapshot();
 for(const p of current.session.players.filter(p=>p.type==='bot')){
  if(current.stage!=='playing')break;
  flow.botTurn(p.id);current=flow.snapshot();
 }
 if(current.stage==='result'){finish();return;}
 $('feedback').textContent='';
 render();
}
function render(){
 const s=flow.snapshot(),state=s.session.state;
 $('status').textContent='Runde '+(state.round+1)+' / '+state.rounds+' · '+(state.level==='leicht'?'Wort lesen':'Schriftfarbe wählen');
 $('prompt').textContent=state.level==='leicht'?'Welches WORT steht hier?':'In welcher FARBE ist das Wort geschrieben?';
 $('word').textContent=state.challenge.word.toUpperCase();
 $('word').style.color=colors[state.challenge.ink];
 $('colors').replaceChildren();
 for(const [name,color] of Object.entries(colors)){
  const b=document.createElement('button');b.textContent=name.toUpperCase();b.style.background=color;
  b.addEventListener('click',()=>answer(name));$('colors').append(b);
 }
 $('scores').replaceChildren();
 for(const [id,n] of Object.entries(state.scores)){const el=document.createElement('span');el.className='score-pill';el.textContent=id==='player-1'?'👤 Spieler 1':'🤖 '+id.replace('bot-','Bot ');$('scores').append(el);}
}
function finish(){
 const s=flow.snapshot();show('finish');
 const rows=[...s.completion.result.results].sort((a,b)=>b.score-a.score);
 $('results').replaceChildren();
 for(const [i,r] of rows.entries()){const p=document.createElement('p');p.textContent=(i+1)+'. '+r.playerId+' – '+r.score+' richtig';$('results').append(p);}
 $('scores').replaceChildren();
}
$('start').addEventListener('click',startNew);
$('again').addEventListener('click',()=>{flow.replay();flow.start();$('feedback').textContent='';show('play');render();});
$('back').addEventListener('click',()=>{flow.returnToSelection();show('setup');$('scores').replaceChildren();});
</script></body></html>
