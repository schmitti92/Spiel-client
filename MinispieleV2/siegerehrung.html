<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minispiele V2 · Dschungel-Spielwertung</title>
<style>
:root{font-family:system-ui,sans-serif;color:#fff6d5;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#356b38,#102c25 68%,#081c18);padding:clamp(10px,2vw,24px)}main{max-width:1050px;margin:auto;min-height:calc(100dvh - 40px);display:flex;flex-direction:column;gap:15px}.heading{text-align:center;background:linear-gradient(#885022,#4c2a13);border:5px ridge #bc8439;border-radius:20px;padding:12px;box-shadow:0 12px 30px #0008}h1{margin:0;color:#ffcf53;text-shadow:2px 3px #532600;font-size:clamp(26px,5vw,50px)}.sub{margin:5px}.leaf{font-size:24px}.panel{background:linear-gradient(140deg,#583819,#332113);border:5px ridge #b17a3b;border-radius:18px;padding:clamp(10px,2vw,22px);box-shadow:0 15px 30px #0008}.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.tabs button{background:#244d3c;border:2px solid #ac7a36}.tabs button[aria-selected=true]{background:linear-gradient(#ffd75b,#b56a0d);color:#33200b}.table-wrap{overflow-x:auto}table{border-collapse:separate;border-spacing:0 9px;width:100%;min-width:480px;text-align:center}th{font-size:clamp(12px,2vw,16px);color:#fce0a1}td{background:#294a3c;padding:12px 9px;font-weight:700}td:first-child{border-radius:12px 0 0 12px;text-align:left}td:last-child{border-radius:0 12px 12px 0;font-size:1.2em;color:#ffe392}tr.first td{background:linear-gradient(90deg,#d8a82b,#8a5b19);color:#fff}tr.second td{background:#576a73}tr.third td{background:#84513b}.muted{opacity:.65}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:auto}button,a.button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 20px;color:white;cursor:pointer;text-decoration:none;background:linear-gradient(#39bb4e,#11772e);box-shadow:0 5px 0 #06421a}a.button{background:linear-gradient(#359ee7,#1153ac);box-shadow:0 5px 0 #072b63}.note{text-align:center;color:#d6dfbd;font-size:13px}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}@media(max-width:550px){td{padding:9px 5px}.panel{padding:8px}.buttons>*{flex:1;text-align:center}}
</style></head><body><main><header class="heading"><div class="leaf">🌴 🔥 🌿 🏆 🌿 🔥 🌴</div><h1>SPIEL BEENDET!</h1><p class="sub" id="subtitle">Punktwertung dieses Spiels</p></header><section class="panel" aria-label="Spielergebnisse"><nav class="tabs" id="tabs" aria-label="Runden auswählen"></nav><div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></section><div class="buttons"><button id="replay" type="button">↻ Nochmal spielen</button><a class="button" id="back" href="./lobby.html">⌂ Zur Spielauswahl</a></div><p class="note" id="note">Designvorschau mit Beispieldaten · noch nicht mit einem Spiel verbunden</p></main>
<script type="module">
import {createRoundResults} from './engine/RoundResults.js';
const demo=[{id:'anna',name:'Anna',type:'human'},{id:'chris',name:'Chris',type:'human'},{id:'max',name:'Max',type:'human'},{id:'lena',name:'Lena',type:'bot'}];
const params=new URLSearchParams(location.search);
const raw=params.get('data');let players=demo,rounds=[[8,7,4,5],[10,6,5,3],[8,7,6,4]];
if(raw){try{const parsed=JSON.parse(raw);if(!Array.isArray(parsed.players)||!Array.isArray(parsed.rounds)||parsed.players.length<1||parsed.players.length>4||parsed.rounds.length>30)throw Error('INVALID_PREVIEW');players=parsed.players;rounds=parsed.rounds}catch{document.getElementById('note').textContent='Ungültige Vorschaudaten – Beispieldaten werden angezeigt.';players=demo;rounds=[[8,7,4,5],[10,6,5,3],[8,7,6,4]]}}
const manager=createRoundResults(players);
for(const round of rounds)manager.addRound(players.map((p,i)=>({playerId:p.id,score:round[i]})));
const data=manager.snapshot(),tabs=document.getElementById('tabs'),head=document.getElementById('head'),body=document.getElementById('rows');
let selected='total';
const safe=value=>String(value??'');
function render(){tabs.replaceChildren();for(let i=0;i<data.roundCount;i++){const b=document.createElement('button');b.textContent='Runde '+(i+1);b.setAttribute('aria-selected',String(selected===i));b.onclick=()=>{selected=i;render()};tabs.append(b)}const total=document.createElement('button');total.textContent='Gesamt';total.setAttribute('aria-selected',String(selected==='total'));total.onclick=()=>{selected='total';render()};tabs.append(total);
head.replaceChildren();const tr=document.createElement('tr');for(const name of ['Platz / Spieler',...(selected==='total'?Array.from({length:data.roundCount},(_,i)=>'Runde '+(i+1)):['Runde '+(selected+1)]),'Gesamt']){const th=document.createElement('th');th.textContent=name;tr.append(th)}head.append(tr);body.replaceChildren();
const ranking=selected==='total'?data.ranking:(()=>{const r=data.rounds[selected];return [...r].sort((a,b)=>b.score-a.score).map((x,i,arr)=>({...x,rank:i&&x.score===arr[i-1].score?null:i+1})).map((x,i,arr)=>({...x,rank:x.rank??arr.slice(0,i).reverse().find(y=>y.rank!==null)?.rank??1}))})();
for(const entry of ranking){const tr=document.createElement('tr');tr.className=entry.rank===1?'first':entry.rank===2?'second':entry.rank===3?'third':'';const p=players.find(p=>p.id===entry.playerId);const cells=[(entry.rank===1?'🥇':entry.rank===2?'🥈':entry.rank===3?'🥉':'🎖️')+' '+safe(p?.name??p?.id),...(selected==='total'?data.rounds.map(r=>r.find(x=>x.playerId===entry.playerId).score):[data.rounds[selected].find(x=>x.playerId===entry.playerId).score]),data.totals.find(x=>x.playerId===entry.playerId).score];for(const [i,value] of cells.entries()){const td=document.createElement('td');td.textContent=safe(value);if(selected==='total'&&i>0&&i<cells.length-1)td.className='muted';tr.append(td)}body.append(tr)}
}
render();document.getElementById('replay').onclick=()=>{selected=0;render()};const room=params.get('room');if(room&&/^\d{3}$/.test(room))document.getElementById('back').href='./lobby.html?room='+encodeURIComponent(room);
</script></body></html>
