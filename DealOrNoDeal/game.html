<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deal or No Deal – Online Goldstudio</title><style>
*{box-sizing:border-box}body{margin:0;color:#f7e6c3;background:radial-gradient(ellipse at 50% 0,#514127,#112548 42%,#050b1a);font:16px system-ui}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:#071329;border-bottom:2px solid #b98a43}h1{font-size:clamp(20px,3vw,32px);margin:0;color:#ffe2a0}a{color:#ffdc95}main{max-width:1550px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:minmax(170px,1fr) minmax(380px,3fr) minmax(170px,1fr);gap:14px}.panel{background:linear-gradient(145deg,#182e52,#08172e);border:2px solid #b28a51;border-radius:18px;padding:12px;box-shadow:0 9px 22px #0007}.panel h2{font-size:18px;text-align:center;margin:5px 0 12px;color:#ffdc95}.money{display:grid;grid-template-columns:1fr 1fr;gap:4px}.money span{background:#14325a;padding:6px 2px;border-radius:4px;text-align:center;font-size:clamp(10px,1vw,15px)}.money .gone{text-decoration:line-through;opacity:.32}.cases{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:20px 8px}.case{min-height:76px;position:relative;border-radius:9px;background:linear-gradient(135deg,#fff0ad,#ad7430 47%,#ffda86);color:#201507;border:2px solid #ffe6a0;box-shadow:0 7px 8px #0009;font-size:clamp(18px,2vw,30px);font-weight:900}.case:before{content:"";position:absolute;top:-10px;left:34%;width:32%;height:10px;border:3px solid #dca85b;border-bottom:0;border-radius:6px 6px 0 0}.case:disabled{opacity:.5}.case.personal{background:#102a4a;color:#9ddcff;border:2px dashed #4badd8}.case.opened{background:linear-gradient(#5b381e,#dfb16a);color:#fff4c8;font-size:clamp(10px,1.2vw,17px);opacity:1}.case.revealing{animation:flash .7s infinite alternate}@keyframes flash{to{box-shadow:0 0 28px #ffdc8a;transform:scale(1.04)}}.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:15px}.player{padding:12px;border:2px solid #977241;border-radius:16px;background:#10264a;min-height:100px}.player.turn{border-color:#ffdf90;box-shadow:0 0 20px #e8b85c66}.personalcase{margin-top:9px;display:inline-block;background:linear-gradient(135deg,#ffe9a3,#ae752c);color:#231709;border-radius:8px;padding:8px 13px;font-weight:900}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{padding:12px 18px;border-radius:10px;border:1px solid #ffdd9b;background:linear-gradient(#ffe3a0,#c18b3b);color:#201609;font:800 16px system-ui;cursor:pointer}.btn:disabled{opacity:.4}.status{padding:16px;background:#112a4c;border:1px solid #a27a45;border-radius:12px;margin:12px 0;min-height:80px}.offer{font-size:clamp(20px,3vw,40px);color:#ffe5a0;font-weight:900}.overlay{position:fixed;inset:0;background:#030915df;display:grid;place-items:center;z-index:9;padding:15px}.overlay.hidden{display:none}.modal{max-width:570px;width:100%;padding:28px;border:2px solid #d8ad62;background:#102448;border-radius:24px;text-align:center}.modal h2{font-size:28px}.modal .big{font-size:42px;font-weight:900;color:#ffdf8c}.banker{min-height:160px;display:grid;place-items:center;font-size:85px;text-shadow:0 0 30px #4278bc}@media(max-width:900px){.layout{grid-template-columns:1fr 2.5fr}.layout .bank{grid-column:1/-1}.banker{min-height:40px;font-size:35px}.cases{gap:7px}.case{min-height:55px}.players{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.layout{grid-template-columns:1fr}.cases{gap:6px}.case{min-height:44px}.money{grid-template-columns:repeat(4,1fr)}.players{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div><h1>✦ DEAL OR NO DEAL</h1><small>MULTIPLAYER BATTLE · GOLDSTUDIO ONLINE</small></div><a id="back" href="lobby.html">← Lobby</a></header><main><div class="status" id="status">Verbinde mit dem Goldstudio …</div><div class="layout"><section class="panel"><h2>💰 Geldtafel</h2><div class="money" id="money"></div></section><section class="panel"><h2>🧳 26 Goldkoffer</h2><div class="cases" id="cases"></div></section><section class="panel bank"><h2>☎ Der Banker</h2><div class="banker">♟</div><div id="offer"></div></section></div><div class="players" id="players"></div><div class="actions" id="actions"></div></main><div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div><script src="../profile-config.js"></script><script src="../profile-auth.js"></script><script>
'use strict';const $=id=>document.getElementById(id),code=new URLSearchParams(location.search).get('room'),base=String(window.SPIELPORTAL_CONFIG?.apiBase||'https://serverfinal-ynbe.onrender.com').replace(/\/+$/,''),values=[1,100,500,1000,2500,5000,7500,10000,20000,30000,40000,50000,75000,100000,500000,1000000,2500000,5000000,7500000,10000000,20000000,30000000,40000000,50000000,75000000,100000000],eur=v=>(v/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});let g=null,busy=false,lastReveal=null;
$('back').href='lobby.html?room='+encodeURIComponent(code||'');
function user(){const s=window.SpielOnline?.state?.();return s?.status==='online'?s.user:null}
function myId(){return user()?.uid||null}
async function request(method,path,body){let u=user();if(!u)throw Error('Bitte anmelden');let token=await u.getIdToken();let r=await fetch(base+'/api/deal-or-no-deal/'+encodeURIComponent(code)+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});let data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'SERVER_ERROR');return data}
function button(label,fn){let b=document.createElement('button');b.className='btn';b.textContent=label;b.disabled=busy;b.onclick=fn;return b}
async function action(type,extra={}){if(!g||busy)return;busy=true;try{let data=await request('POST','/action',{type,...extra,revision:g.revision,id:crypto.randomUUID()});g=data.game;render()}catch(e){$('status').textContent='Aktion nicht möglich: '+e.message;await poll()}finally{busy=false}}
function turn(){if(!g)return null;for(let i=0;i<g.order.length;i++){let id=g.order[(g.turnIndex+i)%g.order.length];if(g.players.some(p=>p.id===id&&p.deal===null))return id}return null}
function free(i){return !g.opened.includes(i)&&!g.players.some(p=>p.case===i)}
function currentDecision(){let h=g.history.at(-1);return h?.participants.find(id=>!h.decisions.some(d=>d.id===id))}
function render(){if(!g){$('status').textContent='Noch keine Partie gestartet. Öffne die Lobby und starte als Host.';return}let who=g.phase==='select'?g.order[g.selectionIndex]:g.phase==='open'?turn():g.phase==='decision'?currentDecision():null;let p=g.players.find(x=>x.id===who);$('status').textContent=g.phase==='select'?'Persönliche Koffer wählen: '+p?.name:g.phase==='open'?'Koffer öffnen: '+p?.name:g.phase==='reveal'?'Der Koffer wird geöffnet …':g.phase==='decision'?'Bankangebot · '+p?.name+' entscheidet':g.phase==='final'?'🏆 Finale: Persönliche Koffer werden enthüllt':'Partie beendet';
$('cases').replaceChildren();for(let i=0;i<26;i++){let b=document.createElement('button');b.className='case';let opened=g.openedAmounts.find(x=>x.case===i),owner=g.players.find(x=>x.case===i);b.textContent=opened?eur(opened.amount):owner?'◈':i+1;if(opened)b.classList.add('opened');if(owner)b.classList.add('personal');if(g.pending?.case===i)b.classList.add('revealing');b.disabled=busy||!free(i)||!['select','open'].includes(g.phase)||who!==myId();b.onclick=()=>action(g.phase==='select'?'select':'open',{case:i});$('cases').append(b)}
$('money').replaceChildren();for(let v of values){let x=document.createElement('span');x.textContent=eur(v);if(g.openedAmounts.some(a=>a.amount===v))x.className='gone';$('money').append(x)}
$('players').replaceChildren();for(let p of g.players){let el=document.createElement('div');el.className='player'+(p.id===who?' turn':'');let title=document.createElement('strong');title.textContent='👤 '+p.name;el.append(title);let desc=document.createElement('div');desc.textContent=p.deal!==null?'🤝 DEAL · '+eur(p.deal):'Im Spiel';el.append(desc);if(p.case!==null){let c=document.createElement('div');c.className='personalcase';let f=g.finalValues?.find(x=>x.id===p.id);c.textContent='🧳 '+(p.case+1)+(f?' · '+eur(f.amount):'');el.append(c)}$('players').append(el)}
$('offer').textContent=g.phase==='decision'?'Bankangebot für alle: '+eur(g.offer):g.history.length?'Letztes Angebot: '+eur(g.history.at(-1).offer):'Der Banker wartet.';
$('actions').replaceChildren();if(g.phase==='decision'&&who===myId()){$('actions').append(button('🤝 DEAL',()=>{if(confirm('DEAL über '+eur(g.offer)+' verbindlich annehmen?'))action('decide',{deal:true})}),button('🔥 NO DEAL',()=>action('decide',{deal:false})))}if(g.phase==='reveal'&&g.pending?.actor===myId()&&!busy){let a=g.pending;let revealed=g.openedAmounts.find(x=>x.case===a.case);$('actions').append(button('🧳 Kofferöffnung abschließen',()=>action('ack-reveal')))}if(g.phase==='final'&&g.finalValues){let max=Math.max(...g.finalValues.map(x=>x.payout));$('status').textContent='🏆 '+g.finalValues.filter(x=>x.payout===max).map(x=>g.players.find(p=>p.id===x.id)?.name).join(' & ')+' gewinnt mit '+eur(max)}}
async function poll(){if(!code||!user())return;try{let data=await request('GET','');if(!g||data.game?.revision!==g.revision){g=data.game;render()}}catch(e){$('status').textContent='Verbindung: '+e.message}}
window.addEventListener('spielonline-change',poll);setInterval(()=>{if(!document.hidden)poll()},1800);poll();
</script></body></html>
