</style></head><body><header><div><h1>✦ DEAL OR NO DEAL</h1><small>MULTIPLAYER BATTLE · GOLDSTUDIO ONLINE</small></div><a id="back" href="lobby.html">← Lobby</a></header><main><div class="status" id="status">Verbinde mit dem Goldstudio …</div><div class="layout"><section class="panel"><h2>💰 Geldtafel</h2><div class="money" id="money"></div></section><section class="panel"><h2>🧳 26 Goldkoffer</h2><div class="cases" id="cases"></div></section><section class="panel bank"><h2>☎ Der Banker</h2><div class="banker">♟</div><div id="offer"></div></section></div><div class="players" id="players"></div><div class="actions" id="actions"></div></main><div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div><script src="../profile-config.js"></script><script src="../profile-auth.js"></script><script>
'use strict';const $=id=>document.getElementById(id),code=new URLSearchParams(location.search).get('room'),base=String(window.SPIELPORTAL_CONFIG?.apiBase||'https://serverfinal-ynbe.onrender.com').replace(/\/+$/,''),values=[1,100,500,1000,2500,5000,7500,10000,20000,30000,40000,50000,75000,100000,500000,1000000,2500000,5000000,7500000,10000000,20000000,30000000,40000000,50000000,75000000,100000000],eur=v=>(v/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});let g=null,busy=false,lastReveal=null,revealTimer=null,lastError='';
$('back').href='lobby.html?room='+encodeURIComponent(code||'');
function user(){const s=window.SpielOnline?.state?.();return s?.status==='online'?s.user:null}
function myId(){return user()?.uid||null}
async function request(method,path,body){let u=user();if(!u)throw Error('Bitte anmelden');let token=await u.getIdToken();let r=await fetch(base+'/api/deal-or-no-deal/'+encodeURIComponent(code)+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});let data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'SERVER_ERROR');return data}
function button(label,fn){let b=document.createElement('button');b.className='btn';b.textContent=label;b.disabled=busy;b.onclick=fn;return b}
async function action(type,extra={}){if(!g||busy)return;busy=true;lastError='';$('status').textContent='⏳ '+(type==='open'?'Koffer wird geöffnet …':'Aktion wird gespeichert …');try{let data=await request('POST','/action',{type,...extra,revision:g.revision,id:crypto.randomUUID()});g=data.game;render()}catch(e){lastError='⚠️ Aktion fehlgeschlagen: '+e.message;await poll();$('status').textContent=lastError}finally{busy=false;render();if(lastError)$('status').textContent=lastError}}
function turn(){if(!g)return null;for(let i=0;i<g.order.length;i++){let id=g.order[(g.turnIndex+i)%g.order.length];if(g.players.some(p=>p.id===id&&p.deal===null))return id}return null}
function free(i){return !g.opened.includes(i)&&!g.players.some(p=>p.case===i)}
function currentDecision(){let h=g.history.at(-1);return h?.participants.find(id=>!h.decisions.some(d=>d.id===id))}
function render(){if(!g){$('offer').classList.remove('offer-active');$('status').textContent='Noch keine Partie gestartet. Gehe zur Lobby und starte als Host.';$('cases').replaceChildren();for(let i=0;i<26;i++){let b=document.createElement('button');b.className='case';b.textContent=i+1;b.disabled=true;$('cases').append(b)}$('money').replaceChildren();for(let v of values){let x=document.createElement('span');x.textContent=eur(v);$('money').append(x)}$('players').replaceChildren();$('actions').replaceChildren();$('actions').append(button('← Zur Lobby',()=>location.assign('lobby.html?room='+encodeURIComponent(code||''))));$('offer').textContent='Der Banker wartet auf den Spielstart.';return}let who=g.phase==='select'?g.order[g.selectionIndex]:g.phase==='open'?turn():g.phase==='decision'?currentDecision():null;let p=g.players.find(x=>x.id===who);$('status').textContent=g.phase==='select'?'Persönliche Koffer wählen: '+p?.name:g.phase==='open'?'Koffer öffnen: '+p?.name:g.phase==='reveal'?'Der Koffer wird geöffnet …':g.phase==='decision'?'Bankangebot · '+p?.name+' entscheidet':g.phase==='final'?'🏆 Finale: Persönliche Koffer werden enthüllt':'Partie beendet';
$('cases').replaceChildren();for(let i=0;i<26;i++){let b=document.createElement('button');b.className='case';let opened=g.openedAmounts.find(x=>x.case===i),owner=g.players.find(x=>x.case===i);b.textContent=opened?eur(opened.amount):owner?'◈':i+1;if(opened)b.classList.add('opened');if(owner)b.classList.add('personal');if(g.pending?.case===i)b.classList.add('revealing');b.disabled=busy||!free(i)||!['select','open'].includes(g.phase)||who!==myId();b.onclick=()=>action(g.phase==='select'?'select':'open',{case:i});$('cases').append(b)}
$('money').replaceChildren();for(let v of values){let x=document.createElement('span');x.textContent=eur(v);if(g.openedAmounts.some(a=>a.amount===v))x.className='gone';$('money').append(x)}
$('players').replaceChildren();for(let p of g.players){let el=document.createElement('div');el.className='player'+(p.id===who?' turn':'');let title=document.createElement('strong');title.textContent='👤 '+p.name;el.append(title);let desc=document.createElement('div');desc.textContent=p.deal!==null?'🤝 DEAL · '+eur(p.deal):'Im Spiel';el.append(desc);if(p.case!==null){let c=document.createElement('div');c.className='personalcase';let f=g.finalValues?.find(x=>x.id===p.id);c.textContent='🧳 '+(p.case+1)+(f?' · '+eur(f.amount):'');el.append(c)}$('players').append(el)}
$('offer').classList.toggle('offer-active',g.phase==='decision');$('offer').textContent=g.phase==='decision'?'Bankangebot für alle: '+eur(g.offer):g.history.length?'Letztes Angebot: '+eur(g.history.at(-1).offer):'Der Banker wartet.';
$('actions').replaceChildren();if(g.phase==='decision'&&who===myId()){$('actions').append(button('🤝 DEAL',()=>{if(confirm('DEAL über '+eur(g.offer)+' verbindlich annehmen?'))action('decide',{deal:true})}),button('🔥 NO DEAL',()=>action('decide',{deal:false})))}if(g.phase==='reveal'&&g.pending?.actor===myId()&&!busy){$('status').textContent='🧳 Koffer '+(g.pending.case+1)+' öffnet sich – Enthüllung läuft …';$('actions').append(button('🧳 Enthüllung jetzt abschließen',()=>action('ack-reveal')));if(lastReveal!==g.pending.eventId){lastReveal=g.pending.eventId;clearTimeout(revealTimer);revealTimer=setTimeout(()=>{if(g?.phase==='reveal'&&g.pending?.eventId===lastReveal)action('ack-reveal')},3200)}}if(g.phase==='open'&&who!==myId())$('status').textContent+=' · Du bist gerade nicht am Zug.';if(g.phase==='final'&&g.finalValues){let max=Math.max(...g.finalValues.map(x=>x.payout));$('status').textContent='🏆 '+g.finalValues.filter(x=>x.payout===max).map(x=>g.players.find(p=>p.id===x.id)?.name).join(' & ')+' gewinnt mit '+eur(max)}}
async function poll(){if(!code||!user())return;try{let data=await request('GET','');if(!g||data.game?.revision!==g.revision){g=data.game;render()}}catch(e){$('status').textContent='Verbindung: '+e.message}}
render();window.addEventListener('spielonline-change',poll);setInterval(()=>{if(!document.hidden)poll()},1800);poll();
</script></body></html>
