<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOG Sammelalbum 2 · Weihnachtswelt</title>
<script>
(()=>{const target=new URL('./weihnachtswelt.html',location.href);
 const query=new URLSearchParams(location.search);
 const view=location.hash==='#packs'?'packs':location.hash==='#duplicates'?'duplicates':query.get('view')==='packs'?'packs':query.get('view')==='duplicates'?'duplicates':'album';
 target.searchParams.set('view',view);
 const room=query.get('room');if(/^(?:\d{3}|[A-HJ-NP-Z2-9]{6})$/i.test(room||''))target.searchParams.set('room',room);
 location.replace(target.href);
})();
</script></head><body><p>Das DOG Sammelalbum ist jetzt direkt in der <a href="./weihnachtswelt.html?view=album">Weihnachtswelt</a> integriert.</p></body></html>
