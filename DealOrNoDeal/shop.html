<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goldstudio · Shop & Sammelalbum</title><style>
*{box-sizing:border-box}body{margin:0;color:#fff0d2;font:16px system-ui;background:linear-gradient(135deg,#061124e8,#07152de6),url('./assets/1000029058.png') center/cover fixed}main{max-width:1450px;margin:auto;padding:clamp(12px,2vw,26px)}a{color:#ffe0a1}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.top a{text-decoration:none;border:1px solid #dfb97988;padding:11px 16px;border-radius:12px;background:#091d38cc;font-weight:800}.balance{background:#211a0fc9;border:1px solid #e7c279;border-radius:40px;padding:12px 19px;font-weight:850;color:#ffe4a5}.hero{text-align:center;margin:20px 0}.hero h1{font-size:clamp(32px,5vw,62px);margin:0;color:#ffe1a0;text-shadow:0 3px 22px #f6bb5855}.hero p{color:#bdcce0}.columns{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);gap:16px}.panel{background:linear-gradient(145deg,#091b35ed,#0a1b32db);border:1px solid #cda76a9c;border-radius:22px;padding:20px;box-shadow:0 12px 32px #0007}.panel h2{color:#ffe0a0;margin:0 0 15px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{border:1px solid #a98555;border-radius:12px;background:#132b47;color:#f5d8a5;padding:9px 13px;cursor:pointer}.filter.active{background:linear-gradient(#ffe4a0,#b88a41);color:#24190b;font-weight:850}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.product{background:linear-gradient(155deg,#152e4c,#09152b);border:1px solid #b68c50;border-radius:17px;padding:13px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.product.owned{border-color:#85dfab}.art{width:100%;min-height:115px;display:grid;place-items:center;font-size:65px;background:radial-gradient(ellipse,#9e753c47,#071529 73%);border-radius:12px;text-shadow:0 6px 25px #ffc96a99}.product strong{font-size:15px}.price{font-size:19px;font-weight:950;color:#ffdb8e}.buy{width:100%;border:1px solid #f3d28e;border-radius:10px;background:linear-gradient(#ffe2a0,#b98135);color:#241605;padding:11px;font-weight:900;cursor:pointer;margin-top:auto}.buy:disabled{background:#18283c;color:#b3bac5;border-color:#627184;cursor:not-allowed}.album{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.album-slot{background:#112743;border:1px solid #8e744f;border-radius:12px;min-height:86px;display:grid;place-items:center;gap:2px;padding:8px;text-align:center}.album-slot span{font-size:32px}.album-slot small{font-size:10px;color:#b7c9dd}.album-slot.locked{filter:grayscale(.8);opacity:.55}.progress{height:12px;border-radius:10px;background:#0b1a2e;overflow:hidden;border:1px solid #af8c56;margin:14px 0}.progress div{height:100%;background:linear-gradient(90deg,#ad782c,#ffe5a5);width:0}.muted{color:#bdcce0;font-size:13px}#notice{min-height:28px;color:#ffdf95;font-weight:700}.counter{font-size:30px;font-weight:900;color:#ffe4a0}@media(max-width:900px){.columns{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.products{gap:8px}.product{padding:9px}.art{min-height:85px;font-size:47px}.panel{padding:13px}}
</style></head><body><main><div class="top"><a id="back" href="./lobby.html">← Zur Lobby</a><div class="balance">🪙 Mein Konto: <span id="balance">Wird geladen …</span></div></div><header class="hero"><h1>✦ SHOP & SAMMELALBUM ✦</h1><p>12 exklusive Sammlerstücke · Alles ab 1.000.000 € · Nur Spielgeld</p></header><div class="columns"><section class="panel"><h2>🛍️ Goldstudio-Shop</h2><div class="filters" id="filters"></div><div id="notice" role="status"></div><div class="products" id="products"></div></section><aside class="panel"><h2>📖 Mein Sammelalbum</h2><div class="counter" id="count">0 / 12</div><div class="progress"><div id="progress"></div></div><p class="muted">Jeder Kauf schaltet einen Platz dauerhaft frei.</p><div class="album" id="album"></div></aside></div></main><script src="../profile-config.js"></script><script src="../profile-auth.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),code=params.get('room')||'',base=String(window.SPIELPORTAL_CONFIG?.apiBase||'https://serverfinal-ynbe.onrender.com').replace(/\/+$/,'');
$('back').href='./lobby.html'+(code?'?room='+encodeURIComponent(code):'');
const eur=c=>(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const user=()=>{const s=window.SpielOnline?.state?.();return s?.status==='online'&&s.user?.getIdToken?s.user:null};
let data=null,category='Alle',busy=false;
async function request(method,path,body){const u=user();if(!u)throw Error('Bitte mit deinem Online-Profil anmelden.');const token=await u.getIdToken();const res=await fetch(base+'/api/deal-or-no-deal/shop/'+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await res.json();if(!res.ok||!d.ok)throw Error(d.error||'SERVER_ERROR');return d}
function render(){if(!data)return;$('balance').textContent=eur(data.balance);const cats=['Alle',...new Set(data.items.map(x=>x.category))];$('filters').replaceChildren();cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c===category?' active':'');b.textContent=c;b.onclick=()=>{category=c;render()};$('filters').append(b)});$('products').replaceChildren();data.items.filter(x=>category==='Alle'||x.category===category).forEach(item=>{const owned=data.owned.includes(item.id),affordable=data.balance>=item.price;const card=document.createElement('article');card.className='product'+(owned?' owned':'');const art=document.createElement('div');art.className='art';art.textContent=item.emoji;const title=document.createElement('strong');title.textContent=item.name;const price=document.createElement('div');price.className='price';price.textContent=eur(item.price);const button=document.createElement('button');button.className='buy';button.textContent=owned?'✓ Gesammelt':affordable?'Jetzt kaufen':'🔒 Nicht genug Geld';button.disabled=owned||!affordable||busy;button.onclick=()=>buy(item);card.append(art,title,price,button);$('products').append(card)});$('album').replaceChildren();data.items.forEach(item=>{const owned=data.owned.includes(item.id),slot=document.createElement('div');slot.className='album-slot'+(owned?'':' locked');const icon=document.createElement('span');icon.textContent=owned?item.emoji:'🔒';const label=document.createElement('small');label.textContent=owned?item.name:'Noch nicht gesammelt';slot.append(icon,label);$('album').append(slot)});$('count').textContent=data.owned.length+' / '+data.items.length;$('progress').style.width=(data.owned.length/data.items.length*100)+'%'}
async function load(){try{data=await request('GET','me');render();$('notice').textContent=''}catch(e){$('notice').textContent='Shop nicht erreichbar: '+e.message}}
async function buy(item){if(busy||!data||data.owned.includes(item.id)||data.balance<item.price)return;if(!confirm(item.name+' für '+eur(item.price)+' kaufen?'))return;busy=true;render();try{const result=await request('POST','buy',{itemId:item.id});data.balance=result.balance;data.owned=result.owned;$('notice').textContent='✨ '+item.name+' gekauft und im Sammelalbum gespeichert!'}catch(e){$('notice').textContent='Kauf fehlgeschlagen: '+e.message;await load()}finally{busy=false;render()}}
window.addEventListener('spielonline-change',load);load();
</script></body></html>
