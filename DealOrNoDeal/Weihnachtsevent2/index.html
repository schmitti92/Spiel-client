<script>
(function(){
 const valid=/^(?:\d{3}|[A-HJ-NP-Z2-9]{6})$/i;
 const param=new URLSearchParams(location.search).get('room');
 const saved=sessionStorage.getItem('deal-active-room');
 const room=valid.test(param||'')?param:valid.test(saved||'')?saved:null;
 if(room){
  sessionStorage.setItem('deal-active-room',room);
  document.querySelector('nav a[href="../game.html"]').href='../game.html?room='+encodeURIComponent(room);
  document.querySelectorAll('nav a[href^="../weihnachten.html"]').forEach(a=>{
   const url=new URL(a.href);
   url.searchParams.set('room',room);
   a.href=url.href;
  });
 }
})();
</script>

  <h2 id="event-guide-title" class="event-guide-title">❄️ Spielanleitung · Weihnachtsevent 2</h2>
  <img id="event-guide-img" class="event-guide-img" alt="Collage mit der Spielanleitung zu Weihnachtsevent 2">
  <p id="event-guide-fallback" class="event-guide-fallback" hidden>Das hochgeladene Anleitungsbild wurde noch nicht gefunden. Bitte den Bildpfad prüfen.</p>
  <div class="event-guide-actions"><button type="button" id="event-guide-close">✓ Verstanden – Event starten</button></div>
 </div>
</div>
<script>
(function(){
 'use strict';
 const modal=document.getElementById('event-guide'),img=document.getElementById('event-guide-img'),fallback=document.getElementById('event-guide-fallback');
 const keyBase='deal:event2:guide:v2:';
 let firstVisit=false,activeKey='';
 img.onerror=function(){img.hidden=true;fallback.hidden=false;};
 img.src='./Weihnachtsbilder/file_0000000084748210bb97070abd56ebf0.png';
 function profileId(){
  const state=window.SpielOnline?.state?.();
  return state?.user?.uid || state?.profile?.id || window.ProfileAuth?.currentUser?.uid || 'local';
 }
 function openGuide(force){
  activeKey=keyBase+profileId();
  try{if(!force&&localStorage.getItem(activeKey)==='yes')return;}catch(_){}
  firstVisit=!force;modal.hidden=false;document.getElementById('event-guide-close').focus();
 }
 function closeGuide(){
  if(firstVisit){try{localStorage.setItem(activeKey,'yes');}catch(_){}}
  modal.hidden=true;firstVisit=false;
 }
 document.getElementById('event-guide-close').addEventListener('click',closeGuide);
 document.getElementById('event-guide-open').addEventListener('click',function(e){e.preventDefault();openGuide(true);});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>openGuide(false));else openGuide(false);
})();
</script>
