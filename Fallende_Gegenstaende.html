<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fallende Gegenstände V1.4 –  V1.3</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif;color:#fff}body{background:linear-gradient(155deg,#152b43,#183f4a 65%,#0d2332)}main{max-width:1080px;margin:auto;padding:12px}header{text-align:center}h1{font-size:clamp(23px,5vw,40px);margin:5px 0}header p{margin:5px 0 10px;color:#d9eced}.setup,.buttons,.scores{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}button,select{font:inherit;font-weight:800;border:0;border-radius:13px;padding:11px 17px;color:#22333e;background:#ffdc85;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.43}.scores>div{flex:1;min-width:110px;max-width:240px;text-align:center;border:2px solid var(--c);background:#ffffff19;border-radius:16px;padding:7px}.scores strong{display:block;font-size:24px}.arena{height:clamp(330px,58dvh,570px);position:relative;display:flex;overflow:hidden;border:7px solid #91694b;border-radius:23px;background:linear-gradient(#68b5d5,#c1e9e4 68%,#8bc67b 68%);box-shadow:0 12px 32px #0007}.arena:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 78% 14%,#fff9 0 34px,transparent 35px),linear-gradient(155deg,transparent 35%,#ffffff22 45%,transparent 60%)}.hill{position:absolute;bottom:20%;width:70%;height:27%;border-radius:50% 50% 0 0;background:#4f9e78;opacity:.6}.hill.one{left:-24%}.hill.two{right:-20%;background:#438f78}.lane{position:relative;flex:1;border-right:2px dashed #ffffff55;min-width:0}.lane:last-child{border:0}.tree{position:absolute;bottom:21%;height:100px;width:48px;opacity:.5;pointer-events:none}.tree.left{left:-22px}.tree.right{right:-22px}.tree:before{content:"";position:absolute;bottom:0;left:19px;width:12px;height:50px;background:#77563d}.tree:after{content:"";position:absolute;bottom:33px;left:0;width:50px;height:70px;border-radius:60% 60% 30% 30%;background:#267b62}.floor{position:absolute;bottom:0;left:0;width:100%;height:24%;background:linear-gradient(#7fbd73,#478b5d);border-top:5px solid #c3e18a}.floor:after{content:"";position:absolute;inset:20% 0;background:repeating-linear-gradient(110deg,transparent 0 32px,#ffffff0c 33px 36px)}.character{position:absolute;bottom:12%;left:50%;width:64px;height:116px;transform:translateX(-50%);transform-origin:50% 95%;z-index:3} .arm{position:absolute;top:54px;width:14px;height:39px;background:#f0bd94;border:3px solid #765442;border-radius:10px;z-index:-1}.arm.a{left:0;transform:rotate(13deg)}.arm.b{right:0;transform:rotate(-13deg)}.dust{position:absolute;bottom:12%;left:50%;width:80px;height:30px;transform:translateX(-50%);opacity:0;pointer-events:none;background:radial-gradient(circle at 20% 60%,#eee7ce 0 12px,transparent 13px),radial-gradient(circle at 52% 40%,#eee7ce 0 15px,transparent 16px),radial-gradient(circle at 83% 65%,#eee7ce 0 11px,transparent 12px);z-index:7}.dust.active{animation:puff .7s ease-out}@keyframes puff{0%{opacity:0;scale:.5}30%{opacity:.9;scale:1.1}100%{opacity:0;scale:1.7}}.character.fall{animation:knock .65s ease-in forwards}.character.rise{animation:rise .7s ease-out forwards}@keyframes knock{to{transform:translateX(-50%) rotate(77deg) translateY(14px)}}@keyframes rise{from{transform:translateX(-50%) rotate(77deg) translateY(14px)}to{transform:translateX(-50%) rotate(0)}}.hair{position:absolute;top:0;left:15px;width:35px;height:17px;border-radius:50% 50% 15% 15%;background:#3b2c28;z-index:5}.head{position:absolute;top:8px;left:10px;width:44px;height:46px;background:#f3c79b;border:3px solid #765442;border-radius:45%;z-index:4}.eyes{position:absolute;top:26px;left:21px;font-size:10px;z-index:5;color:#263d40;letter-spacing:8px}.torso{position:absolute;top:48px;left:8px;width:49px;height:45px;border-radius:15px 15px 9px 9px;background:var(--c);border:3px solid #35566a}.leg{position:absolute;top:88px;width:17px;height:27px;border-radius:0 0 8px 8px;background:#2e526e}.leg.a{left:13px}.leg.b{right:13px}.shadow{position:absolute;bottom:10%;left:50%;width:80px;height:15px;border-radius:50%;background:#103d3460;transform:translateX(-50%)}.object{position:absolute;top:0;left:50%;transform:translate(-50%,-160px);z-index:5;display:flex;align-items:center;justify-content:center;will-change:transform}.piano{width:min(92%,190px);height:100px;border-radius:10px 24px 10px 10px;background:linear-gradient(145deg,#6b7586 0%,#202938 19%,#0a101d 65%,#30394c 95%);border:4px solid #070e19;box-shadow:inset 0 6px #ffffff5a,inset -7px -7px #0005,0 12px 15px #0007;overflow:visible}.piano:before{content:"";position:absolute;top:10px;left:9%;width:76%;height:40%;border-radius:8px 18px 4px 4px;background:linear-gradient(150deg,#171d2b,#050910);border:2px solid #a5aebc66;box-shadow:inset 0 2px #ffffff25}.piano:after{content:"";position:absolute;bottom:7px;left:7%;width:86%;height:26px;background:repeating-linear-gradient(90deg,#f5f6ed 0 10px,#1b2030 10px 14px,#f5f6ed 14px 23px);border:2px solid #111;box-shadow:0 3px 0 #070a12}.object.emoji{font-size:clamp(65px,11vw,110px);line-height:1;filter:drop-shadow(0 6px 3px #0005)}.label{position:absolute;top:16%;left:0;width:100%;font-size:clamp(12px,2.4vw,21px);font-weight:900;text-align:center;text-shadow:0 2px 5px #163e45;z-index:6}.name{position:absolute;bottom:3%;width:100%;text-align:center;font-size:clamp(12px,2.5vw,18px);font-weight:900;z-index:6}.message{text-align:center;font-size:clamp(17px,3vw,23px);font-weight:800;min-height:46px;padding:10px}.hit{flex:1;min-width:100px;background:var(--c)}.note{text-align:center;font-size:12px;color:#cde3e6}.hidden{display:none!important}@media(max-width:520px){main{padding:5px}.arena{height:55dvh}.character{scale:.82;transform-origin:center bottom}.object.piano{height:60px}.object.piano:after{height:17px}.scores strong{font-size:20px}.tree{opacity:.25}}
.object.asset{width:min(94%,160px);height:100px}.object.asset img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 5px #1237)}.object.asset .fallback{display:none}.object.asset.missing img{display:none}.object.asset.missing .fallback{display:block;font-size:70px}.impact{position:absolute;z-index:9;pointer-events:none;left:50%;bottom:23%;font-size:48px;opacity:0;transform:translateX(-50%)}.impact.burst{animation:burst .9s ease-out}@keyframes burst{0%{opacity:0;scale:.4}20%{opacity:1;scale:1.4}100%{opacity:0;scale:2}}@media(max-width:520px){.object.asset{height:75px}} </style></head><body><main><header><h1>🎹 Fallende Gegenstände</h1><p>Stoppe möglichst knapp über deinem Kopf! Der kleinste Gesamtabstand gewinnt.</p></header><div id="setup" class="setup"><label>Spieler <select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><label>Menschen <select id="humans"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><button id="start">▶ Starten</button></div><div id="scores" class="scores"></div><div id="arena" class="arena"><div class="floor"></div></div><div id="message" class="message">5 Runden · Abstände in cm · Treffer: +100 cm Strafabstand</div><div id="buttons" class="buttons"></div><div class="note">Tastatur: Spieler 1 A · Spieler 2 L · Spieler 3 F · Spieler 4 J</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),colors=['#ff8f81','#f7d66c','#88d9ed','#c7a6ef'],keys=['a','l','f','j'];const objects=[{name:'Klavier',icon:'🎹',file:'klavier.svg'},{name:'Amboss',icon:'⚒️',file:'amboss.svg'},{name:'Eisblock',icon:'🧊',file:'eisblock.svg'},{name:'Felsbrocken',icon:'🪨',file:'felsbrocken.svg'},{name:'Tresor',icon:'🗃️',file:'tresor.svg'}];let players=[],round=0,phase='setup',frame=0,timer=0,token=0,started=0,speed=0;function clear(){cancelAnimationFrame(frame);clearTimeout(timer);token++}
function ui(){ $('scores').innerHTML=players.map((p,i)=>`<div style="--c:${colors[i]}">Spieler ${i+1}${p.ai?' 🤖':''}<strong>${p.score.toFixed(1).replace('.',',')} cm</strong></div>`).join('')}
function begin(){clear();let n=+$('count').value,h=Math.min(n,+$('humans').value);players=Array.from({length:n},(_,i)=>({ai:i>=h,score:0,hits:0}));round=0;$('setup').classList.add('hidden');next()}
function next(){clear();round++;if(round>5)return finish();phase='ready';$('arena').innerHTML='<div class="hill one"></div><div class="hill two"></div><div class="floor"></div>';$('buttons').innerHTML='';const obj=objects[round-1];players.forEach((p,i)=>{p.done=false;p.aiGap=8+Math.random()*85;let lane=document.createElement('div');lane.className='lane';lane.style.setProperty('--c',colors[i]);lane.innerHTML=`<div class="tree left"></div><div class="tree right"></div><div class="shadow"></div><div class="dust"></div><div class="character"><div class="hair"></div><div class="head"></div><div class="eyes">••</div><div class="torso"></div><div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div></div><div class="object asset"><img src="assets/fallende-gegenstaende/${obj.file}" alt="${obj.name}" onerror="this.parentElement.classList.add('missing')"><span class="fallback">${obj.icon}</span></div><div class="impact">💥</div><div class="label"></div><div class="name">Spieler ${i+1}</div>`;$('arena').append(lane);p.lane=lane;p.character=lane.querySelector('.character');p.head=lane.querySelector('.hair');p.obj=lane.querySelector('.object');p.visibleBottom=0;const img=p.obj.querySelector('img');img.addEventListener('load',()=>{try{const canvas=document.createElement('canvas');canvas.width=160;canvas.height=100;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,160,100);const data=ctx.getImageData(0,0,160,100).data;let last=-1;for(let y=0;y<100;y++)for(let x=12;x<148;x++){if(data[(y*160+x)*4+3]>35)last=y}if(last>=0)p.visibleBottom=Math.max(0,(99-last)/100*p.obj.offsetHeight)}catch(e){p.visibleBottom=0}});p.label=lane.querySelector('.label');p.btn=null;if(!p.ai){let b=document.createElement('button');b.className='hit';b.style.setProperty('--c',colors[i]);b.textContent=`Spieler ${i+1} · ${keys[i].toUpperCase()}`;b.onclick=()=>stop(i);$('buttons').append(b);p.btn=b}});ui();const speeds=[155,210,185,245,195];speed=speeds[round-1]*(.92+Math.random()*.16);$('message').textContent=`Runde ${round}/5 · ${obj.name} · ${speed<190?'Langsam':speed<225?'Mittel':'Schnell'}`;const t=token;timer=setTimeout(()=>{if(t!==token)return;phase='fall';started=performance.now();frame=requestAnimationFrame(tick)},1000+Math.random()*1000)}
function offset(p){/* Use the bottommost visible SVG pixels, when available. */return p.head.getBoundingClientRect().top-p.lane.getBoundingClientRect().top-p.obj.offsetHeight+(p.visibleBottom||0)}
function draw(p,y){p.obj.style.transform=`translate(-50%,${y}px)`}
function tick(now){if(phase!=='fall')return;const elapsed=(now-started)/1000;players.forEach((p,i)=>{if(p.done)return;let target=offset(p),y=-p.obj.offsetHeight+elapsed*speed;draw(p,y);if(p.ai&&target-y<=p.aiGap)stop(i);else if(y>=target)stop(i,true)});if(phase==='fall')frame=requestAnimationFrame(tick)}
function stop(i,forced=false){if(phase!=='fall')return;const p=players[i];if(!p||p.done)return;let target=offset(p),y=-p.obj.offsetHeight+(performance.now()-started)/1000*speed,gap=target-y,crash=forced||gap<=0;draw(p,crash?target:y);p.done=true;const CM_PER_PIXEL=0.1;const distance=crash?100:Math.max(0,Math.round(gap*CM_PER_PIXEL*10)/10);p.score+=distance;if(crash)p.hits++;p.label.textContent=crash?'💥 Treffer! +100 cm Strafabstand':`${gap<12?'🏆 Perfekt!':gap<35?'⭐ Super!':gap<75?'👍 Gut!':'Zu früh'} · ${distance.toFixed(1).replace('.',',')} cm`;if(crash){
 const dust=p.lane.querySelector('.dust');dust.classList.add('active');const impact=p.lane.querySelector('.impact');impact.textContent=round===3?'❄️💎':round===4?'💨🪨':'💥';impact.classList.remove('burst');void impact.offsetWidth;impact.classList.add('burst');
 p.character.classList.add('fall');
 /* After the character tips over, let the object drop onto the ground instead of hovering on the head. */
 const droppedObject=p.obj,fallenCharacter=p.character,fallenLane=p.lane;
 setTimeout(()=>{if(!fallenLane.isConnected)return;
   droppedObject.style.transition='transform .48s cubic-bezier(.35,.1,.8,1)';droppedObject.style.zIndex='2';
   draw(p,p.lane.clientHeight-p.obj.offsetHeight-p.lane.clientHeight*.12);
 },350);
 setTimeout(()=>{if(!fallenLane.isConnected)return;
   fallenCharacter.classList.remove('fall');fallenCharacter.classList.add('rise');
 },1350);
}if(p.btn)p.btn.disabled=true;ui();if(players.every(x=>x.done)){phase='result';clear();$('message').textContent=`Runde ${round} abgeschlossen!`;const t=token;timer=setTimeout(()=>{if(t===token)next()},3200)}}
function finish(){phase='finished';let best=Math.min(...players.map(p=>p.score)),wins=players.map((p,i)=>({...p,i:i+1})).filter(p=>p.score===best);$('message').textContent=`🏆 ${wins.map(p=>'Spieler '+p.i).join(' & ')} ${wins.length===1?'gewinnt':'gewinnen'} mit ${best.toFixed(1).replace('.',',')} cm Gesamtabstand!`;$('buttons').innerHTML='';let again=document.createElement('button');again.textContent='🔁 Nochmal spielen';again.onclick=()=>{round=0;players.forEach(p=>{p.score=0;p.hits=0});next()};$('buttons').append(again);let change=document.createElement('button');change.textContent='⚙️ Spieler ändern';change.onclick=()=>{clear();phase='setup';$('setup').classList.remove('hidden');$('buttons').innerHTML='';$('scores').innerHTML='';$('arena').innerHTML='<div class="floor"></div>'};$('buttons').append(change);window.dispatchEvent(new CustomEvent('minigame:finished',{detail:{game:'fallende-gegenstaende',results:players.map((p,i)=>({player:i+1,score:p.score,distanceCm:p.score,hits:p.hits,winner:p.score===best}))}}))}
$('start').onclick=begin;$('count').onchange=()=>{$('humans').value=Math.min(+$('humans').value,+$('count').value)};document.addEventListener('keydown',e=>{if(e.repeat)return;let i=keys.indexOf(e.key.toLowerCase());if(i>=0){e.preventDefault();stop(i)}})
})();
</script></body></html>
