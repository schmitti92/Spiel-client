<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;color:#fff;background:linear-gradient(#75c1dc,#95d3ba 70%,#4c9560 70%);overflow:hidden}header{text-align:center;padding:8px;background:#183b51e8;font-weight:900}#scores{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#173b53e8;padding:5px}.score{padding:4px 9px;background:#ffffff25;border-radius:8px}#arena{height:calc(100dvh - 165px);min-height:230px;display:grid;grid-template-columns:repeat(var(--n,2),1fr)}.lane{position:relative;border-right:2px dashed #fff9}.object{position:absolute;left:50%;top:0;transform:translate(-50%,-130px);width:min(90%,160px);height:95px;object-fit:contain;filter:drop-shadow(0 5px 5px #2228)}.person{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);font-size:clamp(50px,12vw,100px)}.name{position:absolute;bottom:3%;width:100%;text-align:center;font-weight:900;text-shadow:0 1px 4px #111}.distance{position:absolute;top:18%;width:100%;text-align:center;font-size:clamp(16px,3vw,28px);font-weight:900;text-shadow:0 1px 4px #111}footer{position:fixed;bottom:0;left:0;width:100%;height:78px;text-align:center;background:#183b51e8}button{font:900 24px system-ui;background:#ffcb5d;border:0;border-radius:14px;padding:13px 44px;margin:8px}button:disabled{opacity:.4}</style></head><body><header id="status">Verbinde mit gemeinsamer Lobby …</header><div id="scores"></div><div id="arena"></div><footer><button id="stop" disabled>✋ STOPP!</button></footer><script>
(()=>{'use strict';let state=null,offset=0,frame=0,pending=false;const $=id=>document.getElementById(id);function send(type){parent.postMessage({type,challengeId:state?.challengeId},location.origin)}function render(){if(!state)return;const s=state;$('arena').style.setProperty('--n',s.players.length);$('scores').innerHTML=s.players.map(p=>'<div class="score">'+esc(p.name)+' · '+Number(p.total).toFixed(1)+' cm</div>').join('');$('arena').innerHTML=s.players.map(p=>'<div class="lane" data-seat="'+p.seat+'"><img class="object" src="assets/fallende-gegenstaende/'+['klavier.svg','amboss.svg','eisblock.svg','felsbrocken.svg','tresor.svg'][s.round-1]+'"><div class="distance">'+(p.cm===null?'':p.cm===100?'💥 100 cm':Number(p.cm).toFixed(1)+' cm')+'</div><div class="person">🧍</div><div class="name">'+esc(p.name)+'</div></div>').join('');pending=false;update()}function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function update(){if(!state)return;const s=state,m=s.players.find(p=>p.seat===s.seat),elapsed=Date.now()+offset-s.startAt;const active=s.phase==='countdown'&&elapsed>=0&&elapsed<s.duration;$('stop').disabled=!(active&&m&&m.cm===null&&!pending);$('status').textContent=s.phase==='finished'?'🏆 Fertig – Ergebnis in der Lobby':s.phase==='results'?'🏁 Ergebnis – weiter in der Lobby':'🎹 Runde '+s.round+'/5 · '+(elapsed<0?'Start in '+Math.ceil(-elapsed/1000)+' …':'Stoppe möglichst knapp vor dem Kopf!')}function animate(){if(state){update();const s=state,elapsed=Date.now()+offset-s.startAt,progress=Math.max(0,Math.min(1,elapsed/s.duration));for(const lane of $('arena').querySelectorAll('.lane')){const p=s.players.find(x=>x.seat===+lane.dataset.seat),img=lane.querySelector('.object'),person=lane.querySelector('.person');if(!p||!img)continue;const box=lane.getBoundingClientRect(),head=person.getBoundingClientRect(),start=-95,end=head.top-box.top-95;const fraction=p.cm!==null?Math.max(0,Math.min(1,1-p.cm/100)):progress;img.style.transform='translate(-50%,'+(start+(end-start)*fraction)+'px)'}}frame=requestAnimationFrame(animate)}window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data;if(m?.type==='falling:state'){state=m;offset=m.serverNow-Date.now();render()}if(m?.type==='falling:rejected'){pending=false;update()}});$('stop').onclick=()=>{if($('stop').disabled)return;pending=true;$('stop').disabled=true;send('falling:stop')};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();$('stop').click()}});send('falling:ready');frame=requestAnimationFrame(animate)})();
</script></body></html>
