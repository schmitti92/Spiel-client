</style></head><body><main class="scene jungle" id="scene"><header class="header"><h1 id="heading">ZEITGEFÜHL</h1><p class="subtitle" id="subtitle">WIE GUT IST DEIN ZEITGEFÜHL?</p></header><section class="stage"><div class="target" id="target">🎯 Zielzeit wird ausgelost</div><div class="clock" id="clock"><span id="digits">0,00</span></div><div class="hint" id="hint">Die ersten 3 Sekunden siehst du die Uhr. Danach läuft sie unsichtbar weiter!</div><div class="setup" id="setup"><label>👤 Menschen <select id="humans"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></label><label>🤖 Computer <select id="bots"><option selected>0</option><option>1</option><option>2</option><option>3</option></select></label><button class="gold" id="start">▶ SPIEL STARTEN</button></div><div class="players" id="players"></div><div class="results" id="results" hidden></div><div class="end" id="end" hidden>🏁 Minispiel beendet</div></section><footer class="foot">Eine Runde · 10–20 Sekunden Zufallsziel · Offline · Tasten 1–4</footer></main><script>(()=>{'use strict';
const $=id=>document.getElementById(id),scene=$('scene'),digits=$('digits'),clock=$('clock'),players=$('players'),results=$('results'),hint=$('hint');
const MAX_TIME=30000,colors=['#38a8ff','#ff5868','#45d88e','#ffce49'];
let phase='idle',entries=[],goal=0,startAt=0,raf=0,timers=[],hidden=false;
const fmt=ms=>(ms/1000).toFixed(2).replace('.',',')+' s';
let onlineMode=false,onlineSeat=null,onlineChallenge=null,onlineTimer=0,onlineOffset=0,onlineStartAt=0,onlineStopped=false;
function onlineSync(data){
 if(!data||data.type!=='zeitgefuehl:state')return;
 const sameRound=onlineMode&&onlineChallenge===data.challengeId&&onlineStartAt===Number(data.startAt);
 onlineMode=true;onlineChallenge=data.challengeId;onlineSeat=data.mySeat;
 scene.classList.add('online-play');
 const observedOffset=Number(data.serverNow)-Date.now();
 onlineOffset=sameRound?onlineOffset*0.8+observedOffset*0.2:observedOffset;
 onlineStartAt=Number(data.startAt);onlineStopped=!!data.stopped;
 if(sameRound){
  (data.players||[]).forEach(p=>{
   const idx=entries.findIndex(e=>e.id===p.seat);
   if(idx<0)return;
   entries[idx].done=!!p.stopped;
   const card=$('p'+idx);if(!card)return;
   const button=card.querySelector('button');
   if(button)button.disabled=p.seat!==onlineSeat||onlineStopped||phase!=='running';
   const status=card.querySelector('.status');
   if(status)status.textContent=p.stopped?'✓ Gestoppt':p.seat===onlineSeat?'Bereit zum Stoppen':'Spielt mit';
  });
  return;
 }
 goal=Number(data.targetSeconds)*1000;
 if(!Number.isFinite(goal)||goal<10000||goal>20000)return;
 if(onlineTimer)clearInterval(onlineTimer);
 if(raf)cancelAnimationFrame(raf);
 timers.forEach(clearTimeout);timers=[];
 phase='countdown';hidden=false;startAt=performance.now();
 entries=(data.players||[]).map(p=>({id:p.seat,name:p.name,bot:false,done:!!p.stopped,timeout:false,ms:0}));
 $('setup').hidden=true;$('target').textContent='🎯 ZIELZEIT: '+fmt(goal);
 $('heading').textContent='ZEITGEFÜHL';$('subtitle').textContent='ONLINE · DIE ZEIT LÄUFT FÜR ALLE GLEICH';
 $('end').hidden=true;results.hidden=true;players.hidden=false;clock.hidden=false;
 players.replaceChildren();
 entries.forEach((e,i)=>{
  const card=document.createElement('article');card.className='player';card.id='p'+i;card.style.setProperty('--accent',colors[i%4]);
  const av=document.createElement('div');av.className='avatar';av.textContent=['🧑','👩','🧑‍🚀','👨‍🦰'][i%4];
  const title=document.createElement('h2');title.textContent=e.name;
  const btn=document.createElement('button');btn.className='stop';btn.textContent=e.id===onlineSeat?'STOPP!':'MIT SPIELER';btn.disabled=e.id!==onlineSeat||onlineStopped;
  btn.addEventListener('click',()=>{if(phase==='running'&&!onlineStopped&&e.id===onlineSeat){onlineStopped=true;btn.disabled=true;window.parent.postMessage({type:'zeitgefuehl:stop',challengeId:onlineChallenge},location.origin)}});
  const status=document.createElement('div');status.className='status';status.textContent=e.id===onlineSeat?(onlineStopped?'✓ Gespeichert':'Bereit zum Stoppen'):(e.done?'✓ Gestoppt':'Spielt mit');
  card.append(av,title,btn,status);players.append(card);
 });
 function drawOnline(){
  const elapsed=Date.now()+onlineOffset-onlineStartAt;
  if(elapsed<0){phase='countdown';digits.textContent=String(Math.max(1,Math.ceil(-elapsed/1000)));hint.textContent='Gemeinsamer Start in '+Math.ceil(-elapsed/1000);return;}
  phase='running';
  const ownButton=entries.findIndex(e=>e.id===onlineSeat);if(ownButton>=0){const btn=$('p'+ownButton)?.querySelector('button');if(btn)btn.disabled=onlineStopped;}
  if(elapsed<3000){digits.textContent=(elapsed/1000).toFixed(2).replace('.',',');clock.classList.remove('hidden-time');scene.className='scene online-play';}
  else{digits.textContent='?';clock.classList.add('hidden-time');scene.className='scene night online-play';}
  hint.textContent=onlineStopped?'✓ Stopp gespeichert – warte auf Mitspieler':'Stoppe bei '+fmt(goal)+'!';
  if(elapsed>=30000){phase='finished';clearInterval(onlineTimer);digits.textContent='✓';hint.textContent='Zeit abgelaufen – Server wertet aus.';$('subtitle').textContent='Warte auf die Server-Auswertung';const btn=entries.findIndex(e=>e.id===onlineSeat);if(btn>=0){const button=$('p'+btn)?.querySelector('button');if(button)button.disabled=true;}}
 }
 drawOnline();onlineTimer=setInterval(drawOnline,60);
}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.origin!==location.origin)return;
if(event.data?.type==='zeitgefuehl:stop-rejected'&&event.data.challengeId===onlineChallenge&&phase==='running'){
 onlineStopped=false;
 const index=entries.findIndex(e=>e.id===onlineSeat);
 if(index>=0){const button=$('p'+index)?.querySelector('button');if(button)button.disabled=false;}
 hint.textContent='Verbindung fehlgeschlagen – bitte erneut stoppen.';
 return;
}
onlineSync(event.data)});

function schedule(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id}
function conceal(){if(hidden||phase!=='running')return;hidden=true;digits.textContent='?';clock.classList.add('hidden-time');scene.className='scene night';$('subtitle').textContent='TIPPE DIE RICHTIGE ZEIT!';hint.textContent='Die Zeit läuft unsichtbar weiter. Stoppe bei '+fmt(goal)+'!'}
function stop(i,at=performance.now(),timeout=false){if(onlineMode)return;const e=entries[i];if(phase!=='running'||!e||e.done)return;e.ms=Math.max(0,at-startAt);e.done=true;e.timeout=timeout;const el=$('p'+i);el.classList.add('done');el.querySelector('button').disabled=true;el.querySelector('.status').textContent=timeout?'⌛ Zeit abgelaufen':'✓ Gestoppt – Zeit bleibt geheim';if(entries.every(x=>x.done))finish()}
function finish(){phase='finished';cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers=[];scene.className='scene treasure';$('heading').textContent='ERGEBNIS';$('subtitle').textContent='DIE SCHATZKAMMER DER ZEIT';$('target').textContent='🎯 ZIELZEIT: '+fmt(goal);clock.hidden=true;players.hidden=true;results.hidden=false;$('end').hidden=false;hint.textContent='Alle haben gestoppt – die einzige Runde ist beendet.';
const order=entries.map((e,i)=>({...e,i,diff:Math.abs(e.ms-goal)})).sort((a,b)=>a.diff-b.diff||a.i-b.i);const best=order[0].diff;results.innerHTML='';let prev=-1,place=0;
order.forEach((e,idx)=>{if(prev<0||Math.abs(e.diff-prev)>=5)place=idx+1;prev=e.diff;const tie=Math.abs(e.diff-best)<5;const card=document.createElement('article');card.className='result-card'+(tie?' winner':'');card.style.setProperty('--accent',colors[e.i%4]);const medal=tie?'🏆':place===2?'🥈':place===3?'🥉':'🎖️';card.innerHTML='<div class="medal">'+medal+'</div><h2></h2><strong></strong><p></p><p></p>';card.querySelector('h2').textContent=e.name;card.querySelector('strong').textContent=fmt(e.ms);card.querySelectorAll('p')[0].textContent='Abweichung: '+fmt(e.diff);card.querySelectorAll('p')[1].textContent=tie?'👑 Gewinner!':e.timeout?'Zeitlimit erreicht':'Platz '+place;results.append(card)});
const payload={game:'zeitgefuehl',version:6,targetMs:goal,results:order.map(e=>({playerId:e.id,player:e.name,isComputer:e.bot,elapsedMs:Math.round(e.ms),deviationMs:Math.round(e.diff),rank:1+order.filter(x=>x.diff<e.diff-5).length,timedOut:e.timeout}))};window.zeitgefuehlResult=payload;window.dispatchEvent(new CustomEvent('zeitgefuehl:finished',{detail:payload}));if(window.parent!==window)window.parent.postMessage({type:'zeitgefuehl:finished',detail:payload},'*')}
function tick(){if(phase!=='running')return;const elapsed=performance.now()-startAt;if(elapsed>=3000)conceal();else digits.textContent=(elapsed/1000).toFixed(2).replace('.',',');raf=requestAnimationFrame(tick)}
function begin(){phase='running';hidden=false;startAt=performance.now();digits.textContent='0,00';entries.forEach((e,i)=>{if(e.bot){const noise=(Math.random()+Math.random()+Math.random()-1.5)*1700;const target=Math.max(3200,goal+noise);schedule(()=>stop(i,startAt+target),target)}else $('p'+i).querySelector('button').disabled=false});tick();schedule(conceal,3000);schedule(()=>{if(phase==='running')entries.forEach((e,i)=>{if(!e.done)stop(i,startAt+MAX_TIME,true)})},MAX_TIME)}
function countdown(n){if(phase!=='countdown')return;if(n===0){begin();return}digits.textContent=String(n);hint.textContent='Bereit machen … Start in '+n;schedule(()=>countdown(n-1),1000)}
function run(){if(onlineMode||phase!=='idle')return;const h=+$('humans').value,b=Math.min(4-h,+$('bots').value);goal=(10+Math.floor(Math.random()*11))*1000;entries=Array.from({length:h+b},(_,i)=>({id:i+1,name:i<h?'Spieler '+(i+1):'Computer '+(i-h+1),bot:i>=h,done:false,timeout:false,ms:0}));$('target').textContent='🎯 ZIELZEIT: '+fmt(goal);$('setup').hidden=true;players.innerHTML='';players.hidden=false;entries.forEach((e,i)=>{const card=document.createElement('article');card.className='player';card.id='p'+i;card.style.setProperty('--accent',colors[i]);const av=document.createElement('div');av.className='avatar';av.textContent=e.bot?'🤖':['🧑','👩','🧑‍🚀','👨‍🦰'][i%4];const title=document.createElement('h2');title.textContent=e.name;const btn=document.createElement('button');btn.className='stop';btn.textContent=e.bot?'COMPUTER':'STOPP!';btn.disabled=true;btn.setAttribute('aria-label',e.name+' Zeit stoppen');btn.addEventListener('pointerdown',ev=>{if(!e.bot){ev.preventDefault();stop(i)}});btn.addEventListener('click',()=>{if(!e.bot)stop(i)});const status=document.createElement('div');status.className='status';status.textContent=e.bot?'Computer bereit':'Taste '+(i+1)+' · Wartet auf Start';card.append(av,title,btn,status);players.append(card)});phase='countdown';countdown(3)}
$('start').addEventListener('click',run);$('humans').addEventListener('change',()=>{$('bots').value=Math.min(+$('bots').value,4-(+$('humans').value))});$('bots').addEventListener('change',()=>{$('bots').value=Math.min(+$('bots').value,4-(+$('humans').value))});document.addEventListener('keydown',ev=>{if(ev.repeat||ev.target.matches('select,input,button'))return;const map={Digit1:0,Digit2:1,Digit3:2,Digit4:3,Numpad1:0,Numpad2:1,Numpad3:2,Numpad4:3,Space:0};if(map[ev.code]!==undefined){ev.preventDefault();const i=map[ev.code];if(!onlineMode&&entries[i]&&!entries[i].bot)stop(i)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&phase==='running'&&performance.now()-startAt>=3000)conceal()});
})();</script></body></html>
