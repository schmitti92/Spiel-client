function playOrDiscardAction(pi,idx){if(pi!==state.currentPlayer||ui.mode!=='chooseActionTurn')return;const p=current(),a=p.actions[idx];if(!a)return;if(!actionAvailable(a,p)){toast('Diese Aktionskarte ist noch gesperrt.');return}if(state.roundEnder!==null){toast('In der Schlussrunde dürfen Aktionskarten nicht gespielt oder abgelegt werden.');return}modal(`<h3>${ACTIONS[a.type].icon} ${ACTIONS[a.type].name}</h3><p>${ACTIONS[a.type].desc}</p><div class="modal-actions"><button class="primary" onclick="Game.confirmPlayAction(${idx})">Ausspielen</button><button class="secondary" onclick="Game.confirmDiscardAction(${idx})">Nur ablegen</button><button onclick="Game.closeModal()">Abbrechen</button></div>`)}

function playAction(a,reactivated){const t=a.type;if(t==='react'){state.heldReacts=state.heldReacts||[];state.heldReacts.push(a);}else{state.actionDiscard.push(a);}setWatch('action-play',{actor:state.currentPlayer,actionType:a.type,srcId:`player-${state.currentPlayer}`,dstId:`player-${state.currentPlayer}`,title:`spielt ${ACTIONS[a.type].name}`,typeLabel:'AKTION',text:reactivated?'durch Reaktivierung erneut ausgelöst':ACTIONS[a.type].desc});log(`${current().name} spielt „${ACTIONS[a.type].name}“.`);
 if(t==='double'){state.extraTurns+=2;finishTurn();return}

 if(t==='ownswap'){ui={mode:'ownSwapSelect',data:{},selected:[]};render();toast('Wähle zwei eigene Karten');return}
 if(t==='draw3'){startDraw3();return}

function finishOtherSwap(){const [sa,sb]=ui.selected,ca=getSlot(sa),cb=getSlot(sb),oldA=ca.faceUp,oldB=cb.faceUp;const openA=$('#osa').checked,openB=$('#osb').checked;setWatch('action-play',{actor:state.currentPlayer,title:'tauscht Karten zwischen Spielern',typeLabel:'AKTION',text:`${state.players[sa.pi].name} ↔ ${state.players[sb.pi].name}`});setSlot(sa,cb);setSlot(sb,ca);cb.faceUp=openA;ca.faceUp=openB;closeModal();const owners=[];if(jokerSpecialsEnabled()&&cb.type==='star'&&!oldB&&openA)owners.push(sa.pi);if(jokerSpecialsEnabled()&&ca.type==='star'&&!oldA&&openB)owners.push(sb.pi);ui.selected=[];if(owners.length){queueStarOwners(owners,'finishTurn');return}afterMutation('finishTurn')}

function thiefPick(pi,ai){closeModal();if(consumeDefense(pi)){state.extraTurns+=1;finishTurn();return}const target=state.players[pi],a=target.actions[ai];if(!a){finishTurn();return}setWatch('action-play',{actor:state.currentPlayer,actionType:a.type,srcId:`player-${pi}`,dstId:`player-${state.currentPlayer}`,title:`stiehlt ${ACTIONS[a.type].name}`,typeLabel:'DIEB',text:`von ${state.players[pi].name}`});target.actions.splice(ai,1);a.availableOwnTurn=current().ownTurn+2;a.stolen=true;current().actions.push(a);state.extraTurns+=1;log(`${current().name} stiehlt ${state.players[pi].name} „${ACTIONS[a.type].name}“.`);finishTurn()}
function startMeteor(){const targets=[];for(let k=1;k<state.players.length;k++){const pi=(state.currentPlayer+k)%state.players.length;if(consumeDefense(pi))continue;targets.push(pi)}if(!targets.length){finishTurn();return}ui={mode:'meteorSelect',data:{targets,target:targets[0],index:0,attacker:state.currentPlayer},selected:[]};render();toast(`☄️ Wähle eine Karte bei ${state.players[targets[0]].name}`)}

function meteorChoose(zone,idx){const pi=ui.data.target,p=state.players[pi];let replacement=takePlay();if(!replacement){toast('Keine Ersatzkarte verfügbar.');meteorNext();return}replacement.faceUp=true;if(zone==='action'){const old=p.actions[idx];if(!old)return;setWatch('meteor',{actor:state.currentPlayer,card:clone(replacement),srcId:'play-deck-pile',dstId:`player-${pi}`,title:`trifft ${p.name}`,typeLabel:'METEORIT',text:'entfernt eine Aktionskarte und legt eine offene Zusatzkarte aus'});p.actions.splice(idx,1);state.actionDiscard.push(old);p.extras.push(replacement);log(`☄️ Bei ${p.name} wird eine Aktionskarte entfernt; die Ersatz-Spielkarte liegt als Zusatzkarte aus.`)}else{const arr=zone==='grid'?p.grid:p.extras,old=arr[idx];if(!old)return;setWatch('meteor',{actor:state.currentPlayer,card:clone(replacement),oldCard:clone(old),srcId:'play-deck-pile',dstId:`cell-${pi}-${zone}-${idx}`,title:`trifft ${p.name}`,typeLabel:'METEORIT',text:`ersetzt ${cardShortText(old)} durch ${cardShortText(replacement)}`});old.faceUp=true;state.playDiscard.unshift(old);arr[idx]=replacement;log(`☄️ Bei ${p.name} wird eine Spielkarte ersetzt.`)}let stars=jokerFunctionEnabled()&&replacement.type==='star'?1:0;if(stars){queueStar(1,'meteorStarReturn',pi);return}meteorNext()}

function starChoiceDone(){ui.data.ownerIndex++;if(ui.data.ownerIndex<ui.data.owners.length){showStarChoice();return}const cont=ui.data.continuation,meteorData=ui.data.meteorData;closeModal();if(cont==='setupContinue'){ui={mode:'setupReveal',data:{},selected:[]};setupContinue();return}if(cont==='meteorStarReturn'){const old=meteorData;if(old){ui={mode:'meteorSelect',data:old,selected:[]};state.currentPlayer=old.attacker;}meteorNext();return}afterMutation(cont||'finishTurn')}
function afterMutation(cont){checkRoundTrigger();resolveMatches(state.currentPlayer,cont)}
function findMatches(pi){const p=state.players[pi],groups=[];for(let r=0;r<3;r++){const raw=[r*4,r*4+1,r*4+2,r*4+3],idx=raw.filter(i=>p.grid[i]);if(idx.length>=3)groups.push({name:`Reihe ${r+1}`,idx})}for(let c=0;c<4;c++){const raw=[c,c+4,c+8],idx=raw.filter(i=>p.grid[i]);if(idx.length>=3)groups.push({name:`Spalte ${c+1}`,idx})}const out=[];for(const g of groups){const cards=g.idx.map(i=>p.grid[i]);if(cards.some(c=>!c.faceUp))continue;/* Sterne bleiben IMMER echte Joker/Wildcards. Der Schalter deaktiviert nur Zusatz-Effekte. */const nums=[...new Set(cards.filter(c=>c.type==='number').map(c=>c.value))],stars=cards.filter(c=>c.type==='star').length;if(nums.length===1){out.push({...g,key:`${g.name}:${g.idx.join('-')}`,optional:stars>0,label:`${g.name}: ${nums[0]}${stars?` + ${stars}★`:''}`})}else if(nums.length===0&&stars===cards.length){out.push({...g,key:`${g.name}:${g.idx.join('-')}`,optional:true,pureStars:true,label:`${g.name}: nur Joker`})}}return out}
function resolveMatches(pi,cont){const matches=findMatches(pi);if(state.phase==='scoring'){const mandatory=matches.filter(m=>!m.optional);if(mandatory.length){if(mandatory.length===1){removeMatch(pi,mandatory[0]);resolveMatches(pi,cont);return}ui={mode:'matchChoice',data:{pi,cont,matches:mandatory,optional:false},selected:[]};showMatchChoice();return}const optional=matches.filter(m=>m.optional);if(optional.length){ui={mode:'matchChoice',data:{pi,cont,matches:optional,optional:true},selected:[]};showMatchChoice();return}continueAfter(cont);return}if(!matches.length){state.pendingMatch=null;save();continueAfter(cont);return}state.pendingMatch={pi,cont};ui={mode:'matchReady',data:{pi,cont},selected:[]};save();render();toast(matches.some(m=>!m.optional)?'✨ Reihe vollständig – jetzt auflösen':'⭐ Joker-Reihe vollständig – optional auflösen')}
function showMatchChoice(){const d=ui.data;modal(`<h3>${d.optional?'⭐ Joker-Kombination':'Gleiche Reihe gefunden'}</h3><p>${d.optional?'Mit Sternen ist das Ablegen freiwillig. Du kannst eine Kombination wählen oder die Sterne behalten.':'Eine reine Zahlenreihe muss abgelegt werden. Wähle bei Überschneidungen die Reihenfolge.'}</p><div class="choice-grid">${d.matches.map((m,i)=>`<button class="choice" onclick="Game.chooseMatch(${i})"><b>${escapeHTML(m.label)}</b><small>${m.idx.length} Karten ablegen</small></button>`).join('')}</div>${d.optional?`<div class="modal-actions"><button class="secondary" onclick="Game.skipOptionalMatches()">Keine Stern-Kombination ablegen</button></div>`:''}`,false)}
function chooseMatch(i){const d=ui.data,m=d.matches[i];closeModal();removeMatch(d.pi,m);resolveMatches(d.pi,d.cont)}
function skipOptionalMatches(){const cont=ui.data.cont;closeModal();continueAfter(cont)}
function resolveBoardMatch(pi,i){if(!state||state.phase!=='play')return;if(cloud.enabled&&!isMyActorDevice()){toast('Du bist gerade nicht am Zug');return}if(pi!==state.currentPlayer){toast('Nur der aktive Spieler kann seine Reihe auflösen');return}const matches=findMatches(pi),m=matches[i];if(!m)return;setWatch('action-play',{actor:pi,srcId:`player-${pi}`,dstId:'play-discard-pile',title:`löst ${m.name} auf`,typeLabel:'REIHE AUFLÖSEN',text:m.label});removeMatch(pi,m);visualFx('action',`${m.name} aufgelöst`,'✨',8);if(ui.mode==='matchReady'||state.pendingMatch){const cont=state.pendingMatch?.cont||ui.data.cont;resolveMatches(pi,cont)}else{save();render()}}
function continueMatchReady(){if(ui.mode!=='matchReady'&&!state.pendingMatch)return;const d=state.pendingMatch||ui.data,matches=findMatches(d.pi);if(matches.some(m=>!m.optional)){toast('Die vollständige Zahlenreihe muss zuerst aufgelöst werden');return}const cont=d.cont;state.pendingMatch=null;ui={mode:'turnChoice',data:{},selected:[]};save();continueAfter(cont)}
function removeMatch(pi,m){const p=state.players[pi];for(const idx of m.idx){const c=p.grid[idx];if(c){c.faceUp=true;state.playDiscard.push(c);p.grid[idx]=null}}log(`${p.name} legt ${m.label} ab.`)}
function continueAfter(cont){if(cont==='finishTurn')finishTurn();else if(cont==='scoreNext')scoreNextPlayer();else if(cont==='meteorNext')meteorNext();else if(cont==='setupContinue')setupContinue();else finishTurn()}
function checkRoundTrigger(){if(state.roundEnder!==null)return;for(let i=0;i<state.players.length;i++){if(totalHidden(state.players[i])===0){state.roundEnder=state.currentPlayer;state.extraTurns=0;const q=[];for(let k=1;k<state.players.length;k++)q.push((state.currentPlayer+k)%state.players.length);state.finalTurnQueue=q;log(`${current().name} beendet die Runde. Alle anderen haben noch genau einen Zug.`);toast('🔔 Schlussrunde!');return}}}
function finishTurn(){closeModal();if(state.heldReacts&&state.heldReacts.length){state.actionDiscard.push(...state.heldReacts);state.heldReacts=[];}checkRoundTrigger();if(state.roundEnder!==null){state.extraTurns=0;if(state.finalTurnQueue.length){state.currentPlayer=state.finalTurnQueue.shift();startTurn();return}startScoring();return}if(state.extraTurns>0){state.extraTurns--;startTurn();return}state.currentPlayer=(state.currentPlayer+1)%state.players.length;startTurn()}
function startScoring(){state.phase='scoring';ui={mode:'scoring',data:{index:0},selected:[]};scorePrepare(0)}
function scorePrepare(pi){if(pi>=state.players.length){finishScoring();return}const p=state.players[pi];for(const c of p.grid)if(c)c.faceUp=true;for(const c of p.extras)if(c)c.faceUp=true;state.currentPlayer=pi;ui={mode:'scoringResolve',data:{index:pi},selected:[]};resolveMatches(pi,'scoreNext');render()}
function scoreNextPlayer(){const next=(ui.data.index??state.currentPlayer)+1;ui={mode:'scoringResolve',data:{index:next},selected:[]};scorePrepare(next)}
function bestStarBonus(p){if(!jokerSpecialsEnabled())return 0;const groups=[];for(let r=0;r<3;r++){const idx=[r*4,r*4+1,r*4+2,r*4+3].filter(i=>p.grid[i]);if(idx.length>=3&&idx.every(i=>p.grid[i].type==='star'))groups.push({idx,bonus:idx.length===4?-15:-10})}for(let c=0;c<4;c++){const idx=[c,c+4,c+8].filter(i=>p.grid[i]);if(idx.length===3&&idx.every(i=>p.grid[i].type==='star'))groups.push({idx,bonus:-10})}let best=0;function dfs(i,used,sum){if(i===groups.length){if(sum<best)best=sum;return}dfs(i+1,used,sum);const g=groups[i];if(g.idx.every(x=>!used.has(x))){const n=new Set(used);g.idx.forEach(x=>n.add(x));dfs(i+1,n,sum+g.bonus)}}dfs(0,new Set(),0);return best}
function rawRoundScore(p){let s=0;for(const c of p.grid)if(c)s+=cardPoints(c);for(const c of p.extras)if(c)s+=cardPoints(c);if(jokerSpecialsEnabled())s+=p.actions.length*10;s+=bestStarBonus(p);return s}
let scoreSequenceSeen='',roundSummarySeen='';
function scoreItemsForPlayer(p){const items=[];for(const c of p.grid)if(c)items.push({kind:'card',card:clone(c),value:cardPoints(c),label:c.type==='star'?'Stern':String(c.value)});for(const c of p.extras)if(c)items.push({kind:'card',card:clone(c),value:cardPoints(c),label:`Zusatz ${c.type==='star'?'★':c.value}`});if(jokerSpecialsEnabled())for(const a of p.actions)items.push({kind:'action',actionType:a.type,value:10,label:ACTIONS[a.type]?.name||'Aktionskarte'});const bonus=bestStarBonus(p);if(bonus)items.push({kind:'bonus',value:bonus,label:'Sternbonus'});return items}
function scoreTokenHTML(item,i){const v=Number(item.value)||0;const cls=v<0?'negative':v>0?(item.kind==='action'?'penalty':'positive'):'bonus';const icon=item.kind==='action'?(ACTIONS[item.actionType]?.icon||'⚡'):item.kind==='bonus'?'⭐':item.card?.type==='star'?'★':(item.card?.value??item.label);return `<div id="score-token-${i}" class="score-token ${cls}"><div class="tok-value">${escapeHTML(icon)}</div><div class="tok-label">${escapeHTML(item.label||'Karte')} · ${v>=0?'+':''}${v}</div></div>`}
function finishScoring(){const scores=state.players.map(rawRoundScore);const e=state.roundEnder;let final=scores.slice();if(e!==null&&scores[e]>0){const min=Math.min(...scores.filter((_,i)=>i!==e));if(min<=scores[e])final[e]=scores[e]*2}const seq={id:uid(),round:state.round,ownerDevice:cloud.enabled?cloud.deviceId:'local',createdAt:Date.now(),players:state.players.map((p,i)=>({index:i,name:p.name,beforeTotal:p.total,raw:scores[i],final:final[i],items:scoreItemsForPlayer(p)}))};state.phase='scoringSequence';state.scoreSequence=seq;ui={mode:'scoreSequence',data:{},selected:[]};save();render();maybeStartScoreSequence()}
function maybeStartScoreSequence(){const seq=state?.scoreSequence;if(!seq||seq.id===scoreSequenceSeen)return;scoreSequenceSeen=seq.id;runScoreSequenceVisual(seq)}
function sleepMs(ms){return new Promise(r=>setTimeout(r,ms))}
async function runScoreSequenceVisual(seq){document.querySelector('.score-sequence-overlay')?.remove();const ov=document.createElement('div');ov.className='score-sequence-overlay';ov.innerHTML=`<div class="score-sequence-stage"><div class="score-seq-head"><div><small>SKYJO ACTION · RUNDENABRECHNUNG</small><h2>Karten werden gezählt</h2></div><div class="score-seq-round">Runde ${seq.round}</div></div><div class="score-seq-body"><div id="score-focus" class="score-player-focus"><div id="score-avatar" class="avatar-big">1</div><h3 id="score-name"></h3><p id="score-sub">Karte für Karte</p><div class="score-running-total">Zwischenstand<b id="score-running">0</b></div></div><div class="score-count-zone"><div id="score-count-cards" class="score-count-cards"></div><div id="score-step-line" class="score-step-line">Bereit …</div></div></div><div id="score-seq-final" class="score-sequence-final"></div></div>`;document.body.append(ov);const delay=Math.max(85,Math.min(230,250-seq.players.length*22));for(let pi=0;pi<seq.players.length;pi++){const sp=seq.players[pi];const focus=ov.querySelector('#score-focus');focus.classList.remove('score-player-done');ov.querySelector('#score-avatar').textContent=pi+1;ov.querySelector('#score-name').textContent=sp.name;ov.querySelector('#score-sub').textContent='Karte für Karte · Punkte werden addiert';const run=ov.querySelector('#score-running'),zone=ov.querySelector('#score-count-cards'),line=ov.querySelector('#score-step-line');run.textContent='0';zone.innerHTML=sp.items.map(scoreTokenHTML).join('');let total=0;await sleepMs(300);for(let i=0;i<sp.items.length;i++){const it=sp.items[i],el=zone.querySelector(`#score-token-${i}`);el?.classList.add('active');line.innerHTML=`${escapeHTML(it.label)} <strong>${it.value>=0?'+':''}${it.value}</strong>`;await sleepMs(delay);total+=Number(it.value)||0;run.textContent=String(total);el?.classList.remove('active');el?.classList.add('done');playFxSound(it.value<0?'star':'draw');await sleepMs(Math.max(35,delay*.25))}if(sp.final!==sp.raw){line.innerHTML=`Rundenbeender nicht allein niedrigster Wert: <strong>${sp.raw} × 2 = ${sp.final}</strong>`;run.textContent=String(sp.final);haptic([12,30,12]);await sleepMs(800)}else{line.innerHTML=`Rundenwert <strong>${sp.final>=0?'+':''}${sp.final}</strong>`;await sleepMs(420)}focus.classList.add('score-player-done');await sleepMs(350)}const fin=ov.querySelector('#score-seq-final');fin.innerHTML=seq.players.map((sp,i)=>`<div class="score-final-row"><span>${i+1}</span><b>${escapeHTML(sp.name)}</b><span>${sp.final>=0?'+':''}${sp.final}</span></div>`).join('');fin.classList.add('show');await sleepMs(1100);const isOwner=!cloud.enabled||seq.ownerDevice===cloud.deviceId;if(isOwner&&state?.scoreSequence?.id===seq.id)commitScoreSequence(seq);await sleepMs(350);ov.style.opacity='0';setTimeout(()=>{ov.remove();maybeShowRoundSummary()},350)}
function commitScoreSequence(seq){seq.players.forEach(sp=>{const p=state.players[sp.index];p.lastRound=sp.final;p.total+=sp.final});const ended=state.players.some(p=>p.total>=state.target);state.gameOver=ended;state.phase=ended?'gameOver':'betweenRounds';state.lastRoundSummary={id:seq.id,round:seq.round,ended,players:seq.players.map(sp=>({index:sp.index,name:sp.name,raw:sp.raw,round:sp.final,total:state.players[sp.index].total}))};state.scoreSequence=null;save();render();visualFx(ended?'win':'action',ended?`${[...state.players].sort((a,b)=>a.total-b.total)[0].name} gewinnt!`:'Runde beendet',ended?'🏆':'📊',ended?18:8);if(ended)finaleBurst();maybeShowRoundSummary()}
function maybeShowRoundSummary(){const s=state?.lastRoundSummary;if(!s||s.id===roundSummarySeen)return;if(document.querySelector('.score-sequence-overlay')){setTimeout(maybeShowRoundSummary,400);return}roundSummarySeen=s.id;const sorted=s.ended?[...s.players].sort((a,b)=>a.total-b.total):s.players;const winner=sorted[0];const rows=sorted.map((x,rank)=>{const medal=s.ended?(rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`#${rank+1}`):'R';const doubled=x.round!==x.raw;return `<div class="score-result ${s.ended&&rank===0?'winner-row':''}"><div class="score-rank">${medal}</div><div class="score-who"><b>${escapeHTML(x.name)}</b><small>${doubled?`Verdoppelt aus ${x.raw}`:'Rundenwert'}</small></div><div class="score-round ${x.round<0?'good-score':''}">${x.round>=0?'+':''}${x.round}</div><div class="score-total"><small>GESAMT</small><b>${x.total}</b></div></div>`}).join('');modal(`<div class="final-score-modal">${s.ended?`<div class="winner-hero"><div class="winner-crown">🏆</div><small>SPIELSIEG</small><h3>${escapeHTML(winner.name)}</h3><p>${winner.total} Punkte · niedrigster Gesamtstand</p></div>`:`<div class="round-score-head"><span>📊</span><div><h3>Runde ${s.round} beendet</h3><p>Alle Karten wurden einzeln gezählt.</p></div></div>`}<div class="score-results">${rows}</div><div class="modal-actions"><button class="primary" onclick="${s.ended?'Game.closeModal();Game.render()':'Game.nextRound()'}">${s.ended?'🏆 Ergebnis ansehen':'▶ Nächste Runde'}</button></div></div>`,false)}

function showRules(){modal(`<div class="rules"><h3>Regeln dieser Fan-Umsetzung</h3><p class="note">Eigenständige, nicht offizielle Browser-Umsetzung ohne Originalgrafiken. Die Regeln sind in eigenen Worten zusammengefasst.</p><h4>Ziel</h4><p>Über mehrere Runden möglichst wenige Punkte sammeln. Sobald nach einer Runde mindestens ein Spieler ${state?state.target:100} oder mehr Gesamtpunkte hat, endet das Spiel; der niedrigste Gesamtstand gewinnt.</p><h4>Aufbau</h4><ul><li>Jeder Spieler erhält 12 Spielkarten im 4×3-Raster und deckt 2 beliebige Karten auf.</li><li>Es gibt einen Spielkarten-Nachzieh- und Ablagestapel sowie vier offen ausliegende Aktionskarten, einen Aktions-Nachziehstapel und eine Aktions-Ablage.</li><li>Wer mit den zwei Startkarten die höchste Summe hat, beginnt. Bei Gleichstand entscheidet diese digitale Fassung zufällig.</li></ul><h4>Ein Zug – genau eine Hauptaktion</h4><ul><li><b>Spielkarte ziehen:</b> Ablagekarte muss sofort getauscht werden. Vom verdeckten Stapel darfst du die Karte ansehen, tauschen oder ablegen; beim Ablegen musst du eine eigene verdeckte Karte aufdecken.</li><li><b>Aktionskarte ziehen:</b> offen aus der Vierer-Auslage oder verdeckt vom Stapel. Sie darf frühestens im nächsten eigenen Zug gespielt werden.</li><li><b>Aktionskarte spielen/ablegen:</b> ihr Effekt ersetzt den normalen Zug. Unbenutzte Aktionskarten zählen am Rundenende je +10.</li></ul><h4>Sterne</h4><ul><li>Ein neu aufgedeckter bzw. passend platzierter Stern gibt einmalig sofort eine Aktionskarte. Auch ein offen vom Ablagestapel genommener Stern löst dies aus.</li><li>Sterne zählen 0 Punkte und können am Zugende freiwillig kurz den Wert einer Zahl in derselben kompletten Reihe/Spalte annehmen.</li><li>Reine Stern-Gruppen dürfen abgelegt werden, müssen aber nicht. Am Rundenende bringt eine vollständige 3er-Sterngruppe −10, eine waagerechte 4er-Sterngruppe −15; jeder Stern wird nur einmal für einen Bonus gezählt.</li></ul><h4>Gleiche Reihen</h4><p>Komplette senkrechte oder waagerechte Reihen mit mindestens 3 noch vorhandenen Karten aus derselben Zahl werden direkt am Spielfeld markiert. Über „Reihe auflösen“ bzw. „Spalte auflösen“ legst du sie ab – auch Minuszahlen. Dadurch kann nach dem Entfernen einer ganzen Spalte auch eine waagerechte 3er-Reihe entstehen. Kombinationen, die nur mit Sternen möglich sind, sind freiwillig.</p><h4>Rundenende</h4><p>Sobald ein Spieler die letzte verdeckte Karte bei sich oder einem Mitspieler aufdeckt, hat jeder andere Spieler noch genau einen Zug. Ab dann dürfen Aktionskarten nicht mehr gespielt oder freiwillig abgelegt werden. Danach werden alle Karten aufgedeckt und gewertet.</p><p>Hat der Rundenbeender nicht allein den niedrigsten Rundenwert, wird sein positiver Rundenwert verdoppelt. Bei 0 oder negativen Rundenpunkten gibt es keine Verdopplung.</p><h4>Aktionskarten</h4><ul>${Object.values(ACTIONS).map(a=>`<li><b>${a.icon} ${a.name}:</b> ${a.desc}</li>`).join('')}</ul><h4>Varianten aus der Anleitung</h4><p class="note">Diese vier Varianten sind hier als Regelreferenz enthalten; die automatische Spiellogik der Datei nutzt den vollständigen Standardmodus für 2–8 Spieler.</p><ul><li><b>Ein Kartendeck:</b> 5–10 Aktionskarten werden ins Spielkartendeck gemischt; beim Ziehen/Aufdecken darf man sie behalten oder ablegen und zieht danach noch eine Spielkarte (2–6 Spieler).</li><li><b>Zahlen + Sterne:</b> ohne Aktionskarten (2–6 Spieler).</li><li><b>Nur Zahlen:</b> ohne Sterne und Aktionskarten (2–4 Spieler).</li><li><b>Große Runde:</b> bis zu 10 Spieler mit 9 Karten im 3×3-Raster; zu Beginn wird nur 1 Karte aufgedeckt.</li></ul><p class="note"><b>Meteoritenschauer:</b> Die gedruckte Regel nennt als entfernbares Ziel Zahlen-, Stern- oder Aktionskarten. Wird hier eine Aktionskarte getroffen, legt die digitale Fassung die gezogene Ersatz-Spielkarte als offene Zusatzkarte neben das Raster; sie zählt bei der Wertung und kann später wie eine Spielkarte getauscht werden.</p><p class="note"><b>Diese digitale Version:</b> Die Anzahl der Joker-/Sternkarten ist im Startmenü von 0–30 einstellbar. „Joker-Spezialeffekte AUS“ lässt Sterne weiterhin als echte Joker/Wildcards mit 0 Punkten funktionieren. In dieser digitalen Variante werden dann die Aktionskarten vollständig deaktiviert und ausgeblendet; außerdem entfallen Gratis-Aktionskarte und Sternbonus.</p><p class="note"><b>Blanko-Ideenkarten:</b> Die Packung enthält Karten für eigene Hausregeln. Da sie keinen festen Effekt besitzen, sind sie nicht Teil des automatisierten Regelsets.</p></div>`)}

function setupView(){const cfgRoom=escapeHTML(cloud.room||'');const nm=escapeHTML(cloud.myName||'');const st=cloud.lastError?`<div class="online-status err">⚠ ${escapeHTML(cloud.lastError)}</div>`:(cloud.serverOK===true?'<div class="online-status ok">● Render/SKYJO-Server erreichbar</div>':'');return `<div class="panel hero"><div class="brandmark" style="margin:auto"></div><h2>SKYJO</h2><p>Lokal auf einem Gerät oder echter Online-Mehrspieler mit einem Gerät pro Spieler.</p><div class="setup-grid"><div class="field"><label>Spielmodus</label><select id="cloudMode" onchange="Game.toggleCloudFields()"><option value="local" ${cloud.enabled?'':'selected'}>Lokal / Pass-and-Play</option><option value="cloud" ${cloud.enabled?'selected':''}>Online – mehrere Geräte</option></select></div><div class="field"><label>Zielpunktzahl</label><input id="target" type="number" min="20" max="500" value="100"></div><div id="specialSetupField" class="field"><label>Aktionskarten-Modus</label><select id="beginner"><option value="0">Nein – alle Aktionen</option><option value="1">Ja – ohne Dieb & Meteorit</option></select></div><div class="field"><label>Anzahl Jokerkarten</label><input id="jokerCount" type="number" min="0" max="30" step="1" value="15"><div class="joker-off-note">Standard: 15.</div></div><div class="field"><label>Joker-Spezialeffekte</label><div class="toggle-box"><span><b>Zusatzfähigkeiten</b><div class="joker-off-note">AUS = Joker bleibt Wildcard und zählt 0 Punkte. Aktionskarten, Gratis-Aktion und Sternbonus sind aus.</div></span><input id="jokerEnabled" type="checkbox" checked onchange="Game.toggleJokerSpecialUI()"></div></div></div><div id="cloudBox" style="display:${cloud.enabled?'block':'none'}"><div class="setup-separator"></div><div class="online-mode-grid"><div class="field"><label>Dein Name</label><input id="onlineName" value="${nm}" maxlength="24" placeholder="z. B. Christoph"></div><div class="field"><label>Raumcode</label><input id="cloudRoom" maxlength="20" value="${cfgRoom}" placeholder="z. B. BNLY7"></div></div><div class="online-actions"><button class="secondary" onclick="Game.generateCloudRoom()">🎲 Neuer Code</button><button class="primary" onclick="Game.createOnlineRoom()">👑 Raum erstellen</button><button class="secondary" onclick="Game.joinOnlineRoom()">🔗 Beitreten</button></div>${st}<div class="cloud-info">Host erstellt den Raum. Auf dem zweiten Gerät denselben Code eingeben und „Beitreten“ drücken. Das Spiel startet erst, wenn mindestens 2 Spieler in der Lobby sind.</div></div><div id="localBox" style="display:${cloud.enabled?'none':'block'}"><div class="setup-separator"></div><div class="field"><label>Spielerzahl</label><select id="playerCount" onchange="Game.updateNames()">${[2,3,4,5,6,7,8].map(n=>`<option ${n===2?'selected':''}>${n}</option>`).join('')}</select></div><div id="names" class="names"></div><button class="primary wide" onclick="Game.startFromSetup()">Lokales Spiel starten</button></div></div>`}

function cardClass(c){if(!c)return'empty';if(!c.faceUp)return'back';if(c.type==='star')return'star';if(c.value<0)return'neg';if(c.value===0)return'zero';if(c.value<=4)return'low';if(c.value<=8)return'mid';return'high'}
function cardHTML(c,forceFace=false,clickable=false,selected=false){if(!c)return`<div class="card empty"></div>`;const face=forceFace||c.faceUp,cls=face?(c.type==='star'?'star':c.value<0?'neg':c.value===0?'zero':c.value<=4?'low':c.value<=8?'mid':'high'):'back';const v=face?(c.type==='star'?'★':c.value):'';const off='';return `<div class="card ${cls} ${off} ${clickable?'clickable':''} ${selected?'selected':''}">${face?`<span class="corner tl">${v}</span><span class="center-value">${v}</span><span class="corner br">${v}</span>`:''}</div>`}
function actionHTML(a,clickable=false,selected=false){if(!a)return'';const m=ACTIONS[a.type],locked=state&&state.players[state.currentPlayer]&&state.players[state.currentPlayer].actions.includes(a)&&!actionAvailable(a,state.players[state.currentPlayer]);const kindLabel=m.kind==='attack'?'ANGRIFF':m.kind==='defense'?'SCHUTZ':'AKTION';return `<div class="action-card action-${escapeHTML(a.type)} ${m.kind==='attack'?'attack':m.kind==='defense'?'defense':''} ${clickable?'clickable':''} ${selected?'selected':''} ${locked?'disabled':''}" data-action-type="${escapeHTML(a.type)}"><span class="action-type">${kindLabel}</span><div class="emoji">${m.icon}</div><b>${m.name}</b><small>${m.desc}</small>${locked?'<span class="lock">🔒</span>':''}</div>`}
function boardCardClickable(pi,zone,idx){if(!state)return false;if(cloud.enabled&&!isMyActorDevice())return false;const mode=ui.mode;if(mode==='setupReveal')return pi===state.setupPlayer&&zone==='grid';if(['discardSwap','drawnSwap','flipOwn','ownSwapSelect','draw3Target'].includes(mode))return pi===state.currentPlayer;if(mode==='otherSwapSelect')return pi===ui.data.a||pi===ui.data.b;if(mode==='meteorSelect')return pi===ui.data.target;return false}
function isSelected(pi,zone,idx){return ui.selected.some(s=>s.pi===pi&&s.zone===zone&&s.idx===idx)}
function playerHTML(p,pi){const active=pi===state.currentPlayer;const mine=cloud.enabled&&pi===myPlayerIndex();const matches=(state.phase==='play')?findMatches(pi):[];const matchSet=new Set(matches.flatMap(m=>m.idx));const canResolve=state.phase==='play'&&pi===state.currentPlayer&&(!cloud.enabled||isMyActorDevice());const cards=p.grid.map((c,i)=>`<div id="cell-${pi}-grid-${i}" class="card-slot ${matchSet.has(i)?'match-ready-slot':''}" onclick="Game.selectCard(${pi},'grid',${i})">${cardHTML(c,false,boardCardClickable(pi,'grid',i),isSelected(pi,'grid',i))}</div>`).join('');const extras=p.extras.map((c,i)=>`<div id="cell-${pi}-extra-${i}" class="card-slot" onclick="Game.selectCard(${pi},'extra',${i})">${cardHTML(c,false,boardCardClickable(pi,'extra',i),isSelected(pi,'extra',i))}</div>`).join('');const acts=p.actions.map((a,i)=>`<div onclick="Game.selectActionCard(${pi},${i})">${actionHTML(a,(ui.mode==='chooseActionTurn'&&pi===state.currentPlayer)||(ui.mode==='meteorSelect'&&pi===ui.data.target),false)}</div>`).join('');const total=Math.max(1,12+p.extras.length),hidden=totalHidden(p),pct=Math.max(0,Math.min(100,Math.round(((total-hidden)/total)*100)));const openCards=[...(p.grid||[]),...(p.extras||[])].filter(c=>c&&c.faceUp);const openSum=openCards.reduce((s,c)=>s+cardPoints(c),0);const hue=[43,188,145,282,18,215,325,92][pi%8];const matchActions=matches.length?`<div class="match-actions"><div class="match-actions-title">✨ Vollständige Kombination erkannt</div>${matches.map((m,i)=>canResolve?`<button class="match-resolve-btn ${m.optional?'optional':''}" onclick="Game.resolveBoardMatch(${pi},${i})">${m.name.startsWith('Reihe')?'Reihe auflösen':'Spalte auflösen'} · ${escapeHTML(m.label.replace(/^.*?:\s*/,''))}</button>`:`<span class="match-hint">${escapeHTML(m.label)} vollständig</span>`).join('')}</div>`:'';return `<section id="player-${pi}" data-player="${pi}" class="player ${active?'active':''} ${mine?'mine':''}" style="--player-hue:${hue}"><div class="player-head"><div class="player-title"><div class="avatar">${pi+1}</div><div class="player-meta"><div class="player-name">${escapeHTML(p.name)} ${mine?'<span class="you-tag">DU</span>':''} ${active?'<span class="active-tag">🎯 AM ZUG</span>':''}</div><div class="hint"><span>${hidden} verdeckt</span>${jokerSpecialsEnabled()?`<span>${p.actions.length} Aktionen</span>`:''}<span>offen ${openSum>=0?'+':''}${openSum}</span></div><div class="reveal-meter"><i style="width:${pct}%"></i></div></div></div><div class="score-stack"><div class="scorechip"><small>GESAMT</small><b>${p.total}</b></div><div class="progress-chip">${pct}%</div></div></div><div class="gridwrap"><div class="grid">${cards}</div>${p.extras.length?`<div class="extras"><h5>Zusatzkarten</h5><div class="extra-row">${extras}</div></div>`:''}</div>${matchActions}${jokerSpecialsEnabled()&&p.actions.length?`<div class="actions-owned action-only-ui"><div class="owned-title">⚡ Eigene Aktionskarten</div>${acts}</div>`:''}</section>`}
function instructionText(){if(!state)return'';const p=current();if(cloud.enabled&&!isMyActorDevice()){const ai=actorIndex(),n=state.players[ai]?.name||'Mitspieler';return `Warte auf ${escapeHTML(n)} …`}switch(ui.mode){case'setupReveal':return `${state.players[state.setupPlayer].name}: ${2-state.setupRevealed} Startkarte(n) aufdecken`;case'turnChoice':return jokerSpecialsEnabled()?`${p.name}: Stapel, Ablage oder Aktionskarte direkt antippen`:`${p.name}: Nachziehstapel oder Ablage antippen`;case'drawnDecision':return `Gezogene Karte: oben am Tisch behalten oder ablegen`;case'matchReady':return `✨ Vollständige Reihe erkannt – direkt am Spielfeld auflösen`;case'scoreSequence':return `📊 Rundenabrechnung läuft …`;case'discardSwap':return `${p.name}: Ablagekarte muss getauscht werden`;case'drawnSwap':return `${p.name}: Gezogene Karte in die eigene Auslage tauschen`;case'flipOwn':return `${p.name}: Eine verdeckte eigene Karte aufdecken`;case'chooseActionTurn':return `${p.name}: Aktionskarte wählen`;case'ownSwapSelect':return `${p.name}: Zwei eigene Karten wählen`;case'otherSwapSelect':return `Je eine Karte bei den zwei gewählten Spielern wählen`;case'meteorSelect':return `☄️ Karte bei ${state.players[ui.data.target].name} wählen`;case'draw3Target':return `${p.name}: Zielkarte für die gewählte Karte bestimmen`;case'scoringResolve':return `Rundenwertung wird aufgelöst`;default:return `${p.name}`}}
function bottomButtons(){if(!state||state.phase==='gameOver')return'';if(cloud.enabled&&!isMyActorDevice())return '<div class="waiting-note">Nicht dein Zug – Spiel wird automatisch synchronisiert.</div>';if(ui.mode==='turnChoice')return jokerSpecialsEnabled()?`<button onclick="Game.drawFromDeck()">🎴 Ziehstapel</button><button onclick="Game.drawFromDiscard()">🂠 Ablage</button><button class="primary" onclick="Game.chooseActionTurn()">⚡ Eigene Aktion</button><button onclick="Game.takeActionBlind(false)">⚡ Verdeckt</button>`:`<button onclick="Game.drawFromDeck()">🎴 Ziehstapel</button><button onclick="Game.drawFromDiscard()">🂠 Ablage</button>`;if(ui.mode==='drawnDecision')return `<span class="turn-state-pill mine">🎴 Entscheidung oben am Tisch</span>`;if(ui.mode==='matchReady'){const ms=findMatches(state.currentPlayer);return ms.some(m=>!m.optional)?'<span class="turn-state-pill mine">✨ Reihe zuerst auflösen</span>':'<button onclick="Game.continueMatchReady()">Weiter ohne Joker-Reihe aufzulösen</button>'}if(ui.mode==='chooseActionTurn')return `<button onclick="Game.cancelActionChoice()">↩ Zurück</button>`;return''}
function gameView(){
 const topDiscard=state.playDiscard[state.playDiscard.length-1];
 const specials=jokerSpecialsEnabled();
 const canDirect=ui.mode==='turnChoice'&&(!cloud.enabled||isMyActorDevice());
 const drawnNow=ui.mode==='drawnDecision'&&ui.data?.card&&(!cloud.enabled||isMyActorDevice());
 const mp=cloud.enabled?`<div class="multiplayer-bar"><b>☁ Raum ${escapeHTML(cloud.room)} · ${escapeHTML(cloud.myName||'Spieler')}</b><span class="turn-state-pill ${isMyActorDevice()?'mine':''}">${isMyActorDevice()?'🟢 Dein Zug':'⏳ Warten'}</span></div>`:'';
 const deckClick=canDirect?'onclick="Game.drawFromDeck()" role="button" tabindex="0"':'';
 const discardClick=canDirect&&topDiscard?'onclick="Game.drawFromDiscard()" role="button" tabindex="0"':'';
 const playArea=drawnNow?drawnDecisionHTML(ui.data.card):`<div class="pile-row"><div id="play-deck-pile" class="pile-card-hit ${canDirect?'enabled':''}" ${deckClick}>${cardHTML({type:'number',value:0,faceUp:false},false,canDirect)}<span class="pile-tip">${canDirect?'Ziehen':'Nachziehstapel'}</span></div><div id="play-discard-pile" class="pile-card-hit ${discardClick?'enabled':''}" ${discardClick}>${cardHTML(topDiscard,true,!!discardClick)}<span class="pile-tip">${discardClick?'Nehmen':'Ablage'}</span></div></div>`;
 const actionArea=specials?`<div class="pilebox action-only-ui"><h4>Aktionskarten · offen oder verdeckt antippen</h4><div class="market">${actionBlindStackHTML(canDirect)}${state.market.map((a,i)=>a?`<div id="market-${i}" class="market-hit ${canDirect?'enabled':''}" ${canDirect?`onclick="Game.takeActionMarket(${i},false)" role="button" tabindex="0"`:''}>${actionHTML(a,canDirect)}</div>`:'').join('')}</div><div class="count">Aktionsstapel ${state.actionDeck.length} · Ablage ${state.actionDiscard.length}</div></div>`:`<div class="specials-off-note">⭐ Joker bleiben Wildcards mit 0 Punkten · Spezialfähigkeiten sind deaktiviert</div>`;
 const centerTable=`<section class="panel center-table ${specials?'':'specials-off'}"><div class="watchbox">${watchPanelHTML()}</div><div class="pilebox play-pilebox"><h4>${drawnNow?'Spielkarte gezogen · Entscheidung':'Spielkarten · direkt antippen'}</h4>${playArea}<div class="count">${state.playDeck.length} im Stapel · ${state.playDiscard.length} auf Ablage</div></div>${actionArea}</section>`;
 const playersHTML=state.players.map(playerHTML);
 const boards=state.players.length===2?`<div class="table-area two-player-layout"><div class="board-col left">${playersHTML[0]||''}</div>${centerTable}<div class="board-col right">${playersHTML[1]||''}</div></div>`:`<div class="table-area">${centerTable}<div class="players players-${state.players.length}">${playersHTML.join('')}</div></div>`;
 return `${mp}<div class="status"><div class="stat"><b>${state.round}</b><span>Runde</span></div><div class="stat"><b>${escapeHTML(current().name)}</b><span>${state.phase==='scoring'?'Wertung':'am Zug'}</span></div><div class="stat"><b>${state.playDeck.length}</b><span>Nachziehstapel</span></div><div class="stat"><b>${state.target}</b><span>Spielende ab</span></div><div class="stat"><b>${state.jokerCount??15} · ${specials?'AN':'AUS'}</b><span>Joker · Spezialeffekte</span></div></div>${boards}<div class="bottom-actions"><div class="bottom-inner"><div class="instruction">${instructionText()}</div><div class="action-buttons">${bottomButtons()}</div></div></div>`
}
function render(){const app=$('#app');let content;if(cloud.enabled&&isRoomDoc(cloud.doc)&&!cloud.doc.game)content=lobbyView();else if(!state)content=setupView();else content=gameView();app.innerHTML=`<div class="topbar"><div class="brand"><div class="brandmark"></div><div><h1>SKYJO <span style="color:var(--accent)">ACTION</span></h1><small>V10.2 · Clean Table</small></div></div><div class="top-actions">${cloudBadgeHTML()}${state?'<button class="iconbtn focus-btn" onclick="Game.focusMyBoard()" title="Zu meinem Feld">🎯</button>':''}<button id="soundBtn" class="iconbtn sound-btn" onclick="Game.toggleSound()" title="Sound">${uiPrefs.sound?'🔊':'🔇'}</button><button id="fullscreenBtn" class="iconbtn fs-btn" onclick="Game.toggleFullscreen()" title="Vollbild">⛶</button><button class="iconbtn" onclick="Game.showDisplaySettings()" title="Darstellung">⚙</button><button class="iconbtn" onclick="Game.showRules()" title="Regeln">📖</button>${state?'<button class="iconbtn" onclick="Game.showLog()" title="Spielverlauf">🧾</button><button class="iconbtn" onclick="Game.restart()" title="Neu starten">↻</button>':''}</div></div>${content}`;if(!state&&!isRoomDoc(cloud.doc))setTimeout(()=>{updateNames();toggleCloudFields();toggleJokerSpecialUI()},0);syncBodyMode();if(state){save();runWatchFx();maybeStartScoreSequence();if((state.phase==='betweenRounds'||state.phase==='gameOver')&&state.lastRoundSummary)setTimeout(maybeShowRoundSummary,80)}}
function cancelActionChoice(){ui={mode:'turnChoice',data:{},selected:[]};render()}
function escapeHTML(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
window.Game={render,updateNames,startFromSetup,selectCard,drawFromDeck,drawFromDiscard,keepDrawn,discardDrawn,takeActionMarket,takeActionBlind,chooseActionTurn,selectActionCard,confirmPlayAction,confirmDiscardAction,finishOwnSwap,draw3Pick,draw3None,showEnlightenment,finishEnlightenment,reactivate,beginOtherSwapSelection,finishOtherSwap,thiefPick,chooseMatch,skipOptionalMatches,closeModal,showRules,showLog,restart,nextRound,cancelActionChoice,loadCloudRoom,generateCloudRoom,toggleCloudFields,createOnlineRoom,joinOnlineRoom,startOnlineGame,leaveOnlineRoom,toggleFullscreen,toggleSound,toggleHaptic,toggleCinematic,toggleAutoFocus,focusMyBoard,showDisplaySettings,resolveBoardMatch,continueMatchReady,maybeShowRoundSummary,toggleJokerSpecialUI};

document.addEventListener('fullscreenchange',syncFullscreenState);
document.addEventListener('webkitfullscreenchange',syncFullscreenState);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(isFullscreen()||pseudoFullscreen))requestWakeLock()});
window.addEventListener('resize',()=>{syncChromeButtons()},{passive:true});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;const k=String(e.key||'').toLowerCase();if(k==='f'){e.preventDefault();toggleFullscreen();return}if(k==='s'){e.preventDefault();showDisplaySettings();return}if(k==='m'&&state){e.preventDefault();focusMyBoard();return}if(k==='l'&&state){e.preventDefault();showLog();return}if(!state||!isMyActorDevice())return;if(k==='d'&&ui.mode==='turnChoice'){e.preventDefault();drawFromDeck()}else if(k==='a'&&ui.mode==='turnChoice'){e.preventDefault();drawFromDiscard()}});

cloudConfigLoad();
const saved=!cloud.enabled?load():null;if(saved){state=saved;if(state.phase==='play')ui=state.pendingMatch?{mode:'matchReady',data:{pi:state.pendingMatch.pi,cont:state.pendingMatch.cont},selected:[]}:{mode:'turnChoice',data:{},selected:[]};else if(state.phase==='initialReveal')ui={mode:'setupReveal',data:{},selected:[]};else if(state.phase==='betweenRounds'||state.phase==='gameOver')ui={mode:'none',data:{},selected:[]};else ui={mode:'turnChoice',data:{},selected:[]};}
render();
if(cloud.enabled&&cloud.room){restoreOnlineRoom()}
})();
</script>
