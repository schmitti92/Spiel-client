<div id="toast" class="toast"></div>
<div id="modalBack" class="modal-back"><div id="modal" class="modal"></div></div>
<script>
(() => {
'use strict';
const SAVE_KEY='skyjo_action_fan_v1';
const CLOUD_CFG_KEY='skyjo_action_cloud_v1';
const CLOUD_BASE='https://serverfinal-ynbe.onrender.com';
let cloud={enabled:false,room:'',rev:0,inFlight:false,pending:false,pendingJSON:'',lastPushedJSON:'',applying:false,pollTimer:null,lastStatus:'local'};
const ACTIONS={
 ownswap:{name:'Eigene Karten tauschen',icon:'🔀',kind:'normal',desc:'Zwei eigene Karten tauschen; Ausrichtung neu wählen.'},
 double:{name:'Doppelter Spielzug',icon:'⏩',kind:'normal',desc:'Danach zwei vollständige Züge hintereinander.'},
 draw3:{name:'Drei Karten ziehen',icon:'3️⃣',kind:'normal',desc:'Drei ziehen, höchstens eine behalten.'},
 enlight:{name:'Erleuchtung',icon:'🔎',kind:'normal',desc:'Eine komplette Reihe oder Spalte geheim ansehen.'},
 react:{name:'Reaktivierung',icon:'♻️',kind:'normal',desc:'Eine Aktionskarte aus der Ablage sofort erneut spielen.'},
 defense:{name:'Verteidigung',icon:'🛡️',kind:'defense',desc:'Blockt einen Angriff; aktiv gespielt = Extrazug.'},
 swapother:{name:'Kartentausch Mitspieler',icon:'🔁',kind:'attack',desc:'Eine Karte zwischen zwei Spielern tauschen.'},
 thief:{name:'Aktionskarten-Dieb',icon:'🥷',kind:'attack',desc:'Aktionskarte stehlen + Extrazug.'},
 meteor:{name:'Meteoritenschauer',icon:'☄️',kind:'attack',desc:'Bei jedem Mitspieler eine Karte ersetzen.'}
};
let state=null;
let ui={mode:'none',data:{},selected:[]};
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));

const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function visualFx(kind,label,emoji='✨',sparks=0){
  try{
    fxFeedback(kind);
    if(uiPrefs.cinematic===false)return;
    const wrap=document.createElement('div');wrap.className=`game-fx ${kind||''}`;
    const core=document.createElement('div');core.className='fx-core';
    const ic=document.createElement('div');ic.className='fx-icon';ic.textContent=emoji;
    const tx=document.createElement('div');tx.className='fx-label';tx.textContent=label||'';
    core.append(ic,tx);wrap.append(core);document.body.append(wrap);
    setTimeout(()=>wrap.remove(),980);
    const n=Math.max(0,Math.min(18,Number(sparks)||0));
    for(let i=0;i<n;i++){
      const s=document.createElement('i');s.className='fx-spark';
      const a=(Math.PI*2*i/n)+(Math.random()-.5)*.35;
      const d=70+Math.random()*120;
      s.style.left=`${50+(Math.random()-.5)*4}%`;s.style.top=`${46+(Math.random()-.5)*4}%`;
      s.style.setProperty('--sx',`${Math.cos(a)*d}px`);s.style.setProperty('--sy',`${Math.sin(a)*d}px`);
      document.body.append(s);setTimeout(()=>s.remove(),900);
    }
  }catch(_e){}
}


const UI_PREF_KEY='skyjo_action_ui_v9';
let uiPrefs={sound:false,haptic:true,cinematic:true,autoFocus:false,motion:'table'};
try{const p=JSON.parse(localStorage.getItem(UI_PREF_KEY)||'null');if(p&&typeof p==='object')uiPrefs={...uiPrefs,...p}}catch(_e){}
let audioCtx=null,wakeLock=null,pseudoFullscreen=false;
function saveUIPrefs(){try{localStorage.setItem(UI_PREF_KEY,JSON.stringify(uiPrefs))}catch(_e){}}
let motionBusy=false,motionQueueBusy=false,motionUnlockTimer=null,motionSessionStart=Date.now(),motionBusyUntil=0,motionRenderPending=false,motionActiveEvent=null;
const motionSeen=new Set();
const motionDiscardCommitted=new Set();
function discardArrivalEvent(){
 if(motionActiveEvent&&(motionActiveEvent.type==='swap'||motionActiveEvent.type==='drawn-discard')&&!motionDiscardCommitted.has(motionActiveEvent.id))return motionActiveEvent;
 const list=state?.motionFeed||[];
 for(let i=list.length-1;i>=0;i--){
   const e=list[i];
   if(!e?.id||motionSeen.has(e.id)||motionDiscardCommitted.has(e.id))continue;
   if(!(Number(e.ts||0)>=motionSessionStart-8000||e.id===state?.watch?.id))continue;
   if(e.type==='swap'||e.type==='drawn-discard')return e
 }
 return null
}
function discardArrivalPending(){return !!discardArrivalEvent()}
function visualDiscardState(){const arr=state?.playDiscard||[];const pending=discardArrivalPending();if(pending&&arr.length){return {top:arr.length>1?arr[arr.length-2]:null,count:Math.max(0,arr.length-1),pending:true}}return {top:arr[arr.length-1]||null,count:arr.length,pending:false}}
function commitDiscardArrival(e,card){
 if(e?.id)motionDiscardCommitted.add(e.id);
 showDiscardCardImmediately(card);
 const pile=document.getElementById('play-discard-pile');
 if(pile){
   const tip=pile.querySelector('.pile-tip');
   if(tip)tip.textContent='Ablage';
   pile.setAttribute('data-arrival-committed','1');
 }
}
function showDiscardCardImmediately(card){
 if(!card)return;
 const pile=document.getElementById('play-discard-pile');
 if(!pile)return;
 const current=pile.querySelector('.card');
 const wrap=document.createElement('div');
 wrap.innerHTML=cardHTML({...card,faceUp:true},true,false);
 const fresh=wrap.firstElementChild;
 if(current&&fresh)current.replaceWith(fresh);
 const tip=pile.querySelector('.pile-tip');
 if(tip)tip.textContent='Ablage';
 pile.classList.remove('discard-commit-pop');
 void pile.offsetWidth;
 pile.classList.add('discard-commit-pop');
 setTimeout(()=>pile?.classList.remove('discard-commit-pop'),520);
 const box=pile.closest('.play-pilebox');
 const count=box?.querySelector('.count');
 if(count&&state){
   const n=state.playDiscard?.length||0,buried=state.removedCards?.length||0;
   count.textContent=`${state.playDeck.length} im Stapel · ${n} Ablagekarte${n===1?'':'n'}${buried?` · ${buried} gesperrt darunter`:''}`;
 }
}
function motionSpec(){const level=uiPrefs.motion||'table';if(level==='normal')return {level,flight:285,arc:30,settle:55,swapGap:48,pause:34,flip:235,revealPause:52};if(level==='slow')return {level,flight:455,arc:42,settle:82,swapGap:75,pause:58,flip:305,revealPause:72};return {level:'table',flight:595,arc:56,settle:100,swapGap:92,pause:70,flip:360,revealPause:86}}
function setMotionLevel(level){if(!['normal','slow','table'].includes(level))level='table';uiPrefs.motion=level;saveUIPrefs();showDisplaySettings();toast(level==='normal'?'⚡ Bewegung: schnell':level==='slow'?'🎴 Bewegung: normal':'🃏 Tischmodus · flüssig')}
function rerenderAfterMotion(){if(motionRenderPending||!state)return;motionRenderPending=true;setTimeout(()=>{motionRenderPending=false;if(state)render()},0)}
function unlockMotion(rerender=false){clearTimeout(motionUnlockTimer);motionUnlockTimer=null;const was=motionBusy;motionBusy=false;motionBusyUntil=0;document.body.classList.remove('motion-busy');if(rerender&&was&&!motionQueueBusy)rerenderAfterMotion()}
function lockMotion(ms,label='Kartenbewegung läuft …'){motionBusy=true;const guard=Math.min(6500,Math.max(1800,(Number(ms)||300)+1400));motionBusyUntil=Date.now()+guard;document.body.classList.add('motion-busy');const pill=document.getElementById('motionStatusText');if(pill)pill.textContent=label;clearTimeout(motionUnlockTimer);/* Harte Notentriegelung: niemals wegen einer Browser-Animation dauerhaft sperren. */motionUnlockTimer=setTimeout(()=>unlockMotion(true),guard)}
function motionLocked(show=true){if(motionBusy&&motionBusyUntil&&Date.now()>motionBusyUntil){unlockMotion(true);return false}if(!motionBusy)return false;if(show)toast('🎴 Kartenbewegung läuft noch …');return true}
function motionShouldBlock(e){if(!state||!e)return false;/* Alte Bewegungen dürfen den nächsten Zug nie blockieren. */if(state.phase==='play'&&ui.mode==='turnChoice'&&Number(e.actor)!==Number(state.currentPlayer))return false;return true}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function recentMotionCard(){const list=state?.motionFeed||[],now=Date.now();for(let i=list.length-1;i>=0;i--){const e=list[i];if(!e)continue;if(now-Number(e.ts||0)>7000)break;if(e.type==='swap'||e.type==='drawn-discard'||e.type==='turn'||e.type==='reveal'||e.type==='action-play'||e.type==='action-take'||e.type==='meteor')return null;if((e.type==='draw-deck'||e.type==='take-discard'||e.type==='decision-keep')&&e.card)return e}return null}
function heldCardInfo(){if(!state)return null;const localHeld=(ui.mode==='drawnDecision'||ui.mode==='drawnSwap'||ui.mode==='discardSwap'||ui.mode==='draw3Target')&&ui.data?.card?{card:ui.data.card,actor:state.currentPlayer,type:ui.mode==='discardSwap'?'Ablagekarte':'Gezogene Karte',local:!isAIPlayer(state.currentPlayer),title:isAIPlayer(state.currentPlayer)?`${state.players[state.currentPlayer].name} spielt diese Karte`:''}:null;if(localHeld)return localHeld;const evt=recentMotionCard();if(evt?.card)return {card:evt.card,actor:evt.actor??state.currentPlayer,type:evt.typeLabel||'Live-Karte',local:false,title:evt.title||'',text:evt.text||''};return null}
function handZoneHTML(){const h=heldCardInfo();const actor=h?state.players?.[h.actor]?.name:'';const decision=!!(h?.local&&ui.mode==='drawnDecision');return `<div id="table-hand-zone-anchor" class="real-hand-zone"><div id="table-hand-zone-card" class="real-hand-card ${h?'':'empty'}">${h?cardHTML({...h.card,faceUp:true},true,false):'✦'}</div><div class="real-hand-copy"><span class="eyebrow">${h?escapeHTML(h.type):'Hand-/Entscheidungszone'}</span><b>${h?(h.local?'Karte in deiner Hand':`${escapeHTML(actor)} hat diese Karte`):'Hier landet eine gezogene Karte zuerst'}</b><small>${h?(h.local?(decision?'Eigene Karte antippen: Sie wird zuerst aufgedeckt, dann sauber ausgetauscht. Oder auf die Ablage tippen.':'Diese Karte wird jetzt gespielt.'):escapeHTML(h.text||h.title||'Live vom anderen Spieler.')):'Stapel → Handzone → alte Feldkarte offen zur Ablage → erst danach Handkarte ins Spielfeld.'}</small>${decision?`<div class="direct-swap-hint">☝ Eigene Karte antippen = sofort tauschen</div><div class="real-hand-actions direct-only"><button class="drop big-discard-btn" onclick="Game.discardDrawn()"><span class="big-discard-main">🗑️ KARTE AUF ABLAGE</span><small class="big-discard-sub">wegwerfen & eigene Karte aufdecken</small></button></div>`:''}</div></div>`}
function motionFlightMarkup(e,cardOverride=null){if(e?.actionType&&!cardOverride){const a=ACTIONS[e.actionType];return `<div class="motion-fly action">${a?a.icon:'⚡'}</div>`}const c=cardOverride||e?.card||{type:'number',value:0,faceUp:false};return `<div class="motion-fly">${cardHTML({...c,faceUp:true},true,false)}</div>`}
async function animateRealFlight(fromId,toId,e,cardOverride=null){const from=document.getElementById(fromId),to=document.getElementById(toId);if(!from||!to)return;const spec=motionSpec(),fr=from.getBoundingClientRect(),tr=to.getBoundingClientRect();const wrap=document.createElement('div');wrap.innerHTML=motionFlightMarkup(e,cardOverride);const fly=wrap.firstElementChild;if(!fly)return;document.body.append(fly);const sx=fr.left+fr.width/2,sy=fr.top+fr.height/2,tx=tr.left+tr.width/2,ty=tr.top+tr.height/2,dx=tx-sx,dy=ty-sy;fly.style.left=`${sx}px`;fly.style.top=`${sy}px`;const arc=Math.min(110,Math.max(26,spec.arc+Math.abs(dx)*.035));const scale=Math.max(.76,Math.min(1.08,(tr.width||74)/(fr.width||74)));let anim=null;try{anim=fly.animate([{transform:'translate(-50%,-50%) scale(.88) rotate(-2deg)',opacity:.96},{offset:.48,transform:`translate(calc(-50% + ${dx*.48}px),calc(-50% + ${dy*.48-arc}px)) scale(1.06) rotate(${dx>=0?3:-3}deg)`,opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${scale}) rotate(0deg)`,opacity:1}],{duration:spec.flight,easing:'cubic-bezier(.22,.78,.2,1)',fill:'forwards'});const finished=anim?.finished&&typeof anim.finished.then==='function'?anim.finished.catch(()=>null):sleep(spec.flight);await Promise.race([finished,sleep(spec.flight+350)])}catch(_e){await sleep(Math.min(spec.flight,1400))}finally{try{anim?.cancel?.()}catch(_e){}fly.remove()}if(!document.body.contains(to))return;to.classList.remove('motion-landing');void to.offsetWidth;to.classList.add('motion-landing');setTimeout(()=>to.classList.remove('motion-landing'),500);await sleep(spec.settle)}
function swapLayerMarkup(oldCard,wasFaceUp){const back=cardHTML({type:'number',value:0,faceUp:false},false,false),front=cardHTML({...oldCard,faceUp:true},true,false);return `<div class="swap-reveal-card"><div class="swap-reveal-face back-face">${back}</div><div class="swap-reveal-face front-face">${front}</div></div>`}
async function prepareSwapReveal(e){const target=document.getElementById(e.dstId);if(!target||!e.oldCard)return null;const cardEl=target.querySelector('.card')||target;const r=cardEl.getBoundingClientRect();if(!r.width||!r.height)return null;target.classList.add('swap-target-ghost');const layer=document.createElement('div');layer.className='swap-reveal-layer';layer.style.left=`${r.left+r.width/2}px`;layer.style.top=`${r.top+r.height/2}px`;layer.style.width=`${r.width}px`;layer.style.height=`${r.height}px`;layer.innerHTML=swapLayerMarkup(e.oldCard,!!e.oldWasFaceUp);document.body.append(layer);const inner=layer.querySelector('.swap-reveal-card');if(inner&&e.oldWasFaceUp)inner.style.transform='rotateY(180deg)';const spec=motionSpec();const caption=document.createElement('div');caption.className='swap-reveal-caption';caption.style.left=`${r.left+r.width/2}px`;caption.style.top=`${Math.max(38,r.top-6)}px`;caption.textContent=e.oldWasFaceUp?'Karte wird ausgetauscht':'Karte wird zuerst aufgedeckt';document.body.append(caption);let a=null;try{if(e.oldWasFaceUp){a=inner.animate([{transform:'rotateY(180deg) translateY(0) rotateZ(0deg)'},{offset:.5,transform:'rotateY(180deg) translateY(-7px) rotateZ(-1.5deg)'},{transform:'rotateY(180deg) translateY(0) rotateZ(0deg)'}],{duration:Math.max(300,spec.flip*.72),easing:'ease-in-out',fill:'forwards'});await Promise.race([a.finished.catch(()=>null),sleep(spec.flip+180)])}else{a=inner.animate([{transform:'rotateY(0deg) scale(1)'},{offset:.45,transform:'rotateY(88deg) scale(1.035)'},{transform:'rotateY(180deg) scale(1)'}],{duration:spec.flip,easing:'cubic-bezier(.22,.72,.18,1)',fill:'forwards'});await Promise.race([a.finished.catch(()=>null),sleep(spec.flip+220)]);haptic(7)}await sleep(spec.revealPause)}catch(_e){await sleep(Math.min(spec.flip,700))}finally{try{a?.cancel?.()}catch(_e){}if(inner)inner.style.transform='rotateY(180deg)'}return {target,layer,caption}}
function clearSwapReveal(ctx,arrive=false){if(!ctx)return;try{ctx.layer?.remove()}catch(_e){}try{ctx.caption?.remove()}catch(_e){}if(ctx.target){ctx.target.classList.remove('swap-target-ghost');if(arrive){ctx.target.classList.remove('swap-target-arrive');void ctx.target.offsetWidth;ctx.target.classList.add('swap-target-arrive');setTimeout(()=>ctx.target?.classList.remove('swap-target-arrive'),520)}}}

async function animateCardReveal(targetId,card){
 const target=document.getElementById(targetId);if(!target||!card)return;
 const cardEl=target.querySelector('.card')||target,r=cardEl.getBoundingClientRect();if(!r.width||!r.height)return;
 const spec=motionSpec();target.classList.add('swap-target-ghost');
 const layer=document.createElement('div');layer.className='swap-reveal-layer quick-reveal';layer.style.left=`${r.left+r.width/2}px`;layer.style.top=`${r.top+r.height/2}px`;layer.style.width=`${r.width}px`;layer.style.height=`${r.height}px`;layer.innerHTML=swapLayerMarkup(card,false);document.body.append(layer);
 const inner=layer.querySelector('.swap-reveal-card');let a=null;
 try{
   a=inner.animate([
     {transform:'rotateY(0deg) scale(1)'},
     {offset:.48,transform:'rotateY(86deg) scale(1.025)'},
     {offset:.52,transform:'rotateY(94deg) scale(1.025)'},
     {transform:'rotateY(180deg) scale(1)'}
   ],{duration:spec.flip,easing:'cubic-bezier(.25,.72,.18,1)',fill:'forwards'});
   /* Die Vorderseite ist durch backface-visibility ab ca. 50 % sichtbar. Keine zusätzliche Wartezeit bis zur Zahl. */
   await Promise.race([a.finished.catch(()=>null),sleep(spec.flip+180)]);
   if(inner)inner.style.transform='rotateY(180deg)';
   await sleep(45);
 }catch(_e){if(inner)inner.style.transform='rotateY(180deg)'}
 finally{
   try{a?.cancel?.()}catch(_e){}
   target.classList.remove('swap-target-ghost');
   try{layer.remove()}catch(_e){}
   target.classList.remove('reveal-arrive');void target.offsetWidth;target.classList.add('reveal-arrive');
   setTimeout(()=>target?.classList.remove('reveal-arrive'),420);
 }
}
function queueMotionEvent(type,data={}){if(!state)return null;state.motionFeed=Array.isArray(state.motionFeed)?state.motionFeed:[];const evt={id:uid(),type,actor:(data.actor!==undefined?data.actor:state.currentPlayer)||0,ts:Date.now(),...data};state.motionFeed.push(evt);state.motionFeed=state.motionFeed.slice(-24);state.watch=evt;return evt}
async function playMotionEvent(e){if(!e)return;const spec=motionSpec();let label=e.title||'Kartenbewegung';const block=motionShouldBlock(e);const maybeLock=(ms)=>{if(block)lockMotion(ms,label)};const masksDiscard=e.type==='swap'||e.type==='drawn-discard';motionActiveEvent=e;try{
 if(e.type==='turn'){pulseTarget(`player-${e.actor}`);await sleep(Math.min(260,spec.pause));return}
 if(e.type==='draw-deck'||e.type==='take-discard'){maybeLock(spec.flight+spec.settle+140);await animateRealFlight(e.srcId||'play-deck-pile','table-hand-zone-card',e);return}
 if(e.type==='drawn-discard'){maybeLock(spec.flight+spec.settle+140);await animateRealFlight('table-hand-zone-card','play-discard-pile',e);commitDiscardArrival(e,e.card);return}
 if(e.type==='decision-keep'){maybeLock(Math.min(430,spec.flight*.45));pulseTarget('table-hand-zone-card');await sleep(Math.min(430,spec.flight*.45));return}
 if(e.type==='swap'){
   maybeLock(spec.flip+spec.revealPause+spec.flight*2+spec.swapGap+spec.settle*2+980);
   const revealCtx=await prepareSwapReveal(e);
   try{
     if(e.oldCard){
       if(revealCtx?.layer){
         revealCtx.layer.style.opacity='0';
         revealCtx.layer.style.transition='opacity .12s ease';
         await sleep(90)
       }
       /* PHASE 1: alte Feldkarte fliegt offen auf die Ablage. */
       await animateRealFlight(e.dstId,e.discardId||'play-discard-pile',e,e.oldCard);
       /* PHASE 2: die Ablage ist ab JETZT verbindlich sichtbar.
          discardArrivalPending() darf sie nun auch bei Zwischen-Render/Sync nicht mehr verstecken. */
       commitDiscardArrival(e,e.oldCard);
       haptic(7);
       await sleep(spec.level==='table'?520:spec.level==='slow'?400:300)
     }
     /* PHASE 3: erst jetzt verlässt die Handkarte die Handzone. */
     await animateRealFlight('table-hand-zone-card',e.dstId,e,e.card);
     clearSwapReveal(revealCtx,true);
     return
   }finally{
     clearSwapReveal(revealCtx,false)
   }
 }
 if(e.type==='bury-row'){const cards=Array.isArray(e.cards)?e.cards:[],srcIds=Array.isArray(e.srcIds)?e.srcIds:[];maybeLock(Math.max(700,cards.length*(spec.flight+90)+spec.settle));for(let i=0;i<cards.length;i++){await animateRealFlight(srcIds[i]||`player-${e.actor}`,e.dstId||'play-discard-pile',e,cards[i]);if(i<cards.length-1)await sleep(70)}return}
 if(e.type==='action-take'||e.type==='action-play'||e.type==='meteor'){maybeLock(spec.flight+spec.settle+120);if(e.card||e.actionType)await animateRealFlight(e.srcId||'action-deck-pile',e.dstId||`player-${e.actor}`,e);else{pulseTarget(e.dstId||`player-${e.actor}`);await sleep(Math.min(320,spec.pause+100))}return}
 if(e.type==='reveal'){maybeLock(spec.flip+180);await animateCardReveal(e.dstId||`player-${e.actor}`,e.card);return}
 pulseTarget(e.dstId||`player-${e.actor}`);await sleep(Math.min(300,spec.pause))
 }finally{
   if(motionActiveEvent===e)motionActiveEvent=null;
   if(masksDiscard)rerenderAfterMotion();
   if(e?.id)setTimeout(()=>motionDiscardCommitted.delete(e.id),250)
 }}
async function runMotionQueue(){if(motionQueueBusy||!state)return;const feed=(state.motionFeed||[]).filter(e=>e?.id&&!motionSeen.has(e.id)&&(Number(e.ts||0)>=motionSessionStart-8000||e.id===state.watch?.id));if(!feed.length){if(motionBusy)unlockMotion(true);return}motionQueueBusy=true;try{for(const e of feed){motionSeen.add(e.id);await playMotionEvent(e);await sleep(motionSpec().pause)}}catch(err){console.warn('[motion queue]',err)}finally{motionQueueBusy=false;const more=(state?.motionFeed||[]).some(e=>e?.id&&!motionSeen.has(e.id)&&(Number(e.ts||0)>=motionSessionStart-8000||e.id===state.watch?.id));if(more)setTimeout(runMotionQueue,40);else unlockMotion(true)}}
function haptic(pattern=8){try{if(uiPrefs.haptic&&navigator.vibrate)navigator.vibrate(pattern)}catch(_e){}}
function ensureAudio(){try{if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx?.state==='suspended')audioCtx.resume()}catch(_e){}return audioCtx}
function playFxSound(kind){if(!uiPrefs.sound)return;try{const ctx=ensureAudio();if(!ctx)return;const now=ctx.currentTime;const cfg={turn:[520,.055],draw:[650,.045],action:[740,.06],star:[880,.075],win:[980,.11]}[kind]||[600,.04];const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='win'?'triangle':'sine';o.frequency.setValueAtTime(cfg[0],now);if(kind==='star'||kind==='win')o.frequency.exponentialRampToValueAtTime(cfg[0]*1.35,now+cfg[1]);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(kind==='win'?.10:.055,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+cfg[1]);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+cfg[1]+.02)}catch(_e){}}
function fxFeedback(kind){const p=kind==='win'?[18,45,28]:kind==='star'?[10,30,15]:kind==='action'?14:8;haptic(p);playFxSound(kind)}

function toggleHaptic(){uiPrefs.haptic=!uiPrefs.haptic;saveUIPrefs();if(uiPrefs.haptic)haptic([8,22,8]);showDisplaySettings()}
function toggleCinematic(){uiPrefs.cinematic=!uiPrefs.cinematic;saveUIPrefs();syncBodyMode();showDisplaySettings()}

function migrateState(x){if(!x||x.version!==1)return null;if(!Array.isArray(x.motionFeed))x.motionFeed=[];if(!Array.isArray(x.reactionFeed))x.reactionFeed=[];if(!Array.isArray(x.removedCards))x.removedCards=[];if(!x.dismissedMatches||typeof x.dismissedMatches!=='object'||Array.isArray(x.dismissedMatches))x.dismissedMatches={};if(!Array.isArray(x.setupOrder))x.setupOrder=[];if(!Number.isInteger(x.setupOrderPos))x.setupOrderPos=0;if(!Number.isInteger(x.jokerCount))x.jokerCount=15;if(typeof x.jokerEnabled!=='boolean')x.jokerEnabled=true;if(!x.roundJokerValues||typeof x.roundJokerValues!=='object'||Array.isArray(x.roundJokerValues))x.roundJokerValues={};if(x.turnFlow&&typeof x.turnFlow!=='object')x.turnFlow=null;if(x.roundClose&&typeof x.roundClose!=='object')x.roundClose=null;for(const p of (x.players||[])){if(typeof p.isAI!=='boolean')p.isAI=false;if(!['easy','normal','hard'].includes(p.aiDifficulty))p.aiDifficulty='normal';if(!p.aiKnowledge||typeof p.aiKnowledge!=='object')p.aiKnowledge={};if(!Number.isFinite(p.bankedStarBonus))p.bankedStarBonus=0}/* Offene Reihenentscheidung bleibt Teil des Spielzustands. */if(x.pendingMatch&&x.phase!=='play')x.pendingMatch=null;return x}
function recoverInterruptedMatchDecision(){
 if(!state||state.phase!=='play'||state.pendingMatch)return false;
 const feed=Array.isArray(state.motionFeed)?state.motionFeed:[],latest=feed[feed.length-1];
 if(!latest||Number(latest.actor)!==Number(state.currentPlayer)||!['swap','reveal'].includes(latest.type))return false;
 const pi=state.currentPlayer,fresh=findMatches(pi).filter(m=>!isMatchDismissed(pi,m));

}

function captureTurnFlow(){
 if(!state)return;
 if(state.phase==='play'){
   const mode=PERSIST_FLOW_MODES.has(ui.mode)?ui.mode:'turnChoice';
   state.turnFlow={turnNo:Number(state.turnNo)||0,currentPlayer:Number(state.currentPlayer)||0,mode,data:clone(ui.data||{}),selected:clone(ui.selected||[])};
 }else if(state.phase==='initialReveal'){
   state.turnFlow={turnNo:Number(state.turnNo)||0,currentPlayer:Number(state.currentPlayer)||0,mode:'setupReveal',data:{},selected:[]};
 }else state.turnFlow=null;
}
function validTurnFlow(){

 return f;

function restorePlayUIFromState(){

   const d=state.pendingMatch;
   return {mode:'matchReady',data:{pi:d.pi??state.currentPlayer,cont:d.cont||'finishTurn',matchKeys:Array.isArray(d.matchKeys)?d.matchKeys:[],activeMatchKey:null},selected:[]};
 }
 if(state.phase==='play'){
   const f=validTurnFlow();
   if(f)return {mode:f.mode,data:clone(f.data||{}),selected:clone(f.selected||[])};
   return {mode:'turnChoice',data:{},selected:[]};
 }

 if(state.phase==='roundReveal')return {mode:'roundReveal',data:{stage:state.roundClose?.stage||'reveal'},selected:[]};

 return {mode:'turnChoice',data:{},selected:[]};
}

function findMatchesInPlayer(p){
 const groups=[];
 for(let r=0;r<3;r++){
   const raw=[r*4,r*4+1,r*4+2,r*4+3],idx=raw.filter(i=>p.grid[i]);
   if(idx.length>=3)groups.push({name:`Reihe ${r+1}`,idx})
 }
 for(let c=0;c<4;c++){
   const raw=[c,c+4,c+8],idx=raw.filter(i=>p.grid[i]);
   if(idx.length>=3)groups.push({name:`Spalte ${c+1}`,idx})
 }
 const out=[];
 for(const g of groups){
   const cards=g.idx.map(i=>p.grid[i]);
   if(cards.some(c=>!c.faceUp))continue;
   const nums=[...new Set(cards.filter(c=>c.type==='number').map(c=>c.value))],stars=cards.filter(c=>c.type==='star').length;
   const signature=`${g.name}:${cards.map(c=>c?.id||`${c?.type}:${c?.value}`).join('|')}`;
   if(nums.length===1)out.push({...g,key:signature,optional:true,label:`${g.name}: ${nums[0]}${stars?` + ${stars}★`:''}`});
   else if(nums.length===0&&stars===cards.length)out.push({...g,key:signature,optional:true,pureStars:true,label:`${g.name}: nur Joker`})
 }
 return out
}

function showRules(){modal(`<div class="rules"><h3>Regeln dieser Fan-Umsetzung</h3><p class="note">Eigenständige, nicht offizielle Browser-Umsetzung ohne Originalgrafiken. Die Regeln sind in eigenen Worten zusammengefasst.</p><h4>Ziel</h4><p>Über mehrere Runden möglichst wenige Punkte sammeln. Sobald nach einer Runde mindestens ein Spieler ${state?state.target:100} oder mehr Gesamtpunkte hat, endet das Spiel; der niedrigste Gesamtstand gewinnt.</p><h4>Aufbau</h4><ul><li>Jeder Spieler erhält 12 Spielkarten im 4×3-Raster und deckt 2 beliebige Karten auf.</li><li>Es gibt einen Spielkarten-Nachzieh- und Ablagestapel sowie vier offen ausliegende Aktionskarten, einen Aktions-Nachziehstapel und eine Aktions-Ablage.</li><li>In Runde 1 beginnt, wer mit den zwei Startkarten die höchste Summe hat; bei Gleichstand entscheidet diese digitale Fassung zufällig. Ab Runde 2 beginnt der Spieler, der die vorherige Runde beendet hat.</li></ul><h4>Ein Zug – genau eine Hauptaktion</h4><ul><li><b>Spielkarte ziehen:</b> Ablagekarte muss sofort getauscht werden. Vom verdeckten Stapel darfst du die Karte ansehen, tauschen oder ablegen; beim Ablegen musst du eine eigene verdeckte Karte aufdecken.</li><li><b>Aktionskarte ziehen:</b> offen aus der Vierer-Auslage oder verdeckt vom Stapel. Sie darf frühestens im nächsten eigenen Zug gespielt werden.</li><li><b>Aktionskarte spielen/ablegen:</b> ihr Effekt ersetzt den normalen Zug. Unbenutzte Aktionskarten zählen am Rundenende je +10.</li></ul><h4>Sterne</h4><ul><li>Ein neu aufgedeckter bzw. passend platzierter Stern gibt einmalig sofort eine Aktionskarte. Auch ein offen vom Ablagestapel genommener Stern löst dies aus.</li><li>Sterne/Joker haben während des Spiels den Grundwert 0. Bei der Rundenabrechnung übernimmt jeder verbliebene Joker automatisch die niedrigste Zahl, die in seiner waagerechten Reihe oder senkrechten Spalte noch liegt. Beispiel: −2 und 3 in derselben Linie → der Joker zählt −2. Gibt es dort keine Zahl, bleibt er 0.</li><li>Reine Stern-Gruppen dürfen entfernt werden, müssen aber nicht. Eine vollständige 3er-Sterngruppe bringt −10, eine waagerechte 4er-Sterngruppe −15. Wird sie vorher freiwillig abgeräumt, bleibt dieser Bonus gespeichert; jeder Stern zählt nur einmal für einen Bonus.</li></ul><h4>Gleiche Reihen</h4><p class="note"><b>Online-Schutz:</b> Solange die einmalige Ja/Nein-Entscheidung zu einer neuen Reihe offen ist, ist der normale Zug gesperrt. Ein Cloud-Sync kann dadurch keinen zweiten Zug mehr freigeben.</p><p>Komplette senkrechte oder waagerechte Reihen mit mindestens 3 noch vorhandenen Karten aus derselben Zahl werden direkt am Spielfeld markiert. Über „Reihe entfernen“ bzw. „Spalte entfernen“ räumst du sie freiwillig ab – auch Minuszahlen. Dadurch kann nach dem Entfernen einer ganzen Spalte auch eine waagerechte 3er-Reihe entstehen. Das Entfernen jeder vollständigen Kombination ist freiwillig. Beim ersten Entstehen erscheint einmal die Frage „Möchtest du diese Reihe jetzt entfernen?“. Mit Ja wird sie entfernt. Mit Nein bleibt sie liegen; für genau diese Kombination wird nicht erneut gefragt. Der Entfernen-Button bleibt trotzdem jederzeit verfügbar. Die abgeräumten Karten liegen gesperrt unter der Ablage und können nicht gezogen oder später neu eingemischt werden. Die normale oberste Ablagekarte bleibt ziehbar.</p><h4>Rundenende</h4><p>Sobald ein Spieler die letzte verdeckte Karte bei sich oder einem Mitspieler aufdeckt, erhält <b>genau der nächste Spieler</b> noch einen letzten Zug. Ab dann dürfen Aktionskarten nicht mehr gespielt oder freiwillig abgelegt werden. Danach werden alle noch verdeckten Karten langsam nacheinander aufgedeckt. Anschließend werden alle jetzt vollständigen gleichen Reihen und Spalten automatisch abgeräumt; erst danach beginnt die Punktewertung. Der Spieler, der die Runde beendet hat, beginnt die nächste Runde und deckt dort auch zuerst seine Startkarten auf.</p><p>Hat der Rundenbeender nicht allein den niedrigsten Rundenwert, wird sein positiver Rundenwert verdoppelt. Bei 0 oder negativen Rundenpunkten gibt es keine Verdopplung.</p><h4>Aktionskarten</h4><ul>${Object.values(ACTIONS).map(a=>`<li><b>${a.icon} ${a.name}:</b> ${a.desc}</li>`).join('')}</ul><h4>Varianten aus der Anleitung</h4><p class="note">Diese vier Varianten sind hier als Regelreferenz enthalten; die automatische Spiellogik der Datei nutzt den vollständigen Standardmodus für 2–8 Spieler.</p><ul><li><b>Ein Kartendeck:</b> 5–10 Aktionskarten werden ins Spielkartendeck gemischt; beim Ziehen/Aufdecken darf man sie behalten oder ablegen und zieht danach noch eine Spielkarte (2–6 Spieler).</li><li><b>Zahlen + Sterne:</b> ohne Aktionskarten (2–6 Spieler).</li><li><b>Nur Zahlen:</b> ohne Sterne und Aktionskarten (2–4 Spieler).</li><li><b>Große Runde:</b> bis zu 10 Spieler mit 9 Karten im 3×3-Raster; zu Beginn wird nur 1 Karte aufgedeckt.</li></ul><p class="note"><b>Meteoritenschauer:</b> Die gedruckte Regel nennt als entfernbares Ziel Zahlen-, Stern- oder Aktionskarten. Wird hier eine Aktionskarte getroffen, legt die digitale Fassung die gezogene Ersatz-Spielkarte als offene Zusatzkarte neben das Raster; sie zählt bei der Wertung und kann später wie eine Spielkarte getauscht werden.</p><p class="note"><b>Diese digitale Version:</b> Die Anzahl der Joker-/Sternkarten ist im Startmenü von 0–30 einstellbar. „Joker-Spezialeffekte AUS“ lässt Sterne weiterhin als echte Joker/Wildcards funktionieren; während des Spiels ist ihr Grundwert 0, bei der Endabrechnung gilt weiterhin die beste Zahl aus Reihe/Spalte. Auch der Jokerbonus bleibt aktiv: 3 Sterne = −10 Punkte, 4 waagerechte Sterne = −15 Punkte. Deaktiviert werden nur die Aktionskarten und die Gratis-Aktionskarte beim Aufdecken eines Sterns.</p><p class="note"><b>Blanko-Ideenkarten:</b> Die Packung enthält Karten für eigene Hausregeln. Da sie keinen festen Effekt besitzen, sind sie nicht Teil des automatisierten Regelsets.</p></div>`)}

function aiTargets(pi,candidate){const p=state.players[pi],diff=aiDifficulty(pi),candVal=aiCandidateValue(candidate),out=[],end=aiEndgameProfile(pi);for(let i=0;i<p.grid.length;i++){const old=p.grid[i];if(!old)continue;const hidden=!old.faceUp,oldVal=aiSlotExpectedValue(pi,old,[candidate]),lineDelta=aiLineDelta(pi,i,old,candidate);let score=(oldVal-candVal)+lineDelta+aiNoise(diff);if(hidden){const known=!!aiHiddenKnowledgeCard(pi,old);score+=candVal<=0?1.4:candVal<=3?.8:candVal<=5?.25:0;if(known)score+=.35;if(diff==='hard'){if(end.ahead&&(end.ownHidden<=3||end.pressure))score+=1.0;if(end.behind&&end.ownHidden<=2)score-=1.1}}else{const same=aiSameCardValue(old,candidate),numericGain=cardPoints(old)-candVal;if(same)score-=9;if(cardPoints(old)<0)score-=6;else if(cardPoints(old)===0&&candVal>=0&&lineDelta<3.5)score-=4.8;else if(numericGain<=0&&lineDelta<1.3)score-=3.2;if(lineDelta>=5)score+=2.3}if(candidate?.type==='star')score+=hidden?2.7:1.6;out.push({zone:'grid',idx:i,score,old,lineDelta,hidden})}for(let i=0;i<p.extras.length;i++){const old=p.extras[i];if(!old)continue;const hidden=!old.faceUp,oldVal=aiSlotExpectedValue(pi,old,[candidate]);let score=oldVal-candVal+aiNoise(diff);if(hidden)score+=candVal<=1?1.0:.25;else{if(aiSameCardValue(old,candidate))score-=9;if(cardPoints(old)<0)score-=6;if(cardPoints(old)-candVal<=0)score-=3}out.push({zone:'extra',idx:i,score,old,lineDelta:0,hidden})}return out.sort((a,b)=>b.score-a.score)}

function aiRevealPositionScore(pi,zone,idx){const p=state.players[pi],arr=zone==='grid'?p.grid:p.extras,c=arr[idx];if(!c||c.faceUp)return-999;let score=.4;if(zone==='extra')return score;const known=aiHiddenKnowledgeCard(pi,c);if(known){const v=aiCandidateValue(known);score+=v>=8?2.4:v>=5?1.4:v<=0?-.8:.3}for(const ids of aiLineIndexesFor(idx)){const others=ids.filter(i=>i!==idx).map(i=>p.grid[i]).filter(Boolean);const vis=others.filter(x=>x.faceUp),stars=vis.filter(x=>x.type==='star').length,freq={};for(const x of vis)if(x.type==='number')freq[x.value]=(freq[x.value]||0)+1;const best=Math.max(0,...Object.values(freq));if(best+stars>=2)score+=2.2;else if(best+stars===1)score+=.5}const end=aiEndgameProfile(pi);if(end.ahead&&end.pressure)score+=.6;if(end.behind&&end.ownHidden<=2)score-=.7;return score}

function aiNextPlayerAfter(pi){
 if(!state||!state.players?.length)return -1;
 if(state.extraTurns>0)return pi;
 if(state.roundEnder!==null&&Array.isArray(state.finalTurnQueue)&&state.finalTurnQueue.length)return state.finalTurnQueue[0];

function aiPublicLineCompletionThreat(observerPi,oppPi,idx,candidate){
 const p=state.players[oppPi];
 if(!p||idx<0||idx>11||!candidate)return {score:0,complete:false,label:''};
 let best={score:0,complete:false,label:''};
 const lines=aiLineIndexesFor(idx);
 for(const ids of lines){
   const cards=ids.map(i=>i===idx?{...candidate,faceUp:true}:p.grid[i]).filter(Boolean);
   if(cards.length<3||cards.some(c=>!c.faceUp))continue;
   const nums=cards.filter(c=>c.type==='number');
   const stars=cards.filter(c=>c.type==='star').length;
   const values=[...new Set(nums.map(c=>Number(c.value)))];
   let complete=false,pureStars=false;
   if(values.length===1&&nums.length+stars===cards.length)complete=true;
   else if(values.length===0&&stars===cards.length){complete=true;pureStars=true}
   if(!complete)continue;
   const positiveRemoved=cards.reduce((s,c)=>s+Math.max(0,cardPoints(c)),0);
   const negativeKept=Math.abs(cards.reduce((s,c)=>s+Math.min(0,cardPoints(c)),0));
   /* Positive Zahlenreihen sind besonders gefährlich: Gegner kann viele Punkte sofort loswerden.
      Reine Jokergruppen sind ebenfalls wertvoll, werden aber etwas niedriger gewichtet,
      da sie je nach Spielsituation lieber für den Jokerbonus liegen bleiben können. */
   let score=pureStars?(cards.length===4?11:8.5):(8+positiveRemoved*.72+cards.length*.55);
   if(negativeKept>0&&!pureStars)score-=negativeKept*.55;
   const kind=ids.length===4?'Reihe':'Spalte';

   if(score>best.score)best={score,complete:true,label:`${kind} ${value}`};

 return best
}
function aiOpponentCardOpportunity(observerPi,oppPi,candidate){
 const p=state.players[oppPi];
 if(!p||oppPi===observerPi||!candidate)return {score:0,direct:0,target:null,label:''};
 const candVal=aiCandidateValue(candidate);
 let best={score:0,direct:0,target:null,label:''};
 for(let idx=0;idx<p.grid.length;idx++){
   const old=p.grid[idx];
   if(!old)continue;
   const completion=aiPublicLineCompletionThreat(observerPi,oppPi,idx,candidate);
   let numericGain=0;
   if(old.faceUp)numericGain=Math.max(0,cardPoints(old)-candVal);
   else{
     /* Keine verdeckte Gegnerkarte ausspähen: nur statistischen Erwartungswert benutzen. */
     const expected=aiExpectedUnknown(observerPi,[candidate]);
     numericGain=Math.max(0,expected-candVal)*.55
   }
   /* Bereits sichtbares Reihenpotenzial ist öffentlich und darf strategisch berücksichtigt werden. */
   let publicPotential=0;
   for(const ids of aiLineIndexesFor(idx)){
     const others=ids.filter(i=>i!==idx).map(i=>p.grid[i]).filter(Boolean).filter(c=>c.faceUp);
     const stars=others.filter(c=>c.type==='star').length;
     const freq={};
     for(const c of others)if(c.type==='number')freq[c.value]=(freq[c.value]||0)+1;
     const matching=Math.max(0,...Object.values(freq))+stars;
     if(matching>=2)publicPotential+=candidate.type==='star'?2.6:1.0;
     else if(matching===1)publicPotential+=.25
   }
   const score=completion.score+numericGain*.72+publicPotential;
   if(score>best.score)best={
     score,
     direct:completion.complete?completion.score:0,
     target:{zone:'grid',idx},
     label:completion.label||''
   }
 }
 /* Zusatzkarten können zwar günstig getauscht werden, erzeugen aber keine Rasterreihe. */
 for(let idx=0;idx<(p.extras||[]).length;idx++){
   const old=p.extras[idx];
   if(!old)continue;
   const numericGain=old.faceUp?Math.max(0,cardPoints(old)-candVal):Math.max(0,aiExpectedUnknown(observerPi,[candidate])-candVal)*.45;
   const score=numericGain*.6;
   if(score>best.score)best={score,direct:0,target:{zone:'extra',idx},label:''}

}
function aiOpponentDiscardThreat(aiPi,candidate){
 if(!state||!candidate)return {score:0,direct:0,opponent:-1,label:''};

 let best={score:0,direct:0,opponent:-1,label:''};
 for(let oi=0;oi<state.players.length;oi++){
   if(oi===aiPi)continue;
   const chance=aiOpponentCardOpportunity(aiPi,oi,candidate);
   /* Der direkt folgende Spieler hat das Erstzugriffsrecht auf die Ablage.
      Weitere Gegner werden nur schwach berücksichtigt, falls die Karte liegen bleibt. */
   const weight=oi===next?1:(state.players.length===2?0:.24);

}
function aiExpectedOutgoingDiscardThreat(pi,target){

 if(old.faceUp)return aiOpponentDiscardThreat(pi,old).score;
 const known=aiHiddenKnowledgeCard(pi,old);
 if(known)return aiOpponentDiscardThreat(pi,{...known,faceUp:true}).score;
 /* Bei einer unbekannten eigenen verdeckten Karte kennt auch die KI deren Wert nicht.
    Deshalb wird der erwartete Gefahrenwert über die Restverteilung berechnet. */

   return {keep:!!target&&baseKeep>=threshold,threat,keepUtility:baseKeep,dropUtility:aiDiscardRevealUtility(pi),reason:''}
 }

   /* Normal erkennt vor allem offensichtliche sofortige Dreier-/Viererreihen. */

   return {
     keep:!!target&&(baseKeep>=threshold||defensive),
     threat,keepUtility:baseKeep-outgoing*.28,dropUtility:reveal-threat.score*.42,
     reason:defensive?'verhindert eine direkte Gegnerreihe':''

   strategicallyNecessary ||

   keep,threat,outgoing,keepUtility,dropUtility,
   reason:strategicallyNecessary?(threat.label?`blockiert ${threat.label}`:'blockiert eine fertige Gegnerkombination'):(keepUtility>dropUtility?'vermeidet eine starke Ablagevorlage':'')

function playerHTML(p,pi){const active=pi===state.currentPlayer;const mine=cloud.enabled&&pi===myPlayerIndex();const matches=(state.phase==='play')?findMatches(pi):[];const matchSet=new Set(matches.flatMap(m=>m.idx));const canResolve=state.phase==='play'&&pi===state.currentPlayer&&!p.isAI&&['turnChoice','matchReady'].includes(ui.mode)&&(!cloud.enabled||isMyActorDevice())&&!motionBusy;const cards=p.grid.map((c,i)=>`<div id="cell-${pi}-grid-${i}" class="card-slot ${matchSet.has(i)?'match-ready-slot':''}" onclick="Game.selectCard(${pi},'grid',${i})">${cardHTML(c,false,boardCardClickable(pi,'grid',i),isSelected(pi,'grid',i))}</div>`).join('');const extras=p.extras.map((c,i)=>`<div id="cell-${pi}-extra-${i}" class="card-slot" onclick="Game.selectCard(${pi},'extra',${i})">${cardHTML(c,false,boardCardClickable(pi,'extra',i),isSelected(pi,'extra',i))}</div>`).join('');const acts=p.actions.map((a,i)=>`<div onclick="Game.selectActionCard(${pi},${i})">${actionHTML(a,(ui.mode==='chooseActionTurn'&&pi===state.currentPlayer)||(ui.mode==='meteorSelect'&&pi===ui.data.target),false)}</div>`).join('');const total=Math.max(1,12+p.extras.length),hidden=totalHidden(p),pct=Math.max(0,Math.min(100,Math.round(((total-hidden)/total)*100)));const openCards=[...(p.grid||[]),...(p.extras||[])].filter(c=>c&&c.faceUp);const openSum=openCards.reduce((s,c)=>s+cardPoints(c),0);const hue=[43,188,145,282,18,215,325,92][pi%8];const matchActions=matches.length?`<div class="match-actions"><div class="match-actions-title">✨ Fertige Kombination · Entfernen jederzeit möglich</div>${matches.map((m,i)=>`<button class="match-resolve-btn optional ${canResolve?'':'disabled'}" ${canResolve?`onclick="Game.resolveBoardMatch(${pi},${i})"`:'disabled'}>${m.name.startsWith('Reihe')?'Reihe entfernen':'Spalte entfernen'} · ${escapeHTML(m.label.replace(/^.*?:\s*/,''))}</button>`).join('')}</div>`:'';return `<section id="player-${pi}" data-player="${pi}" class="player ${active?'active':''} ${mine?'mine':''} ${p.isAI?'ai-player':''}" style="--player-hue:${hue}">${active?`<div class="active-turn-banner"><span>${p.isAI?'🤖':'🎯'}</span><b>${mine?'DEIN ZUG':p.isAI?'COMPUTER AM ZUG':'JETZT AM ZUG'}</b></div>`:''}<div class="player-head"><div class="player-title"><div class="avatar">${pi+1}</div><div class="player-meta"><div class="player-name">${escapeHTML(p.name)} ${p.isAI?'<span class="ai-tag">🤖 COMPUTER</span>':''} ${mine?'<span class="you-tag">DU</span>':''} ${active?'<span class="active-tag">🎯 AM ZUG</span>':''}</div><div class="hint player-meta-chips"><span class="meta-chip hidden-chip">▦ ${hidden} verdeckt</span>${jokerSpecialsEnabled()?`<span class="meta-chip action-chip">⚡ ${p.actions.length} Aktionen</span>`:''}<span class="meta-chip open-chip">Σ ${openSum>=0?'+':''}${openSum} offen</span></div><div class="reveal-meter"><i style="width:${pct}%"></i></div></div></div><div class="score-stack"><div class="scorechip"><small>GESAMT</small><b>${p.total}</b></div><div class="progress-chip">${pct}%</div></div></div><div class="gridwrap"><div class="grid">${cards}</div>${p.extras.length?`<div class="extras"><h5>Zusatzkarten</h5><div class="extra-row">${extras}</div></div>`:''}</div>${matchActions}${jokerSpecialsEnabled()&&p.actions.length?`<div class="actions-owned action-only-ui"><div class="owned-title">⚡ Eigene Aktionskarten</div>${acts}</div>`:''}</section>`}
function instructionText(){if(!state)return'';const p=current();if(isAIActor()&&!aiActing){const ap=state.players[actorIndex()]||p;return `🤖 ${escapeHTML(ap.name)} überlegt …`;}if(cloud.enabled&&!isMyActorDevice()){const ai=actorIndex(),n=state.players[ai]?.name||'Mitspieler';return `Warte auf ${escapeHTML(n)} …`}switch(ui.mode){case'setupReveal':return `${state.players[state.setupPlayer].name}: ${2-state.setupRevealed} Startkarte(n) aufdecken`;case'turnChoice':return jokerSpecialsEnabled()?`${p.name}: Stapel, Ablage oder Aktionskarte direkt antippen`:`${p.name}: Nachziehstapel oder Ablage antippen`;case'drawnDecision':return `Gezogene Karte: Zielfeld antippen → alte Karte aufdecken → offen auf Ablage → danach Handkarte ins Feld`;case'matchReady':return `✨ Neue Kombination – einmal entscheiden. Danach bleibt sie ohne weitere Nachfrage liegen`;case'roundReveal':{const st=ui.data?.stage||state.roundClose?.stage;if(st==='remove')return `✨ Rundenende: Kombinationen werden mit Joker-Endwerten geprüft …`;if(st==='ready')return `📊 Alle Karten offen – Punktewertung startet gleich …`;const i=ui.data?.index||state.roundClose?.revealIndex||0,t=ui.data?.total||state.roundClose?.revealOrder?.length||0;return `🔄 Rundenende: verdeckte Karten werden nacheinander aufgedeckt${t?` · ${i}/${t}`:''}`;}case'scoreSequence':return `📊 Score Show: Punkte werden langsam Karte für Karte addiert …`;case'discardSwap':return `${p.name}: Zielfeld wählen – Ablagekarte wird sichtbar eingetauscht`;case'drawnSwap':return `${p.name}: Zielfeld wählen – Karte fliegt dorthin, alte Karte zur Ablage`;case'flipOwn':return `${p.name}: Eine verdeckte eigene Karte aufdecken`;case'chooseActionTurn':return `${p.name}: Aktionskarte wählen`;case'ownSwapSelect':return `${p.name}: Zwei eigene Karten wählen`;case'otherSwapSelect':return `Je eine Karte bei den zwei gewählten Spielern wählen`;case'meteorSelect':return `☄️ Karte bei ${state.players[ui.data.target].name} wählen`;case'draw3Target':return `${p.name}: Zielkarte für die gewählte Karte bestimmen`;case'scoringResolve':return `Rundenwertung wird aufgelöst`;default:return `${p.name}`}}
function bottomButtons(){if(!state||state.phase==='gameOver')return'';if(isAIActor()&&!aiActing)return '<span class="ai-thinking">Computer denkt <span class="ai-dots"><i></i><i></i><i></i></span></span>';if(motionBusy)return '<span class="turn-state-pill">🎴 Kartenbewegung …</span>';if(cloud.enabled&&!isMyActorDevice())return '<div class="waiting-note">Nicht dein Zug – Spiel wird automatisch synchronisiert.</div>';if(ui.mode==='turnChoice'){const dp=discardArrivalPending(),db=`<button ${dp?'disabled title="Karte landet noch"':'onclick="Game.drawFromDiscard()"'}>🂠 ${dp?'landet …':'Ablage'}</button>`;return jokerSpecialsEnabled()?`<button onclick="Game.drawFromDeck()">🎴 Ziehstapel</button>${db}<button class="primary" onclick="Game.chooseActionTurn()">⚡ Eigene Aktion</button><button onclick="Game.takeActionBlind(false)">⚡ Verdeckt</button>`:`<button onclick="Game.drawFromDeck()">🎴 Ziehstapel</button>${db}`;}if(ui.mode==='drawnDecision')return `<span class="turn-state-pill mine">☝ Zielfeld antippen: erst aufdecken, dann tauschen · 🗑 Ablage = wegwerfen</span>`;if(ui.mode==='matchReady')return `<span class="turn-state-pill mine">✨ Bitte Ja oder Nein wählen</span>`;if(ui.mode==='roundReveal')return `<span class="turn-state-pill mine">🔄 Rundenabschluss läuft automatisch</span>`;if(ui.mode==='chooseActionTurn')return `<button onclick="Game.cancelActionChoice()">↩ Zurück</button>`;return''}
const emojiReactionSeen=new Set();
const EMOJI_REACTIONS=['👍','😂','🤣','😮','😭','😡','👏','🔥','❤️','🤔'];
function reactionActorIndex(){
 if(!state?.players?.length)return 0;
 if(cloud.enabled){const me=myPlayerIndex();return me>=0?me:state.currentPlayer}
 if(state.players.some(p=>p.isAI)){const human=state.players.findIndex(p=>!p.isAI);return human>=0?human:state.currentPlayer}
 return state.currentPlayer
}
function emojiReactionBarHTML(){
 if(!state)return '';
 return `<div class="emoji-reaction-bar"><span class="emoji-bar-label">REAKTION</span><div class="emoji-reaction-list">${EMOJI_REACTIONS.map(e=>`<button type="button" class="emoji-reaction-btn" onclick="Game.sendEmojiReaction('${e}')" aria-label="${e} senden">${e}</button>`).join('')}</div></div>`
}
function sendEmojiReaction(emoji){
 if(!state||!EMOJI_REACTIONS.includes(emoji))return;
 const actor=reactionActorIndex();
 if(actor<0||actor>=state.players.length)return;
 if(!Array.isArray(state.reactionFeed))state.reactionFeed=[];
 const r={id:uid(),actor,emoji,ts:Date.now()};
 state.reactionFeed.push(r);
 if(state.reactionFeed.length>24)state.reactionFeed=state.reactionFeed.slice(-24);
 save();
 showEmojiReaction(r)
}
function showEmojiReaction(r){
 if(!r?.id||emojiReactionSeen.has(r.id))return;
 emojiReactionSeen.add(r.id);
 if(emojiReactionSeen.size>120){const first=emojiReactionSeen.values().next().value;emojiReactionSeen.delete(first)}
 const fx=document.createElement('div');
 fx.className='emoji-reaction-fx global';
 fx.textContent=r.emoji;
 /* Reaktion bewusst direkt an body hängen: immer exakt Bildschirmmitte, unabhängig vom Spielerfeld. */
 document.body.appendChild(fx)
 haptic(7);
 setTimeout(()=>fx.classList.add('show'),20);
 setTimeout(()=>fx.classList.add('leave'),1250);
 setTimeout(()=>fx.remove(),1850)
}
function runEmojiReactions(){
 const list=state?.reactionFeed||[],now=Date.now();
 for(const r of list){
   if(!r?.id||emojiReactionSeen.has(r.id))continue;
   if(now-Number(r.ts||0)>9000){emojiReactionSeen.add(r.id);continue}
   showEmojiReaction(r)
 }
}
function gameView(){
 const discardView=visualDiscardState(),topDiscard=discardView.top,discardCount=discardView.count,discardPending=discardView.pending,specials=jokerSpecialsEnabled(),buriedCount=state.removedCards?.length||0;
 const canDirect=ui.mode==='turnChoice'&&(!cloud.enabled||isMyActorDevice())&&!motionBusy;
 const canDropHeld=ui.mode==='drawnDecision'&&ui.data?.card&&(!cloud.enabled||isMyActorDevice())&&!motionBusy&&!discardPending&&!isAIActor();
 const mp=cloud.enabled?`<div class="multiplayer-bar"><b>☁ Raum ${escapeHTML(cloud.room)} · ${escapeHTML(cloud.myName||'Spieler')}</b><span class="turn-state-pill ${isMyActorDevice()?'mine':''}">${isMyActorDevice()?'🟢 Dein Zug':'⏳ Warten'}</span></div>`:'';
 const deckClick=canDirect?'onclick="Game.drawFromDeck()" role="button" tabindex="0"':'';
 const discardTakeClick=canDirect&&topDiscard&&!discardPending?'onclick="Game.drawFromDiscard()" role="button" tabindex="0"':'';
 const discardDropClick=canDropHeld?'onclick="Game.discardDrawn()" role="button" tabindex="0" title="Gezogene Karte hier ablegen"':'';
 const discardClick=discardDropClick||discardTakeClick;
 const discardClass=canDropHeld?'discard-drop-target enabled':(discardTakeClick?'enabled':'');
 const discardTip=discardPending?'landet …':(canDropHeld?'🗑 HIER ABLEGEN':(discardTakeClick?'Nehmen':'Ablage'));
 const playArea=`<div class="pile-row premium-piles"><div class="pile-unit"><span class="pile-overline">NACHZIEHEN</span><div id="play-deck-pile" class="pile-card-hit ${canDirect?'enabled':''}" ${deckClick}><span class="pile-count-chip">${state.playDeck.length}</span>${cardHTML({type:'number',value:0,faceUp:false},false,canDirect)}<span class="pile-tip">${canDirect?'Ziehen':'Nachziehstapel'}</span></div></div><div class="pile-unit"><span class="pile-overline">ABLAGE</span><div id="play-discard-pile" class="pile-card-hit ${discardClass} ${buriedCount?'has-buried':''}" ${discardClick} data-buried="${buriedCount}"><span class="pile-count-chip discard-count">${discardCount}</span>${cardHTML(topDiscard,true,!!discardClick)}${buriedCount?`<span class="buried-mini">${buriedCount} gesperrt darunter</span>`:''}<span class="pile-tip">${discardTip}</span></div></div></div>`;
 const actionArea=specials?`<div class="pilebox action-pilebox action-only-ui"><div class="section-heading"><span class="section-icon">⚡</span><div><h4>Aktionskarten</h4><small>Offen oder verdeckt antippen</small></div></div><div class="market">${actionBlindStackHTML(canDirect)}${state.market.map((a,i)=>a?`<div id="market-${i}" class="market-hit ${canDirect?'enabled':''}" ${canDirect?`onclick="Game.takeActionMarket(${i},false)" role="button" tabindex="0"`:''}>${actionHTML(a,canDirect)}</div>`:'').join('')}</div><div class="count">Aktionsstapel ${state.actionDeck.length} · Ablage ${state.actionDiscard.length}</div></div>`:'';
 const centerTable=`<section class="panel center-table ${specials?'':'specials-off'}"><div class="handbox">${handZoneHTML()}</div><div class="watchbox">${watchPanelHTML()}</div><div class="pilebox play-pilebox"><div class="section-heading"><span class="section-icon">🎴</span><div><h4>Spielkarten</h4><small>Direkt antippen</small></div></div>${playArea}<div class="count">${state.playDeck.length} im Stapel · ${discardCount} ziehbare Ablagekarte${discardCount===1?'':'n'}${buriedCount?` · ${buriedCount} gesperrt darunter`:''}${discardPending?' · Karte unterwegs':''}</div></div>${actionArea}</section>`;
 const playersHTML=state.players.map(playerHTML);
 const boards=state.players.length===2?`<div class="table-area two-player-layout"><div class="board-col left">${playersHTML[0]||''}</div>${centerTable}<div class="board-col right">${playersHTML[1]||''}</div></div>`:`<div class="table-area">${centerTable}<div class="players players-${state.players.length}">${playersHTML.join('')}</div></div>`;
 const closing=state.phase==='roundReveal'?`<div class="round-close-banner ${escapeHTML(state.roundClose?.stage||'reveal')}"><span>${state.roundClose?.stage==='remove'?'✨':state.roundClose?.stage==='ready'?'📊':'🔄'}</span><div><b>${state.roundClose?.stage==='remove'?'Kombinationen werden punkteschonend geprüft':state.roundClose?.stage==='ready'?'Aufdecken abgeschlossen':'Rundenende · alle Karten werden aufgedeckt'}</b><small>${state.roundClose?.stage==='remove'?`${state.roundClose?.removedGroups||0} entfernt · ${state.roundClose?.keptBetterGroups||0} bewusst behalten`:state.roundClose?.stage==='ready'?'Punktewertung startet gleich':`${state.roundClose?.revealIndex||0}/${state.roundClose?.revealOrder?.length||0} verdeckte Karten`}</small></div></div>`:'';
 return `${mp}${closing}<div class="status premium-status"><div class="stat round-stat" data-icon="◷"><b>${state.round}</b><span>Runde</span></div><div class="stat turn-stat" data-icon="●"><b>${escapeHTML(current().name)}</b><span>${['roundReveal','scoring','scoringSequence'].includes(state.phase)?'Rundenende':'am Zug'}</span></div><div class="stat deck-stat" data-icon="▤"><b>${state.playDeck.length}</b><span>Nachziehstapel</span></div><div class="stat target-stat" data-icon="◎"><b>${state.target}</b><span>Spielende ab</span></div><div class="stat joker-stat" data-icon="★"><b>${state.jokerCount??15} · ${specials?'AN':'AUS'}</b><span>Joker · Spezialeffekt</span></div></div>${boards}<div class="bottom-actions"><div class="bottom-inner"><div class="instruction">${instructionText()}</div><div class="action-buttons">${bottomButtons()}</div>${emojiReactionBarHTML()}</div></div><div class="motion-status-pill"><i></i><span id="motionStatusText">Kartenbewegung läuft …</span></div>`}

function resumeTransientFlow(){
 if(!state||isModalOpen())return;
 if(ui.mode==='matchReady'){setTimeout(maybeShowMatchPrompt,40);return}
 if(!canControlFlow())return;
 if(ui.mode==='draw3Choose'){setTimeout(showDraw3Modal,40);return}
 if(ui.mode==='enlightSelect'){if(ui.data?.viewed){const pi=Number(ui.data.pi),code=ui.data.code,p=state.players[pi],cards=lineIndexes(code).map(i=>p.grid[i]).filter(Boolean);modal(`<h3>Nur ${escapeHTML(current().name)} schauen</h3><p>${escapeHTML(p.name)} · ${code[0]==='r'?'Reihe':'Spalte'} ${Number(code.slice(1))+1}</p><div class="pile-row">${cards.map(c=>cardHTML(c,true,false)).join('')}</div><div class="modal-actions"><button class="primary" onclick="Game.finishEnlightenment()">Fertig</button></div>`,false)}else setTimeout(showEnlightenmentSetupModal,40);return}
 if(ui.mode==='reactivate'){setTimeout(showReactivationModal,40);return}
 if(ui.mode==='otherSwapSetup'){setTimeout(showOtherSwapSetupModal,40);return}
 if(ui.mode==='thiefSelect'){setTimeout(showThiefModal,40);return}
 if(ui.mode==='ownSwapSelect'&&ui.selected?.length===2){setTimeout(ownSwapOrientation,40);return}
 if(ui.mode==='otherSwapSelect'&&ui.selected?.length===2){setTimeout(otherSwapOrientation,40);return}
 if(ui.mode==='starChoice'){setTimeout(showStarChoice,40);return}
}
function render(){if(state?.phase!=='scoringSequence')document.querySelector('.score-sequence-overlay')?.remove();if(state?.phase==='play'&&!state.pendingMatch&&ui.mode==='turnChoice')recoverInterruptedMatchDecision();if(state?.phase==='play'&&state.pendingMatch&&ui.mode!=='matchReady'){
 const d=state.pendingMatch;
 ui={mode:'matchReady',data:{pi:d.pi??state.currentPlayer,cont:d.cont||'finishTurn',matchKeys:Array.isArray(d.matchKeys)?d.matchKeys:[],activeMatchKey:null},selected:[]};
}
if(motionBusy&&state?.phase==='play'&&ui.mode==='turnChoice'){const latest=state?.motionFeed?.[state.motionFeed.length-1];if(!latest||Number(latest.actor)!==Number(state.currentPlayer))unlockMotion(false)}const app=$('#app');let content;if(cloud.enabled&&isRoomDoc(cloud.doc)&&!cloud.doc.game)content=lobbyView();else if(!state)content=setupView();else content=gameView();app.innerHTML=`<div class="topbar"><div class="brand"><div class="brandmark"></div><div class="brand-copy"><h1>SKYJO <span style="color:var(--accent)">ACTION</span></h1><div class="brand-subline"><small>V15.11 · Score Check</small><span class="edition-chip">LUXE TABLE</span></div></div></div><div class="top-actions">${cloudBadgeHTML()}${state?'<button class="iconbtn focus-btn" onclick="Game.focusMyBoard()" title="Zu meinem Feld">🎯</button>':''}<button id="soundBtn" class="iconbtn sound-btn" onclick="Game.toggleSound()" title="Sound">${uiPrefs.sound?'🔊':'🔇'}</button><button id="fullscreenBtn" class="iconbtn fs-btn" onclick="Game.toggleFullscreen()" title="Vollbild">⛶</button><button class="iconbtn" onclick="Game.showDisplaySettings()" title="Darstellung">⚙</button><button class="iconbtn" onclick="Game.showRules()" title="Regeln">📖</button><button class="iconbtn refresh-page-btn" onclick="Game.reloadPage()" title="Komplette Seite aktualisieren">🔄</button>${state?'<button class="iconbtn" onclick="Game.showLog()" title="Spielverlauf">🧾</button><button class="iconbtn" onclick="Game.restart()" title="Neues Spiel / Spielstand löschen">↻</button>':''}</div></div>${content}`;if(!state&&!isRoomDoc(cloud.doc))setTimeout(()=>{updateNames();toggleCloudFields();toggleJokerSpecialUI()},0);syncBodyMode();if(state){save();runWatchFx();runEmojiReactions();maybeStartRoundClose();maybeStartScoreSequence();if((state.phase==='betweenRounds'||state.phase==='gameOver')&&state.lastRoundSummary)setTimeout(maybeShowRoundSummary,80);setTimeout(resumeTransientFlow,70);scheduleAIIfNeeded()}}
function cancelActionChoice(){ui={mode:'turnChoice',data:{},selected:[]};render()}
function escapeHTML(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}

// Sicherheitsnetz: Browser-Tab-Wechsel oder unterbrochene Animationen dürfen das Spiel nie blockieren.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&motionBusy&&!motionQueueBusy&&motionBusyUntil&&Date.now()>motionBusyUntil)unlockMotion(true)});
window.addEventListener('pageshow',()=>{if(motionBusy&&!motionQueueBusy)unlockMotion(true)});
window.Game={render,updateNames,startFromSetup,startAIFromSetup,selectCard,drawFromDeck,drawFromDiscard,keepDrawn,discardDrawn,takeActionMarket,takeActionBlind,chooseActionTurn,selectActionCard,confirmPlayAction,confirmDiscardAction,finishOwnSwap,draw3Pick,draw3None,showEnlightenment,finishEnlightenment,reactivate,beginOtherSwapSelection,finishOtherSwap,thiefPick,chooseMatch,skipOptionalMatches,closeModal,showRules,showLog,restart,nextRound,cancelActionChoice,loadCloudRoom,generateCloudRoom,toggleCloudFields,createOnlineRoom,joinOnlineRoom,startOnlineGame,leaveOnlineRoom,toggleFullscreen,toggleSound,toggleHaptic,toggleCinematic,toggleAutoFocus,focusMyBoard,showDisplaySettings,setMotionLevel,resolveBoardMatch,continueMatchReady,maybeShowMatchPrompt,maybeShowRoundSummary,toggleJokerSpecialUI,selectSetupMode,sendEmojiReaction,reloadPage,confirmScoreSequence,recountScoreSequence,toggleScoreAudit};

document.addEventListener('fullscreenchange',syncFullscreenState);
document.addEventListener('webkitfullscreenchange',syncFullscreenState);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(isFullscreen()||pseudoFullscreen))requestWakeLock()});
window.addEventListener('resize',()=>{syncChromeButtons()},{passive:true});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;const k=String(e.key||'').toLowerCase();if(k==='f'){e.preventDefault();toggleFullscreen();return}if(k==='s'){e.preventDefault();showDisplaySettings();return}if(k==='m'&&state){e.preventDefault();focusMyBoard();return}if(k==='l'&&state){e.preventDefault();showLog();return}if(!state||!isMyActorDevice())return;if(k==='d'&&ui.mode==='turnChoice'){e.preventDefault();drawFromDeck()}else if(k==='a'&&ui.mode==='turnChoice'){e.preventDefault();drawFromDiscard()}});

cloudConfigLoad();
const saved=!cloud.enabled?load():null;if(saved){state=saved;ui=restorePlayUIFromState();}
render();
if(cloud.enabled&&cloud.room){restoreOnlineRoom()}
})();
