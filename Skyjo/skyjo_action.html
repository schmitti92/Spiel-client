<script>
/* Shared hub is authoritative: skip SKYJO's obsolete second start confirmation. */
(function(){
 const q=new URLSearchParams(location.search);
 if(!/^(?:[0-9]{3}|[A-HJ-NP-Z2-9]{6})$/.test(q.get('hub')||'')||!q.get('match')||!/^S[A-HJ-NP-Z2-9]{9}$/.test(q.get('room')||''))return;
 let started=false;
 const begin=()=>{
   if(started)return;
   const button=document.querySelector('button[onclick="Game.startOnlineGame()"]');
   if(!button||button.disabled)return;
   started=true;
   button.click();
 };
 const watcher=new MutationObserver(begin);
 const start=()=>{watcher.observe(document.getElementById('app')||document.body,{childList:true,subtree:true});begin();};
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
 window.addEventListener('pagehide',()=>watcher.disconnect(),{once:true});
})();
</script>

<script id="skyjo-gold-active-sync-v1">
/* Applies the same outer gold outline in 4x3 and 5x3, including after rerenders. */
(function(){
 const gold='4px solid #ffd12e';
 function sync(){
   document.querySelectorAll('section.player').forEach(function(el){
     if(el.classList.contains('active')){
       el.style.setProperty('border',gold,'important');
       el.style.setProperty('outline','none','important');
       el.style.setProperty('box-shadow','0 0 0 2px #fff1a2, 0 0 17px 5px #ffbd30b0','important');
       el.style.setProperty('border-radius','19px','important');
     }else{
       ['border','outline','box-shadow','border-radius'].forEach(function(prop){
         if(el.style.getPropertyPriority(prop)==='important')el.style.removeProperty(prop);
       });
     }
   });
 }
 let pending=false;
 const schedule=function(){if(!pending){pending=true;requestAnimationFrame(function(){pending=false;sync()})}};
 document.addEventListener('DOMContentLoaded',function(){
   const root=document.getElementById('app');
   if(root)new MutationObserver(schedule).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
   sync();
 });
})();
</script>
<script id="skyjo-online-motion-fast-v1">
/* Faster card transitions in online rooms, without additional server reads.
   Loaded logic is assembled asynchronously; install once it becomes available. */
(function(){
 let attempts=0;
 const timer=setInterval(function(){
   attempts++;
   if(typeof motionSpec==='function' && typeof cloud!=='undefined'){
     clearInterval(timer);
     const original=motionSpec;
     motionSpec=function(){
       const spec=original();
       if(!cloud || !cloud.enabled)return spec;
       return {...spec,
         flight:Math.min(spec.flight,125),
         settle:Math.min(spec.settle,14),
         swapGap:Math.min(spec.swapGap,12),
         pause:Math.min(spec.pause,6),
         flip:Math.min(spec.flip,95),
         revealPause:Math.min(spec.revealPause,12)};
     };
   }else if(attempts>=100)clearInterval(timer);
 },150);
})();
</script>
<script id="skyjo-clear-board-minus20-v1">
/* Complete-clear bonus: only an entirely empty board (including extras) qualifies.
   Applied in the authoritative scoring functions, not merely in the display. */
(function(){
 let tries=0;
 const install=setInterval(function(){
   tries++;
   if(typeof rawRoundScore==='function' && typeof scoreItemsForPlayer==='function'){
     clearInterval(install);
     const originalScore=rawRoundScore;
     const originalItems=scoreItemsForPlayer;
     const cleared=function(p){
       return !!p && Array.isArray(p.grid) && p.grid.length>0 &&
         p.grid.every(function(c){return c==null}) &&
         (!Array.isArray(p.extras)||p.extras.every(function(c){return c==null}));
     };
     rawRoundScore=function(p){return originalScore(p)-(cleared(p)?20:0)};
     scoreItemsForPlayer=function(p){
       const items=originalItems(p);
       if(cleared(p))items.push({kind:'bonus',value:-20,label:'Alle Karten abgebaut'});
       return items;
     };
   }else if(tries>=120)clearInterval(install);
 },100);
})();
</script>

@keyframes skyjoClearArrival{from{opacity:0;transform:scale(.25) rotate(-7deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes skyjoClearBackdrop{0%{opacity:0}12%,78%{opacity:1}100%{opacity:0}}
@keyframes skyjoClearCrown{to{transform:translateY(-10px) scale(1.08)}}
@keyframes skyjoClearParticle{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.2)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--rot)) scale(.8)}}
@media(prefers-reduced-motion:reduce){.skyjo-clear-victory,.skyjo-clear-victory *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
<script id="skyjo-clear-victory-script-v1">
(function(){
 const seen=new Set();
 function celebrate(){
   const seq=(typeof state!=='undefined'&&state)?state.scoreSequence:null;
   if(!seq||!seq.id||seen.has(seq.id))return;
   seen.add(seq.id);
   const winners=(seq.players||[]).filter(function(p){return Array.isArray(p.gridSnapshot)&&p.gridSnapshot.length>0&&p.gridSnapshot.every(function(c){return c==null})&&(!Array.isArray(p.openingExtras)||!p.openingExtras.length||!(typeof state!=='undefined'&&state.players&&state.players[p.index]&&state.players[p.index].extras||[]).some(Boolean))});
   if(!winners.length)return;
   let index=0;
   function show(){
     if(index>=winners.length)return;
     const player=winners[index++];
     const layer=document.createElement('div');
     layer.className='skyjo-clear-victory';
     layer.setAttribute('role','status');
     const panel=document.createElement('div');
     panel.className='skyjo-clear-panel';
     const crown=document.createElement('div');crown.className='skyjo-clear-crown';crown.textContent='🏆';
     const title=document.createElement('div');title.className='skyjo-clear-title';title.textContent='PERFEKT ABGERÄUMT!';
     const name=document.createElement('div');name.className='skyjo-clear-name';name.textContent=player.name||'Spieler';
     const score=document.createElement('div');score.className='skyjo-clear-score';score.textContent='−20 PUNKTE';
     panel.append(crown,title,name,score);layer.append(panel);
     if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
       const colors=['#ffdb70','#fff1b5','#65e7d3','#ffffff','#f6a13b'];
       for(let i=0;i<75;i++){const p=document.createElement('i');p.className='skyjo-clear-particle';p.style.setProperty('--color',colors[i%colors.length]);p.style.setProperty('--x',Math.round((Math.random()-.5)*window.innerWidth*1.6)+'px');p.style.setProperty('--y',Math.round((Math.random()-.5)*window.innerHeight*1.5)+'px');p.style.setProperty('--rot',Math.round(Math.random()*960)+'deg');p.style.setProperty('--duration',(1.3+Math.random()*1.4)+'s');p.style.setProperty('--delay',(Math.random()*.45)+'s');layer.append(p)}
     }
     document.body.append(layer);
     if(navigator.vibrate)try{navigator.vibrate([70,50,120,70,170])}catch(_e){}
     setTimeout(function(){layer.remove();show()},3500);
   }
   show();
 }
 let queued=false;
 function schedule(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;celebrate()})}
 document.addEventListener('DOMContentLoaded',function(){
   const app=document.getElementById('app');
   if(app)new MutationObserver(schedule).observe(app,{childList:true,subtree:false});
   schedule();
 });
})();
</script>
</body>
</html>
