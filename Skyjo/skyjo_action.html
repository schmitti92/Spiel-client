<script>
/* Visual-only Wald selection; existing online engine owns game state. */
(()=>{
 const q=new URLSearchParams(location.search);
 if(q.get('mode')!=='online')return;
 // Standalone rooms previously lacked board=wald, leaving the old Classic UI.
 // This online edition uses Wald for every online entry, including invite links.
 if(q.get('board')!=='wald'){
  q.set('board','wald');
  history.replaceState(history.state,'',location.pathname+'?'+q.toString()+location.hash);
 }
 for(const href of ['skyjo_local_royal_layout.css?v=3','skyjo_local_layout_v3.css?v=18','skyjo_fullscreen_fixed_v1.css?v=1']){const link=document.createElement('link');link.rel='stylesheet';link.href=href;document.head.appendChild(link);}
 document.body.dataset.skyjoLocalBoard='wald';
 /* The game engine may reset data-skyjo-theme to standard during renders.
    Wald styling relies on the independent data-skyjo-local-board marker. */
 const playingBannerPresent=()=>!!document.getElementById('skyjo-wald-online-label');
 const check=()=>{
  if(document.body.dataset.skyjoLocalBoard!=='wald')document.body.dataset.skyjoLocalBoard='wald';
  // Clearly label the standalone room before play, not just the game board.
  // One-device Wald preview uses the existing offline AI engine, not the online room.
  const app=document.getElementById('app');
  if(app && !document.getElementById('skyjo-wald-preview-link') && !document.body.classList.contains('is-playing')){
   const anchor=document.createElement('a');
   anchor.id='skyjo-wald-preview-link';
   anchor.href='skyjo_action_local.html?mode=local&board=wald&testPlayers=2&layout=classic';
   anchor.textContent='🌲 Waldlayout mit 2 Testspielern öffnen';
   anchor.style.cssText='display:block;text-align:center;padding:13px 18px;margin:12px auto;max-width:680px;background:linear-gradient(135deg,#27754d,#134d3a);color:white;border:2px solid #c9a764;border-radius:12px;text-decoration:none;font:700 17px system-ui';
   const setup=app.querySelector('#target');
   if(setup){const panel=setup.closest('.panel')||setup.parentElement;panel?.prepend(anchor)}
   else if(app.querySelector('.lobby-card'))app.querySelector('.lobby-card').prepend(anchor);
  }
  if(!playingBannerPresent()){
   const app=document.getElementById('app');
   if(app && app.querySelector('.topbar') && !document.body.classList.contains('is-playing')){
    const tag=document.createElement('div');tag.id='skyjo-wald-online-label';
    tag.textContent='🌲 SKYJO Wald · Online · genau 3 Spieler';
    tag.style.cssText='text-align:center;padding:8px 12px;background:#174e3e;color:#f7e6b9;font:700 16px system-ui;border-radius:10px;margin:8px auto;max-width:680px';
    app.prepend(tag);
   }
  }
  const playing=document.body.classList.contains('is-playing');
  const board=document.querySelector('.table-area.three-player-layout');
  const valid=!!board && !!board.querySelector(':scope > .own-seat') && !!board.querySelector(':scope > .center-seat') && !!board.querySelector(':scope > .mini-seat') && board.querySelectorAll('section.player').length===3;
  let note=document.getElementById('wald-online-three-only');
  if(playing&&!valid&&!note){
   note=document.createElement('div');note.id='wald-online-three-only';note.setAttribute('role','alert');
   note.textContent='🌲 Wald Online benötigt genau 3 Spieler. Bitte einen Raum mit drei Spielern starten.';
   note.style.cssText='position:fixed;z-index:2147483000;top:60px;left:50%;transform:translateX(-50%);max-width:90vw;padding:12px 18px;background:#12372d;color:white;border:2px solid #cda85b;border-radius:12px;font:bold 15px system-ui';
   document.body.append(note);
  }else if((!playing||valid)&&note)note.remove();
 };
 addEventListener('DOMContentLoaded',()=>{new MutationObserver(check).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});check()});
})();
</script>
