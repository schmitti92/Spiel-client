  background:linear-gradient(180deg,#17383b,#0d292c);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 80px rgba(0,0,0,.50)
}
.modal p{color:#a9bfc0}.choice{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10);color:#fff}.choice:hover{background:rgba(255,255,255,.09)}
.rules .note{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10)}
.log{background:rgba(0,0,0,.15);border-color:rgba(255,255,255,.09);color:#b9cecf}.log div{border-bottom-color:rgba(255,255,255,.08)}
.toast{top:82px;background:#fff;color:#12282a;border:1px solid rgba(0,0,0,.06);box-shadow:0 14px 36px rgba(0,0,0,.30);font-weight:800}
@media(min-width:760px){
  .players{grid-template-columns:repeat(2,minmax(0,1fr))}
  .player.active{grid-column:1/-1}
  .center-table{grid-template-columns:minmax(230px,.72fr) minmax(0,1.55fr)}
}
@media(max-width:620px){
  :root{--card-w:clamp(58px,21.2vw,82px)}
  .topbar{top:5px;border-radius:15px}.brand h1{font-size:16px}.top-actions{gap:4px}.iconbtn{font-size:12px;padding:7px 8px}
  .status{grid-template-columns:repeat(2,1fr)}
  .center-table{grid-template-columns:1fr}.panel{border-radius:18px}.player{border-radius:18px}
  .grid{width:100%;grid-template-columns:repeat(4,minmax(0,var(--card-w)));justify-content:center;gap:5px}
  .gridwrap{justify-content:center}.market{margin-left:-2px;margin-right:-2px}
  .action-card{min-height:108px}

/* V3: Joker-Regeln + Firebase/Cloud-Sync */
.setup-separator{height:1px;background:rgba(255,255,255,.12);margin:14px 0}
.toggle-box{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.78)}
.toggle-box input{width:22px;height:22px;accent-color:var(--accent)}
.cloud-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.cloud-row .field{flex:1 1 180px}.cloud-row button{flex:0 0 auto}
.cloud-info{margin-top:8px;padding:9px 11px;border:1px solid rgba(125,211,252,.35);background:rgba(14,116,144,.08);border-radius:12px;font-size:12px;color:var(--muted)}
.cloud-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.07);font-size:11px;font-weight:900;color:#fff;white-space:nowrap}
.cloud-pill.online:before{content:"";width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px rgba(74,222,128,.75)}
.cloud-pill.local:before{content:"";width:7px;height:7px;border-radius:50%;background:#94a3b8}
.joker-off-note{font-size:11px;color:var(--muted);margin-top:5px}.card.star.joker-off{filter:none;box-shadow:0 6px 0 rgba(0,0,0,.24),0 14px 30px rgba(83,147,255,.14),inset 0 0 0 2px rgba(255,255,255,.42)}
@media(max-width:640px){.cloud-row{align-items:stretch}.cloud-row button{flex:1 1 120px}.cloud-pill{padding:6px 8px;font-size:10px}}

/* Online Multiplayer V4 */
.online-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.online-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.online-status{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.16);font-size:13px;color:var(--muted)}
.online-status.ok{border-color:rgba(46,204,113,.34);color:#bdf5d2}.online-status.err{border-color:rgba(255,92,92,.34);color:#ffd1d1}
.lobby-card{max-width:920px;margin:20px auto}.lobby-head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.player-list{display:grid;gap:10px;margin:18px 0}.player-slot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.04)}
.player-slot.me{border-color:rgba(255,201,64,.45);box-shadow:0 0 0 2px rgba(255,201,64,.08) inset}.player-slot .num{width:32px;height:32px;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.08);font-weight:900}
.player-slot .who{flex:1}.player-slot .who b{display:block}.player-slot .who small{color:var(--muted)}
.lobby-settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.setting-chip{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.15)}.setting-chip b{display:block;font-size:15px}.setting-chip small{color:var(--muted)}
.multiplayer-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.16)}
.waiting-note{padding:11px 14px;border-radius:13px;background:rgba(255,255,255,.06);color:var(--muted);font-weight:800}
.you-tag{display:inline-flex;margin-left:6px;padding:2px 7px;border-radius:999px;background:rgba(255,201,64,.15);color:#ffd55f;font-size:10px;font-weight:900;vertical-align:middle}
@media(max-width:760px){.online-mode-grid,.lobby-settings{grid-template-columns:1fr}.online-actions>*{flex:1 1 140px}}



/* ==========================================================
   V5 COMPACT TABLET UPDATE
   Ziel: 2-Spieler-Partie im Querformat möglichst vollständig
   auf einen Blick + direkte Stapelbedienung.
   ========================================================== */
.pile-card-hit{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px;padding:2px;transition:transform .12s ease,filter .12s ease}
.pile-card-hit.enabled{cursor:pointer}
.pile-card-hit.enabled:hover,.pile-card-hit.enabled:active{transform:translateY(-3px);filter:brightness(1.08)}
.pile-card-hit.enabled .card{outline:2px solid rgba(255,224,94,.58);outline-offset:2px}
.pile-tip{font-size:9px;font-weight:900;letter-spacing:.55px;text-transform:uppercase;color:#ffe36c;min-height:11px}
.market-hit{display:inline-flex;border-radius:14px;transition:transform .12s ease,filter .12s ease}
.market-hit.enabled{cursor:pointer}
.market-hit.enabled:hover,.market-hit.enabled:active{transform:translateY(-3px);filter:brightness(1.08)}
.market-hit.enabled .action-card{outline:2px solid rgba(255,224,94,.42);outline-offset:1px}
.direct-hint{font-size:9px;color:#ffe36c;font-weight:800;margin-top:3px;letter-spacing:.2px}

@media (min-width:900px) and (orientation:landscape){
  :root{--card-w:clamp(50px,4.15vw,64px);--card-h:calc(var(--card-w)*1.32)}
  html,body{overflow-x:hidden}
  .app{max-width:1500px;padding:6px 10px calc(62px + env(safe-area-inset-bottom))}
  .topbar{margin:-6px -10px 6px;padding:5px 10px;min-height:48px;border-radius:0 0 15px 15px}
  .brand{gap:7px}.brandmark{width:28px;height:28px;border-radius:8px}.brand h1{font-size:14px}.brand small{font-size:9px}
  .top-actions{gap:4px}.iconbtn{padding:6px 8px;border-radius:9px;font-size:12px}.cloud-pill{padding:5px 8px;font-size:10px}
  .multiplayer-bar{margin:4px 0;padding:5px 10px;border-radius:10px;font-size:10px}
  .status{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:4px 0 6px}
  .stat{padding:4px 6px;border-radius:10px;min-height:38px}.stat b{font-size:12px;line-height:1.05}.stat span{font-size:8px}
  .table-area{gap:6px}
  .panel{margin:5px 0;padding:8px;border-radius:14px}
  .center-table{grid-template-columns:minmax(260px,.78fr) minmax(500px,1.72fr);gap:7px;padding:7px;min-height:0}
  .center-table:after{display:none}
  .pilebox{padding:6px;border-radius:13px;min-height:0}.pilebox h4{margin:0 0 4px;font-size:9px;letter-spacing:.9px}
  .pile-row{gap:6px;flex-wrap:nowrap}.count{font-size:8px;line-height:1.15;margin-top:2px}
  .card{border-radius:11px;font-size:clamp(18px,2.5vw,28px);box-shadow:0 5px 0 rgba(0,0,0,.16),0 7px 12px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.5)}
  .card.back:after{font-size:28px}.card .corner{font-size:8px}.card .center-value{font-size:clamp(20px,3vw,30px)}
  .market{gap:5px;padding:0 2px 2px;overflow:visible;justify-content:center;align-items:stretch}
  .action-card{width:clamp(78px,7.1vw,98px);min-height:82px;border-radius:11px;padding:5px;box-shadow:0 5px 10px rgba(0,0,0,.15)}
  .action-card .emoji{font-size:21px;margin-bottom:1px}.action-card b{font-size:9px;line-height:1.08}.action-card small{font-size:7px;line-height:1.12;margin-top:2px}
  .players{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .player,.player.active{grid-column:auto;padding:7px;border-radius:14px;min-width:0}
  .player.active{box-shadow:0 0 0 2px rgba(255,217,72,.18),0 6px 16px rgba(0,0,0,.18)}
  .player-head{margin-bottom:5px}.player-title{gap:6px}.avatar{width:24px;height:24px;font-size:11px}.player-name{font-size:11px}.scorechip{font-size:9px;padding:3px 6px}.player .hint{font-size:8px}
  .gridwrap{display:flex;justify-content:center;gap:7px;flex-wrap:nowrap}.grid{gap:4px;grid-template-columns:repeat(4,var(--card-w))}
  .extras{min-width:90px}.extras h5{font-size:8px;margin-bottom:3px}.extra-row{gap:3px}
  .actions-owned{gap:4px;margin-top:5px;padding-top:5px;max-height:95px;overflow:auto}
  .actions-owned .action-card{width:74px;min-height:65px}.actions-owned .action-card .emoji{font-size:17px}.actions-owned .action-card small{display:none}
  .bottom-actions{padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
  .bottom-inner{max-width:1500px;display:grid;grid-template-columns:minmax(220px,.72fr) minmax(0,2.28fr);gap:7px;align-items:center}
  .instruction{text-align:left;margin:0;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .action-buttons{gap:4px;padding:0;overflow-x:auto}.action-buttons button{min-width:0;flex:1 1 auto;padding:6px 8px;border-radius:9px;font-size:9px;white-space:nowrap}
  .waiting-note{padding:5px 8px;font-size:9px;border-radius:9px}
  .toast{top:58px;padding:7px 10px;font-size:10px}
  .modal{max-height:82vh;padding:13px}.modal h3{font-size:16px}.modal p{font-size:11px}
}

/* Sehr breite Tablets/Desktops: beide Spieler + Tisch besonders kompakt. */
@media (min-width:1200px) and (min-height:700px) and (max-height:1050px){

  .players.players-2{grid-template-columns:repeat(2,minmax(0,1fr))}

/* Hochformat/kleinere Geräte bleiben gut bedienbar, aber ebenfalls etwas dichter. */
@media (max-width:899px){
  .panel{margin:8px 0}
  .player{padding:9px}
  .pile-tip{font-size:8px}
}

/* ==========================================================
   V6 CINEMATIC VISUAL UPDATE
   Spektakulärer, aber ruhig: Ereignis-Animationen statt Dauerblinken.
   ========================================================== */
:root{
  --gold:#ffd65a;
  --gold2:#ffb72e;
  --cyan:#62e8e0;
  --violet:#9c7cff;
  --felt:#082c2d;
  --felt2:#041d20;
}
body{
  background:
    radial-gradient(900px 520px at 10% -5%,rgba(88,77,255,.18),transparent 60%),
    radial-gradient(900px 520px at 90% 0%,rgba(0,220,185,.12),transparent 62%),
    linear-gradient(180deg,#041416,#061d20 46%,#041416);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    linear-gradient(115deg,transparent 0 42%,rgba(255,255,255,.018) 43% 44%,transparent 45% 100%),
    radial-gradient(circle at 50% 120%,rgba(255,201,64,.06),transparent 36%);
}
.app{position:relative}
.topbar{
  border:1px solid rgba(98,232,224,.10);
  background:linear-gradient(180deg,rgba(5,34,36,.96),rgba(3,25,28,.94));
  box-shadow:0 12px 34px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.04);
}
.brandmark{
  position:relative;overflow:hidden;
  box-shadow:0 0 0 2px rgba(255,255,255,.08),0 7px 20px rgba(0,0,0,.28);
}
.brandmark:after{
  content:"";position:absolute;inset:-40%;
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
  transform:translateX(-120%) rotate(12deg);
  animation:brandShine 5.8s ease-in-out infinite;
}
@keyframes brandShine{0%,74%{transform:translateX(-120%) rotate(12deg)}88%,100%{transform:translateX(120%) rotate(12deg)}}
.iconbtn,.cloud-pill{
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));
  border-color:rgba(255,255,255,.11);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.14);
}
.status{perspective:900px}
.stat{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
  border-color:rgba(255,255,255,.10);
}
.stat:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 42%);
}
.center-table{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 15%,rgba(57,230,207,.16),transparent 34%),
    radial-gradient(circle at 20% 90%,rgba(132,95,255,.10),transparent 36%),
    linear-gradient(180deg,#0b3a3a,#07292b 56%,#062326);
  box-shadow:
    inset 0 0 0 1px rgba(109,255,238,.08),
    inset 0 22px 70px rgba(255,255,255,.025),
    0 16px 38px rgba(0,0,0,.24);
}
.center-table:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background-image:
    repeating-radial-gradient(circle at 0 0,transparent 0 3px,rgba(255,255,255,.025) 4px 5px);
}
.pilebox{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(2,22,24,.58),rgba(2,17,20,.38));
  border-color:rgba(255,255,255,.09);
}
.pilebox:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(125deg,rgba(255,255,255,.035),transparent 40%);
}
.card{
  transform-style:preserve-3d;
  box-shadow:
    0 5px 0 rgba(0,0,0,.28),
    0 10px 18px rgba(0,0,0,.24),
    inset 0 1px 0 rgba(255,255,255,.62),
    inset 0 -1px 0 rgba(0,0,0,.12);
}
.card:before{
  background:
    linear-gradient(150deg,rgba(255,255,255,.42),transparent 33%,rgba(255,255,255,.04) 54%,rgba(0,0,0,.06));
}
.card.clickable:hover,.card.clickable:active{
  transform:translateY(-5px) rotateX(4deg) rotateY(-3deg) scale(1.025);
  box-shadow:0 7px 0 rgba(0,0,0,.24),0 16px 28px rgba(0,0,0,.33),0 0 0 2px rgba(255,223,91,.17);
}
.card.back{
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.16) 0 2px,transparent 3px 16px,rgba(255,255,255,.06) 17px 18px,transparent 19px),
    repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 5px,transparent 5px 10px),
    linear-gradient(145deg,#4932a3 0%,#2460aa 52%,#079178 100%);
}
.card.back:after{
  content:"✦";font-size:clamp(24px,3vw,40px);
  color:#fff;text-shadow:0 0 16px rgba(255,255,255,.48),0 3px 7px rgba(0,0,0,.32);
}
.card.star{
  background:
    radial-gradient(circle at 50% 42%,rgba(255,255,255,.32),transparent 24%),
    conic-gradient(from 12deg,#ffd73f,#ff866e,#b66bff,#5ba8ff,#45d9b4,#ffd73f);
  box-shadow:0 5px 0 rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.24),0 0 20px rgba(255,214,90,.20);
}
.card.selected{
  outline:3px solid var(--gold);outline-offset:2px;
  box-shadow:0 5px 0 rgba(0,0,0,.24),0 12px 24px rgba(0,0,0,.28),0 0 26px rgba(255,214,90,.38);
}
.pile-card-hit.enabled{
  filter:drop-shadow(0 0 12px rgba(255,216,74,.12));
}
.pile-card-hit.enabled:after{
  content:"";position:absolute;inset:-5px;border-radius:18px;pointer-events:none;
  border:1px solid rgba(255,221,88,.24);
  box-shadow:0 0 18px rgba(255,213,70,.08);
}
.pile-tip{
  padding:2px 7px;border-radius:999px;
  background:rgba(255,214,90,.10);
  border:1px solid rgba(255,214,90,.16);
}
.action-card{
  overflow:hidden;
  border-color:rgba(180,145,255,.34);
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.22),transparent 37%),
    linear-gradient(145deg,#5933a8,#353e9f 58%,#24458c);
  box-shadow:0 5px 0 rgba(0,0,0,.20),0 10px 20px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.16);
}
.action-card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 10%,rgba(255,255,255,.10) 38%,transparent 60%);
  transform:translateX(-55%);
  transition:transform .28s ease;
}
.action-card.clickable:hover:before,.market-hit.enabled:hover .action-card:before{transform:translateX(45%)}
.action-card.attack{
  background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.20),transparent 36%),linear-gradient(145deg,#b83269,#81376f 58%,#56335f);
  border-color:rgba(255,120,169,.38);
}
.action-card.defense{
  background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.24),transparent 36%),linear-gradient(145deg,#177a8c,#265fa1 58%,#34519a);
  border-color:rgba(108,226,255,.40);
}
.action-card .emoji{
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.30));
}
.action-card b{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.26)}
.action-card small{color:rgba(255,255,255,.73)}
.action-type{
  position:absolute;top:5px;right:5px;
  padding:2px 5px;border-radius:999px;
  font-size:6px;font-weight:950;letter-spacing:.55px;text-transform:uppercase;
  background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.76)
}
.player{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 5% 0%,rgba(96,232,224,.07),transparent 32%),
    linear-gradient(180deg,rgba(9,48,50,.97),rgba(7,35,38,.98));
  border-color:rgba(255,255,255,.09);
}
.player:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(130deg,rgba(255,255,255,.025),transparent 30%);
}
.player.active{
  border-color:rgba(255,213,77,.66)!important;
  box-shadow:
    0 0 0 2px rgba(255,216,82,.11),
    0 12px 26px rgba(0,0,0,.24),
    inset 0 0 24px rgba(255,209,68,.035)!important;
}
.player.active:after{
  content:"AM ZUG";
  position:absolute;top:7px;left:50%;transform:translateX(-50%);
  padding:2px 9px;border-radius:999px;
  font-size:7px;font-weight:950;letter-spacing:1.1px;
  color:#3b2a00;background:linear-gradient(180deg,#ffe887,#ffc43e);
  box-shadow:0 4px 10px rgba(0,0,0,.23);
}
.avatar{
  background:linear-gradient(145deg,#ffe57e,#ffb934);color:#4a3300;
  box-shadow:0 4px 12px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.65)
}
.scorechip{
  background:rgba(255,255,255,.07);color:#d7e8e9;border:1px solid rgba(255,255,255,.08)
}
.multiplayer-bar{
  background:linear-gradient(90deg,rgba(73,54,147,.26),rgba(13,104,102,.25));
  border-color:rgba(125,235,220,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
.bottom-actions{
  background:linear-gradient(180deg,rgba(3,25,28,.93),rgba(2,18,21,.98));
  border-top-color:rgba(120,235,220,.12);
  box-shadow:0 -14px 34px rgba(0,0,0,.28);
}
.action-buttons button{
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
  color:#eaf7f7;border-color:rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.action-buttons button.primary{
  background:linear-gradient(135deg,#8a66ff,#5d8dff);
  box-shadow:0 7px 18px rgba(95,92,238,.24),inset 0 1px 0 rgba(255,255,255,.18);
}
.instruction{color:#f0fbfb}
.modal{
  background:
    radial-gradient(circle at 50% 0%,rgba(110,86,255,.10),transparent 34%),
    linear-gradient(180deg,#0b3436,#08272a);
  border:1px solid rgba(255,255,255,.10);
}
.drawn-stage{
  display:grid;place-items:center;min-height:150px;margin:8px 0 12px;perspective:900px;
}
.drawn-stage .card{animation:drawCardReveal .48s cubic-bezier(.16,.8,.2,1) both}
@keyframes drawCardReveal{
  0%{opacity:0;transform:translateY(-24px) rotateY(78deg) scale(.72)}
  65%{opacity:1;transform:translateY(3px) rotateY(-5deg) scale(1.04)}
  100%{transform:none}
}
.game-fx{
  position:fixed;inset:0;z-index:140;pointer-events:none;display:grid;place-items:center;
  animation:fxFade .95s ease both;
}
.game-fx .fx-core{
  min-width:220px;max-width:min(70vw,440px);
  padding:14px 22px;border-radius:24px;text-align:center;
  background:rgba(4,27,29,.84);border:1px solid rgba(255,255,255,.13);
  box-shadow:0 24px 70px rgba(0,0,0,.48),0 0 45px rgba(105,235,219,.10);
  backdrop-filter:blur(12px);
  animation:fxPop .72s cubic-bezier(.16,.9,.24,1) both;
}
.game-fx .fx-icon{font-size:42px;line-height:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
.game-fx .fx-label{margin-top:7px;font-weight:950;font-size:16px;letter-spacing:.2px;color:white}
.game-fx.turn .fx-core{border-color:rgba(255,215,79,.34);box-shadow:0 24px 70px rgba(0,0,0,.48),0 0 55px rgba(255,212,76,.18)}
.game-fx.star .fx-core{border-color:rgba(255,216,90,.40);background:rgba(52,35,84,.88)}
.game-fx.action .fx-core{border-color:rgba(165,129,255,.38);background:rgba(36,31,82,.88)}
.game-fx.draw .fx-core{border-color:rgba(89,220,210,.34)}
.game-fx.win .fx-core{border-color:rgba(255,218,97,.50);background:rgba(70,49,18,.90)}
@keyframes fxFade{0%{opacity:0}12%,72%{opacity:1}100%{opacity:0}}
@keyframes fxPop{0%{transform:scale(.72) translateY(14px);filter:blur(2px)}58%{transform:scale(1.045) translateY(-2px)}100%{transform:none}}
.fx-spark{
  position:fixed;z-index:139;pointer-events:none;width:8px;height:8px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 12px rgba(255,216,90,.55);
  animation:sparkFly .8s ease-out both;
}
@keyframes sparkFly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.1)}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}
@media (min-width:900px) and (orientation:landscape){
  .player.active:after{top:4px;font-size:6px;padding:1px 7px}
  .action-type{top:3px;right:3px;font-size:5px;padding:1px 4px}
  .game-fx .fx-core{padding:10px 16px;min-width:190px}
  .game-fx .fx-icon{font-size:34px}.game-fx .fx-label{font-size:13px}
}


/* ==========================================================
   V7 ULTRA TABLE · FULLSCREEN · NON-BLOCKING DRAW ZONE
   Fokus: Tablet-Querformat, direkte Bedienung, keine Karte über
   dem eigenen Spielfeld, echtes Vollbild + immersive Details.
   ========================================================== */
:root{
  --v7-glow:rgba(94,236,220,.22);
  --v7-gold:rgba(255,216,90,.92);
}
html:fullscreen,html:-webkit-full-screen{background:#031416}
body.is-fullscreen{min-height:100vh;background:#031416}
body.is-fullscreen .app{max-width:none;width:100%;min-height:100vh}
body.is-fullscreen .topbar{top:0;border-radius:0;margin-top:0}
body.is-fullscreen .brand small{display:none}
.fs-btn{min-width:38px;font-size:17px;line-height:1}
.sound-btn{min-width:38px}

/* Gezogene Karte bleibt am Tisch – kein Modal über dem eigenen Feld. */
.drawn-decision-inline{
  position:relative;z-index:3;
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:center;
  width:100%;padding:7px;border-radius:15px;
  border:1px solid rgba(255,218,89,.32);
  background:
    radial-gradient(circle at 8% 50%,rgba(255,218,89,.11),transparent 36%),
    linear-gradient(180deg,rgba(18,55,56,.93),rgba(6,32,35,.96));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 24px rgba(0,0,0,.18);
  animation:v7TrayIn .28s cubic-bezier(.18,.86,.28,1) both;
}
.drawn-decision-inline .drawn-card-wrap{display:grid;place-items:center;position:relative}
.drawn-decision-inline .drawn-card-wrap:after{
  content:"GEZOGEN";position:absolute;left:50%;bottom:-3px;transform:translate(-50%,50%);
  padding:2px 6px;border-radius:999px;font-size:6px;font-weight:950;letter-spacing:.8px;
  color:#302200;background:linear-gradient(180deg,#ffe986,#ffc33f);box-shadow:0 4px 10px rgba(0,0,0,.22)
}
.drawn-decision-inline .card{
  animation:v7DrawCard .42s cubic-bezier(.16,.86,.24,1) both;
  outline:2px solid rgba(255,220,94,.34);outline-offset:2px;
}
.drawn-decision-copy{min-width:0;text-align:left}
.drawn-decision-copy b{display:block;color:#fff;font-size:11px;margin-bottom:2px}
.drawn-decision-copy small{display:block;color:#9db4b5;font-size:8px;line-height:1.25;margin-bottom:6px}
.drawn-decision-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.drawn-decision-actions button{
  min-width:0;padding:7px 6px;border-radius:9px;border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.07);color:#fff;font-weight:900;font-size:8px;line-height:1.12
}
.drawn-decision-actions button.keep{background:linear-gradient(135deg,#8d69ff,#5d8dff);border-color:rgba(157,139,255,.36)}
.drawn-decision-actions button.drop{background:linear-gradient(135deg,rgba(255,197,64,.20),rgba(255,150,55,.12));border-color:rgba(255,210,82,.26);color:#ffe89b}
@keyframes v7TrayIn{from{opacity:0;transform:translateY(-7px) scale(.98)}to{opacity:1;transform:none}}
@keyframes v7DrawCard{0%{opacity:.1;transform:translateY(-20px) rotateY(72deg) scale(.72)}65%{opacity:1;transform:translateY(2px) rotateY(-5deg) scale(1.04)}100%{transform:none}}

/* Verdeckter Aktionsstapel ist jetzt ebenfalls direkt bedienbar. */
.action-blind-hit{flex:0 0 auto;display:grid;place-items:center;align-self:stretch;border-radius:12px;transition:.14s ease}
.action-blind-hit.enabled{cursor:pointer}
.action-blind-hit.enabled:hover,.action-blind-hit.enabled:active{transform:translateY(-3px);filter:brightness(1.08)}
.action-deck-back{
  width:clamp(62px,6.2vw,82px);min-height:82px;height:100%;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:1px solid rgba(255,255,255,.18);
  background:
    radial-gradient(circle at 50% 20%,rgba(255,255,255,.18),transparent 30%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 5px,transparent 5px 10px),
    linear-gradient(145deg,#40258f,#235aa0 60%,#127876);
  box-shadow:0 5px 0 rgba(0,0,0,.20),0 10px 18px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.15);
  color:#fff;text-align:center;position:relative;overflow:hidden
}
.action-deck-back .bolt{font-size:22px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.28))}
.action-deck-back b{font-size:7px;letter-spacing:.55px;text-transform:uppercase}
.action-deck-back small{font-size:6px;color:rgba(255,255,255,.67)}
.action-blind-hit.enabled .action-deck-back{outline:2px solid rgba(255,221,88,.26);outline-offset:1px}

/* Fortschritt: wie weit ist die eigene Auslage bereits aufgelöst? */
.reveal-meter{height:3px;margin-top:4px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.reveal-meter>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#56e2d3,#ffd85a);box-shadow:0 0 8px rgba(80,224,210,.22);transition:width .22s ease}

/* Ereigniseffekte schweben oben und verdecken nicht mehr das Kartenfeld. */
.game-fx{place-items:start center;padding-top:72px}
.game-fx.win{place-items:center;padding-top:0}
.game-fx .fx-core{min-width:180px;padding:10px 16px;border-radius:18px}
.game-fx .fx-icon{font-size:32px}.game-fx .fx-label{font-size:12px}

/* Vollbild bei 2 Spielern: alles auf einen Blick. */
body.is-fullscreen[data-players="2"]{overflow:hidden}
body.is-fullscreen[data-players="2"] .app{height:100vh;overflow:hidden;padding-top:4px;padding-bottom:52px}
body.is-fullscreen[data-players="2"] .multiplayer-bar{margin:2px 0 3px;padding:4px 9px}
body.is-fullscreen[data-players="2"] .status{margin:2px 0 4px}
body.is-fullscreen[data-players="2"] .panel{margin:3px 0}
body.is-fullscreen[data-players="2"] .center-table{padding:5px;gap:5px}
body.is-fullscreen[data-players="2"] .players{gap:5px}
body.is-fullscreen[data-players="2"] .player{padding:6px}
body.is-fullscreen[data-players="2"] .player-head{margin-bottom:3px}
body.is-fullscreen[data-players="2"] .actions-owned{margin-top:3px;padding-top:3px}
body.is-fullscreen[data-players="2"] .bottom-actions{padding-top:3px;padding-bottom:calc(3px + env(safe-area-inset-bottom))}

/* Kleine Zustandsanzeige direkt am Tisch. */
.turn-state-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:999px;font-size:7px;font-weight:950;letter-spacing:.5px;text-transform:uppercase;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:#a9bfc0}
.turn-state-pill.mine{color:#352700;background:linear-gradient(180deg,#ffe98b,#ffc644);border-color:rgba(255,235,147,.65);box-shadow:0 0 14px rgba(255,210,70,.12)}

@media (min-width:900px) and (orientation:landscape){
  .drawn-decision-inline{padding:5px;gap:7px}.drawn-decision-copy b{font-size:9px}.drawn-decision-copy small{font-size:7px;margin-bottom:4px}
  .drawn-decision-actions button{padding:5px 4px;font-size:7px}.action-deck-back{min-height:82px;width:68px}
  .reveal-meter{height:2px;margin-top:3px}
  body.is-fullscreen[data-players="2"]{--card-w:58px}
}
@media(max-width:620px){
  .drawn-decision-inline{grid-template-columns:1fr;text-align:center}.drawn-decision-copy{text-align:center}
  .drawn-decision-inline .drawn-card-wrap{margin-bottom:5px}.action-deck-back{min-height:92px}
  .game-fx{padding-top:62px}
}


/* ==========================================================
   V8 FINAL HIGH-END EDITION
   Polished arena lighting · player identities · luxury cards
   richer action deck · smart focus · final responsive pass
   ========================================================== */
:root{
  --turn-hue:43;
  --v8-gold:#ffd95f;
  --v8-ice:#75f1e2;
  --v8-panel:rgba(8,34,37,.86);
  --v8-line:rgba(255,255,255,.105);
  --v8-soft:rgba(255,255,255,.055);
}
body{
  background:
    radial-gradient(900px 520px at 50% -18%,hsla(var(--turn-hue),85%,62%,.13),transparent 62%),
    radial-gradient(640px 440px at 10% 96%,rgba(62,221,202,.09),transparent 68%),
    radial-gradient(620px 420px at 92% 92%,rgba(107,82,255,.08),transparent 68%),
    linear-gradient(145deg,#020d0f 0%,#071c1f 45%,#031315 100%);
  transition:background .55s ease;
}
body:after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.42;
  background:
    linear-gradient(90deg,transparent 0 49.85%,rgba(255,255,255,.025) 50%,transparent 50.15%),
    linear-gradient(0deg,transparent 0 49.85%,rgba(255,255,255,.018) 50%,transparent 50.15%);
  background-size:76px 76px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 75%);
}
.app{max-width:1480px}
.topbar{
  border:1px solid rgba(255,255,255,.10);
  background:
    linear-gradient(180deg,rgba(11,38,41,.88),rgba(5,24,27,.86));
  box-shadow:0 18px 50px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.055);
}
.topbar:after{
  content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,hsla(var(--turn-hue),92%,69%,.66),transparent);
  box-shadow:0 0 18px hsla(var(--turn-hue),92%,69%,.20);pointer-events:none
}
.brandmark{position:relative;isolation:isolate}
.brandmark:after{content:"";position:absolute;inset:-7px;border-radius:16px;background:conic-gradient(from 120deg,transparent,hsla(var(--turn-hue),90%,65%,.22),transparent 48%);filter:blur(8px);z-index:-1}
.brand h1{letter-spacing:.2px}.brand small{letter-spacing:.45px;text-transform:uppercase;font-size:9px}
.top-actions{align-items:center;flex-wrap:nowrap}
.iconbtn{min-width:38px;min-height:38px;display:grid;place-items:center;position:relative;overflow:hidden}
.iconbtn:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.08),transparent 46%);opacity:.6;pointer-events:none}
.iconbtn:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(0,0,0,.20)}
.cloud-pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 7px 18px rgba(0,0,0,.18)}

/* HIGH-END status rail */
.status{position:relative;isolation:isolate}
.stat{
  position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(18,52,55,.82),rgba(8,30,33,.90));
  border-color:rgba(255,255,255,.095);box-shadow:0 10px 26px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.04)
}
.stat:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,hsla(var(--turn-hue),90%,66%,.52),transparent)}
.stat b{font-variant-numeric:tabular-nums;letter-spacing:-.3px}.stat span{text-transform:uppercase;letter-spacing:.65px;font-weight:800}
.multiplayer-bar{
  border:1px solid rgba(255,255,255,.09);background:linear-gradient(90deg,rgba(20,54,57,.78),rgba(7,30,33,.88));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 22px rgba(0,0,0,.14)
}

/* ARENA TABLE */
.center-table{
  overflow:hidden;isolation:isolate;
  background:
    radial-gradient(ellipse at 23% 48%,hsla(var(--turn-hue),84%,62%,.075),transparent 31%),
    radial-gradient(ellipse at 78% 45%,rgba(113,91,255,.075),transparent 32%),
    repeating-radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.012) 0 1px,transparent 1px 5px),
    linear-gradient(165deg,rgba(10,52,52,.97),rgba(3,27,30,.99));
  border:1px solid rgba(106,239,221,.115);
  box-shadow:0 20px 55px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.055),inset 0 -30px 60px rgba(0,0,0,.12)
}
.center-table:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.022) 30%,transparent 43% 100%);
}
.center-table:after{content:"SKYJO ACTION · FINAL TABLE";letter-spacing:2.8px;color:rgba(255,255,255,.075)}
.pilebox{
  position:relative;overflow:visible;
  background:linear-gradient(180deg,rgba(3,28,30,.48),rgba(2,19,21,.35));
  border-color:rgba(255,255,255,.085);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)
}
.pilebox h4{font-weight:950;letter-spacing:1.35px;color:#a7bbbc}
.pile-card-hit,.market-hit,.action-blind-hit{position:relative}
.pile-card-hit.enabled:before,.market-hit.enabled:before,.action-blind-hit.enabled:before{
  content:"";position:absolute;inset:-5px;border-radius:18px;border:1px solid hsla(var(--turn-hue),92%,69%,.22);
  box-shadow:0 0 20px hsla(var(--turn-hue),92%,69%,.08);pointer-events:none;opacity:.9
}
.pile-tip{backdrop-filter:blur(8px);box-shadow:0 4px 12px rgba(0,0,0,.20)}
.deck-count-badge{
  position:absolute;right:5px;top:5px;z-index:2;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  display:grid;place-items:center;font-size:7px;font-weight:950;color:#fff;background:rgba(0,0,0,.30);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 4px 9px rgba(0,0,0,.22)
}

/* PREMIUM PLAYING CARDS */
.card{
  border:1px solid rgba(255,255,255,.48);
  box-shadow:0 6px 0 rgba(0,0,0,.24),0 12px 24px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.70),inset 0 -1px 0 rgba(0,0,0,.08);
  transform-origin:center 75%;backface-visibility:hidden;
}
.card:before{
  background:
    radial-gradient(circle at 18% 10%,rgba(255,255,255,.55),transparent 18%),
    linear-gradient(135deg,rgba(255,255,255,.26),transparent 38%,rgba(255,255,255,.03) 72%,rgba(0,0,0,.06));
  opacity:.74
}
.card .center-value{font-weight:950;text-shadow:0 2px 0 rgba(255,255,255,.18),0 5px 12px rgba(0,0,0,.10)}
.card .corner{font-weight:950;letter-spacing:-.5px}
.card.back{
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.13) 0 1px,transparent 2px),
    radial-gradient(circle at 50% 50%,transparent 0 31%,rgba(255,255,255,.055) 32% 33%,transparent 34%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 5px,transparent 5px 10px),
    linear-gradient(145deg,#5030a5 0%,#245f9f 52%,#118578 100%);
  background-size:12px 12px,100% 100%,100% 100%,100% 100%;
}
.card.back:after{content:"✦";font-size:clamp(24px,3vw,42px);filter:drop-shadow(0 4px 5px rgba(0,0,0,.28));text-shadow:0 0 18px rgba(255,255,255,.18)}
.card.neg{background:linear-gradient(145deg,#c9eaff,#6ebcf3 68%,#48a7e9);color:#0d3965}
.card.zero{background:linear-gradient(145deg,#b7f4ff,#55d6ef 68%,#2ebbd9);color:#054e5f}
.card.low{background:linear-gradient(145deg,#c9f7d6,#72dda0 68%,#49c680);color:#105d35}
.card.mid{background:linear-gradient(145deg,#fff2a9,#ffc958 68%,#f3a82d);color:#6f3b00}
.card.high{background:linear-gradient(145deg,#ffd2d4,#ff858d 68%,#ef6472);color:#751c26}
.card.star{background:conic-gradient(from 22deg,#ffe266,#ff9757,#fa5f82,#ad75ff,#5bbaff,#48e4bf,#ffe266);box-shadow:0 6px 0 rgba(0,0,0,.24),0 14px 30px rgba(83,147,255,.14),inset 0 1px 0 rgba(255,255,255,.72)}
.card.star .center-value{font-size:1.12em;filter:drop-shadow(0 4px 6px rgba(0,0,0,.24))}
.card.clickable{will-change:transform,filter}
.card.clickable:hover{transform:translateY(-6px) rotateX(2deg) scale(1.025);filter:saturate(1.05) brightness(1.04)}
.card.clickable:active{transform:translateY(-1px) scale(.985)}
.card.selected{outline:3px solid var(--v8-gold);outline-offset:3px;box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 0 6px rgba(255,217,95,.08),0 0 28px rgba(255,217,95,.22)}
body[data-mode="drawnSwap"] .player.active .card.clickable,
body[data-mode="discardSwap"] .player.active .card.clickable,
body[data-mode="flipOwn"] .player.active .card.clickable,
body[data-mode="setupReveal"] .player.active .card.clickable{
  box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 0 2px hsla(var(--turn-hue),90%,70%,.28),0 0 18px hsla(var(--turn-hue),90%,65%,.13)
}
.card-slot{position:relative;display:grid;place-items:center}

/* PLAYER ARENAS */
.players{align-items:stretch}
.player{
  position:relative;isolation:isolate;overflow:hidden;
  background:
    radial-gradient(circle at 2% 0%,hsla(var(--player-hue),88%,66%,.075),transparent 29%),
    linear-gradient(180deg,rgba(15,49,52,.93),rgba(6,30,33,.97));
  border:1px solid rgba(255,255,255,.085);
  box-shadow:0 14px 36px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.045)
}
.player:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,hsla(var(--player-hue),88%,68%,.75),hsla(var(--player-hue),78%,54%,.18));opacity:.8}
.player.mine{border-color:hsla(var(--player-hue),80%,72%,.20)}
.player.mine:after{content:"DEIN FELD";position:absolute;right:10px;bottom:7px;font-size:6px;font-weight:950;letter-spacing:1.45px;color:hsla(var(--player-hue),75%,80%,.17);pointer-events:none}
.player.active{
  border-color:hsla(var(--player-hue),92%,72%,.52);
  box-shadow:0 0 0 1px hsla(var(--player-hue),92%,72%,.12),0 16px 42px rgba(0,0,0,.28),0 0 30px hsla(var(--player-hue),88%,62%,.10),inset 0 1px 0 rgba(255,255,255,.08)
}
.player.active:before{width:4px;opacity:1;box-shadow:0 0 18px hsla(var(--player-hue),90%,62%,.28)}
.player-head{position:relative;z-index:2}
.avatar{background:linear-gradient(145deg,hsla(var(--player-hue),85%,66%,.24),hsla(var(--player-hue),85%,48%,.12));color:hsl(var(--player-hue),85%,82%);border:1px solid hsla(var(--player-hue),86%,72%,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.player-meta{min-width:0}.player-name{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.player-name .active-tag{display:inline-flex;padding:2px 6px;border-radius:999px;background:hsla(var(--player-hue),86%,60%,.14);border:1px solid hsla(var(--player-hue),86%,70%,.20);color:hsl(var(--player-hue),85%,82%);font-size:6px;font-weight:950;letter-spacing:.65px}
.player .hint{display:flex;gap:7px;flex-wrap:wrap;margin-top:1px}.player .hint span{position:relative}.player .hint span+span:before{content:"·";position:absolute;left:-5px;color:rgba(255,255,255,.20)}

/* === V14 FINAL STABILITY === */
.flow-lock-note{font-size:10px;opacity:.72}
.match-resolve-btn.disabled,.match-resolve-btn:disabled{opacity:.48;filter:saturate(.55);cursor:not-allowed}


/* === V14.1 DISCARD-FIRST SWAP === */
#play-discard-pile.discard-commit-pop>.card{
  animation:discardCommitPop .42s cubic-bezier(.2,.85,.22,1);
}
@keyframes discardCommitPop{
  0%{transform:scale(.93);filter:brightness(1.18)}
  55%{transform:scale(1.055);filter:brightness(1.10)}
  100%{transform:scale(1);filter:brightness(1)}
}
@media(prefers-reduced-motion:reduce){
  #play-discard-pile.discard-commit-pop>.card{animation:none}
}


/* === V14.2 HARD DISCARD COMMIT === */
#play-discard-pile[data-arrival-committed="1"]>.card{
  box-shadow:0 0 0 2px rgba(255,221,92,.34),0 10px 24px rgba(0,0,0,.28);
}


/* ==========================================================
   V15.0 PREMIUM TABLE — FINAL VISUAL PASS
   Quiet luxury, better hierarchy, tablet-first polish.
   ========================================================== */
:root{
  --v15-ink:#eaf8f6;
  --v15-muted:#8fa9aa;
  --v15-gold:#f6d15f;
  --v15-mint:#79e6d4;
  --v15-panel:rgba(7,31,34,.92);
  --v15-panel-2:rgba(10,42,45,.88);
  --v15-line:rgba(255,255,255,.105);
  --v15-line-strong:rgba(255,255,255,.17);
  --v15-shadow:0 18px 44px rgba(0,0,0,.27);
}
html{background:#031113}
body{
  background:
    radial-gradient(1000px 600px at 50% -20%,hsla(var(--turn-hue),82%,60%,.115),transparent 64%),
    radial-gradient(820px 520px at -8% 108%,rgba(47,211,185,.095),transparent 65%),
    radial-gradient(760px 480px at 108% 88%,rgba(111,88,236,.075),transparent 67%),
    linear-gradient(155deg,#020c0e 0%,#061b1d 48%,#031113 100%)!important;
}
body:before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.16;
  background-image:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.22) 0 .5px,transparent .8px),
    radial-gradient(circle at 75% 65%,rgba(255,255,255,.14) 0 .45px,transparent .75px);
  background-size:10px 10px,13px 13px;
}
body:after{
  opacity:.20!important;
  background-size:96px 96px!important;
}
.app{max-width:1540px}

/* HEADER */
.topbar{
  min-height:56px!important;
  border-color:rgba(255,255,255,.11)!important;
  background:
    linear-gradient(180deg,rgba(10,39,42,.94),rgba(4,24,27,.93))!important;
  box-shadow:0 16px 45px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.065)!important;
}
.brand{gap:11px!important}
.brandmark{
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.72),0 8px 20px rgba(0,0,0,.28),0 0 22px hsla(var(--turn-hue),82%,62%,.10)!important;
}
.brand-copy{min-width:0}
.brand h1{font-size:18px!important;line-height:1.02!important;letter-spacing:.15px!important}
.brand-subline{display:flex;align-items:center;gap:7px;margin-top:3px}
.brand-subline small{font-size:7px!important;color:#7f9b9d!important;letter-spacing:.7px!important}
.edition-chip{
  display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:999px;
  font-size:5.8px;font-weight:950;letter-spacing:1px;color:#bdd8d5;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)
}
.top-actions{gap:5px!important}
.iconbtn{
  border-radius:12px!important;
  border-color:rgba(255,255,255,.105)!important;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035))!important;
}
.iconbtn:focus-visible,.pile-card-hit:focus-visible,.market-hit:focus-visible{
  outline:2px solid var(--v15-gold)!important;outline-offset:3px!important
}
.cloud-pill{border-color:rgba(255,255,255,.11)!important;font-weight:850!important}

/* STATUS RAIL */
.premium-status{gap:7px!important;margin:5px 0 7px!important}
.premium-status .stat{
  min-height:48px;padding:7px 9px 6px!important;border-radius:14px!important;
  display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:7px;align-items:center;
  background:linear-gradient(180deg,rgba(17,52,55,.82),rgba(6,29,32,.92))!important;
  border:1px solid rgba(255,255,255,.09)!important
}
.premium-status .stat:after{
  content:attr(data-icon);grid-row:1/3;grid-column:1;width:25px;height:25px;border-radius:9px;
  display:grid;place-items:center;font-size:11px;font-weight:950;color:#9fb9b8;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)
}
.premium-status .stat b{grid-column:2;font-size:13px!important;line-height:1.1;color:#f5fbfa}
.premium-status .stat span{grid-column:2;font-size:5.7px!important;line-height:1.1}
.premium-status .turn-stat{
  border-color:hsla(var(--turn-hue),75%,68%,.27)!important;
  background:linear-gradient(180deg,hsla(var(--turn-hue),45%,24%,.30),rgba(7,31,34,.94))!important
}
.premium-status .turn-stat:after{
  color:hsl(var(--turn-hue),80%,76%);background:hsla(var(--turn-hue),76%,60%,.10);
  border-color:hsla(var(--turn-hue),78%,70%,.16)
}

/* TABLE */
.center-table{
  border-radius:22px!important;
  border-color:rgba(113,231,213,.12)!important;
  background:
    radial-gradient(ellipse at 17% 42%,hsla(var(--turn-hue),82%,61%,.065),transparent 34%),
    radial-gradient(ellipse at 83% 40%,rgba(120,94,255,.060),transparent 35%),
    linear-gradient(165deg,rgba(9,48,49,.985),rgba(3,25,28,.995))!important;
  box-shadow:0 22px 58px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.055),inset 0 0 80px rgba(0,0,0,.08)!important;
}
.center-table:after{
  content:"PREMIUM TABLE · SKYJO ACTION"!important;
  font-size:6px!important;letter-spacing:3.2px!important;color:rgba(255,255,255,.052)!important
}
.handbox,.watchbox,.pilebox{min-width:0}
.pilebox{
  border-radius:17px!important;
  background:linear-gradient(180deg,rgba(2,26,29,.58),rgba(2,18,20,.43))!important;
  border-color:rgba(255,255,255,.082)!important
}
.section-heading{
  display:flex;align-items:center;justify-content:center;gap:7px;margin:0 0 7px;
  min-height:27px
}
.section-heading .section-icon{
  width:23px;height:23px;border-radius:8px;display:grid;place-items:center;font-size:11px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.075)
}
.section-heading h4{margin:0!important;font-size:9px!important;color:#c4d6d5!important;letter-spacing:1px!important}
.section-heading small{display:block;margin-top:1px;font-size:5.5px;color:#748f91;text-transform:uppercase;letter-spacing:.7px;font-weight:850}

/* PREMIUM PILES */
.premium-piles{gap:16px!important;align-items:flex-end!important}
.pile-unit{position:relative;display:grid;justify-items:center;gap:4px}
.pile-overline{
  font-size:5.8px;font-weight:950;letter-spacing:1.25px;color:#708c8e;
  text-transform:uppercase
}
.pile-card-hit{
  padding:5px 6px 7px!important;border-radius:16px!important;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.07));
  border:1px solid rgba(255,255,255,.055)
}
.pile-card-hit:after{
  content:"";position:absolute;left:13%;right:13%;bottom:-5px;height:7px;border-radius:50%;
  background:rgba(0,0,0,.28);filter:blur(3px);z-index:-1;pointer-events:none
}
.pile-card-hit.enabled{
  border-color:hsla(var(--turn-hue),76%,70%,.25);
  box-shadow:0 0 0 2px hsla(var(--turn-hue),80%,65%,.055),0 10px 22px rgba(0,0,0,.18)
}
.pile-count-chip{
  position:absolute;right:-5px;top:-6px;z-index:9;min-width:22px;height:22px;padding:0 5px;
  display:grid;place-items:center;border-radius:999px;font-size:7px;font-weight:950;color:#d8e9e7;
  background:#14383b;border:2px solid #082326;box-shadow:0 5px 12px rgba(0,0,0,.26)
}
.pile-count-chip.discard-count{background:#594817;color:#ffe999}
.pile-tip{
  min-width:58px!important;padding:3px 7px!important;font-size:6.5px!important;letter-spacing:.65px!important
}
.buried-mini{bottom:-12px!important;font-size:6.3px!important}

/* CARDS */
.card{
  border-radius:13px!important;border-color:rgba(255,255,255,.52)!important;
  box-shadow:0 7px 0 rgba(0,0,0,.235),0 14px 26px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.76),inset 0 -1px 0 rgba(0,0,0,.08)!important
}
.card:before{
  border-radius:inherit;
  background:
    linear-gradient(125deg,rgba(255,255,255,.34),transparent 27% 72%,rgba(0,0,0,.055)),
    radial-gradient(circle at 24% 11%,rgba(255,255,255,.48),transparent 16%)!important
}
.card .center-value{
  letter-spacing:-1.7px;font-weight:950!important;
  text-shadow:0 2px 0 rgba(255,255,255,.16),0 5px 10px rgba(0,0,0,.10)!important
}
.card .corner{
  padding:2px 3px;border-radius:5px;background:rgba(255,255,255,.12);backdrop-filter:blur(2px)
}
.card.back{
  border-color:rgba(162,209,234,.32)!important;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.10) 0 1px,transparent 1.5px),
    linear-gradient(135deg,transparent 0 46%,rgba(255,255,255,.055) 47% 53%,transparent 54%),
    linear-gradient(45deg,transparent 0 46%,rgba(255,255,255,.038) 47% 53%,transparent 54%),
    linear-gradient(145deg,#47329b 0%,#28619b 50%,#12837b 100%)!important;
  background-size:10px 10px,20px 20px,20px 20px,100% 100%!important
}
.card.back:after{opacity:.94!important}
.card.star{filter:saturate(.96)}
.card.clickable:hover{
  transform:translateY(-5px) scale(1.018)!important;
  box-shadow:0 8px 0 rgba(0,0,0,.22),0 18px 30px rgba(0,0,0,.25),0 0 22px hsla(var(--turn-hue),75%,66%,.08)!important
}
.card-slot{border-radius:15px}
body[data-mode="drawnDecision"] .player.active .card-slot:has(.card.clickable),
body[data-mode="discardSwap"] .player.active .card-slot:has(.card.clickable),
body[data-mode="flipOwn"] .player.active .card-slot:has(.card.clickable){
  background:hsla(var(--player-hue),78%,60%,.035)
}
.match-ready-slot:after{
  content:"KOMBI";position:absolute;right:-4px;top:-5px;z-index:8;padding:2px 5px;border-radius:999px;
  font-size:5px;font-weight:950;letter-spacing:.7px;color:#5b4200;background:#ffe275;
  border:1px solid rgba(255,255,255,.55);box-shadow:0 4px 10px rgba(0,0,0,.20)
}

/* PLAYER PANELS */
.player{
  border-radius:20px!important;
  background:
    radial-gradient(circle at 0% 0%,hsla(var(--player-hue),84%,65%,.075),transparent 30%),
    linear-gradient(180deg,rgba(14,47,50,.95),rgba(5,27,30,.985))!important;
  border-color:rgba(255,255,255,.085)!important;
  box-shadow:0 16px 38px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05)!important
}
.player:before{width:3px!important}
.player.active{
  border-color:hsla(var(--player-hue),90%,74%,.48)!important;
  box-shadow:0 0 0 2px hsla(var(--player-hue),84%,65%,.075),0 18px 46px rgba(0,0,0,.29),0 0 28px hsla(var(--player-hue),88%,62%,.085)!important
}
.player.active:after{
  content:"AKTIVER SPIELER";position:absolute;right:9px;top:7px;bottom:auto;
  font-size:5.2px;font-weight:950;letter-spacing:1.15px;color:hsl(var(--player-hue),76%,82%);
  padding:3px 6px;border-radius:999px;background:hsla(var(--player-hue),78%,58%,.095);
  border:1px solid hsla(var(--player-hue),82%,70%,.13);pointer-events:none
}
.player.mine:not(.active):after{
  content:"DEIN FELD";position:absolute;right:10px;bottom:7px;top:auto;
  font-size:5.5px;font-weight:950;letter-spacing:1.25px;color:hsla(var(--player-hue),75%,80%,.16)
}
.player-head{
  padding-bottom:7px;margin-bottom:8px!important;border-bottom:1px solid rgba(255,255,255,.055)
}
.avatar{
  width:31px!important;height:31px!important;border-radius:11px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 5px 12px rgba(0,0,0,.17)!important
}
.player-name{font-size:12px!important;line-height:1.05}
.ai-tag,.you-tag,.active-tag{white-space:nowrap}
.ai-tag,.you-tag{
  display:inline-flex;padding:2px 5px;border-radius:999px;font-size:5.5px;font-weight:950;letter-spacing:.55px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045)
}
.ai-tag{color:#a8d8ff}.you-tag{color:#9df0dc}
.player-meta-chips{gap:4px!important;margin-top:4px!important}
.player-meta-chips .meta-chip{
  display:inline-flex;align-items:center;min-height:16px;padding:2px 5px;border-radius:999px;
  font-size:5.7px!important;font-weight:850;color:#8ea8a9;background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.055)
}
.player-meta-chips .meta-chip+span:before{display:none!important}
.player-meta-chips .open-chip{color:#9fd6ce}
.player-meta-chips .action-chip{color:#d3c6ff}
.scorechip{border-radius:11px!important}
.progress-chip{height:25px;display:grid!important;place-items:center}
.reveal-meter{height:3px!important;margin-top:5px!important;border-radius:99px;overflow:hidden}
.grid{
  padding:3px;border-radius:16px;
  background:rgba(0,0,0,.065);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)
}

/* MATCH / OPTIONAL ROW */
.match-actions{
  border-radius:13px!important;padding:7px 8px!important;
  background:linear-gradient(180deg,rgba(255,208,76,.075),rgba(255,255,255,.018))!important
}
.match-actions-title{color:#eedb8a!important}
.match-resolve-btn{
  border-radius:10px!important;font-weight:900!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)
}

/* HAND ZONE */
.real-hand-zone{
  border-radius:19px!important;
  background:
    radial-gradient(circle at 13% 50%,hsla(var(--turn-hue),78%,65%,.085),transparent 36%),
    linear-gradient(180deg,rgba(8,34,37,.96),rgba(4,24,27,.97))!important;
  border-color:rgba(255,219,103,.16)!important;
  box-shadow:0 14px 30px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.055)!important
}
.real-hand-zone:before{content:"HANDZONE · AKTUELLE KARTE"!important;color:rgba(255,223,123,.30)!important}
.real-hand-card{
  border-radius:15px!important;background:rgba(0,0,0,.10)!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)
}
.real-hand-card.empty{
  border:1px dashed rgba(255,255,255,.12)!important;color:rgba(255,255,255,.16)!important
}
.real-hand-copy .eyebrow{color:#829c9d!important;letter-spacing:1.15px!important}
.real-hand-copy b{font-size:12px!important;letter-spacing:.05px}
.real-hand-copy small{color:#7f999b!important;line-height:1.35}

/* LIVE PANEL */
.watch-panel{
  border-radius:18px!important;
  background:linear-gradient(180deg,rgba(7,28,39,.93),rgba(7,31,33,.90))!important;
  border-color:rgba(255,255,255,.085)!important;
  box-shadow:0 13px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.045)!important
}
.watch-headline{
  padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.05)
}
.watch-headline b{letter-spacing:.15px}
.watch-headline span{
  padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.055)
}
.watch-card-stage{
  border-radius:13px!important;background:rgba(0,0,0,.10)!important;
  border-color:rgba(255,255,255,.065)!important
}
.watch-copy b{color:#eef8f7!important}.watch-copy small{line-height:1.4}

/* BOTTOM COMMAND BAR */
.bottom-actions{
  border-top-color:rgba(255,255,255,.10)!important;
  background:linear-gradient(180deg,rgba(5,26,29,.94),rgba(2,16,18,.985))!important;
  box-shadow:0 -16px 42px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.035)!important
}
.bottom-inner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;max-width:1500px!important}
.instruction{
  position:relative;text-align:left!important;margin:0!important;padding-left:19px;
  color:#e7f4f3!important;font-size:10px!important;line-height:1.25!important
}
.instruction:before{
  content:"";position:absolute;left:0;top:50%;width:8px;height:8px;border-radius:50%;
  transform:translateY(-50%);background:hsl(var(--turn-hue),78%,63%);
  box-shadow:0 0 0 4px hsla(var(--turn-hue),78%,63%,.08)
}
.action-buttons{padding:0!important;max-width:760px}
.action-buttons button{
  min-height:36px!important;padding:7px 12px!important;border-radius:11px!important;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035))!important;
  border-color:rgba(255,255,255,.09)!important;color:#eef7f6!important
}
.action-buttons button.primary{
  background:linear-gradient(135deg,hsla(var(--turn-hue),76%,49%,.80),rgba(89,73,196,.92))!important;
  border-color:hsla(var(--turn-hue),80%,70%,.18)!important
}
.turn-state-pill,.waiting-note,.ai-thinking{
  border-radius:10px!important;padding:7px 10px!important;border:1px solid rgba(255,255,255,.08)!important;
  background:rgba(255,255,255,.045)!important
}

/* MODALS */
.modal-back{background:rgba(0,8,10,.74)!important;backdrop-filter:blur(10px) saturate(115%)!important}
.modal{
  border:1px solid rgba(255,255,255,.11)!important;
  background:
    radial-gradient(circle at 8% 0%,hsla(var(--turn-hue),75%,60%,.075),transparent 30%),
    linear-gradient(180deg,rgba(13,43,46,.985),rgba(5,25,28,.995))!important;
  box-shadow:0 34px 90px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.065)!important;
}
.modal h3{color:#f3fbfa!important;letter-spacing:-.15px}
.modal p{color:#91aaab!important}
.modal-actions button,.choice{
  border-radius:12px!important;border-color:rgba(255,255,255,.09)!important;
  background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.035))!important
}
.modal-actions button.primary{
  background:linear-gradient(135deg,hsla(var(--turn-hue),72%,48%,.80),#5f4dc5)!important;color:white!important
}

/* SETUP */
.hero{
  overflow:hidden!important;border-radius:24px!important;
  background:
    radial-gradient(circle at 15% 0%,rgba(255,218,88,.10),transparent 28%),
    radial-gradient(circle at 90% 14%,rgba(82,220,202,.08),transparent 32%),
    linear-gradient(165deg,rgba(11,43,46,.96),rgba(5,27,30,.99))!important
}
.setup-brand{display:flex;align-items:center;justify-content:center;gap:16px;text-align:left;margin:5px auto 14px}
.setup-mark{margin:0!important;width:66px!important;height:66px!important;border-radius:20px!important;flex:0 0 66px}
.setup-kicker{display:block;font-size:7px;font-weight:950;letter-spacing:1.8px;color:#789497;margin-bottom:4px}
.hero .setup-brand h2{margin:0!important;font-size:34px!important;letter-spacing:-1.2px}
.hero .setup-brand h2 em{font-style:normal;color:var(--accent)}
.hero .setup-brand p{margin:4px 0 0!important;text-align:left}
.setup-feature-row{
  display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:-2px auto 15px
}
.setup-feature-row span{
  padding:5px 8px;border-radius:999px;font-size:7px;font-weight:850;color:#a8c0c0;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)
}
.field input,.field select{
  border-radius:12px!important;border-color:rgba(255,255,255,.09)!important;
  background:rgba(0,0,0,.14)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)
}
.field label{letter-spacing:.45px}
.toggle-box,.ai-setup-card{
  border-radius:15px!important;border-color:rgba(255,255,255,.08)!important;background:rgba(255,255,255,.028)!important
}

/* Tablet landscape refinement */
@media (min-width:900px) and (orientation:landscape){
  .premium-status .stat{min-height:42px;padding:5px 7px!important}
  .premium-status .stat:after{width:21px;height:21px;border-radius:7px;font-size:9px}
  .premium-status .stat b{font-size:11px!important}
  .bottom-inner{grid-template-columns:minmax(220px,1fr) auto}
  .player-head{padding-bottom:5px;margin-bottom:6px!important}
  .player-meta-chips{margin-top:2px!important}
  .player-meta-chips .meta-chip{min-height:14px;padding:1px 4px;font-size:5.2px!important}
  .premium-piles{gap:13px!important}
  .section-heading{margin-bottom:4px}
}
@media (max-width:1050px) and (orientation:landscape){
  .premium-status .stat:after{display:none}
  .premium-status .stat{display:block;text-align:center;min-height:38px}
  .bottom-inner{grid-template-columns:1fr auto;gap:8px}
  .instruction{font-size:8.5px!important}
  .edition-chip{display:none}
}

/* ==========================================================
   V15.24 · GROSSE SPIELHINWEISE
   Nur transform + opacity: auffällig, aber sehr leicht für Tablets.
   ========================================================== */
.game-announcement{
  position:fixed;
  inset:0;
  z-index:4200;
  display:grid;
  place-items:center;
  pointer-events:none;
  padding:24px;
  opacity:0;
  background:rgba(1,11,14,.16);
  transition:opacity .18s ease;
}
.game-announcement.show{opacity:1}
.game-announcement.leave{opacity:0}

.game-announcement-inner{
  width:min(760px,88vw);
  min-height:190px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 34px;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(145deg,rgba(5,31,34,.96),rgba(7,49,48,.96));
  box-shadow:0 22px 54px rgba(0,0,0,.34);
  transform:scale(.82) translateY(12px);
  opacity:.2;
  transition:transform .32s cubic-bezier(.2,.82,.2,1),opacity .24s ease;
}
.game-announcement.show .game-announcement-inner{
  transform:scale(1) translateY(0);
  opacity:1;
}
.game-announcement.leave .game-announcement-inner{
  transform:scale(.96) translateY(-8px);
  opacity:0;
}

.game-announcement-eyebrow{
  margin-bottom:10px;
  font-size:clamp(11px,1.7vw,17px);

  letter-spacing:.22em;

}
.game-announcement-title{
  font-size:clamp(42px,8vw,92px);

  font-weight:1000;

  text-shadow:0 4px 18px rgba(0,0,0,.28);
}
.game-announcement-subtitle{
  margin-top:16px;
  max-width:640px;
  font-size:clamp(14px,2.3vw,23px);
  line-height:1.25;
  font-weight:800;
  color:rgba(255,255,255,.82);
}

.game-announcement.final-round .game-announcement-inner{
  border-color:rgba(255,201,73,.42);

}

}

}

}

  color:#8fffe0;
}

    width:min(94vw,560px);
    min-height:150px;
    border-radius:22px;

  }
}

body.is-playing:before{opacity:.04!important;}
body.is-playing .app{max-width:1740px!important;padding-left:12px!important;padding-right:12px!important;}
body.is-playing .topbar{
 border:1px solid rgba(202,155,75,.35)!important;
 border-radius:14px!important;
 background:linear-gradient(180deg,#19140fF5,#0b1015F7)!important;
 box-shadow:0 3px 0 rgba(234,180,89,.13),0 10px 28px rgba(0,0,0,.5)!important;
}
body.is-playing .brand h1{font-family:Georgia,serif;letter-spacing:1.15px!important;color:#fff0ca}
body.is-playing .brand h1 span{color:#f1cd74!important}
body.is-playing .edition-chip{color:#ecc17f;border-color:rgba(231,172,76,.32);background:rgba(173,113,34,.11)}
body.is-playing .iconbtn,body.is-playing .cloud-pill{
 background:linear-gradient(180deg,#231d18,#101215)!important;
 border:1px solid rgba(222,170,87,.32)!important;
 color:#f8ead2;
}
body.is-playing .iconbtn:hover{background:#3c2c1d!important}
body.is-playing .skyjo-hub-link{
 background:linear-gradient(145deg,#3b2d18,#181b1c)!important;
 border:1px solid #a9844b!important;
 color:#fff0d3!important;
}
body.is-playing .premium-status .stat{
 background:linear-gradient(175deg,#202023,#0b1117)!important;
 border:1px solid #735735!important;
 box-shadow:inset 0 1px 0 #e0ad5329,0 3px 8px #06060677;
}
body.is-playing .premium-status .stat:after{
 color:#dfb76e;background:rgba(160,117,51,.13);border-color:rgba(197,148,69,.19)
}
body.is-playing .premium-status .stat b{color:#f8e8c3!important}
body.is-playing .premium-status .stat span{color:#bbac98!important}
body.is-playing .premium-status .turn-stat{
 border-color:#dfad53!important;
 background:linear-gradient(175deg,#483118,#121317)!important;
 box-shadow:0 0 0 2px #e6b96620,inset 0 1px 0 #ffd99966!important
}
body.is-playing .premium-status .turn-stat b{color:#ffe09b!important}
body.is-playing .player{
 overflow:hidden;
 border-radius:20px!important;
 border:2px solid #7c5c32!important;
 background:linear-gradient(180deg,#17252acF,#091219F7)!important;
 box-shadow:inset 0 0 0 2px rgba(233,171,69,.08),0 6px 3px #050403a1,0 14px 25px #050403a8!important;
}
body.is-playing .player:before{width:0!important}
body.is-playing .player.active{
 border-color:#f1c46d!important;
 background:linear-gradient(180deg,#493118F5 0%,#211b15F5 25%,#080e15F7 48%)!important;
 box-shadow:inset 0 0 0 2px #edc7793d,0 0 0 2px #ebbd644d,0 13px 30px #0d0705c7!important;
}
body.is-playing .player.active:after{background:rgba(241,191,99,.13);color:#f7d792;border-color:#f1c16c66}
body.is-playing .player-head{
 background:linear-gradient(90deg,#b58a3a38,#14192217);
 border-bottom:1px solid #e5ae6633!important;
 border-radius:11px;
 padding:7px 6px 9px!important;
}
body.is-playing .player.active .player-head{background:linear-gradient(90deg,#f1bc61a8,#71471b33)!important}
body.is-playing .player-name{font-family:Georgia,serif;font-weight:800!important;color:#fff1d5!important;font-size:clamp(12px,1.2vw,17px)!important}
body.is-playing .avatar{border:1px solid #c99d5d!important;border-radius:50%!important;background:linear-gradient(150deg,#6b4c25,#292017)!important;color:#f6d393!important}
body.is-playing .scorechip{background:#13181c!important;border:1px solid #96704755!important;color:#eaca91!important}
body.is-playing .progress-chip{border-color:#94704377!important;color:#e6c68c!important}
body.is-playing .player-meta-chips .meta-chip{background:#10171bbf!important;border-color:#a7844833!important;color:#dec6a2!important}
body.is-playing .grid{
 display:grid!important;
 grid-template-columns:repeat(4,var(--card-w));
 gap:5px!important;
 justify-content:center!important;
 background:linear-gradient(145deg,#06121cb5,#090d15c9)!important;
 border:1px solid #ce9b5633;
 padding:7px!important;
 border-radius:14px;
}
body.is-playing .card-slot{padding:2px!important;border-radius:10px!important;background:#04091270!important}
body.is-playing .card{
 border-radius:9px!important;
 border:1px solid rgba(231,184,104,.76)!important;
 box-shadow:0 3px 0 #080a10d0,0 6px 9px #0304089c,inset 0 0 0 2px #ebbb6530!important;
}
body.is-playing .card.back{
 background:
   repeating-linear-gradient(45deg,rgba(238,197,112,.056) 0 1px,transparent 1px 8px),
   repeating-linear-gradient(135deg,rgba(252,216,158,.044) 0 1px,transparent 1px 8px),
   radial-gradient(ellipse at 50% 35%,#244769,#12273f 64%,#061829)!important;
}
body.is-playing .card.back:after{content:"◇"!important;color:#e3b368!important;font-family:Georgia,serif;font-weight:normal!important;font-size:clamp(25px,3.6vw,43px)!important;text-shadow:0 0 6px #cc9f5888!important}
body.is-playing .card.back:before{background:linear-gradient(130deg,#fff2d619,transparent 48%),linear-gradient(#ebbc6120,#ebbc6120)!important;inset:3px;border:1px solid #cf9e4855;border-radius:6px}
body.is-playing .card.selected{outline:3px solid #f7d783!important}
body.is-playing .center-table{
 background:linear-gradient(165deg,#0c1820fa,#10171bfA 62%,#0a1118fA)!important;
 border:2px solid #a87942!important;
 border-radius:19px!important;
 box-shadow:inset 0 0 0 2px #f1ba6340,0 8px 25px #050302cc!important;

   Kartenflug-Animationen verwenden weiterhin korrekte Bounds.
   =========================================================== */
body.is-playing .play-pilebox .premium-piles{
  display:flex!important;
  flex-wrap:wrap!important;
  justify-content:center!important;
  align-items:flex-start!important;

  row-gap:13px!important;

  max-width:100%;

  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  min-width:0;
  max-width:100%;
}
body.is-playing .play-pilebox .premium-piles .pile-card-hit > .card{
  width:calc(var(--card-w) * 2)!important;
  height:calc(var(--card-h) * 2)!important;
  max-width:none!important;
  flex:0 0 auto!important;

   bewusst flacher angezeigt. Diese Proportion bleibt erhalten. */
@media (min-width:1100px) and (orientation:landscape){
  body.is-playing[data-players="4"] .play-pilebox .premium-piles .pile-card-hit > .card{

  }
}
/* Die 4-Spieler-Mitte hat sonst eine fest auf kleine Stapel
   abgestimmte Zeilenhöhe. Große Karten benötigen echte Höhe. */
body.is-playing[data-players="4"] .four-player-layout .center-table{
  grid-template-rows:none!important;
  grid-auto-rows:auto!important;
}

  height:auto!important;

body.is-playing .play-pilebox .premium-piles .card .corner{

   V111 – stabile Handzone, keine springenden Spielkarten
   Die maximale Handkarten-Entscheidung (Hinweis + Ablageknopf)
   erhält schon vor dem Ziehen genug Platz. Damit verändert das
   Ein-/Ausblenden der Aktionen die Position der Stapel nicht.

/* V117 table message zone */
.table-message-zone{max-width:1500px;margin:10px auto 6px;min-height:0;transition:min-height .22s ease,margin .22s ease;position:relative;z-index:3}
.table-message-zone.empty{min-height:0;margin:4px auto 0}
.table-message-zone:not(.empty){min-height:118px}
.table-message-card{display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-radius:22px;border:1px solid rgba(235,198,120,.22);background:radial-gradient(circle at 12% 0,rgba(255,213,103,.08),transparent 34%),linear-gradient(180deg,rgba(18,44,47,.92),rgba(10,29,31,.96));box-shadow:0 18px 34px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05);opacity:0;transform:translateY(10px) scale(.985);transition:opacity .22s ease,transform .28s ease}
.table-message-card.show{opacity:1;transform:translateY(0) scale(1)}
.table-message-icon{width:74px;height:74px;border-radius:21px;display:grid;place-items:center;font-size:38px;color:#fff8e1;background:linear-gradient(180deg,rgba(255,222,127,.20),rgba(255,255,255,.05));border:1px solid rgba(255,228,147,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 12px 26px rgba(0,0,0,.18)}
.table-message-copy{min-width:0;display:flex;flex-direction:column;gap:7px}
.table-message-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.table-message-kicker{font-size:12px;font-weight:1000;letter-spacing:1.25px;color:#f0d289;text-transform:uppercase}
.table-message-by{font-size:11px;font-weight:800;color:#b8cecf}
.table-message-text{font-size:clamp(17px,1.45vw,24px);line-height:1.3;font-weight:800;color:#f7f6ef;text-wrap:balance}
.table-message-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.table-message-ref{font-size:12px;color:#ffe7a4;font-weight:900;letter-spacing:.4px}
.table-message-note{font-size:11px;color:#98afaf}
.table-message-progress{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:2px}
.table-message-progress i{display:block;height:100%;width:100%;transform-origin:left center;background:linear-gradient(90deg,#f8da7f,#78e0db 55%,#7aaeff);transition:transform linear}
.table-message-progress i.run{transform:scaleX(0)}

.table-message-card.kind-stromberg .table-message-icon{background:linear-gradient(180deg,rgba(125,172,255,.25),rgba(120,69,45,.18));}
.table-message-card.kind-bible .table-message-icon{background:linear-gradient(180deg,rgba(255,218,132,.28),rgba(74,52,16,.16));}
.table-message-card.kind-joke .table-message-icon{background:linear-gradient(180deg,rgba(255,214,108,.28),rgba(105,72,11,.16));}
.table-message-card.kind-surprise .table-message-icon{background:linear-gradient(180deg,rgba(183,132,255,.28),rgba(58,34,97,.20));}
@media(max-width:900px){.table-message-zone:not(.empty){min-height:110px}.table-message-card{grid-template-columns:60px minmax(0,1fr);gap:12px;padding:12px 13px}.table-message-icon{width:60px;height:60px;font-size:31px;border-radius:18px}.table-message-text{font-size:16px}.table-message-kicker{font-size:11px}}

body.is-playing #tableMessageZone .table-message-kicker{font-size:10px;letter-spacing:.5px}
body.is-playing #tableMessageZone .table-message-by{font-size:10px}
body.is-playing #tableMessageZone .table-message-note{font-size:9px}
body.is-playing #tableMessageZone .table-message-progress{height:4px;margin-top:0}
body.is-playing #tableMessageZone.compact-overlay{z-index:26}
@media(max-width:650px){
  body.is-playing #tableMessageZone .table-message-card{
    grid-template-columns:40px minmax(0,1fr)!important;
    gap:7px;padding:9px 9px 10px;border-radius:14px
  }
  body.is-playing #tableMessageZone .table-message-icon{
    width:40px;height:40px;font-size:23px;border-radius:11px
  }
  body.is-playing #tableMessageZone .table-message-text{font-size:13px;line-height:1.3}
  body.is-playing #tableMessageZone .table-message-kicker{font-size:10px}
  body.is-playing #tableMessageZone .table-message-by{font-size:9px}
  body.is-playing #tableMessageZone .table-message-note{font-size:9px}
}

/* Narrow fallback: one clear reading strip, without covering other hands. */
body.is-playing #tableMessageZone.tight-message .table-message-card{
 grid-template-columns:minmax(0,1fr)!important;gap:3px!important;
 padding:5px 8px 5px!important;border-radius:10px!important
}
body.is-playing #tableMessageZone.tight-message .table-message-icon{display:none!important}
body.is-playing #tableMessageZone.tight-message .table-message-copy{gap:2px!important}
body.is-playing #tableMessageZone.tight-message .table-message-text{font-size:11px!important;line-height:1.24!important}
body.is-playing #tableMessageZone.tight-message .table-message-kicker{font-size:9px!important}
body.is-playing #tableMessageZone.tight-message .table-message-by,
body.is-playing #tableMessageZone.tight-message .table-message-note{display:none!important}
body.is-playing #tableMessageZone.tight-message .table-message-progress{height:2px!important}

/* V121 – Helle Leseoberfläche für alle Sprüche, Witze und Bibelverse.
   Nur Farben ändern; die kompakte V120-Platzierung bleibt unverändert. */
body.is-playing #tableMessageZone .table-message-card{
  background:#ffffff!important;
  color:#17212f!important;
  border:1px solid #d5dce4!important;
  box-shadow:0 9px 24px rgba(0,0,0,.18),0 1px 3px rgba(16,24,40,.10)!important;
}
body.is-playing #tableMessageZone .table-message-icon,
body.is-playing #tableMessageZone .table-message-card.kind-heinz .table-message-icon,
body.is-playing #tableMessageZone .table-message-card.kind-stromberg .table-message-icon,
body.is-playing #tableMessageZone .table-message-card.kind-bible .table-message-icon,
body.is-playing #tableMessageZone .table-message-card.kind-joke .table-message-icon,
body.is-playing #tableMessageZone .table-message-card.kind-surprise .table-message-icon{
  background:#ffffff!important;
  color:#1f2937!important;
  border:1px solid #e1e6eb!important;
  box-shadow:0 2px 6px rgba(15,23,42,.08)!important;
}
body.is-playing #tableMessageZone .table-message-text{color:#101820!important;}
body.is-playing #tableMessageZone .table-message-kicker{color:#3b3426!important;}
body.is-playing #tableMessageZone .table-message-by{color:#475569!important;}
body.is-playing #tableMessageZone .table-message-ref{color:#344f78!important;}
body.is-playing #tableMessageZone .table-message-note{color:#526170!important;}
body.is-playing #tableMessageZone .table-message-progress{background:#e8edf2!important;}
body.is-playing #tableMessageZone .table-message-progress i{
  background:linear-gradient(90deg,#b98224,#e8b75b)!important;
}
