<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>SKYJO ACTION · Wald · Layout-Prototyp</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b17;color:#f7f0d8;font-family:system-ui,-apple-system,sans-serif}button,input{font:inherit}#stage{position:absolute;width:1920px;height:1080px;left:50%;top:50%;transform-origin:center;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#285746 0%,#123b31 45%,#071d19 100%)}#stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 110px,#e2c98b07 112px 114px);pointer-events:none}.zone{position:absolute;border:3px solid #a88145;border-radius:24px;background:linear-gradient(135deg,#1b4b3dbb,#112e28ed);box-shadow:inset 0 0 0 3px #d8b57424,0 8px 24px #0008;overflow:hidden}.zone.player{padding:16px 20px}.zone.player.active{border-color:#ffd875;box-shadow:0 0 0 5px #f8d27d88,inset 0 0 0 3px #fff5c444,0 0 32px #ffd66b66}.label{font-weight:800;letter-spacing:.03em;font-size:29px;display:flex;align-items:center;justify-content:space-between;height:42px;text-shadow:0 2px 4px #000}.badge{font-size:19px;border-radius:20px;padding:5px 16px;background:#102e27;border:1px solid #a48b57}.cards{height:calc(100% - 56px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;min-height:0}.card{min-width:0;min-height:0;border-radius:12px;border:3px solid #e6c27e;background:linear-gradient(140deg,#356c66,#164740 60%,#0e332f);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px #ffffff20,0 4px 7px #0007;color:#d4e9d5;font-size:36px;font-weight:900}.card:after{content:"❧";font-size:55px;opacity:.38}.player.small .label{height:36px;font-size:24px}.player.small .cards{height:calc(100% - 45px);gap:9px}.player.small .card{border-width:2px;border-radius:9px}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px}.center h2{font-size:27px;margin:0;color:#ffe4a5}.handcard{width:125px;height:165px;border-radius:15px;border:4px solid #d8b46d;background:#d8ead9;color:#154434;font-size:82px;font-weight:900;display:grid;place-items:center}.piles{display:flex;align-items:center;justify-content:space-evenly;gap:12px;width:100%;height:100%}.pile{text-align:center;font-size:23px;font-weight:700}.pile .card{width:130px;height:175px;margin:12px auto 0}.pile .card.open{background:#e7e3c8;color:#245c47}.pile .card.open:after{content:"7";opacity:1;font-size:85px}.foot{display:flex;align-items:center;justify-content:center;gap:14px;font-size:25px;font-weight:800;padding:8px;background:#14362aee;border-color:#a48b56}.foot button{background:#2a5945;color:#ffe8b1;border:2px solid #bc9a5c;border-radius:12px;padding:6px 14px;cursor:pointer}.foot button:focus-visible{outline:4px solid #fff}.foot small{font-size:18px}.topnote{position:absolute;left:42%;top:4%;width:21%;text-align:center;font-size:31px;font-weight:900;color:#ffe0a3;text-shadow:0 4px 12px #000}.notice{position:fixed;z-index:10;top:8px;left:8px;padding:7px 12px;border-radius:9px;background:#091e1cdd;color:#ffe7aa;font-size:12px;max-width:70vw}.notice strong{color:#fff}.import{position:fixed;right:8px;top:8px;z-index:11;background:#244d40;color:#fff3d5;border:1px solid #c6a36a;border-radius:8px;padding:8px;cursor:pointer;font-size:12px}#upload{display:none}
</style></head><body>
<div id="stage"><div class="topnote">🌲 SKYJO ACTION 🌲</div></div>
<button id="fullscreen" type="button" aria-label="Vollbild aktivieren" style="position:fixed;z-index:12;right:160px;top:8px;background:#244d40;color:#fff3d5;border:1px solid #c6a36a;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px">⛶ Vollbild</button><div class="notice"><strong>Layout-Prototyp · 3 Spieler</strong> · Noch keine Spiellogik · Positionen aus deiner JSON</div><label class="import" for="upload">📐 Layout-JSON laden</label><input type="file" id="upload" accept=".json,application/json">
<script>
"use strict";
const initial=[{"id":"stats","x":21.9,"y":93.3,"w":40,"h":3.9,"z":3},{"id":"player1","x":0.2,"y":0.2,"w":40,"h":91.2,"z":1},{"id":"hand","x":42.2,"y":17.7,"w":21,"h":25,"z":1},{"id":"deck","x":41.9,"y":51,"w":21.1,"h":35.5,"z":1},{"id":"player2","x":66.2,"y":0.2,"w":33.6,"h":44.9,"z":1},{"id":"player3","x":66.2,"y":45.6,"w":33.6,"h":45.8,"z":1},{"id":"status","x":0.4,"y":92.4,"w":20,"h":7,"z":1},{"id":"reactions","x":65.9,"y":93.1,"w":20,"h":6,"z":2},{"id":"pause","x":88.7,"y":93.5,"w":8.9,"h":4.7,"z":1}];
const stage=document.getElementById("stage");let zones=[];
const zoneContent={
player1:()=>player("Spieler 1",false,true),player2:()=>player("Spieler 2",true,false),player3:()=>player("Spieler 3",true,false),
hand:()=>'<div class="center"><h2>Handkarte</h2><div class="handcard">?</div></div>',
deck:()=>'<div class="piles"><div class="pile">Nachziehen<div class="card"></div></div><div class="pile">Ablage<div class="card open"></div></div></div>',
stats:()=>'<span>📊 Runde 1 / 12 · Punkte: 0</span>',
status:()=>'<span>🟡 Spieler 1 am Zug</span>',
reactions:()=>'<span>😀 😂 ❤️ 👍 👏</span>',
pause:()=>'<button type="button">🚻</button><button type="button">📖</button>'
};
function player(name,small,active){return '<div class="label"><span>'+name+'</span><span class="badge">0 Punkte</span></div><div class="cards">'+Array.from({length:12},()=>'<div class="card" aria-label="Verdeckte Karte"></div>').join('')+'</div>'}
function validate(blocks){const ids=new Set(initial.map(b=>b.id));if(!Array.isArray(blocks)||blocks.length!==9)throw Error("Es werden genau neun Layoutbereiche benötigt.");const seen=new Set();for(const b of blocks){if(!ids.has(b.id)||seen.has(b.id)||!["x","y","w","h"].every(k=>Number.isFinite(b[k]))||b.w<=0||b.h<=0)throw Error("Ungültiger Bereich: "+b.id);seen.add(b.id)}}
function render(blocks){validate(blocks);stage.querySelectorAll(".zone").forEach(el=>el.remove());zones=blocks;for(const b of blocks){const el=document.createElement("section");el.className="zone "+(b.id.startsWith("player")?"player "+(b.id!=="player1"?"small ":"")+(b.id==="player1"?"active":""):b.id==="hand"?"center":b.id==="deck"?"": "foot");el.dataset.id=b.id;el.style.cssText="left:"+b.x+"%;top:"+b.y+"%;width:"+b.w+"%;height:"+b.h+"%;z-index:"+(b.z||1);el.innerHTML=zoneContent[b.id]();stage.appendChild(el)}}
function fit(){const scale=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform="translate(-50%,-50%) scale("+scale+")"}
document.getElementById("upload").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const json=JSON.parse(await f.text());if(json.format!=="skyjo-layout-studio"||json.players!==3)throw Error("Bitte ein 3-Spieler-Layout aus dem SKYJO Layout-Studio wählen.");render(json.blocks);alert("Layout übernommen. Spiellogik bleibt unverändert und wird erst später angebunden.")}catch(err){alert("Layout konnte nicht geladen werden: "+err.message)}finally{e.target.value=""}});
const fsButton=document.getElementById("fullscreen");
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen({navigationUI:"hide"})}else{alert("Dieser Browser unterstützt den Vollbildmodus hier nicht. Nutze gegebenenfalls die Browseroption Vollbild oder Zum Startbildschirm hinzufügen.")}}catch(e){alert("Vollbild konnte nicht aktiviert werden: "+e.message)}}
fsButton.addEventListener("click",toggleFullscreen);
document.addEventListener("fullscreenchange",()=>{fsButton.textContent=document.fullscreenElement?"⛶ Vollbild verlassen":"⛶ Vollbild";fit()});
addEventListener("resize",fit);render(initial);fit();
</script></body></html>
