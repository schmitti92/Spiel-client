<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYJO Comic – unabhängiger Integrationstest</title>
<style>
body{font:16px system-ui;background:#101c2d;color:white;padding:24px}
pre{white-space:pre-wrap;background:#172b43;padding:16px;border-radius:12px}
#enemies{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.board{background:#1b4667;padding:12px;border-radius:12px;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.card{background:#dce8f3;color:#14243b;text-align:center;padding:8px;border-radius:4px}
.card.empty{background:transparent;border:1px dashed #8799ae;color:transparent}.card.hidden{background:#315c9d;color:transparent}
button{padding:10px;margin:5px;cursor:pointer}
</style></head>
<body>
<h1>SKYJO Comic – Integrationstest</h1>
<p>Isolierte Testseite. Keine Verbindung zum Online-Raum; keine Änderungen an laufenden Spielen.</p>
<button data-count="3">3 Spieler</button><button data-count="4">4 Spieler</button><button data-count="5">5 Spieler</button>
<button id="rotate">Perspektive wechseln</button>
<pre id="results" role="status"></pre>
<div id="enemies"></div><div id="self"></div><div class="note"></div>
<script type="module">
import {runComicAdapterTests} from './skyjo_comic_adapter.test.mjs';
import {renderComicSnapshot} from './skyjo_comic_snapshot_view.mjs';
const results=document.getElementById('results');
let count=3,seat=0;
const log=[];
function check(condition,description){if(!condition)throw Error(description);log.push('✓ '+description);}
function fixture(n){
 const players=Array.from({length:n},(_,i)=>({id:'seat-'+i,name:'Spieler '+(i+1)}));
 return {kind:'skyjo-room-v2',version:2,
  lobby:{players,status:'playing',settings:{}},
  game:{phase:'playing',players:players.map((p,i)=>({name:p.name,cards:Array.from({length:12},(_,j)=>j%3===0?null:i+j-2)}))}};
}
function render(){
 try{
  const result=renderComicSnapshot(fixture(count),'seat-'+seat);
  check(result.players===count,'Spieleranzahl '+count);
  check(document.querySelectorAll('#enemies .board').length===count-1,'Gegnerbretter '+(count-1));
  check(document.querySelectorAll('#self .card').length===12,'Eigenes Brett mit 12 Karten');
  check(document.querySelectorAll('#enemies .card').length===(count-1)*12,'Alle Gegnerkarten');
  check(document.querySelector('#self .player-name').textContent==='Spieler '+(seat+1),'Perspektive stimmt');
  results.textContent=log.join('\n');
 }catch(error){results.textContent='FEHLER: '+error.message+'\n'+log.join('\n');}
}
try{
 const tests=runComicAdapterTests();
 check(tests.ok,'Adapterprüfungen: '+tests.checks);
 for(const n of [3,4,5]){
  for(let i=0;i<n;i++){
   const root=document.createElement('div');
   const enemies=document.createElement('div'),self=document.createElement('div');
   enemies.id='enemies';self.id='self';root.append(enemies,self);
   const fakeRoot={getElementById:id=>root.querySelector('#'+id),querySelector:()=>null};
   const state=renderComicSnapshot(fixture(n),'seat-'+i,fakeRoot);
   check(state.selfIndex===i&&state.opponents===n-1,'Snapshot '+n+' Spieler, Perspektive '+(i+1));
   check(self.querySelectorAll('.card').length===12,'12 Karten im eigenen Brett ('+n+'/'+i+')');
  }
 }
 check(true,'Alle isolierten Testfälle abgeschlossen');
}catch(error){log.push('✗ '+error.message);}
document.querySelectorAll('[data-count]').forEach(button=>button.addEventListener('click',()=>{
 count=Number(button.dataset.count);seat=0;render();
}));
document.getElementById('rotate').addEventListener('click',()=>{seat=(seat+1)%count;render();});
render();
</script>
</body></html>
