<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SKYJO Modul-Selbsttest</title><style>body{font:16px system-ui;max-width:800px;margin:30px auto;padding:15px}pre{white-space:pre-wrap;background:#f1f5f9;padding:14px;border-radius:8px}</style></head><body><h1>SKYJO Modul-Selbsttest</h1><p>Prüft Dateien und JavaScript-Syntax ohne eine Online-Partie zu verändern.</p><pre id="result">Prüfung läuft …</pre><script>
(async()=>{const output=document.getElementById('result');const checks=[];for(const [name,url] of [['HTML','skyjo_action.html'],['CSS','skyjo.css'],['JavaScript','skyjo-main.js'],['Profilkonfiguration','../profile-config.js'],['Profil-Login','../profile-auth.js'],['Profil-Match','../profile-match.js'],['Profil-Core','../profile-core.js'],['Hub-Bridge','../hub-game-bridge.js']]){try{const r=await fetch(url+'?smoke='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const t=await r.text();if(name==='JavaScript'){new Function(t)}checks.push('✓ '+name+' geladen ('+t.length+' Zeichen)')}catch(e){checks.push('✗ '+name+': '+e.message)}}output.textContent=checks.join('\n')+'\n\n'+(checks.every(c=>c.startsWith('✓'))?'Datei- und Syntaxprüfung bestanden. Spielfunktionen müssen separat getestet werden.':'Fehler gefunden: Bitte vor dem Merge beheben.');})();
</script></body></html>
