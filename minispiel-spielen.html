<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1729"><title>Minispiel · Party Challenge</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:system-ui,Arial}header{position:fixed;z-index:100;top:env(safe-area-inset-top);left:0;right:0;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 12px;background:linear-gradient(#091629ed,#091629bf);border-bottom:1px solid #ffffff2b;min-height:54px}header strong{font-size:clamp(12px,2vw,17px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button,a{font:800 14px system-ui;border-radius:11px;border:1px solid #ffffff55;background:#263f60;color:white;padding:10px 14px;cursor:pointer;text-decoration:none}button:hover,a:hover{filter:brightness(1.15)}#back{background:linear-gradient(135deg,#edbd66,#c98537);color:#23180d}iframe{position:fixed;inset:0;top:calc(54px + env(safe-area-inset-top));width:100%;height:calc(100% - 54px - env(safe-area-inset-top));border:0;background:#0b1523}#overlay{position:fixed;inset:0;z-index:300;background:#040b18da;display:none;place-items:center;padding:20px}#overlay.open{display:grid}.dialog{width:min(450px,100%);background:linear-gradient(140deg,#223952,#101e33);border:1px solid #a6c6e977;border-radius:22px;padding:25px;text-align:center;box-shadow:0 24px 70px #000b}.dialog h2{margin:0 0 10px}.dialog p{color:#c6d7e9;line-height:1.5}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}.actions button,.actions a{min-width:120px}#error{display:none;position:fixed;z-index:200;top:70px;left:12px;right:12px;text-align:center;background:#492437;border:1px solid #d47785;border-radius:10px;padding:13px}@media(max-width:600px){header{padding:5px 7px;gap:6px}header strong{font-size:12px}header button{font-size:12px;padding:9px}iframe{top:calc(51px + env(safe-area-inset-top));height:calc(100% - 51px - env(safe-area-inset-top))}} .dialog .result-list{margin:12px 0;text-align:left;display:grid;gap:7px}.dialog .result-list div{padding:8px 12px;border:1px solid #ffffff25;border-radius:10px;background:#ffffff0b}.dialog .result-list .winner{border-color:#f4c971;color:#ffe1a1} </style></head><body><header><button id="back" type="button">← Minispiele</button><strong id="title">🎮 Minispiel</strong><button id="restart" type="button">↻ Neustart</button></header><iframe id="game" title="Minispiel" allow="fullscreen" referrerpolicy="same-origin"></iframe><div id="error" role="alert"></div><div id="results" role="dialog" aria-modal="true" aria-label="Spielergebnis" style="display:none;position:fixed;z-index:250;inset:0;background:#030917dc;place-items:center;padding:20px"><div class="dialog"><h2>🏆 Minispiel beendet</h2><p id="result-summary"></p><div class="result-list" id="result-list"></div><div class="actions"><button id="result-again" type="button">↻ Erneut spielen</button><a href="minispiele.html">← Minispiele</a></div></div></div><div id="overlay" role="dialog" aria-modal="true" aria-labelledby="question"><div class="dialog"><h2 id="question">Spiel verlassen?</h2><p>Dein aktueller Spielfortschritt geht beim Verlassen verloren.</p><div class="actions"><button id="cancel" type="button">Weiterspielen</button><a id="confirm" href="minispiele.html">Zum Menü</a></div></div></div><script>(()=>{'use strict';const catalog=[["Lava_Arena_v28.html","🌋 Lava Arena"],["Maulwurf_Arena_v9.html","🔨 Maulwurf Arena"],["Preisjaeger_v11_0_RC23.html","💰 Preisjäger"],["recheninsel_piraten_premium_v2_4_eingabe_fix.html","🏴‍☠️ Recheninsel"],["snake-arena-v2.9-gameplay.html","🐍 Snake Arena"],["Zeitgefuehl_v6_Premium.html","⏱️ Zeitgefühl"],["huetchen_challenge_premium_v2_6.html","🎩 Hütchen-Challenge"],["Flusssprung_v41.html","🌊 Flusssprung"],["Bomber-Strand-Arena-V21-5-Steuerung-Nebeneinander.html","💣 Bomber Strand Arena"]];const params=new URLSearchParams(location.search),name=params.get('game'),entry=catalog.find(([file])=>file===name),frame=document.querySelector('#game'),overlay=document.querySelector('#overlay'),error=document.querySelector('#error');if(!entry){error.style.display='block';error.textContent='Unbekanntes Minispiel. Bitte kehre zur Auswahl zurück.';document.querySelector('#restart').disabled=true;return}document.querySelector('#title').textContent=entry[1];document.title=entry[1]+' · Party Challenge';const source='Minispiele/'+encodeURIComponent(entry[0]);frame.src=source;frame.addEventListener('error',()=>{error.style.display='block';error.textContent='Das Minispiel konnte nicht geladen werden.'});document.querySelector('#back').addEventListener('click',()=>{overlay.classList.add('open');document.querySelector('#cancel').focus()});document.querySelector('#cancel').addEventListener('click',()=>{overlay.classList.remove('open');document.querySelector('#back').focus()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open')){overlay.classList.remove('open')}});let resultReceived=false;const results=document.querySelector('#results');function resetGame(){resultReceived=false;results.style.display='none';frame.src=source}document.querySelector('#result-again').addEventListener('click',resetGame);window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='party:minigame-finished'||resultReceived)return;const result=event.data.payload;if(!result||!Array.isArray(result.players)||result.players.length<1||result.players.length>4||!Number.isInteger(result.schema)||result.schema!==1)return;resultReceived=true;const winner=Number.isInteger(result.winnerIndex)&&result.winnerIndex>=0&&result.winnerIndex<result.players.length?result.players[result.winnerIndex]:null;document.querySelector('#result-summary').textContent=winner?'🥇 '+String(winner.name).slice(0,50)+' gewinnt!':'🤝 Unentschieden';const list=document.querySelector('#result-list');list.replaceChildren();result.players.forEach((p,i)=>{const row=document.createElement('div');row.textContent=(i===result.winnerIndex?'🏆 ':'')+String(p.name||'Spieler '+(i+1)).slice(0,50)+(p.bot?' · Computer':' · Mensch');if(i===result.winnerIndex)row.className='winner';list.append(row)});results.style.display='grid'});document.querySelector('#restart').addEventListener('click',resetGame);})();</script></body></html>
