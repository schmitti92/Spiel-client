<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070e1c">
  <meta name="description" content="Wähle eines unserer vier Spiele: Barikade, SKYJO Action, KreuzKunter oder Das große Business.">
  <title>Online-Spielauswahl · Spielauswahl | Unsere Spiele</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f5f7ff;
      --muted: #c5cee2;
      --ease: cubic-bezier(.2,.8,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height:100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #070e1c;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 34% 30% at 101% 6%, rgba(159,89,31,.21), transparent 76%),
        radial-gradient(ellipse 30% 38% at -5% 5%, rgba(134,62,29,.26), transparent 74%),
        radial-gradient(ellipse 38% 40% at 77% 60%, rgba(14,60,108,.26), transparent 78%),
        linear-gradient(120deg, #0b1122 0%, #070e1b 58%, #0a1426 100%);
    }
    a { -webkit-tap-highlight-color: transparent; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .container { width: min(1460px, calc(100% - 70px)); margin: 0 auto; padding: 44px 0 36px; }
    .page-head { margin: 0 0 26px 20px; }
    h1 { margin: 0; font-size: clamp(32px, 3.15vw, 47px); line-height: 1.13; font-weight: 850; letter-spacing: -.045em; }
    .subtitle { font-size: clamp(18px, 1.95vw, 28px); color: #bbc8e4; margin: 6px 0 7px; line-height: 1.35; }
    .hint { margin: 0; font-size: 14px; color: #acb9d1; line-height: 1.4; display: flex; gap: 8px; align-items: start; }
    .hint-icon { display: inline-grid; place-items: center; flex: 0 0 19px; height: 19px; width: 19px; border: 1.5px solid currentColor; border-radius: 50%; font-size: 12px; font-weight: 800; }
    .game-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px 20px; }
    .game {
      isolation: isolate;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(170,186,223,.22);
      border-radius: 24px;
      min-height: 344px;
      display: flex;
      flex-direction: column;
      padding: 23px 26px 20px;
      background: #0b1426;
      box-shadow: 0 13px 35px rgba(0,0,0,.18), inset 0 1px rgba(255,255,255,.06);
      transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
    }
    .game::before {
      content: '';
      position: absolute;
      z-index: -2;
      inset: 0;
      background-image: var(--scene);
      background-size: cover;
      background-position: center;
      transform: scale(1.006);
      transition: transform .55s var(--ease);
    }
    .game::after {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(90deg, rgba(5,9,19,.95) 0%, rgba(8,13,26,.86) 29%, rgba(7,13,23,.62) 61%, rgba(4,10,19,.10) 100%);
      pointer-events: none;
    }
    .game:hover { transform: translateY(-2px); border-color: rgba(201,216,243,.48); box-shadow: 0 17px 40px rgba(0,0,0,.24); }
    .game:hover::before { transform: scale(1.04); }
    .barikade-card { --scene: url('Assets/game-backgrounds/Barikade_EXAKT_AUS_VORLAGE.webp'); border-color: rgba(180,130,79,.4); }
    .skyjo-card { --scene: url('Assets/game-backgrounds/SKYJO_Action_EXAKT_AUS_VORLAGE.webp'); border-color: rgba(146,115,238,.42); }
    .kreuzkunter-card { --scene: url('Assets/game-backgrounds/KreuzKunter_EXAKT_AUS_VORLAGE.webp'); border-color: rgba(28,164,228,.55); }
    .business-card { --scene: url('Assets/game-backgrounds/Das_grosse_Business_EXAKT_AUS_VORLAGE.webp'); border-color: rgba(199,149,54,.44); }
    .game-title { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 11px; margin-bottom: 12px; }
    .game-title h2 { font-size: clamp(23px,2vw,30px); font-weight: 820; line-height: 1.13; letter-spacing: -.034em; margin:0; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
    .game p { max-width: 390px; margin: 0; color:#f0f2fa; line-height: 1.42; font-size: clamp(15px,1.18vw,18px); text-shadow: 0 1px 8px rgba(0,0,0,.4); }
    .badge { font-size: 12px; line-height: 1.2; font-weight: 760; padding: 5px 11px; border-radius: 999px; white-space: nowrap; border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(7px); }
    .badge.purple { color:#f2e4ff; background:rgba(84,25,126,.7); border-color:rgba(196,125,246,.36); }
    .badge.green { color:#dafee6; background:rgba(18,91,45,.77); border-color:rgba(110,217,138,.36); }
    .badge.gold { color:#fff1c6; background:rgba(147,96,15,.7); border-color:rgba(248,191,61,.42); }
    .features { display: grid; gap: 5px; margin: 15px 0 0; padding: 0; list-style: none; font-size:14px; color:#e3e9fa; text-shadow: 0 1px 6px #000; }
    .features li { display: flex; align-items:center; gap: 10px; }
    .features svg { width: 17px; height:17px; flex-shrink:0; fill:none; stroke:#d5e4ff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .features .fill-icon { fill:#d5e4ff; stroke: none; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: auto; padding-top: 16px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 56px;
      min-width: 0;
      padding: 9px 21px;
      border-radius: 17px;
      border: 1px solid rgba(255,255,255,.3);
      font-size: clamp(16px,1.3vw,20px);
      font-weight: 790;
      color: white;
      line-height:1.2;
      text-decoration: none;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,.24);
      box-shadow: inset 0 1px rgba(255,255,255,.16), 0 7px 18px rgba(0,0,0,.23);
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .btn:hover { filter: brightness(1.13); box-shadow: inset 0 1px rgba(255,255,255,.26), 0 10px 22px rgba(0,0,0,.33); }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn svg { width:23px; height:23px; flex: 0 0 auto; }
    .btn .chevron { margin-left: auto; width: 17px; height: 17px; }
    .btn.primary { min-width: min(320px,100%); justify-content:flex-start; }
    .btn.green { background: linear-gradient(145deg,#1f9c6a,#006b44); border-color: #28d292; }
    .btn.purple { background: linear-gradient(125deg,#6535d1,#a223cd); border-color: #b97ee9; }
    .btn.blue { background: linear-gradient(135deg,#14b5ec,#0274c7); border-color:#31c7ff; }
    .btn.gold { background: linear-gradient(135deg,#e4a225,#b47209); border-color:#ffc555; }
    .business-actions .btn, .skyjo-actions .btn { flex: 1 1 190px; }
    .business-card .game-title h2 { font-size: clamp(22px,1.85vw,28px); }
    .business-card p { max-width: 380px; }
    @media (max-width: 1000px) and (min-width: 711px) {
      .container { width: calc(100% - 36px); padding-top: 26px; }
      .page-head { margin-left: 8px; }
      .game { padding: 20px; min-height: 330px; }
      .game::after { background:linear-gradient(90deg,rgba(4,8,17,.98) 0%,rgba(4,8,17,.9) 48%,rgba(4,8,17,.3) 100%); }
      .game p { font-size: 15px; }
      .features { font-size: 12px; }
      .btn { min-height:50px; font-size:15px; padding:7px 14px; }
      .btn.primary { min-width:0; }
      .business-actions .btn, .skyjo-actions .btn { flex-basis: 150px; }
    }
    @media (max-width: 710px) {
      .container { width: calc(100% - 24px); padding: 24px 0 30px; }
      .page-head { margin:0 4px 18px; }
      .subtitle { font-size:18px; }
      .hint { font-size: 12px; }
      .game-grid { grid-template-columns: 1fr; gap:14px; }
      .game { min-height: 310px; padding: 20px 19px 18px; border-radius:21px; }
      .game::after { background:linear-gradient(90deg,rgba(5,9,19,.97),rgba(5,9,19,.85) 58%,rgba(5,9,19,.34)); }
      .game-title h2 { font-size:26px; }
      .game p { font-size: 15px; max-width: 85%; }
      .features { font-size:13px; margin-top:11px; }
      .btn { min-height:51px; font-size:16px; }
      .btn.primary { width: min(320px,100%); }
      .business-card .game-title h2 { width: 100%; }
      .business-card .game-title { gap: 5px 8px; }
      .business-actions, .skyjo-actions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:8px; }
      .business-actions .btn, .skyjo-actions .btn { min-width:0; width:100%; gap:7px; padding:7px 10px; font-size:14px; }
      .business-actions .btn svg, .skyjo-actions .btn svg { width:19px; height:19px; }
      .business-actions .btn .chevron, .skyjo-actions .btn .chevron { display:none; }
    }
    @media (max-width:370px) {
      .game { min-height:310px; padding:17px 14px; }
      .game-title h2 { font-size:23px; }
      .game p { max-width:95%; }
      .badge { font-size:11px; }
      .business-actions, .skyjo-actions { grid-template-columns:1fr; gap:7px; }
      .business-actions .btn, .skyjo-actions .btn { padding:8px 12px; font-size:14px; gap:9px; justify-content:center; }
      .business-actions .btn svg, .skyjo-actions .btn svg { width:18px;height:18px; }
    }
    @media (prefers-reduced-motion:reduce) { .game,.game::before,.btn { transition:none; } }
  
/* Spielerportal – Profil in der rechten oberen Ecke */
.sp-index-wrap{position:absolute;right:0;top:0;z-index:20;min-width:192px}
.sp-profile-button{display:flex;align-items:center;gap:9px;background:linear-gradient(145deg,#182a49,#17223b);color:#fff;border:1px solid #435776;border-radius:999px;padding:7px 12px 7px 7px;font-weight:850;box-shadow:0 9px 26px #040c2499;max-width:260px;width:100%;cursor:pointer}
.sp-profile-button .sp-person-name{flex:1;overflow:hidden;text-overflow:ellipsis;text-align:left;white-space:nowrap;font-size:13px}
.sp-avatar{width:39px;height:39px;flex:none;border-radius:50%;background-color:#d2edff;border:2px solid #84ceff;box-shadow:0 0 0 2px #fff2}
.sp-index-menu{position:absolute;top:calc(100% + 12px);right:0;width:min(340px,85vw);padding:13px;background:linear-gradient(175deg,#0d1932,#142c49);border-radius:20px;border:1px solid #3d6290;box-shadow:0 22px 55px #0009;color:white}

.sp-menu-actions{margin-top:10px;border-top:1px solid #365270;padding-top:10px;display:grid;gap:8px}.sp-menu-actions a,.sp-menu-actions button{background:#243b62;border:0;color:white;padding:12px;border-radius:12px;font-weight:800;font-size:13px;text-align:center;cursor:pointer}.sp-menu-actions button{background:linear-gradient(110deg,#1f85eb,#6557ed)}
@media(max-width:700px){.page-head{padding-right:0!important;padding-top:72px}.sp-index-wrap{right:0;top:-3px}.sp-profile-button{max-width:220px}.sp-index-menu{width:min(330px,90vw)}}

/* Originalvorlage als komplette klickbare Spielkarte; Auswahl bleibt an vorhandener Spiellogik */
.game.barikade-card,.game.skyjo-card,.game.kreuzkunter-card,.game.business-card{padding:0!important;aspect-ratio:696/320;min-height:0!important;display:block;cursor:pointer}
.game.barikade-card::before,.game.skyjo-card::before,.game.kreuzkunter-card::before,.game.business-card::before{z-index:-1;background-position:center;background-size:cover}
.game.barikade-card::after,.game.skyjo-card::after,.game.kreuzkunter-card::after,.game.business-card::after{display:none!important}
.game .actions:has(.image-card-button){position:absolute!important;inset:0;z-index:3;margin:0!important;padding:0!important;display:block}
.game .actions .image-card-button{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none!important;border:0!important;border-radius:inherit!important;background:transparent!important;box-shadow:none!important;opacity:1!important;color:transparent!important;cursor:pointer}
.game .actions .image-card-button:focus-visible{outline:4px solid #fff;outline-offset:-6px}
.game .actions .image-card-button:disabled{cursor:pointer;opacity:1!important;background:transparent!important}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.game.barikade-card,.game.skyjo-card,.game.kreuzkunter-card,.game.business-card{aspect-ratio:696/320;min-height:0!important}}

/* Progressive enhancement: Spielname sichtbar, bis das Originalbild wirklich geladen ist */
.game.barikade-card:not(.original-art-loaded) .game-title,.game.skyjo-card:not(.original-art-loaded) .game-title,.game.kreuzkunter-card:not(.original-art-loaded) .game-title,.game.business-card:not(.original-art-loaded) .game-title{display:flex!important;position:absolute;inset:0;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.game.barikade-card.original-art-loaded .game-title,.game.skyjo-card.original-art-loaded .game-title,.game.kreuzkunter-card.original-art-loaded .game-title,.game.business-card.original-art-loaded .game-title{display:none!important}
.game.barikade-card:not(.original-art-loaded)::after,.game.skyjo-card:not(.original-art-loaded)::after,.game.kreuzkunter-card:not(.original-art-loaded)::after,.game.business-card:not(.original-art-loaded)::after{display:block!important;background:linear-gradient(180deg,#0004,#0008)!important}
