<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1729"><title>Party Challenge · 5 Spiele</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#244663,#101f34 57%,#08111e);color:#f8faff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(940px,calc(100% - 28px));margin:auto;padding:24px 0 55px}a,button{font:800 15px system-ui;cursor:pointer;border:1px solid #ffffff4d;border-radius:13px;padding:12px 18px;background:#254360;color:white;text-decoration:none}a:hover,button:hover{filter:brightness(1.12)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top span{color:#f4cd7e;font-weight:900;letter-spacing:.1em;font-size:12px}.hero{text-align:center;padding:35px 0 20px}.hero h1{font-size:clamp(34px,7vw,65px);letter-spacing:-.045em;margin:8px 0}.hero h1 em{font-style:normal;color:#f5d38d}.hero p{color:#c5d5e5;line-height:1.6}.panel{background:linear-gradient(145deg,#1b3653,#0e2036);border:1px solid #b8b5a45b;border-radius:22px;padding:clamp(17px,3vw,29px);box-shadow:0 18px 50px #0007}.panel h2{margin:0 0 10px;font-size:25px}.muted{color:#c1d3e3}.players{display:grid;gap:10px;margin:20px 0}.player{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 15px;border:1px solid #ffffff25;border-radius:13px;background:#07152877}.player strong{font-size:17px}.player span{color:#e9cb86;font-weight:900}.primary{background:linear-gradient(125deg,#ffdf9a,#d99b41);color:#261907;border-color:#ffedbc;box-shadow:0 5px 0 #7c5427;font-weight:900}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #7c5427}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.progress{display:flex;gap:7px;margin:18px 0}.progress span{height:9px;flex:1;border-radius:20px;background:#5d738d66}.progress span.done{background:#80deb2}.progress span.current{background:#f8ce79}.champion{font-size:80px;text-align:center;margin:10px 0}.hidden{display:none!important}.warning{color:#ffcf9b;font-size:13px}.result{font-size:14px;color:#b6cde2;margin:7px 0}@media(max-width:520px){.top{flex-wrap:wrap}.hero{padding:22px 0}.panel{padding:17px}}</style></head><body><main><div class="top"><a href="minispiele.html">← Minispiele</a><span>🏆 OFFLINE PARTY CHALLENGE</span></div><header class="hero"><h1>Party <em>Challenge</em></h1><p>Fünf zufällige Minispiele · gemeinsame Wertung · ein Gesamtsieger</p></header><section class="panel"><h2 id="heading">Bereit für die Challenge?</h2><p id="intro" class="muted">Alle Spieler übernehmen ihre Einstellungen aus der Minispiel-Auswahl.</p><div id="progress" class="progress" aria-label="Challenge-Fortschritt"></div><div id="champion" class="champion hidden">🏆</div><div id="players" class="players"></div><div id="details"></div><p id="warning" class="warning"></p><div class="buttons"><button class="primary" id="main-action" type="button">🏁 Challenge starten</button><button id="reset" type="button" class="hidden">Neue Challenge</button></div></section></main><script src="party-players.js"></script><script src="party-challenge-core.js"></script><script>(()=>{'use strict';const engine=window.PartyChallenge,$=id=>document.getElementById(id);const titles={'Lava_Arena_v28.html':'🌋 Lava Arena','Maulwurf_Arena_v9.html':'🔨 Maulwurf Arena','recheninsel_piraten_premium_v2_4_eingabe_fix.html':'🏴‍☠️ Recheninsel','Flusssprung_v41.html':'🌊 Flusssprung','Zeitgefuehl_v6_Premium.html':'⏱️ Zeitgefühl'};function render(){const s=engine.read(),players=s?.players||window.PartyPlayers.get();$('players').replaceChildren();$('details').replaceChildren();$('progress').replaceChildren();$('champion').classList.toggle('hidden',!s||s.state!=='finished');$('reset').classList.toggle('hidden',!s);$('warning').textContent='';if(s){for(let i=0;i<5;i++){const dot=document.createElement('span');dot.className=i<s.index?'done':i===s.index?'current':'';dot.title='Spiel '+(i+1);$('progress').append(dot)}}const ranking=players.map((p,i)=>({p,i,points:s?.points?.[i]||0})).sort((a,b)=>b.points-a.points);ranking.forEach((item,pos)=>{const row=document.createElement('div');row.className='player';const name=document.createElement('strong');name.textContent=(pos===0&&s?.state==='finished'?'🥇 ':'')+item.p.name+(item.p.bot?' 🤖':' 👤');const score=document.createElement('span');score.textContent=s?item.points.toLocaleString('de-DE',{maximumFractionDigits:2})+' Punkte':item.p.bot?'Computer':'Mensch';row.append(name,score);$('players').append(row)});const button=$('main-action');if(!s){$('heading').textContent='Bereit für die Challenge?';$('intro').textContent='Fünf zufällige, unterschiedliche Minispiele. Die Ergebnisse zählen zur gemeinsamen Gesamtwertung.';button.textContent='🏁 Challenge starten';button.onclick=()=>{try{engine.create(window.PartyPlayers.get());render()}catch(e){$('warning').textContent=e.message}};return}if(s.state==='finished'){$('heading').textContent='🏆 Die Party Challenge ist beendet!';const top=Math.max(...s.points),winners=s.players.filter((p,i)=>s.points[i]===top);$('intro').textContent=winners.length===1?winners[0].name+' gewinnt die Party Challenge!':'Gleichstand: '+winners.map(p=>p.name).join(' & ');button.textContent='Zur Minispiel-Auswahl';button.onclick=()=>location.assign('minispiele.html');return}if(s.state==='between'){$('heading').textContent='📊 Zwischenstand nach Spiel '+s.index;$('intro').textContent='Gut gespielt! Hier ist die aktuelle Gesamtwertung.';button.textContent='Weiter zu Spiel '+(s.index+1)+' →';button.onclick=()=>{engine.resume();render()};return}$('heading').textContent='Spiel '+(s.index+1)+' von 5';$('intro').textContent='Als Nächstes: '+(titles[s.order[s.index]]||'Minispiel');button.textContent='🎮 Minispiel starten →';button.onclick=()=>{const file=s.order[s.index];location.assign('minispiel-spielen.html?challenge=1&game='+encodeURIComponent(file))}}$('reset').addEventListener('click',()=>{if(confirm('Die laufende Challenge wirklich beenden und alle Challenge-Punkte zurücksetzen?')){engine.clear();render()}});render()})();</script></body></html>
