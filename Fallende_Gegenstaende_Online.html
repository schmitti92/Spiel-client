<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c40"><title>Fallende Gegenstände Online</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:white;background:linear-gradient(#11263c,#143e48);text-align:center}main{max-width:950px;margin:auto;padding:16px}h1{font-size:clamp(25px,5vw,43px);margin:8px 0}p{color:#cce7ee}button,input{font:inherit;border:0;border-radius:12px;padding:12px}button{background:#f6cf69;color:#24313d;font-weight:800;cursor:pointer;margin:5px}button:disabled{opacity:.4}input{max-width:160px}#lobby{background:#ffffff18;padding:15px;border-radius:18px;margin:12px auto;max-width:540px}.hidden{display:none!important}#arena{display:grid;grid-template-columns:repeat(var(--n,2),1fr);height:min(63vh,540px);min-height:360px;border:9px solid #946848;border-radius:24px;background:linear-gradient(#8ccce6 0%,#a7e3df 66%,#79b783 66%,#50945d);overflow:hidden;position:relative}.lane{position:relative;border-right:2px dashed #ffffff70;min-width:0}.lane:last-child{border:0}.object{position:absolute;top:0;left:50%;transform:translate(-50%,-120px);width:min(88%,160px);height:95px;object-fit:contain;filter:drop-shadow(0 5px 4px #203b3b66)}.person{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);font-size:clamp(52px,12vw,105px);line-height:1}.player{position:absolute;bottom:1%;left:0;width:100%;font-weight:800;text-shadow:0 2px 4px #000}.result{position:absolute;top:15%;width:100%;font-weight:900;text-shadow:0 2px 5px #000;font-size:clamp(14px,3vw,24px)}#scores{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}.score{background:#ffffff19;border:2px solid #f7d779;border-radius:14px;padding:9px 14px}.score strong{display:block;font-size:24px}#status{font-size:22px;font-weight:800;margin:12px}#stop{font-size:26px;padding:20px 45px;background:#ff8d78}#stop:disabled{background:#81939d}.small{font-size:13px;color:#cde}#link{word-break:break-all}</style></head><body><main><h1>🎹 Fallende Gegenstände · Online</h1><p>Der kleinste Gesamtabstand nach 5 Runden gewinnt!</p><div id="lobby"><input id="name" placeholder="Dein Name" maxlength="24" value="Spieler"><div><button id="create">Raum erstellen</button><input id="code" placeholder="Raumcode" inputmode="numeric" maxlength="6"><button id="join">Beitreten</button></div><div id="roominfo"></div><button id="start" class="hidden">▶ Spiel starten</button></div><div id="scores"></div><div id="status">Mit einem Raum verbinden</div><div id="arena" style="--n:2"></div><button id="stop" disabled>✋ STOPP!</button><p class="small">Ein Spieler pro Gerät · 2–4 Spieler · 5 Runden · Kopftreffer = 100 cm Strafabstand</p><p><a style="color:#f6d779" href="Fallende_Gegenstaende.html">Offline spielen</a></p></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x),files=['klavier.svg','amboss.svg','eisblock.svg','felsbrocken.svg','tresor.svg'],emoji=['🎹','⚒️','🧊','🪨','🗃️'];let ws,state,seat=0,clockOffset=0,frame=0,requested=false;const params=new URLSearchParams(location.search),url='wss://serverfinal-ynbe.onrender.com/falling';function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}function connect(action){if(ws&&ws.readyState===1){send(action);return}ws=new WebSocket(url);$('status').textContent='Verbinde mit Server …';ws.onopen=()=>{send(action);send({type:'ping',clientTime:Date.now()})};ws.onerror=()=>{$('status').textContent='Verbindung fehlgeschlagen'};ws.onclose=()=>{$('stop').disabled=true;$('status').textContent='Verbindung getrennt – Seite neu laden'};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){alert(m.message);return}if(m.type==='welcome'){seat=m.seat;return}if(m.type==='pong'){clockOffset=m.serverTime-(m.clientTime+Date.now())/2;return}if(m.type==='state'){state=m;render()}}}function render(){if(!state)return;const mine=state.players.find(p=>p.seat===seat);if(!mine&&seat===0){let taken=state.players.find(p=>p.name===$('name').value);if(taken)seat=taken.seat;else if(state.players.length===1)seat=1}const room=state.code;history.replaceState(null,'',location.pathname+'?room='+room);$('roominfo').textContent='Raumcode: '+room+' · '+state.players.length+'/4 Spieler · Link teilen';$('start').classList.toggle('hidden',!(seat===1&&state.phase==='lobby'&&state.players.length>=2));$('scores').innerHTML=state.players.map(p=>'<div class="score">'+escapeHtml(p.name)+(p.seat===seat?' (du)':'')+'<strong>'+p.score.toFixed(1).replace('.',',')+' cm</strong></div>').join('');$('arena').style.setProperty('--n',state.players.length);$('arena').innerHTML=state.players.map(p=>'<div class="lane" data-seat="'+p.seat+'"><img class="object" src="assets/fallende-gegenstaende/'+files[Math.max(0,state.round-1)]+'" onerror="this.style.display=\'none\';this.nextElementSibling.hidden=false"><span hidden style="position:absolute;top:0;left:40%;font-size:60px">'+emoji[Math.max(0,state.round-1)]+'</span><div class="result">'+(p.stops===null?'':p.stops===100?'💥 +100 cm':p.stops.toFixed(1).replace('.',',')+' cm')+'</div><div class="person">🧍</div><div class="player">'+escapeHtml(p.name)+'</div></div>').join('');$('lobby').classList.toggle('hidden',state.phase!=='lobby');requested=false;update();cancelAnimationFrame(frame);frame=requestAnimationFrame(animate)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function update(){if(!state)return;const mine=state.players.find(p=>p.seat===seat);$('stop').disabled=!(state.phase==='fall'&&mine&&mine.stops===null&&!requested);const labels={lobby:'Warte auf Spieler …',countdown:'Bereit machen! Runde '+state.round+'/5',fall:'Runde '+state.round+'/5 – JETZT STOPPEN!',result:'Runde '+state.round+' beendet',finished:'🏆 Spiel beendet'};$('status').textContent=labels[state.phase]||'';if(state.phase==='finished'){const min=Math.min(...state.players.map(p=>p.score));$('status').textContent='🏆 '+state.players.filter(p=>p.score===min).map(p=>p.name).join(' & ')+' gewinnt mit '+min.toFixed(1).replace('.',',')+' cm!'}}function animate(){if(!state)return;const now=Date.now()+clockOffset;let progress=state.phase==='fall'||state.phase==='result'||state.phase==='finished'?Math.max(0,Math.min(1,(now-state.startAt)/state.duration)):0;for(const lane of $('arena').querySelectorAll('.lane')){const p=state.players.find(x=>x.seat===Number(lane.dataset.seat));const img=lane.querySelector('.object');if(!img||!p)continue;const box=lane.getBoundingClientRect(),height=img.offsetHeight||95,person=lane.querySelector('.person').getBoundingClientRect();const start=-height;const finish=person.top-box.top-height;let fraction=p.stops!==null&&state.phase!=='countdown'?Math.min(1,p.stops===100?1:1-p.stops/100):progress;const y=start+(finish-start)*fraction;img.style.transform='translate(-50%,'+y+'px)'}frame=requestAnimationFrame(animate)}$('create').onclick=()=>{seat=1;connect({type:'create',name:$('name').value})};$('join').onclick=()=>{seat=0;connect({type:'join',code:$('code').value,name:$('name').value})};$('start').onclick=()=>send({type:'start'});$('stop').onclick=()=>{requested=true;$('stop').disabled=true;send({type:'stop'})};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&state?.phase==='fall'){e.preventDefault();$('stop').click()}});if(params.get('room')){$('code').value=params.get('room');$('status').textContent='Raumcode übernommen – Namen eingeben und Beitreten drücken'}setInterval(()=>{if(ws?.readyState===1)send({type:'ping',clientTime:Date.now()})},12000);
})();</script></body></html>
