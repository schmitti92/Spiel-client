<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#0b2d4c;color:white;font:600 16px system-ui;text-align:center}header{padding:9px;background:#102d47}canvas{display:block;margin:5px auto;max-width:100%;height:min(68dvh,650px);touch-action:none;border:5px solid #8ce7f4;border-radius:16px;background:#d5f6ff}button{padding:13px 25px;border:0;border-radius:12px;background:#f8d071;font:800 18px system-ui}button:disabled{opacity:.4}#scores{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:14px;padding:5px}</style></head><body><header id="status">🥌 Eisstock wird geladen …</header><div id="scores"></div><canvas id="ice" width="440" height="650"></canvas><button id="shoot" disabled>🥌 Kugel schießen</button><script>
(()=>{'use strict';const canvas=document.getElementById('ice'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let state=null,aim={vx:0,vy:-7},busy=false;const colors=['#e8585d','#3787f6','#e9b83e','#7b50d5'];function send(type,extra={}){parent.postMessage({type,challengeId:state?.challengeId,...extra},location.origin)}function draw(){const w=440,h=650;ctx.clearRect(0,0,w,h);let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#a7e3f2');g.addColorStop(1,'#e7fcff');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<18;i++){ctx.strokeStyle='#ffffff55';ctx.beginPath();ctx.moveTo(0,i*39);ctx.lineTo(w,i*39-28);ctx.stroke()}for(const [r,color] of [[125,'#68b9e5'],[86,'#ffe59a'],[47,'#f09b91']]){ctx.beginPath();ctx.arc(220,157,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.stroke()}ctx.beginPath();ctx.arc(220,157,12,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();for(const s of state?.stones||[]){ctx.beginPath();ctx.arc(s.x,s.y,14,0,Math.PI*2);ctx.fillStyle=colors[(s.owner-1)%4];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#203448';ctx.stroke()}if(state?.myTurn){ctx.beginPath();ctx.arc(220,567,14,0,Math.PI*2);ctx.fillStyle=colors[(state.seat-1)%4];ctx.fill();ctx.strokeStyle='#123';ctx.stroke();ctx.beginPath();ctx.moveTo(220,567);ctx.lineTo(220+aim.vx*22,567+aim.vy*22);ctx.strokeStyle='#153b5a';ctx.lineWidth=5;ctx.stroke();ctx.beginPath();ctx.arc(220+aim.vx*22,567+aim.vy*22,7,0,7);ctx.fillStyle='#153b5a';ctx.fill()}}function update(){if(!state)return;const s=state;$('scores').textContent=s.players.map(p=>p.name+': '+p.score+' Punkte').join(' · ');$('status').textContent=s.phase==='finished'||s.phase==='results'?'🏆 Partie beendet – Ergebnis in der Lobby':s.myTurn?'🥌 Du bist dran! Ziele und schieße.':'🥌 '+(s.players[s.turn]?.name||'Spieler')+' ist dran';$('shoot').disabled=!s.myTurn||busy;draw()}function aimAt(e){if(!state?.myTurn)return;const b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)*440/b.width,y=(e.clientY-b.top)*650/b.height,dx=x-220,dy=y-567;const length=Math.hypot(dx,dy)||1;aim.vx=Math.max(-7,Math.min(7,dx/length*7));aim.vy=Math.max(-11.5,Math.min(-3,dy/length*8));draw()}canvas.addEventListener('pointerdown',aimAt);canvas.addEventListener('pointermove',e=>{if(e.buttons)aimAt(e)});$('shoot').onclick=()=>{if(!state?.myTurn||busy)return;busy=true;update();send('eisstock:shoot',{vx:aim.vx,vy:aim.vy})};window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data;if(m?.type==='eisstock:state'){state=m;busy=false;update()}else if(m?.type==='eisstock:rejected'){busy=false;update()}});send('eisstock:ready')})();
</script></body></html>
