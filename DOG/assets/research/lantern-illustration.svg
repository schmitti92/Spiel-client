 <linearGradient id="snow" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e4f4fe"/><stop offset="1" stop-color="#a2c2e0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
