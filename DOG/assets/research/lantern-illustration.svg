<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="title desc">
<title id="title">Weihnachtliche Nebellaterne</title><desc id="desc">Goldene leuchtende Laterne auf verschneitem Waldweg mit Tannenzweigen und roten Beeren.</desc>
