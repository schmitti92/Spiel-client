<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hütchen Challenge – Original lädt</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08182a;color:#ffe4a3;font:600 22px system-ui;text-align:center}#status{padding:24px}</style></head><body><div id="status">🎩 Original-Hütchen Challenge wird geladen …</div><script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const files=Array.from({length:15},(_,i)=>'huetchen-original-assets/part-'+String(i).padStart(2,'0')+'.txt');
  const parts=await Promise.all(files.map(async file=>{
   const response=await fetch(file,{cache:'force-cache'});
   if(!response.ok)throw Error('Originalsegment fehlt: '+file+' ('+response.status+')');
   return response.text();
  }));
  const html=parts.join('');
  if(!html.startsWith('<!doctype html>')||!html.includes('huetchen:state')||html.length<6900000)throw Error('Originalspiel unvollständig');
  document.open();document.write(html);document.close();setTimeout(()=>window.parent.postMessage({type:'huetchen:ready'},location.origin),50);
 }catch(error){status.textContent='⚠️ Originalspiel konnte nicht geladen werden: '+error.message;console.error(error);}
})();
</script></body></html>
