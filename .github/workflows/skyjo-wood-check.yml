name: SKYJO wooden design checks
on:
  push:
    branches: [skyjo-wood-design-staging-20261019]
    paths: ['.github/workflows/skyjo-wood-check.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS and SKYJO V19 tests
        run: |
          set -e
          node --check Skyjo/skyjo_start.js
          node --check Skyjo/skyjo_wood_modern.js
          python3 tests/check_skyjo_modular.py
          for t in tests/skyjo-v*.test.cjs; do node "$t"; done
          test -f Skyjo/skyjo_wood_modern.css
          grep -q 'skyjo-wood-choice' Skyjo/skyjo_start.html
          grep -q 'skyjo_wood_modern.js' Skyjo/skyjo_action.html
