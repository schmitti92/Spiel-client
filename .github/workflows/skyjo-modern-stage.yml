name: SKYJO Modern stage validation
on:
  push:
    branches: [skyjo-modern-workplan-stage-20261019]
    paths: ['.github/workflows/skyjo-modern-stage.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check Skyjo/skyjo_host_test.js
          node --check Skyjo/skyjo_host_test_visual.js
          node --check Skyjo/skyjo_start.js
          python3 tests/check_skyjo_modular.py
          for t in tests/skyjo-v*.test.cjs; do node "$t"; done
          grep -Fq 'skyjo_host_test_polish.css?v=1' Skyjo/skyjo_host_test.html
          grep -Fq 'Auto-Test starten' Skyjo/skyjo_host_test.js
          grep -Fq 'const quotes=' Skyjo/skyjo_host_test_visual.js
