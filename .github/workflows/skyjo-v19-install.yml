name: Install SKYJO V19 on staging
on:
  push:
    branches: [skyjo-modular-v19-staging]
    paths:
      - '.github/workflows/skyjo-v19-install.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract SKYJO module files
        shell: bash
        run: |
          set -euo pipefail
          unzip -t Spiel-client-skyjo-modular-v19.zip | tail -n 2
          unzip -o -q Spiel-client-skyjo-modular-v19.zip 'Skyjo/*' 'tests/*' -d .
          test -f Skyjo/skyjo_action-manifest.json
          test -f Skyjo/skyjo_action-loader.js
          for t in tests/skyjo-v*.test.cjs; do node "$t"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Skyjo tests
          if ! git diff --cached --quiet; then
            git commit -m "Install modular SKYJO Action V19 and tests"
            git push origin HEAD:skyjo-modular-v19-staging
          fi
