name: SKYJO test tabletop verification
on:
  push:
    branches: [skyjo-test-visual-layout-20261019]
    paths: ['.github/workflows/skyjo-test-tabletop-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check Skyjo/skyjo_host_test.js
          node --check Skyjo/skyjo_host_test_visual.js
          python3 tests/check_skyjo_modular.py
          for t in tests/skyjo-v*.test.cjs; do node "$t"; done
          grep -q 'scene-side' Skyjo/skyjo_host_test.html
