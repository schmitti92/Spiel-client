name: DOG 100-Tore Karte
on:
  push:
    paths:
      - dog-tor-map.html
      - dog-tor-map.css
      - dog-tor-map.js
      - dog-boss10.html
      - dog-boss10.css
      - dog-boss10.js
      - dog-group-boss.html
      - dog-group-boss.js
      - dog-ascension.html
      - dog-ascension.css
      - dog-ascension.js
      - dog-expedition.html
      - dog-materials-ui.js
      - dog-materials.css
      - tests/dog-tor-map.test.mjs
      - tests/dog-first-loop-ui.test.mjs
      - tests/dog-group-boss-ui.test.mjs
      - tests/dog-chests-ui.test.mjs
      - .github/workflows/dog-tor-map-check.yml
  pull_request:
    paths:
      - dog-tor-map.html
      - dog-tor-map.css
      - dog-tor-map.js
      - dog-boss10.html
      - dog-boss10.css
      - dog-boss10.js
      - dog-group-boss.html
      - dog-group-boss.js
      - dog-ascension.html
      - dog-ascension.css
      - dog-ascension.js
      - dog-expedition.html
      - dog-materials-ui.js
      - dog-materials.css
      - tests/dog-tor-map.test.mjs
      - tests/dog-first-loop-ui.test.mjs
      - tests/dog-group-boss-ui.test.mjs
      - tests/dog-chests-ui.test.mjs
      - .github/workflows/dog-tor-map-check.yml

jobs:
  dog-map:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check dog-tor-map.js
          node --check dog-boss10.js
          node --check dog-group-boss.js
          node --check dog-ascension.js
          node --check dog-materials-ui.js
      - name: Test map structure and safe DOG unlock placeholder
        run: node --test tests/dog-tor-map.test.mjs tests/dog-first-loop-ui.test.mjs tests/dog-group-boss-ui.test.mjs tests/dog-chests-ui.test.mjs
