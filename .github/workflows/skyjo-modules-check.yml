name: SKYJO module integrity
on:
  push:
    branches: [main]
    paths:
      - 'Skyjo/**'
      - '.github/workflows/skyjo-modules-check.yml'
  pull_request:
    paths:
      - 'Skyjo/skyjo_action.html'
      - 'Skyjo/skyjo.css'
      - 'Skyjo/skyjo-base.css'
      - 'Skyjo/skyjo-overrides.css'
      - 'Skyjo/skyjo-themes.css'
      - 'Skyjo/skyjo-classic.css'
      - 'Skyjo/skyjo-comic.css'
      - 'Skyjo/skyjo-comic-duo.css'
      - 'Skyjo/skyjo-main.js'
      - '.github/workflows/skyjo-modules-check.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check Skyjo/skyjo-main.js
      - name: Check HTML references and extracted resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('Skyjo/skyjo_action.html').read_text()
          css = Path('Skyjo/skyjo-base.css').read_text() + Path('Skyjo/skyjo-overrides.css').read_text() + Path('Skyjo/skyjo-classic.css').read_text() + Path('Skyjo/skyjo-themes.css').read_text() + Path('Skyjo/skyjo-comic.css').read_text() + Path('Skyjo/skyjo-comic-duo.css').read_text()
          # The v19 board intentionally replaces parts of the historical CSS.
          # Validate actual module order and non-empty sources instead of requiring
          # byte-for-byte equality with the obsolete monolithic backup.
          css_modules = ('skyjo-base.css', 'skyjo-overrides.css', 'skyjo-classic.css', 'skyjo-themes.css', 'skyjo-comic.css', 'skyjo-comic-duo.css')
          for module in css_modules:
              assert Path('Skyjo', module).read_text().strip(), f'Empty stylesheet: {module}'
              assert f'href="{module}?v=' in html, f'Missing stylesheet link: {module}'
          link_positions = [html.index(f'href="{module}?v=') for module in css_modules]
          assert link_positions == sorted(link_positions), 'Stylesheet loading order changed'
          assert 'skyjo-duo-layout-fix.css?v=' in html, 'Missing rebuilt board stylesheet'
          js = Path('Skyjo/skyjo-main.js').read_text()
          assert '<link rel="stylesheet" href="skyjo-base.css?v=15.54">' in html
          assert '<link rel="stylesheet" href="skyjo-overrides.css?v=15.55">' in html
          assert '<link rel="stylesheet" href="skyjo-classic.css?v=15.56">' in html
          assert '<link rel="stylesheet" href="skyjo-themes.css?v=15.57">' in html
          assert '<link rel="stylesheet" href="skyjo-comic.css?v=15.58">' in html
          assert 'href="skyjo-comic-duo.css?v=' in html
          assert 'src="skyjo-main.js?v=' in html
          assert 'document.body.dataset.skyBoard=selectedSkyBoard;' in js
          assert 'window.Game=' in js
          assert 'sky-reference-layout' in css
          for name in ('profile-config.js','profile-auth.js','profile-match.js','profile-core.js','hub-game-bridge.js'):
              assert Path(name).is_file(), name
          print('SKYJO module integrity OK')
          PY

      - name: Verify rebuilt two-player layout remains scoped
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('Skyjo/skyjo-duo-layout-fix.css').read_text()
          html=Path('Skyjo/skyjo_action.html').read_text()
          assert 'skyjo-duo-layout-fix.css?v=' in html
          assert 'data-sky-board="illustrated"' in css
          assert 'data-sky-seats="2"' in css
          assert 'grid-template-areas:"controls opponent sidebar" "controls center sidebar" "controls own sidebar"' in css
          assert 'grid-template-columns:repeat(4,var(--sky-card-width))' in css
          assert 'grid-template-rows:repeat(3,var(--sky-card-height))' in css
          assert 'data-sky-board="classic"' not in css
          print('Rebuilt two-player board scoped and linked')
          PY
      - name: Install Chromium browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated static test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/skyjo-http.log 2>&1 &
          sleep 2
      - name: Browser smoke test for extracted SKYJO
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:800}});
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            const response = await page.goto('http://127.0.0.1:8765/Skyjo/skyjo_action.html?mode=local', {waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1500);
            const result = await page.evaluate(() => ({
              app: !!document.querySelector('#app'),
              game: typeof window.Game?.render === 'function',
              css: ['skyjo-base.css','skyjo-overrides.css','skyjo-classic.css','skyjo-themes.css','skyjo-comic.css','skyjo-comic-duo.css'].every(name=>[...document.styleSheets].some(x=>x.href?.includes(name))),
              script: [...document.scripts].some(x=>x.src?.includes('skyjo-main.js')),
              body: document.querySelector('#app')?.textContent?.length || 0
            }));
            await page.screenshot({path:'skyjo-smoke.png',fullPage:true});
            await browser.close();
            console.log({httpStatus:response.status(),...result,errors});
            if(response.status()!==200||!result.app||!result.game||!result.css||!result.script||result.body<30||errors.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Measure illustrated duo board in Chromium
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1536,height:960},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/Skyjo/skyjo_action.html?board=illustrated&mode=local',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(700);
            const started=await page.evaluate(()=>{
              const inputs=[...document.querySelectorAll('.pname')];
              const start=window.Game?.startFromSetup;
              if(typeof start!=='function'||inputs.length!==2)return false;
              inputs[0].value='Test A';inputs[1].value='Test B';
              start();
              return true;
            });
            await page.waitForTimeout(500);
            const measurements=await page.evaluate(()=>{
              const rect=(el)=>{if(!el)return null;const r=el.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),bottom:Math.round(r.bottom)}};
              const layout=document.querySelector('.sky-reference-layout[data-sky-seats="2"]');
              return {boardTheme:document.body.dataset.skyBoard,bodyClasses:document.body.className,layoutPresent:!!layout,
                computed:layout?{display:getComputedStyle(layout).display,columns:getComputedStyle(layout).gridTemplateColumns,areas:getComputedStyle(layout).gridTemplateAreas,cardWidth:getComputedStyle(layout.querySelector('.sky-reference-own .card')).width,cardVar:getComputedStyle(layout.querySelector('.sky-reference-own .player')).getPropertyValue('--card-w'),cssWidth:document.documentElement.clientWidth}:null,
                viewport:{width:innerWidth,height:innerHeight},
                opponent:rect(layout?.querySelector('.sky-reference-tl .player')),
                own:rect(layout?.querySelector('.sky-reference-own .player')),
                center:rect(layout?.querySelector('.sky-reference-center')),
                reaction:rect(document.querySelector('.reaction-bar')),
                opponentCards:[...(layout?.querySelectorAll('.sky-reference-tl .grid .card')||[])].map(rect),
                ownCards:[...(layout?.querySelectorAll('.sky-reference-own .grid .card')||[])].map(rect)};
            });
            console.log('Illustrated duo layout diagnostics:',JSON.stringify({started,...measurements}));
            await page.screenshot({path:'skyjo-duo-tablet.png',fullPage:true});
            if(!started||!measurements.layoutPresent||measurements.boardTheme!=='illustrated'||errors.length)throw Error('Illustrated local duo did not start correctly: '+errors.join('; '));
            if(measurements.layoutPresent){
              const {opponent,own}=measurements;
              if(!opponent||!own)throw Error('Missing player panels in active duo layout');
              if(opponent.w<100||own.w<100)throw Error('Player panel too narrow');
              const groups=[measurements.opponentCards,measurements.ownCards];
              for(const cards of groups){
                if(cards.length!==12)throw Error('Expected 12 cards per player, got '+cards.length);
                if(cards.some(c=>!c||c.w<10||c.h<10||c.x<0||c.x+c.w>1536||c.y<0||c.bottom>960))
                  throw Error('A player card is outside the tablet viewport');
              }
              const reaction=measurements.reaction;
              if(reaction&&groups.flat().some(c=>c.bottom>reaction.y&&c.y<reaction.bottom))
                throw Error('Reaction bar overlaps player cards');
            }else throw Error('Active two-player layout missing');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Compare illustrated and classic boards at multiple tablet sizes
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const [width,height] of [[1280,800],[1536,960],[1920,1080],[1024,768]]){
              for(const board of ['illustrated','classic']){
                const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8765/Skyjo/skyjo_action.html?board='+board+'&mode=local',{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(250);
                const started=await page.evaluate(()=>{
                  const inputs=[...document.querySelectorAll('.pname')];
                  if(inputs.length!==2||typeof window.Game?.startFromSetup!=='function')return false;
                  inputs[0].value='Test A';inputs[1].value='Test B';
                  window.Game.startFromSetup();return true;
                });
                await page.waitForTimeout(120);
                const info=await page.evaluate(()=>{
                  const layout=document.querySelector('.sky-reference-layout[data-sky-seats="2"]');
                  const rect=el=>{if(!el)return null;const r=el.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height),right:Math.round(r.right),bottom:Math.round(r.bottom)}};
                  const cards=[...(layout?.querySelectorAll('.sky-reference-tl .grid .card,.sky-reference-own .grid .card')||[])];
                  return {theme:document.body.dataset.skyBoard,layout:!!layout,cards:cards.length,
                    outside:cards.filter(el=>{const r=el.getBoundingClientRect();return r.left<0||r.top<0||r.right>innerWidth||r.bottom>innerHeight}).length,
                    own:rect(layout?.querySelector('.sky-reference-own .player')),
                    opponent:rect(layout?.querySelector('.sky-reference-tl .player')),
                    center:rect(layout?.querySelector('.sky-reference-center')),
                    documentHeight:document.documentElement.scrollHeight};
                });
                results.push({width,height,board,started,errors,...info});
                if(width===1280&&height===800)await page.screenshot({path:'skyjo-'+board+'-1280x800.png',fullPage:true});
                await page.close();
              }
            }
            await browser.close();
            require('fs').writeFileSync('skyjo-viewport-results.json',JSON.stringify(results,null,2));
            console.log('Multi-viewport comparison:',JSON.stringify(results));
            if(results.some(r=>!r.started||!r.layout||r.cards!==24||r.theme!==r.board||r.errors.length))
              throw Error('One or more local classic/illustrated two-player games failed to initialize');
            // Geometry is diagnostic at additional sizes until responsive fixes are verified.
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify local opening card interactions
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const board of ['classic','illustrated']){
              const page=await browser.newPage({viewport:{width:1536,height:960}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/Skyjo/skyjo_action.html?mode=local&board='+board,{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(250);
              const result=await page.evaluate(()=>{
                const names=[...document.querySelectorAll('.pname')];
                if(names.length!==2)return {error:'missing setup names'};
                names[0].value='Opening A';names[1].value='Opening B';
                document.querySelector('#jokerEnabled').checked=false;
                window.Game.startFromSetup();
                const before=[...document.querySelectorAll('.sky-reference-layout .player .grid .card:not(.back)')].length;
                for(const pi of [0,1])for(const index of [0,1])window.Game.selectCard(pi,'grid',index);
                const after=[...document.querySelectorAll('.sky-reference-layout .player .grid .card:not(.back)')].length;
                return {before,after,board:document.body.dataset.skyBoard,
                  cards:document.querySelectorAll('.sky-reference-layout .player .grid .card').length,
                  instruction:document.querySelector('#app')?.textContent?.slice(0,200)};
              });
              console.log('Opening reveal test:',board,JSON.stringify(result),errors);
              if(result.error||result.before!==0||result.after!==4||result.cards!==24||result.board!==board||errors.length)
                throw Error('Opening reveal interaction failed in '+board);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Smoke test local games for three to five players
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const count of [3,4,5]){
              for(const board of ['classic','illustrated']){
                const page=await browser.newPage({viewport:{width:1536,height:960}});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8765/Skyjo/skyjo_action.html?mode=local&board='+board,{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(200);
                const started=await page.evaluate(n=>{
                  const select=document.querySelector('#playerCount');
                  if(!select||typeof window.Game?.updateNames!=='function')return false;
                  select.value=String(n);window.Game.updateNames();
                  const inputs=[...document.querySelectorAll('.pname')];
                  if(inputs.length!==n)return false;
                  inputs.forEach((el,i)=>el.value='Test '+(i+1));
                  window.Game.startFromSetup();
                  return true;
                },count);
                await page.waitForTimeout(100);
                const info=await page.evaluate(()=>{
                  const layout=document.querySelector('.sky-reference-layout');
                  const cards=[...document.querySelectorAll('.sky-reference-layout .player .grid .card')];
                  const visible=cards.filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&r.left>=0&&r.top>=0&&r.right<=innerWidth&&r.bottom<=innerHeight}).length;
                  return {theme:document.body.dataset.skyBoard,seats:layout?.dataset.skySeats,cards:cards.length,visible,
                    viewport:{width:innerWidth,height:innerHeight},scrollHeight:document.documentElement.scrollHeight};
                });
                results.push({count,board,started,errors,...info});
                if(count===3)await page.screenshot({path:'skyjo-'+board+'-three-player.png',fullPage:true});
                await page.close();
              }
            }
            await browser.close();
            require('fs').writeFileSync('skyjo-multiplayer-layout-results.json',JSON.stringify(results,null,2));
            console.log('Three-to-five-player diagnostics:',JSON.stringify(results));
            if(results.some(r=>!r.started||r.errors.length||r.theme!==r.board||Number(r.seats)!==r.count||r.cards!==r.count*12))
              throw Error('A local 3-5 player game failed to initialize correctly');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Publish readable viewport and player-count report
        if: always()
        run: |
          node <<'JS'
          const fs=require('fs');
          const rows=[];
          rows.push('## SKYJO Layout- und Spielerzahltests');
          rows.push('');
          const viewport='skyjo-viewport-results.json';
          if(fs.existsSync(viewport)){
            rows.push('### Zwei Spieler – Bildschirmgrößen');
            rows.push('| Größe | Brett | Start | Karten | Außerhalb | JS-Fehler |');
            rows.push('|---|---|---|---:|---:|---:|');
            for(const x of JSON.parse(fs.readFileSync(viewport,'utf8')))
              rows.push('| '+x.width+' × '+x.height+' | '+x.board+' | '+(x.started?'✓':'✗')+' | '+x.cards+' | '+x.outside+' | '+x.errors.length+' |');
          }else rows.push('Zwei-Spieler-Messungen nicht verfügbar (vorherigen Testschritt prüfen).');
          const multiplayer='skyjo-multiplayer-layout-results.json';
          if(fs.existsSync(multiplayer)){
            rows.push('');
            rows.push('### Drei bis fünf Spieler');
            rows.push('| Spieler | Brett | Start | Karten | Im Sichtfeld | JS-Fehler |');
            rows.push('|---:|---|---|---:|---:|---:|');
            for(const x of JSON.parse(fs.readFileSync(multiplayer,'utf8')))
              rows.push('| '+x.count+' | '+x.board+' | '+(x.started?'✓':'✗')+' | '+x.cards+' | '+x.visible+' | '+x.errors.length+' |');
          }else rows.push('Mehrspieler-Messungen nicht verfügbar (vorherigen Testschritt prüfen).');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join('\n')+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyjo-three-player
          path: |
            skyjo-*-three-player.png
            skyjo-multiplayer-layout-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyjo-multi-viewport
          path: |
            skyjo-*-1280x800.png
            skyjo-viewport-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyjo-duo-tablet
          path: skyjo-duo-tablet.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyjo-browser-smoke
          path: skyjo-smoke.png
