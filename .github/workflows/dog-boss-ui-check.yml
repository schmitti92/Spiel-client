      - 'dog-boss-battle-v3.js'
      - 'dog-boss-battle-v3.css'
      - 'tests/dog-boss-battle-v3.test.mjs'
      - 'tests/dog-boss-legendary-arena.test.mjs'
      - 'tests/dog-boss-color-target.test.mjs'
      - 'tests/dog-boss-dodge-slow.test.mjs'
      - 'tests/dog-boss-show14-ui.test.mjs'
      - 'tests/dog-boss-reaction-precision.test.mjs'
      - 'tests/dog-boss-show14.test.mjs'
      - 'dog-group-boss.html'
      - 'tests/dog-boss-preflight-ui.test.mjs'
