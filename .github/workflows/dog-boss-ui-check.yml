      - 'dog-boss-preflight.js'
      - 'tests/dog-boss-cinematic-assets.test.mjs'
      - 'dog-expedition.html'
      - 'dog-materials-ui.js'
      - 'dog-forge-ui.js'
      - 'tests/dog-boss-ui.test.mjs'
      - '.github/workflows/dog-boss-ui-check.yml'
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test boss arena navigation, cooldown, replay and rendering
        run: |
          node --check dog-boss-ui.js
          node --check dog-boss-combat-fx.js
          node --check dog-boss-mini-ui.js
          node --check tests/dog-boss-math-endgame-ui.test.mjs
          node --check tests/dog-boss-show14-ui.test.mjs
          node --check tests/dog-boss-reaction-precision.test.mjs
          node --check tests/dog-boss-color-target.test.mjs
          node --check tests/dog-boss-legendary-arena.test.mjs
          node --check tests/dog-boss-show14.test.mjs
          node --check tests/dog-boss-dodge-slow.test.mjs
          node --check dog-boss-preflight.js
          node --check dog-boss-director.js
          node --check dog-boss-live-ui.js
          node --check dog-boss-battle-v3.js
          node --check dog-boss10.js
          node --check dog-group-boss.js
          node --test tests/dog-boss-ui.test.mjs tests/dog-boss-battle-v3.test.mjs tests/dog-boss-cinematic-assets.test.mjs tests/dog-boss-combat-fx.test.mjs tests/dog-boss-preflight-ui.test.mjs tests/dog-boss-endgame-ui.test.mjs tests/dog-boss-live-ui.test.mjs tests/dog-boss-exchange-ui.test.mjs tests/dog-boss-dodge-cinematic.test.mjs tests/dog-boss-math-endgame-ui.test.mjs tests/dog-boss-show14-ui.test.mjs tests/dog-boss-reaction-precision.test.mjs tests/dog-boss-color-target.test.mjs tests/dog-boss-legendary-arena.test.mjs tests/dog-boss-show14.test.mjs tests/dog-boss-dodge-slow.test.mjs
