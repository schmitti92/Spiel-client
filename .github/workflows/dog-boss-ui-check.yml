name: DOG boss arena frontend checks
on:
  push:
    branches: [main]
    paths:
      - 'dog-boss.html'
      - 'dog-boss.css'
      - 'dog-boss-ui.js'
      - 'dog-boss-art/**'
      - 'dog-boss10.html'
      - 'dog-boss-cinematic.css'
      - 'tests/dog-boss-preflight-ui.test.mjs'
      - 'tests/dog-boss-combat-fx.test.mjs'
      - 'dog-boss-combat-fx.js'
      - 'dog-boss-preflight.js'
      - 'tests/dog-boss-cinematic-assets.test.mjs'
      - 'dog-expedition.html'
      - 'dog-materials-ui.js'
      - 'dog-forge-ui.js'
      - 'tests/dog-boss-ui.test.mjs'
      - '.github/workflows/dog-boss-ui-check.yml'
  pull_request:
    paths:
      - 'dog-boss.html'
      - 'dog-boss.css'
      - 'dog-boss-ui.js'
      - 'dog-boss-art/**'
      - 'dog-boss10.html'
      - 'dog-boss-cinematic.css'
      - 'tests/dog-boss-preflight-ui.test.mjs'
      - 'tests/dog-boss-combat-fx.test.mjs'
      - 'dog-boss-combat-fx.js'
      - 'dog-boss-preflight.js'
      - 'tests/dog-boss-cinematic-assets.test.mjs'
      - 'dog-expedition.html'
      - 'dog-materials-ui.js'
      - 'dog-forge-ui.js'
      - 'tests/dog-boss-ui.test.mjs'
      - '.github/workflows/dog-boss-ui-check.yml'
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test boss arena navigation, cooldown, replay and rendering
        run: |
          node --check dog-boss-ui.js
          node --check dog-boss-combat-fx.js
          node --check dog-boss-preflight.js
          node --test tests/dog-boss-ui.test.mjs tests/dog-boss-cinematic-assets.test.mjs tests/dog-boss-combat-fx.test.mjs tests/dog-boss-preflight-ui.test.mjs
