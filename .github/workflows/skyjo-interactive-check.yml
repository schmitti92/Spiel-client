name: SKYJO interactive preview tests
on:
  push:
    branches: [skyjo-host-interactive-preview-20261019]
    paths: ['.github/workflows/skyjo-interactive-check.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check Skyjo/skyjo_host_test.js
          node --check Skyjo/skyjo_host_test_visual.js
          python3 tests/check_skyjo_modular.py
          for t in tests/skyjo-v*.test.cjs; do node "$t"; done
          grep -Fq 'function revealHost' Skyjo/skyjo_host_test.js
          grep -Fq 'skyjo_host_test.js?v=4' Skyjo/skyjo_host_test.html
