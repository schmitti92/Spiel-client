name: DOG verified personal Videothek
on:
  push:
    branches: [main]
    paths:
      - 'DOG/index.html'
      - 'DOG/app.js'
      - 'DOG/exchange-prompt.js'
      - 'DOG/exchange-prompt.css'
      - 'tests/dog-ui-shell.test.mjs'
      - 'DOG/ui-shell.js'
      - 'DOG/video-library.js'
      - 'DOG/video-library-watched.js'
      - 'DOG/video-library-catalog.js'
      - 'DOG/video-library.css'
      - 'DOG/christmas-tree-films.js'
      - 'DOG/christmas-building-films.js'
      - 'DOG/christmas-first-light-film.js'
      - 'DOG/christmas-intro-gate.js'
      - 'DOG/room-lobby-video.js'
      - 'tests/dog-video-library.test.mjs'
      - 'tests/dog-building-stage3-films.test.mjs'
      - 'tests/dog-christmas-event-module-load.test.mjs'
      - 'DOG/christmas-event.html'
      - 'DOG/lichtertal-gebaeudefilme-vorschau.html'
      - 'DOG/christmas-event.js'
      - '.github/workflows/dog-video-library.yml'
  pull_request:
    paths:
      - 'DOG/index.html'
      - 'DOG/app.js'
      - 'DOG/exchange-prompt.js'
      - 'DOG/exchange-prompt.css'
      - 'tests/dog-ui-shell.test.mjs'
      - 'DOG/ui-shell.js'
      - 'DOG/video-library.js'
      - 'DOG/video-library-watched.js'
      - 'DOG/video-library-catalog.js'
      - 'DOG/video-library.css'
      - 'DOG/christmas-tree-films.js'
      - 'DOG/christmas-building-films.js'
      - 'DOG/christmas-first-light-film.js'
      - 'DOG/christmas-intro-gate.js'
      - 'DOG/room-lobby-video.js'
      - 'tests/dog-video-library.test.mjs'
      - 'tests/dog-building-stage3-films.test.mjs'
      - 'tests/dog-christmas-event-module-load.test.mjs'
      - 'DOG/christmas-event.html'
      - 'DOG/lichtertal-gebaeudefilme-vorschau.html'
      - 'DOG/christmas-event.js'
      - '.github/workflows/dog-video-library.yml'
  workflow_dispatch:
jobs:
  verified-video-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check DOG/app.js && node --check DOG/exchange-prompt.js && node --check DOG/ui-shell.js && node --check DOG/video-library.js && node --check DOG/video-library-watched.js && node --check DOG/christmas-tree-films.js && node --check DOG/christmas-building-films.js
      - run: node --test tests/dog-video-library.test.mjs tests/dog-building-stage3-films.test.mjs tests/dog-christmas-event-module-load.test.mjs tests/dog-ui-shell.test.mjs tests/dog-christmas-discovery.test.mjs
