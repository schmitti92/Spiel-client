name: Firebase hub read regression (offline)
on:
  pull_request:
    paths:
      - 'hub-lobby.js'
      - 'tests/hub-foreground-reconcile-offline.test.mjs'
      - '.github/workflows/firebase-hub-read-check.yml'
  push:
    branches: [main]
    paths:
      - 'hub-game-bridge.js'
      - 'hub-lobby.js'
      - 'tests/hub-game-bridge-reads.test.mjs'
      - 'tests/hub-foreground-reconcile-offline.test.mjs'
      - '.github/workflows/firebase-hub-read-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hub-read-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check hub-game-bridge.js
      - run: node --check hub-lobby.js
      - run: node --test tests/hub-game-bridge-reads.test.mjs tests/hub-foreground-reconcile-offline.test.mjs
