name: SKYJO Comic isolated checks
on:
  push:
    paths:
      - 'Skyjo/skyjo_comic_*.mjs'
      - 'Skyjo/skyjo_comic_*.html'
      - 'Skyjo/skyjo_action_comic_beta.html'
      - '.github/workflows/skyjo-comic-check.yml'
  pull_request:
    paths:
      - 'Skyjo/skyjo_comic_*.mjs'
      - '.github/workflows/skyjo-comic-check.yml'
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated adapter and snapshot tests
        run: |
          node Skyjo/skyjo_comic_ci.mjs
          node Skyjo/skyjo_comic_projection.test.mjs
          node Skyjo/skyjo_comic_live_view.test.mjs
          node Skyjo/skyjo_comic_action_bridge.test.mjs
          node Skyjo/skyjo_comic_card_events.test.mjs
          node Skyjo/skyjo_comic_mount.test.mjs
          node Skyjo/skyjo_comic_mirror.test.mjs
          node Skyjo/skyjo_comic_publisher.test.mjs
          node Skyjo/skyjo_comic_html.test.mjs
