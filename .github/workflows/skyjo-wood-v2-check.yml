name: SKYJO Wood Modern staging checks
on:
  push:
    branches: [skyjo-modern-layout-staging-20261019]
    paths: ['.github/workflows/skyjo-wood-v2-check.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check Skyjo/skyjo_wood_modern.js
          node --check Skyjo/skyjo_start.js
          python3 tests/check_skyjo_modular.py
          for t in tests/skyjo-v*.test.cjs; do node "$t"; done
          grep -Fq 'skyjo-wood-dock' Skyjo/skyjo_wood_modern.css
