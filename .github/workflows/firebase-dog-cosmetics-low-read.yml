name: Firebase DOG cosmetics low-read UI
on:
  push:
    branches: [main]
    paths:
      - 'DOG/verified-cosmetics.js'
      - 'DOG/christmas-intro-gate.js'
      - 'tests/firebase-dog-eligibility-refresh-budget.test.mjs'
      - 'DOG/card-visuals.js'
      - 'DOG/app.js'
      - 'tests/firebase-dog-cosmetics-low-read.test.mjs'
      - '.github/workflows/firebase-dog-cosmetics-low-read.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cosmetics-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check DOG/verified-cosmetics.js
      - run: node --check DOG/card-visuals.js
      - run: node --test tests/firebase-dog-cosmetics-low-read.test.mjs tests/firebase-dog-eligibility-refresh-budget.test.mjs tests/dog-card-editions.test.mjs
