name: MiniGame Engine Contract Tests
# Baseline checks run against the original Zeitgefuehl V6 script.
on:
  push:
    branches:
      - feature/minigame-engine-zeitgefuehl-contract
    paths:
      - 'Minispiele/Zeitgefuehl_v6_Premium.html'
      - 'tests/zeitgefuehl-v6-baseline.test.mjs'
      - 'minigame-engine/**'
      - 'minigame-engine/**'
      - '.github/workflows/minigame-engine-contract.yml'
  pull_request:
    paths:
      - 'Minispiele/Zeitgefuehl_v6_Premium.html'
      - 'tests/zeitgefuehl-v6-baseline.test.mjs'
      - '.github/workflows/minigame-engine-contract.yml'
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/zeitgefuehl-v6-baseline.test.mjs minigame-engine/tests/*.test.mjs
