name: SKYJO host staging integration checks
on:
  push:
    branches: [skyjo-host-security-layout-20261019]
    paths: ['.github/workflows/skyjo-host-stage.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check Skyjo/skyjo_host_test.js
          node --check Skyjo/skyjo_host_test_visual.js
          node --check Skyjo/skyjo_host_preview_engine.js
          node tests/skyjo-host-layout.test.cjs
          node tests/skyjo-host-preview.test.cjs
          python3 tests/check_skyjo_modular.py
          for t in tests/skyjo-v*.test.cjs; do node "$t"; done
