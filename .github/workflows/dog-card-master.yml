name: DOG card master assets
on:
  push:
    branches: [main]
    paths:
      - 'DOG/assets/karten/kartendesign-*/*.png'
      - 'DOG/assets/karten/normalisieren_karten.py'
      - '.github/workflows/dog-card-master.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate uniform 700x980 cards
        run: python DOG/assets/karten/normalisieren_karten.py --all
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A DOG/assets/karten/
          if ! git diff --cached --quiet; then
            git commit -m "DOG: normalize all card editions to 700x980 master format"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
