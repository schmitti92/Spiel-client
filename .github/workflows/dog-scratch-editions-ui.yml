name: DOG Scratch Auflagenstudio UI
on:
  push:
    paths:
      - 'DOG/scratch-editions.html'
      - 'DOG/scratch-editions.js'
      - 'DOG/scratch-odds.mjs'
      - 'tests/dog-scratch-odds.test.mjs'
      - 'tests/dog-scratch-studio-layout.test.mjs'
      - 'DOG/scratch-editions.css'
      - 'DOG/christmas-event.html'
      - '.github/workflows/dog-scratch-editions-ui.yml'
  pull_request:
    paths:
      - 'DOG/scratch-editions.html'
      - 'DOG/scratch-editions.js'
      - 'DOG/scratch-odds.mjs'
      - 'tests/dog-scratch-odds.test.mjs'
      - 'tests/dog-scratch-studio-layout.test.mjs'
      - 'DOG/scratch-editions.css'
      - 'DOG/christmas-event.html'
      - '.github/workflows/dog-scratch-editions-ui.yml'
jobs:
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check DOG/scratch-editions.js
          node --check DOG/scratch-odds.mjs
      - name: Verify automatically balanced 100 percent chance settings
        run: node --test tests/dog-scratch-odds.test.mjs tests/dog-scratch-studio-layout.test.mjs
      - name: Verify link and assets
        run: |
          test -f DOG/scratch-editions.html
          test -f DOG/scratch-editions.css
          grep -q 'scratch-editions.html' DOG/christmas-event.html
          grep -q 'scratch-editions.js' DOG/scratch-editions.html
          grep -q 'scratch-editions.css' DOG/scratch-editions.html
