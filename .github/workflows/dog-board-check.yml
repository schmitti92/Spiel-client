name: DOG classic board checks
on:
  push:
    branches: [main]
    paths:
      - 'DOG/**'
      - 'tests/dog-board-layout.test.mjs'
      - 'tests/dog-board-builder.test.mjs'
      - 'tests/dog-board-editor-ui.test.mjs'
      - 'tests/dog-board-assistants.test.mjs'
      - 'tests/dog-board-group-move.test.mjs'
      - 'tests/dog-appearance.test.mjs'
      - 'tests/dog-card-editions.test.mjs'
      - 'tests/dog-hand-gestures.test.mjs'
      - 'tests/dog-board-gestures.test.mjs'
      - 'tests/dog-green-moves.test.mjs'
      - 'tests/dog-piece-animations.test.mjs'
      - 'tests/dog-motion-settings.test.mjs'
      - 'tests/dog-ui-animations.test.mjs'
      - 'tests/dog-premium-cockpit.test.mjs'
      - 'tests/dog-victory-summary.test.mjs'
      - 'tests/dog-first-four-wins.test.mjs'
      - 'tests/dog-victory-screen.test.mjs'
      - 'tests/dog-game-lobby-return.test.mjs'
      - 'tests/dog-room-lobby.test.mjs'
      - 'tests/dog-board-backdrops.test.mjs'
      - 'tests/dog-ui-shell.test.mjs'
      - 'tests/dog-official-rules.test.mjs'
      - 'tests/dog-startfield-color-protection.test.mjs'
      - 'tests/dog-online-sync.test.mjs'
      - 'tests/dog-collection.test.mjs'
      - 'tests/dog-christmas-rewards.test.mjs'
      - 'tests/dog-christmas-building-costs.test.mjs'
      - 'tests/dog-christmas-live-ui.test.mjs'
      - 'tests/dog-christmas-discovery.test.mjs'
      - 'tests/dog-christmas-gold.test.mjs'
      - '.github/workflows/dog-board-check.yml'
  pull_request:
    paths:
      - 'tests/dog-christmas-rewards.test.mjs'
      - 'tests/dog-christmas-building-costs.test.mjs'
      - 'tests/dog-christmas-live-ui.test.mjs'
      - 'DOG/**'
      - 'tests/dog-board-layout.test.mjs'
      - 'tests/dog-board-builder.test.mjs'
      - 'tests/dog-board-editor-ui.test.mjs'
      - 'tests/dog-board-assistants.test.mjs'
      - 'tests/dog-board-group-move.test.mjs'
      - 'tests/dog-appearance.test.mjs'
      - 'tests/dog-card-editions.test.mjs'
      - 'tests/dog-hand-gestures.test.mjs'
      - 'tests/dog-board-gestures.test.mjs'
      - 'tests/dog-piece-animations.test.mjs'
      - 'tests/dog-motion-settings.test.mjs'
      - 'tests/dog-ui-animations.test.mjs'
      - 'tests/dog-premium-cockpit.test.mjs'
      - 'tests/dog-victory-summary.test.mjs'
      - 'tests/dog-first-four-wins.test.mjs'
      - 'tests/dog-victory-screen.test.mjs'
      - 'tests/dog-game-lobby-return.test.mjs'
      - 'tests/dog-room-lobby.test.mjs'
      - 'tests/dog-board-backdrops.test.mjs'
      - 'tests/dog-ui-shell.test.mjs'
      - 'tests/dog-official-rules.test.mjs'
      - 'tests/dog-startfield-color-protection.test.mjs'
      - 'tests/dog-online-sync.test.mjs'
      - 'tests/dog-collection.test.mjs'
  workflow_dispatch:
# Keep CI for the newest change instead of piling up redundant runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check DOG/app.js
      - run: node --check DOG/christmas-discovery.js && node --test tests/dog-christmas-discovery.test.mjs tests/dog-christmas-gold.test.mjs
      - run: node --check DOG/room-board-preview.js
      - run: node --check DOG/room-lobby.js
      - run: node --check DOG/room-lobby-state.js
      - run: node --check DOG/piece-animations.js
      - run: node --check DOG/motion-settings.js
      - run: node --check DOG/ui-animations.js
      - run: node --check DOG/victory-summary.js && node --test tests/dog-first-four-wins.test.mjs
      - run: node --check DOG/card-visuals.js
      - run: node --check DOG/hand-gestures.js
      - run: node --check DOG/board-gesture-math.js
      - run: node --check DOG/online-sync.js
      - run: node --check DOG/editor.js
      - run: node --check DOG/editor-builder.js
      - run: node --check DOG/editor-model.js
      - run: node --check DOG/board-assistants.js
      - run: node --check DOG/board-layout.js
      - run: node --check DOG/appearance-registry.js
      - run: node --check DOG/board-picker.js
      - run: node --check DOG/ui-shell.js
      - run: node --check DOG/ui-features.js
      - run: node --check DOG/christmas-reward-locks.js
      - run: node --check DOG/collection-catalog.js
      - run: node --check DOG/collection.js
      - run: node --test tests/dog-board-backdrops.test.mjs
      - run: node --test tests/dog-ui-shell.test.mjs tests/dog-premium-cockpit.test.mjs tests/dog-victory-summary.test.mjs tests/dog-victory-screen.test.mjs tests/dog-game-lobby-return.test.mjs tests/dog-room-lobby.test.mjs
      - run: node --test tests/dog-collection.test.mjs tests/dog-christmas-rewards.test.mjs
      - run: node --test tests/dog-card-editions.test.mjs
      - run: node --check DOG/christmas-building-costs.js && node --check DOG/christmas-event.js
      - run: node --test tests/dog-christmas-building-costs.test.mjs
      - run: node --test tests/dog-christmas-live-ui.test.mjs
      - run: node --test tests/dog-hand-gestures.test.mjs
      - run: node --test tests/dog-board-gestures.test.mjs tests/dog-green-moves.test.mjs
      - run: node --test tests/dog-piece-animations.test.mjs tests/dog-motion-settings.test.mjs tests/dog-ui-animations.test.mjs
      - run: node --test tests/dog-board-layout.test.mjs tests/dog-board-builder.test.mjs tests/dog-board-editor-ui.test.mjs tests/dog-board-assistants.test.mjs tests/dog-board-group-move.test.mjs tests/dog-appearance.test.mjs tests/dog-official-rules.test.mjs tests/dog-startfield-color-protection.test.mjs tests/dog-online-sync.test.mjs
