name: SKYJO host button fix check
on:
  push:
    branches: [fix-skyjo-host-test-button-20261019]
    paths: ['.github/workflows/skyjo-host-button-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check Skyjo/skyjo_start.js
          node --check Skyjo/skyjo_host_test.js
          python3 tests/check_skyjo_modular.py
          for t in tests/skyjo-v*.test.cjs; do node "$t"; done
          grep -Fq 'href="skyjo_host_test.html"' Skyjo/skyjo_start.html
          grep -Fq "testBtn.href=" Skyjo/skyjo_start.js
