name: Spielesammlung client checks
on:
  push:
    branches:
      - feature/kreuzkunter-startmaske-v12
      - main
    paths:
      - 'hub-lobby.*'
      - 'hub-game-bridge.js'
      - 'spielauswahl-online.*'
      - 'spielauswahl-lokal.html'
      - 'DOG/index.html'
      - 'DOG/room-lobby*'
      - 'DOG/room-board-preview.js'
      - 'Skyjo/skyjo_start.*'
      - 'Barikade/barikade_start.*'
      - 'Business/business_start.*'
      - 'KreuzKunter/kreuzkunter_start.*'
      - 'tests/dog-room-lobby.test.mjs'
      - 'tests/lobby-v7.test.mjs'
      - 'tests/spielauswahl-v8.test.mjs'
      - 'tests/skyjo-start-v9.test.mjs'
      - 'tests/barikade-start-v10.test.mjs'
      - 'tests/business-start-v11.test.mjs'
      - 'tests/kreuzkunter-start-v12.test.mjs'
      - '.github/workflows/lobby-v7-check.yml'
  workflow_dispatch:
permissions:
  contents: read
# Keep CI for the newest change instead of piling up redundant runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hub-lobby.js
      - run: node --check DOG/room-lobby.js
      - run: node --check DOG/room-board-preview.js
      - run: node --check DOG/room-lobby-state.js
      - run: node --check hub-game-bridge.js
      - run: node --check spielauswahl-online.js
      - run: node --check Skyjo/skyjo_start.js
      - run: node --check Barikade/barikade_start.js
      - run: node --check Business/business_start.js
      - run: node --check KreuzKunter/kreuzkunter_start.js
      - run: node --test tests/dog-room-lobby.test.mjs tests/lobby-v7.test.mjs tests/spielauswahl-v8.test.mjs tests/skyjo-start-v9.test.mjs tests/barikade-start-v10.test.mjs tests/business-start-v11.test.mjs tests/kreuzkunter-start-v12.test.mjs
