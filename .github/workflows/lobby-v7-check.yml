name: Lobby V7 client checks
on:
  push:
    branches:
      - feature/online-vorraeume-offline-v7
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check hub-lobby.js
      - run: node --test tests/lobby-v7.test.mjs
