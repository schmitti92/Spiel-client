name: Spielesammlung client checks
on:
  push:
    branches:
      - feature/business-startmaske-v11
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check hub-lobby.js
      - run: node --check spielauswahl-online.js
      - run: node --check Skyjo/skyjo_start.js
      - run: node --check Barikade/barikade_start.js
      - run: node --check Business/business_start.js
      - run: node --test tests/lobby-v7.test.mjs tests/spielauswahl-v8.test.mjs tests/skyjo-start-v9.test.mjs tests/barikade-start-v10.test.mjs tests/business-start-v11.test.mjs
